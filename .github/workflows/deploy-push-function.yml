name: Deploy edge functions

on:
  push:
    # Only main deploys. Without this a push to any branch went straight to the
    # production project — which is how the push function went live, and the
    # notifications went quiet, before the pull request had even been opened.
    branches: [main]
    paths:
      - "supabase/functions/**"
      # a change to how they are deployed deploys them, so a fix here takes effect
      - ".github/workflows/deploy-push-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # --yes: the CLI now asks before deploying, and with no terminal to
        # answer it, it stopped and changed nothing ("Re-run with --yes")
        run: |
          supabase functions deploy push --project-ref inbxjztezjfrbnidzofy --no-verify-jwt --yes
          supabase functions deploy read-doc --project-ref inbxjztezjfrbnidzofy --no-verify-jwt --yes
          supabase functions deploy ical --project-ref inbxjztezjfrbnidzofy --no-verify-jwt --yes
