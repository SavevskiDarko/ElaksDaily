<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centrala</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A5F">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=cyrillic-ext" rel="stylesheet">
<style>
:root{
  --hb-miss:#C9D0D9;
  --navy:#1E3A5F; --navy-deep:#152A46; --amber:#F5B301; --paper:#F7F8FA;
  --card:#FFFFFF; --ink:#23272E; --muted:#6B7280; --line:#E5E8EC;
  --work:#4C6EF5; --elaks:#E0782A; --personal:#2F9E68; --apts:#7E5BC0; --danger:#D6455D; --danger-bg:#FBE9EC;
  --net-bg:#FFF4D6; --net-ink:#7A5500;
  --surface:#FFFFFF; --on-dark:#FFFFFF;
  --r:14px; --pad:16px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;width:100%;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}

/* ---- top bar ---- */
/* the top bar and the line under it stay in sight: "no signal" must not scroll away */
.app-head{position:sticky;top:0;z-index:20}
.topbar{background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;display:flex;align-items:baseline;gap:10px}
.topbar h1{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em}
.topbar img{width:22px;height:22px;border-radius:6px;flex:none;align-self:center}
.topbar .date{margin-left:auto;font-size:12.5px;opacity:.75;font-family:var(--mono)}
/* a screen's own shortcuts sit in the bar, in place of the date */
.bar-acts{margin-left:auto;display:flex;gap:6px}
.bar-acts:empty{display:none}
.bar-acts:not(:empty) + .date{display:none}
.bar-acts button{display:flex;align-items:center;gap:5px;color:#fff;font-size:13px;font-weight:600;padding:6px 11px;
  border-radius:999px;background:rgba(255,255,255,.13)}
.bar-acts svg{width:15px;height:15px}

/* ---- tab bar ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--navy-deep);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;min-width:0;transition:flex-grow .18s ease;padding:8px 2px 6px;color:#8DA2BC;font-family:var(--cond);font-weight:600;
  font-size:10.5px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabbar svg{width:23px;height:23px;flex:none}
.tabbar button[data-tab="elaks"] svg{width:22px;height:22px}
/* the label would never fit six long words, so only the active tab is named */
.tabbar .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  opacity:0;height:0;transition:opacity .15s}
.tabbar button.on .tl{opacity:1;height:auto}
.tabbar button.on svg{transform:translateY(-1px)}
/* the active tab takes the room its name needs — "Осигурување" is long */
.tabbar button.on{flex-grow:1.6}
.tabbar button .led{width:5px;height:5px;border-radius:50%;background:transparent}
.tabbar button{position:relative}
.tabbar button.on{color:#fff}
.tabbar button:active{opacity:.6}
.bdg{position:absolute;top:2px;right:calc(50% - 20px);background:var(--amber);color:var(--navy-deep);font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px;display:none}
.bdg.on{display:block}
.tabbar button.on .led{background:var(--amber);box-shadow:0 0 6px var(--amber)}

/* ---- generic ---- */
.view{display:none;padding:var(--pad);padding-bottom:calc(var(--pad) + 80px)}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.led.work{background:var(--work)} .led.elaks{background:var(--elaks)} .led.personal{background:var(--personal)} .led.apts{background:var(--apts)}
.led.ok{background:var(--personal)} .led.low{background:var(--amber);box-shadow:0 0 5px var(--amber)}
.led.out{background:var(--danger);box-shadow:0 0 5px var(--danger)}
.led.draft{background:#9AA4B2} .led.sent{background:var(--work)} .led.accepted{background:var(--personal)} .led.rejected{background:var(--danger)}
.sec{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:10px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* Sections inside a tab take you somewhere, so they are drawn as tabs rather
   than chips — which leaves a chip underneath reading plainly as a filter.
   The fade at the right edge says there is more; the extra right padding lets
   the last section scroll clear of it. */
.subnav{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 14px;padding:0 32px 0 var(--pad);
  border-bottom:1px solid var(--line);
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
          mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;padding:13px 10px 11px;font-size:14px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subnav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--amber)}
.btn{background:var(--navy);color:#fff;border-radius:11px;padding:12px 16px;font-weight:600;width:100%;margin-top:14px}
.btn.amber{background:var(--amber);color:var(--navy-deep)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger)}
.btn.sm{width:auto;padding:8px 13px;margin:0;font-size:13.5px;border-radius:9px}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:19;
  width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--navy-deep);
  font-size:30px;font-weight:600;box-shadow:0 4px 14px rgba(30,58,95,.35);display:none;align-items:center;justify-content:center;line-height:1}
.fab.on{display:flex}
.mic{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:19;
  width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;
  box-shadow:0 4px 14px rgba(30,58,95,.35);display:none;align-items:center;justify-content:center}
.mic.beside{right:86px;bottom:calc(74px + env(safe-area-inset-bottom))}
.mic.on{display:flex}
.mic.rec{background:var(--danger);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.vbig{font-size:19px;line-height:1.45;min-height:96px;margin:14px 0;color:var(--ink)}
.vbig .dim{color:var(--muted)}
.vhint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}

/* ---- sheet ---- */
.overlay{position:fixed;inset:0;background:rgba(21,42,70,.45);z-index:30;display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);
  border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:0 var(--pad) calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;display:none}
.sheet.on{display:block;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{font-family:var(--cond);font-weight:700;font-size:17px;margin-bottom:4px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-top{position:sticky;top:0;z-index:3;background:var(--paper);touch-action:none;
  margin:0 calc(var(--pad) * -1) 10px;padding:12px var(--pad) 10px;border-radius:18px 18px 0 0}
.sheet-x{position:absolute;right:10px;top:6px;width:31px;height:31px;border-radius:50%;
  background:var(--line);color:var(--muted);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.sheet-x:active{opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.grid2 > div{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.grid2 > div > label{margin-top:12px}
.grid2 > div > label:first-child{margin-top:0}

/* ---- tasks ---- */
.task{display:flex;align-items:center;gap:11px}
/* A row can be swiped: right to finish, left for later. What it will do shows
   in the gap it leaves, and turns solid once far enough to count. Held down,
   it opens its menu — so no text selection or callout in the way. */
.task[data-id]{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.task.sw-back{transition:transform .2s ease}
.task.sw-r::before,.task.sw-l::after{content:attr(data-sw);position:absolute;top:0;bottom:0;width:100vw;display:flex;align-items:center;
  font-weight:700;font-size:14px;color:#fff;border-radius:var(--r);opacity:.55}
.task.sw-r::before{right:calc(100% + 6px);justify-content:flex-end;padding-right:16px;background:var(--personal)}
.task.sw-l::after{left:calc(100% + 6px);justify-content:flex-start;padding-left:16px;background:var(--navy)}
.task.sw-go::before,.task.sw-go::after{opacity:1}
#today-list,#week-list{overflow-x:clip}
/* The box is drawn wherever a task can be ticked, Home included — it used to
   be styled only inside a task row, which left Home's boxes invisible but
   still live. It is drawn small and answers a thumb: a near miss used to open
   the task instead of ticking it. */
.tick{position:relative;width:24px;height:24px;border-radius:8px;border:2px solid #C3CAD4;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;
  transition:background .15s,border-color .15s}
.tick::after{content:"";position:absolute;inset:-10px}
.tick.on,.task.done .tick{background:var(--personal);border-color:var(--personal)}
.tick.pop{animation:tickpop .3s ease}
@keyframes tickpop{0%{transform:scale(.8)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tick.pop{animation:none}}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.task .t-title{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
/* a row is its title and, underneath, whatever else the task carries */
.task .t-body{flex:1;min-width:0;cursor:pointer}
.t-meta{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-meta > span{margin-right:10px}
.t-meta > span:last-child{margin-right:0}
.t-meta svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.t-meta .late{color:var(--danger)}
.t-meta .full{color:var(--personal)}
.star{color:var(--amber)}
.task .t-time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.task .t-time.late{color:var(--danger);font-weight:500}
.task .t-when{flex:none;width:32px;height:32px;margin:-4px -6px -4px 0;display:flex;align-items:center;
  justify-content:center;color:var(--muted)}
.task .t-when svg{width:18px;height:18px}
.task .tk-ico{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.task .tk-ico svg{width:19px;height:19px}
.task .rec{font-size:11px;color:var(--muted)}
/* how the day is going, in the Today heading: done against all there is, a
   thin bar, and what is next — it used to be a card of its own */
.tk-prog{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tk-day.all .tk-prog{color:var(--personal);font-weight:600}
.tk-prog svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.tk-bar{height:6px;border-radius:3px;background:var(--line);margin:9px 0 0;overflow:hidden}
.tk-bar.thin{height:3px;margin:-3px 0 8px}
.tk-bar i{display:block;height:100%;border-radius:3px;background:var(--personal);transition:width .35s ease}
.tk-day-sub{display:block;width:100%;text-align:left;margin:0 0 8px;font-size:13px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-day-sub b{color:var(--ink);font-weight:600}
/* a section heading with the one thing you can do to the whole section */
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px}
.sec-row .sec{margin:0}
.chip.sm{padding:4px 11px;font-size:12.5px}
.chip .led{width:8px;height:8px;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 1.5px var(--surface)}
.chip.on .led{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.tk-daily{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 2px 12px}
.tk-daily svg{width:14px;height:14px;flex:none}
.tk-daily button{color:var(--ink);font-size:13px;font-weight:500}
.btn.mv-opt{width:100%;display:flex;flex-direction:column;align-items:center;gap:1px}
.mv-opt small{font-weight:400;font-size:12px;color:var(--muted)}
.task.tapp{cursor:pointer}
.task.tapp:active{opacity:.7}
button.t-time{padding:8px 0 8px 8px;margin:-8px 0}
#tk-img-prev:empty{display:none}
.btn.msg-wa{background:#1FA855;color:#fff;margin:0}
/* rent: six months at a glance, each tappable to record it */
.rent-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.rent-m{border-radius:8px;padding:6px 0;font-size:12px;font-weight:600;text-align:center;border:1px solid var(--line);color:var(--muted)}
.rent-m.paid{background:var(--personal);border-color:var(--personal);color:#fff}
.rent-m.part{background:var(--amber);border-color:var(--amber);color:var(--navy-deep)}
.rent-m.late{border-color:var(--danger);color:var(--danger)}
.rent-m.due{border-color:var(--ink);color:var(--ink)}
.rent-m.off{opacity:.35}
.btn.msg-vb{background:#7360F2;color:#fff;margin:0}
/* ---- habits: a repeating task's record ---- */
.t-meta .streak{color:var(--amber);font-weight:600}
.hb-link{display:flex;align-items:center;gap:6px;width:100%;margin:6px 0 2px;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);font-size:13.5px;text-align:left}
.hb-link svg{width:16px;height:16px;color:var(--amber);flex:none}
.hb-link .chev{margin-left:auto;color:var(--muted)}
.hb-big{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.15}
.hb-big svg{width:23px;height:23px;color:var(--amber);vertical-align:-3px;margin-right:4px}
.hb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.hb-stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px;min-width:0}
.hb-stat span,.hb-stat small{display:block;font-size:11.5px;color:var(--muted)}
.hb-stat b{display:block;font-family:var(--cond);font-size:24px;line-height:1.2}
.hb-grid{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.hb-grid i,.hb-strip i{display:block;aspect-ratio:1;border-radius:3px;background:var(--line);opacity:.4}
/* a missed day stands apart from a day that was never one of its days */
.hb-grid i.due,.hb-strip i.due,.hb-legend i.due{background:var(--hb-miss);opacity:1}
.hb-grid i.done,.hb-strip i.done{background:var(--personal);opacity:1}
.hb-grid i.skip,.hb-strip i.skip{background:var(--amber);opacity:.5}
.hb-grid i.now,.hb-strip i.now{box-shadow:inset 0 0 0 1.5px var(--amber);opacity:1}
.hb-grid i.later{visibility:hidden}
.hb-months{display:grid;gap:3px;font-size:10.5px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.hb-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.hb-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--line)}
.hb-card .hb-top{display:flex;align-items:center;gap:9px}
.hb-card .hb-top b{flex:1;min-width:0;font-weight:600}
.hb-card .hb-fl{color:var(--amber);font-weight:700;white-space:nowrap}
.hb-card .hb-fl svg{width:15px;height:15px;vertical-align:-2px;margin-right:2px}
.hb-nums{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:6px 0 7px}
.hb-nums b{color:var(--ink);font-weight:600}
.hb-strip{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.who{background:var(--line);color:var(--muted);border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:700;flex:none}
.clbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;color:var(--on-dark);font-size:14px;display:flex;align-items:center;justify-content:center}
.clbox.on{background:var(--personal);border-color:var(--personal)}

/* ---- inventory ---- */
.art{display:flex;align-items:center;gap:11px}
.art .a-name{flex:1;min-width:0}
.art .a-name b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .a-name span{font-size:12px;color:var(--muted)}
.art .a-qty{font-family:var(--mono);font-weight:600;font-size:16px;text-align:right}
.art .a-qty small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;flex:none;background:#ECECEC}
.thumb-lg{width:100%;max-height:210px;object-fit:contain;border-radius:11px;background:#ECECEC;margin-top:10px}
.mov{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border:0}

/* ---- offers ---- */
.offer .o-num{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.offer .o-total{font-family:var(--mono);font-weight:600;white-space:nowrap}
/* A row's second line is mostly names — clients, guests, policy holders,
   suppliers, sites, statuses — and in monospace those read like code and wrap
   a line early. Sans with tabular figures keeps the numbers and dates in step
   without it. #sheet takes in the lists that open over a tab: still to
   collect, no price yet, paid for and not collected. Tasks keeps its own
   "Also today" rows as they are. */
#v-elaks .offer .o-num, #v-apt .offer .o-num, #v-ins .offer .o-num,
#sheet .offer .o-num{font-family:var(--sans);font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
.oitem{display:grid;grid-template-columns:1fr 58px 74px 74px 28px;gap:6px;align-items:center;margin-bottom:6px;font-size:13.5px}
.oitem input{padding:7px 8px;font-size:14px}
.oitem .del{color:var(--danger);font-size:18px;text-align:center}
/* A line item on a phone: the name deserves the full width, the figures read
   as qty × price = total underneath it. */
.lrow{display:grid;grid-template-columns:22px 1fr 24px;gap:8px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line)}
.lrow.nomove{grid-template-columns:1fr 24px}
.lbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.lname{width:100%;font-weight:600}
.lnums{display:grid;grid-template-columns:64px 12px 1fr 12px minmax(72px,auto);gap:6px;align-items:center}
.lnums input{text-align:right}
.lop{color:var(--muted);font-size:13px;text-align:center}
.ltot{font-size:14.5px;text-align:right;white-space:nowrap}
.lrow .del{color:var(--danger);font-size:18px;align-self:center}
.lhead{display:none}
/* what the item costs you and its markup, under it — never on the offer itself */
.lmargin{grid-column:2 / -2;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.lmargin .neg{color:var(--danger)}
.lpct{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.lpct input{width:84px;padding:5px 8px;text-align:right}
/* From tablet width up there is room for the original single row, so the
   name, quantity, price and total line up in columns again. */
@media (min-width:640px){
  .lrow{grid-template-columns:22px 1fr 58px 100px 88px 24px;gap:6px;
    padding:0;margin-bottom:6px;border-bottom:0}
  .lrow.nomove{grid-template-columns:1fr 58px 100px 88px 24px}
  .lbody,.lnums{display:contents}        /* their children become row columns */
  .lop{display:none}
  .lname{font-weight:400}
  .ltot{align-self:center}
  .lhead{display:grid;grid-template-columns:22px 1fr 58px 100px 88px 24px;gap:6px;
    font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
  .lhead.nomove{grid-template-columns:1fr 58px 100px 88px 24px}
  .lhead span:nth-child(n+3){text-align:right}
  .lmargin{margin:-2px 0 6px}
}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:4px}
.pcell{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#ECECEC;border:1px solid var(--line)}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pdel{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;
  background:rgba(21,42,70,.78);color:#fff;font-size:12px;line-height:1;display:flex;
  align-items:center;justify-content:center}
.pnum{position:absolute;bottom:3px;left:4px;background:rgba(21,42,70,.78);color:#fff;
  border-radius:5px;padding:1px 5px;font-size:10.5px;font-weight:700}
.omove{display:flex;flex-direction:column;gap:2px}
.omove button{font-size:9px;line-height:1;padding:4px 0;color:var(--muted);border:1px solid var(--line);
  border-radius:5px;background:var(--surface);width:100%}
.omove button:disabled{opacity:.25}
.omove button:active:not(:disabled){background:var(--line);color:var(--ink)}
.oitem.moved{animation:movedflash .7s ease}
@keyframes movedflash{0%{background:rgba(245,179,1,.3)}100%{background:transparent}}
.ohead{display:grid;grid-template-columns:1fr 58px 74px 74px 28px;gap:6px;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px}
.totalbar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;
  border-radius:11px;padding:11px 14px;margin-top:10px;font-weight:600}
.totalbar .mono{color:var(--amber);font-size:17px}

/* ---- login ---- */
#login{max-width:360px;margin:16vh auto 0;padding:0 var(--pad)}
#login .logo{width:64px;height:64px;border-radius:16px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--navy-deep);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:center;gap:12px;max-width:92vw}
.toast.act{pointer-events:auto}
.toast button{color:var(--amber);font-weight:700;font-size:13.5px;white-space:nowrap}
.toast.on{opacity:1}
.search{margin-bottom:10px}
/* the line that adds a task in one go, and what it understood */
.qa-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qa-row input{flex:1;min-width:0}
.qa-add{flex:none;width:46px;height:46px;border-radius:12px;background:var(--amber);color:var(--navy-deep);display:flex;align-items:center;justify-content:center}
.qa-add svg{width:22px;height:22px}
.qa-icon{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center}
.qa-icon svg{width:20px;height:20px}
.qa-icon.on{color:var(--ink);border-color:var(--muted)}
.qa-hint{font-size:12.5px;color:var(--muted);margin:-2px 2px 10px}
.qa-hint:empty{display:none}
.qa-hint b{color:var(--ink);font-weight:600}
/* the week at a glance: seven days, how much is on each, tap one to see it */
.tk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 12px}
.tk-strip:empty{display:none}
.tk-strip button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.tk-strip .ds-wd{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.tk-strip .ds-n{font-family:var(--cond);font-weight:700;font-size:17px;line-height:1.15}
.tk-strip .ds-c{font-size:11.5px;font-weight:700;min-height:15px;color:var(--muted)}
.tk-strip .ds-c.none{font-weight:400;opacity:.5}
.tk-strip button.today .ds-n{color:var(--amber)}
.tk-strip button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tk-strip button.on .ds-wd,.tk-strip button.on .ds-c{color:#dbe3ee}
/* overdue, folded to a line when there is a pile of it */
.late-line{display:flex;align-items:center;gap:10px;cursor:pointer;border-color:var(--danger)}
.late-line .late-n{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--danger)}
.late-line .late-what{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.late-line .chev{color:var(--muted)}
#loadbar{background:var(--danger-bg);color:var(--danger);padding:9px 14px;font-size:13px;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#loadbar button{font-weight:700;text-decoration:underline;flex:none}
/* a link that is a button — Call, Directions — reads as one */
a.btn{text-decoration:none;display:block;text-align:center}
.jc-acts{display:grid;gap:8px;margin-top:10px}
.jc-acts .btn{padding-left:6px;padding-right:6px;margin-top:0}
/* no signal is a state to know about, not an error */
#loadbar[data-net]{background:var(--net-bg);color:var(--net-ink)}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hcard h3{font-family:var(--cond);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;gap:10px;flex-wrap:wrap}
.hrow > :first-child{flex:0 0 auto;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow > :last-child{margin-left:auto;white-space:nowrap;text-align:right}
.hsub{font-size:12.5px;color:var(--muted);line-height:1.5;margin:2px 0 4px}
.hsub b{color:var(--ink);font-weight:600}
.hnote{font-size:12px;color:var(--muted);text-align:right;margin:-2px 0 4px}
.hnote.warn{color:var(--danger)}
.htxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick.sm{width:21px;height:21px;border-radius:7px;font-size:12px}
/* Home's rows sit close together, so the reach stays inside its own row */
.tick.sm::after{inset:-4px -8px}
.xtag{background:var(--line);color:var(--muted);border-radius:5px;padding:1px 6px;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.bank-big{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.01em}
.bank-lbl{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:14px 0 2px}
.acct{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:8px 10px;cursor:pointer}
.acct:active{opacity:.65}
.acct span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct b{display:block;font-family:var(--mono);font-size:14.5px;margin-top:1px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.stat-row.top{margin-top:0;padding-top:0;border-top:0}
/* shortcuts that sit on a screen without being its subject, kept apart from
   its figures so a number never looks like a link or a link like a number */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tool{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;padding:9px 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13.5px;text-align:left}
.tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool b{flex:none;font-family:var(--mono);font-size:13px;font-weight:600}
.tool b.warn{color:var(--amber)} .tool b.bad{color:var(--danger)} .tool .chev{color:var(--muted);flex:none}
.btn svg{width:18px;height:18px;vertical-align:-4px;margin-right:7px}
.thumb.ph{display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.thumb.ph svg{width:20px;height:20px}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:14px}
/* A sort is not a filter, so it should not look like one: the chips above
   choose which records, this chooses their order. */
.sortbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sortlbl{font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:600;
  display:flex;align-items:center;gap:5px}
.sortic{font-size:15px;line-height:1}
.sortbar select{width:auto;flex:0 1 auto;padding:7px 30px 7px 11px;font-size:13.5px;border-radius:9px}
.setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;margin-bottom:8px;cursor:pointer}
.setrow:active{opacity:.65}
.setrow .ico{width:34px;height:34px;border-radius:10px;background:var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.setrow .txt{flex:1;min-width:0}
.setrow .txt b{display:block;font-size:15px}
.setrow .txt span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.setrow .chev{color:var(--muted);font-size:18px;flex:none}
.more{margin:6px 0}
.more .morebody{display:none}
.more[data-open="1"] .morebody{display:block}
.more[data-open="1"] .chev{transform:rotate(180deg)}
.morebtn{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  font-weight:600;font-size:14px;color:var(--muted);margin:4px 0 10px}
.morebtn .chev{transition:transform .18s}
.setgrp{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(21,42,70,.55);display:none;
  align-items:center;justify-content:center;padding:22px}
.dlg.on{display:flex}
.dlg-box{background:var(--card);border-radius:16px;padding:18px 18px 14px;width:100%;max-width:360px;
  box-shadow:0 12px 34px rgba(0,0,0,.35)}
.dlg-msg{white-space:pre-line;line-height:1.5;margin-bottom:14px}
.dlg-box .btn{margin-top:8px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:35;
  background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;display:none;
  align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 18px rgba(30,58,95,.4)}
.updbar.on{display:flex}
.updbar button{background:var(--amber);color:var(--navy-deep);border-radius:9px;padding:7px 14px;font-weight:700}
.hrow b{font-family:var(--mono)}
.hbig{font-size:26px;font-weight:700;font-family:var(--cond)}
.hflag{color:var(--danger);font-weight:600}
.skel{height:58px;border-radius:var(--r);margin-bottom:10px;
  background:linear-gradient(90deg,var(--line) 25%,var(--card) 37%,var(--line) 63%);
  background-size:400% 100%;animation:shim 1.3s ease-in-out infinite}
.skel.tall{height:104px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.mov.tapp{cursor:pointer}
.sec.tapp{cursor:pointer;display:flex;align-items:center;gap:6px}
.sec.tapp:active{opacity:.6}
.mov.tapp:active{opacity:.6}
.bankrow{justify-content:space-between;align-items:baseline;margin-top:7px}
.nw{white-space:nowrap}
.calc{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.hok{color:var(--personal);font-weight:600}
.hcard.push-warn{border-color:var(--danger)}
.cal-apt{font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.cal-head span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.cal-head span.we{color:var(--ink)}
.cal-d{aspect-ratio:1/1;border-radius:9px;background:var(--line);color:var(--muted);
  font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.1;padding:0;min-height:38px}
.cal-d.bk{background:var(--personal);color:#fff}
.cal-d.pad{background:transparent;pointer-events:none}
.cal-d.now{box-shadow:inset 0 0 0 2px var(--amber)}
.cal-d small{font-size:9.5px;font-weight:700;opacity:.95}

/* ---- printable offer (PDF) ---- */
#printroot{display:none}
@media print{
  body{background:#fff;padding:0}
  body > *:not(#printroot){display:none !important}
  #printroot{display:block !important}
  @page{size:A4;margin:12mm 10mm}
}
#printroot{--paper:#fff;--card:#fff;--ink:#232323;--line:#CCCCCC;--muted:#555555;--surface:#fff}
.pv{font-family:Arial,Helvetica,sans-serif;color:#232323;font-size:9.5pt;background:#fff;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.pv-plain{margin-bottom:6mm;padding-bottom:3mm;border-bottom:1.5pt solid #232323}
.pv-plain b{font-size:13pt}
.pv-plain span{display:block;color:#555;font-size:9.5pt;margin-top:1mm}
.pv-top{width:100%;border-collapse:collapse;margin-bottom:6mm}
.pv-top td{vertical-align:top}
.pv-top td.r{text-align:right;width:42mm}
.pv-num{font-size:13pt;font-weight:700;padding-top:4mm}
.pv-num u{color:#1F3864;text-decoration:underline;margin-left:4mm}
.pv-logo{width:39mm;height:auto}
.pv-banner{width:125mm;height:auto;display:block}
.pv-client{font-size:12pt;font-weight:700;color:#1F3864;margin:3mm 0 3mm 5mm}
.pv-fields{border-collapse:collapse;margin:0 0 8mm 5mm;font-size:9.5pt}
.pv-fields td{padding:1.1mm 0;vertical-align:top}
.pv-fields td:first-child{width:32mm;color:#232323}
.pv-items{width:100%;border-collapse:separate;border-spacing:1.2mm 1.2mm;table-layout:fixed}
.pv-items th{font-weight:400;color:#252525;font-size:10pt;padding:1mm 0;text-align:center}
.pv-items td{background:#ECECEC;padding:2.4mm 2mm;vertical-align:middle;font-size:9pt}
.pv-items td.c{text-align:center}
.pv-items td.b{font-weight:700}
.pv-items td img{max-width:100%;max-height:26mm;display:block;margin:0 auto}
.pv-items .sp{margin-top:1.5mm;line-height:1.35}
.pv-total{background:#2462AC !important;color:#fff;font-weight:700;font-size:11pt;padding:3mm 4mm !important;text-align:right}
.pv-note{color:#C00000;font-weight:700;text-align:center;margin:6mm 0 2mm}
.pv-valid{color:#C00000;font-weight:700;text-align:center;margin-bottom:8mm}
.pv-footer{display:block;margin:10mm auto 0;width:57mm;height:auto}
.pv-items tr{page-break-inside:avoid}
.rp-h1{font-size:13pt;font-weight:700;margin:0 0 1mm}
.rp-sub{color:#555;font-size:9.5pt;margin-bottom:6mm}
.rp-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:6mm}
.rp-tbl th{text-align:left;border-bottom:1px solid #8a8a8a;padding:1.8mm 1mm;font-weight:700}
.rp-tbl td{border-bottom:1px solid #dcdcdc;padding:1.8mm 1mm}
.rp-tbl th.r,.rp-tbl td.r{text-align:right}
.rp-bar{background:#2462AC !important;color:#fff;font-weight:700;padding:2.6mm 3mm;font-size:10.5pt;
  display:flex;justify-content:space-between;margin-bottom:6mm}
@media (prefers-color-scheme: dark){
  /* Elaks's orange a shade lighter, to stand out on a dark card */
  :root{--paper:#12161C;--card:#1A202A;--ink:#E7EAF0;--line:#2A3242;--muted:#95A1B5;--danger-bg:#3A1B22;--surface:#1A202A;
    --elaks:#F08E46;--hb-miss:#3A4456;--net-bg:#33290F;--net-ink:#F2C94C}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .tick{border-color:#39424F}
}
</style>

<body>

<!-- ================= LOGIN ================= -->
<div id="login" style="display:none">
  <img src="icon-192.png?v=3" class="logo" alt="">
  <h1 style="font-family:var(--cond);font-size:24px;margin-bottom:2px">Centrala</h1>
  <p class="muted" style="margin-bottom:18px">Tasks · Stock · Offers</p>
  <label>Email</label><input id="lg-email" type="email" autocomplete="username">
  <label>Password</label><input id="lg-pass" type="password" autocomplete="current-password">
  <button class="btn" onclick="login()">Sign in</button>
  <p id="lg-err" class="muted" style="color:var(--danger);margin-top:10px"></p>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">
  <div class="app-head">
  <div class="topbar"><img src="icon-192.png?v=3" alt=""><h1 id="bar-title">Home</h1><span class="bar-acts" id="bar-acts"></span><span class="date" id="bar-date"></span></div>
  <div id="loadbar" style="display:none"><span id="loadmsg">Could not load data.</span><button onclick="retryLoad()">Retry</button></div>
  </div>

  <!-- HOME -->
  <div class="view on" id="v-home"><div id="home-body"></div></div>

  <!-- TODAY -->
  <div class="view" id="v-today">
    <div class="qa-row">
      <input id="tk-quick" placeholder="Add: Call Marko tomorrow 10" enterkeyhint="done" autocomplete="off"
        onkeydown="quickAddKey(event)" oninput="quickAddHint()">
      <!-- an arrow, not a second +: this one saves the line, the round + opens the full form -->
      <button class="qa-add" onclick="quickAdd()" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
      <button class="qa-icon" id="tk-search-btn" onclick="toggleTaskSearch()" aria-label="Search"><svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
    <div class="qa-hint" id="tk-quick-hint"></div>
    <input class="search" id="tk-search" placeholder="Search tasks…" oninput="renderToday()" style="display:none">
    <div class="chips" id="ctx-filter" style="margin-bottom:12px"></div>
    <div class="tk-strip" id="tk-strip"></div>
    <div id="today-list"></div>
    <div id="week-list"></div>
  </div>

  <!-- ELAKS BUSINESS -->
  <div class="view" id="v-elaks">
    <div class="subnav" id="elaks-tabs" role="tablist"></div>
    <div id="el-body-inv">
      <input class="search" id="inv-search" placeholder="Search name, code, supplier or specs…" oninput="renderInv()">
      <div class="chips" id="cat-filter" style="margin-bottom:12px"></div>
      <div id="inv-list"></div>
    </div>
    <div id="el-body-off" style="display:none">
      <input class="search" id="off-search" placeholder="Search offers…" oninput="renderOffers()">
      <div class="chips" id="off-filter" style="margin-bottom:12px"></div>
      <div id="off-list"></div>
    </div>
    <div id="el-body-pur" style="display:none">
      <input class="search" id="pur-list-search" placeholder="Search supplier or document…" oninput="renderPurchases()">

/* ---------- tasks with no signal ----------

   deleted. The change shows at once and waits on this phone, in order, until

async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  const { data: { session }, error } = await within(10000, db.auth.getSession(), { data: {}, error: { timedOut: true } });
  if (session) return startApp(session);
  // the sign-in could not be renewed for want of a signal: open as the one
  // who was here last; the database asks again once there is a signal
  if (keptWho() && (offlineNow() || netFailed(error))) return startApp(null);
  $("login").style.display = "block";
}
async function login() {
  const { error } = await db.auth.signInWithPassword({ email: $("lg-email").value.trim(), password: $("lg-pass").value });
  if (error) { $("lg-err").textContent = "Wrong email or password."; return; }
  $("login").style.display = "none"; startApp();
}
async function logout() {

    `Задачи сменети без сигнал што сè уште не се испратени: ${n}. Ќе се испратат кога пак ќе се најавиш на овој телефон. Да се одјавам?`), T("Sign out", "Одјави се"))) return;

}

async function startApp(signedIn) {
  $("app").style.display = "block";
  $("bar-date").textContent = wd() + " " + dmy(new Date());
  try {
    // who is signed in, from the sign-in kept on the phone: no trip to the
    // server, which with a weak signal could take a long while
    const who = keptWho();
    // already asked on the way in, unless a sign-in has just been made
    const { data: { session }, error: serr } = signedIn !== undefined
      ? { data: { session: signedIn }, error: signedIn ? null : { timedOut: true } }
      : await within(10000, db.auth.getSession(), { data: {}, error: { timedOut: true } });
    let user = session ? session.user : null;
    // no signal to renew the sign-in: the one who was here last
    if (!user && who && (offlineNow() || netFailed(serr))) user = { id: who.uid };
    state.uid = user ? user.id : null;
    if (user) {
      const known = who && who.uid === user.id && who.role;
      let { data: r, error: rerr } = await within(known ? 5000 : 15000, db.from("user_roles").select("*").eq("user_id", user.id).maybeSingle(),
        { data: null, error: { timedOut: true } });
      if (rerr && who && who.uid === user.id && who.role && netFailed(rerr)) { r = who.role; rerr = null; }
      if (!rerr && r) try { localStorage.setItem(WHO, JSON.stringify({ uid: user.id, role: r })); } catch { /* no room */ }
      if (!rerr && !r) {  // first sign-in: register with zero access; owner grants from Team
        await db.from("user_roles").insert({ user_id: user.id, role: "employee" });
        r = { role: "employee", task_contexts: [], see_elaks: false, see_apts: false, see_insurance: false };
      }
      if (!rerr && r) {
        state.role = r.role;
        state.perm = r.role === "owner"
          ? { owner: true, ctx: ["work", "elaks", "personal", "apts"],
              elaks: !(r.hide_tabs || []).includes("elaks"),
              apts: !(r.hide_tabs || []).includes("apt"),
              ins: !(r.hide_tabs || []).includes("ins") }
          : { owner: false, ctx: r.task_contexts || [], elaks: !!r.see_elaks, apts: !!r.see_apts, ins: !!r.see_insurance,
              aptsOwnOnly: !!r.apts_own_only };
        state.perm.personalAccess = r.personal_access || [];
        // the flats I keep off my own screen, and whether the column is there to keep them in
        state.aptListCol = "hide_apts" in r;
        state.hideApts = new Set(r.hide_apts || []);
      }
    }
    applyTabVisibility();
    if (state.perm.owner && !offlineNow()) loadTeam();
  } catch (e) { console.warn("permission lookup", e); }
  tab("home");                    // paint skeletons before the data lands
  // a weak signal can keep the load going a long while: meanwhile, the tasks as last seen
  const slow = setTimeout(() => {
    if (state.tasksLoaded || !useKeptCopy()) return;
    state.loading = false; state.slowLoad = true; render(); netStatus();
  }, 4000);
  await refreshAll();
  clearTimeout(slow);
  state.loading = false; state.slowLoad = false;
  render();
  netStatus();
  sendOutbox();                   // changes made with no signal last time the app was open
  if (state.perm.elaks) markOldInvoicesPaid();
  updatePushState();
  keepPushAlive();
  handleNotificationIntent();
  handleShortcut();
  if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data && e.data.centrala && e.data.jobId) openJobFromNotice(e.data.jobId);
    else if (e.data && e.data.centrala) runTaskIntent(e.data.taskId, e.data.action);
  });
  if (state.role === "owner") {
    try {
      const { data } = await db.from("app_settings").select("key, value").in("key", ["digest_hour", "bills_day", "bill_types", "stay_remind_time", "checkout_time"]);
      let stored = null;
      for (const r of data || []) {
        if (r.key === "digest_hour" && $("digest-hour")) $("digest-hour").value = String(r.value).replace(/"/g, "");
        if (r.key === "bills_day" && $("bills-day")) $("bills-day").value = String(r.value).replace(/"/g, "");
        if (r.key === "stay_remind_time" && $("stay-time")) $("stay-time").value = String(r.value).replace(/"/g, "");
        if (r.key === "checkout_time" && $("apt-checkout")) $("apt-checkout").value = String(r.value).replace(/"/g, "");
        if (r.key === "bill_types") stored = Array.isArray(r.value) ? r.value : (() => { try { return JSON.parse(r.value); } catch { return null; } })();
      }
      // keep the notification side in step with BILL_TYPES instead of hardcoding a count
      if (!stored || stored.join(",") !== BILL_TYPES.join(","))
        await db.from("app_settings").upsert({ key: "bill_types", value: BILL_TYPES }, { onConflict: "key" });
    } catch (e) { console.warn("settings", e); }
  }
}

const backDays = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toLocaleDateString("sv-SE"); };
const backMonths = (n) => { const d = new Date(); d.setMonth(d.getMonth() - n, 1); return d.toLocaleDateString("sv-SE"); };

// Recent records, so the app stays quick as the years add up — and every
// older one still open on top, so it never drops out of Work, To invoice or
// Outstanding: an accepted offer not paid in full, an invoice not paid, a
// supplier bill not paid. The rest of the past is a "Show older" away.
const KEEP = {
  offers:    { table: "offers", select: "*, clients(name)", order: "created_at", limit: 150,
               cols: "id, status, grand_total, paid_amount",
               open: (o) => o.status === "accepted" && (parseFloat(o.paid_amount) || 0) < (parseFloat(o.grand_total) || 0) - 0.005 },
  invoices:  { table: "invoices", select: "*", order: "invoice_date", limit: 300,
               cols: "id, paid_on, cancelled", open: (i) => !i.paid_on && !i.cancelled },
  purchases: { table: "purchases", select: "*", order: "doc_date", limit: 150,
               cols: "id, total, paid_amount", open: (p) => (parseFloat(p.paid_amount) || 0) < (parseFloat(p.total) || 0) - 0.005 },
  // an archive: nothing in it is ever open, the older ones come on request
  docs:      { table: "documents", select: "*", order: "doc_date", limit: 400 },
};
const OLDER_PAGE = 100;
async function byIds(K, ids) {
  const rows = [];
  for (let i = 0; i < ids.length; i += 100) {
    const r = await db.from(K.table).select(K.select).in("id", ids.slice(i, i + 100));
    if (r.error) return r;
    rows.push(...(r.data || []));
  }
  return { data: rows, error: null };
}
async function recentAndOpen(key) {
  const K = KEEP[key];
  const r = await db.from(K.table).select(K.select).order(K.order, { ascending: false }).limit(K.limit);
  if (r.error) return r;
  const rows = r.data || [], have = new Set(rows.map((x) => x.id));
  const add = (list) => { for (const x of list || []) if (!have.has(x.id)) { have.add(x.id); rows.push(x); } };
  state.more[key] = rows.length >= K.limit;
  if (state.more[key] && K.open) {
    // a light pass over the few columns that say whether an older one is still open, then those in full
    const oldest = rows[rows.length - 1][K.order], ids = [];
    for (let at = 0; at < 50000; at += 1000) {
      const l = await db.from(K.table).select(K.cols).lte(K.order, oldest).order(K.order, { ascending: false }).range(at, at + 999);
      if (l.error) break;
      ids.push(...(l.data || []).filter((x) => K.open(x) && !have.has(x.id)).map((x) => x.id));
      if ((l.data || []).length < 1000) break;
    }
    const full = await byIds(K, ids);
    if (!full.error) add(full.data);
  }
  // and whatever was opened from further back stays, fresh
  const kept = (state.olderIds[key] || []).filter((id) => !have.has(id));
  if (kept.length) { const back = await byIds(K, kept); if (!back.error) add(back.data); }
  return { data: rows, error: null };
}
// the next page of the past, at the end of a list
let loadingOlder = false;
async function loadOlder(key) {
  const K = KEEP[key];
  if (loadingOlder || !K) return;
  loadingOlder = true;
  const page = state.olderPage[key] || 0, from = K.limit + page * OLDER_PAGE;
  const r = await db.from(K.table).select(K.select).order(K.order, { ascending: false }).range(from, from + OLDER_PAGE - 1);
  loadingOlder = false;
  if (r.error) return toast(T("Could not load older ones", "Постарите не може да се вчитаат") + " — " + r.error.message);
  const have = new Set(state[key].map((x) => x.id)), fresh = (r.data || []).filter((x) => !have.has(x.id));
  state[key] = state[key].concat(fresh);
  state.olderIds[key] = (state.olderIds[key] || []).concat(fresh.map((x) => x.id));
  state.olderPage[key] = page + 1;
  if ((r.data || []).length < OLDER_PAGE) state.more[key] = false;
  render();
}
const olderButton = (key, label) => state.more[key]
  ? `<button class="btn ghost" style="margin-top:6px" onclick="loadOlder('${key}')">${label}</button>` : "";
// one record from further back, opened from somewhere that knows its id
async function ensureLoaded(key, id) {
  if (!id || state[key].some((x) => x.id === id)) return true;
  const r = await byIds(KEEP[key], [id]);
  if (r.error || !(r.data || []).length) return false;
  state[key].push(r.data[0]);
  state.olderIds[key] = (state.olderIds[key] || []).concat(id);
  return true;
}

const missingTable = (e) => !!e && (e.code === "42P01" || e.code === "PGRST205" || /does not exist|schema cache/i.test(e.message || ""));

async function refreshAll(only) {
  // no signal: what is on screen stays, and the tasks as last seen if nothing was loaded yet
  if (offlineNow()) { if (!state.tasksLoaded) useKeptCopy(); netStatus(); return; }
  const keys = (only || Object.keys(LOADERS)).filter((k) => LOADERS[k] && LOADERS[k].need());
  // a weak signal can leave a request hanging; after half a minute it counts as no signal
  const res = await Promise.all(keys.map((k) => within(30000, LOADERS[k].q(), { data: null, error: { message: "timed out" }, timedOut: true })));
  const failed = [];
  let noSignal = false;
  keys.forEach((k, i) => {
    const r = res[i];
    if (r.error && LOADERS[k].optional && missingTable(r.error)) { state[k] = []; return; }
    if (r.error) { console.error("load", k, r.error); failed.push(k); if (netFailed(r)) noSignal = true; return; }
    if (LOADERS[k].scalar) state[k] = (r.data && r.data.balance != null) ? parseFloat(r.data.balance) : 0;
    else state[k] = r.data ?? [];
    // tasks.habit arrives with migration 0004; until it is run, every
    // repeating task counts as a habit and the switch stays out of sight
    if (k === "tasks" && (r.data || []).length) state.habitCol = "habit" in r.data[0];
    // apartments.rent_mode arrives with migration 0006; until then every flat is let by the night
    if (k === "apartments" && (r.data || []).length) state.rentCol = "rent_mode" in r.data[0];
    // stays.guest_phone arrives with migration 0005; until then the field stays hidden
    if (k === "stays" && (r.data || []).length) state.stayPhoneCol = "guest_phone" in r.data[0];
    if (k === "completions") {
      state.doneSet = new Set((r.data ?? []).filter((c) => !c.skipped).map((c) => c.task_id + ":" + c.done_on));
      state.skipSet = new Set((r.data ?? []).filter((c) => c.skipped).map((c) => c.task_id + ":" + c.done_on));
    }
  });
  applyAptHiding(keys);
  // tasks: what is still on its way laid over what came, and kept for a start with no signal
  if (keys.includes("tasks") && !failed.includes("tasks")) { state.tasksLoaded = true; state.fromCopy = false; }
  if (["tasks", "completions"].some((k) => keys.includes(k) && failed.includes(k))) { if (!state.tasksLoaded) useKeptCopy(); }
  else if (["tasks", "completions", "people", "templates"].some((k) => keys.includes(k))) { applyPending(); keepCopy(); }
  state.netDown = noSignal;
  if (noSignal) return netStatus();
  if (failed.length) {
    $("loadmsg").textContent = "Could not load: " + failed.join(", ") + ". Data shown may be incomplete.";
    $("loadbar").style.display = "flex";
    delete $("loadbar").dataset.net;
  } else if (!only) { $("loadbar").style.display = "none"; netStatus(); }
}

/* ---------- asking things, in the app's own language and style ----------
   Replaces the browser's confirm/alert/prompt, which cannot be translated,
   carry the site address in their title, and ignore the app's styling. */
function dialog({ msg, ok, cancel, danger, input }) {
  return new Promise((resolve) => {
    const box = $("dlg"), okBtn = $("dlg-ok"), noBtn = $("dlg-cancel"), field = $("dlg-input");
    $("dlg-msg").textContent = msg;
    okBtn.textContent = ok || T("OK", "Во ред");
    okBtn.classList.toggle("danger", !!danger);
    noBtn.style.display = cancel === false ? "none" : "";
    noBtn.textContent = T("Cancel", "Откажи");
    field.style.display = input === undefined ? "none" : "";
    if (input !== undefined) { field.value = input; }
    box.classList.add("on");
    if (input !== undefined) setTimeout(() => field.focus(), 60);

    const done = (val) => {
      box.classList.remove("on");
      okBtn.onclick = noBtn.onclick = box.onclick = null;
      okBtn.classList.remove("danger");
      resolve(val);
    };
    okBtn.onclick = () => done(input === undefined ? true : (field.value || ""));
    noBtn.onclick = () => done(input === undefined ? false : null);
    box.onclick = (e) => { if (e.target === box) done(input === undefined ? false : null); };
  });
}

const BUILD = "20261102-090000";

  if (Date.now() - lastBuildCheck < 60000) return;

async function runTaskIntent(id, action) {
  if (!id) return;
  await refreshAll(["tasks", "completions"]);
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return toast("That task is no longer there");
  if (action === "done") {
    if (!isDoneOn(t, todayStr())) await toggleTask(id);
    tab("today"); toast("Done \u2713 " + t.title);
    return;
  }
  if (action === "snooze") {
    const now = new Date();
    now.setHours(now.getHours() + 1);
    const hhmm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    taskSave([{ t: "tasks", do: "update", id, set: { due_time: hhmm, reminded_on: null } }]);
    tab("today");

  if (action === "tomorrow") {
    tab("today");
    // a repeating task does not move; today's turn is let go instead
    if (t.recurrence) return skipOccurrence(id, todayStr());
    return moveTaskQuiet(id, backDays(-1));

// The line under the top bar while there is no signal, or task changes are
// still waiting for one.
function netStatus() {
  const bar = $("loadbar");
  if (!bar) return;
  const n = waitingCount(), stuck = outbox.some((o) => ownChange(o) && o.waited);
  // opened with no signal: the tasks are the ones last seen, and from when
  const at = state.keptAt ? new Date(state.keptAt) : null, atDay = at ? at.toLocaleDateString("sv-SE") : "";
  const seen = state.fromCopy && at ? " " + T("Tasks as last seen", "Задачите како последно видени") + " "
    + (atDay === todayStr() ? "" : dm(atDay) + " ") + at.toTimeString().slice(0, 5) + "." : "";
  let msg = "";
  if (offlineNow() || state.netDown || state.slowLoad)
    msg = (state.slowLoad && !offlineNow() ? T("Weak signal, still loading.", "Слаб сигнал, сè уште се вчитува.") : T("No signal.", "Нема сигнал."))
      + " " + T("Tasks still save here and are sent when it is back", "Задачите се чуваат тука и се испраќаат кога ќе се врати")
      + (n ? " · " + T(`${n} waiting`, `чекаат ${n}`) : "") + "." + seen;
  else if (n && state.signedOut) msg = T(`Sign out and in again to send ${n} task${n > 1 ? "s" : ""}: this phone's sign-in has run out.`,
    `Одјави се и најави се повторно за да се испратат задачи (${n}): најавата на телефонот истекла.`);
  else if (n && stuck) msg = T(`Waiting for a signal to send ${n} task${n > 1 ? "s" : ""}; it happens by itself.`,
    `Чека сигнал за да се испратат задачи: ${n}; ќе се случи само.`);
  if (msg) { $("loadmsg").textContent = msg; bar.style.display = "flex"; bar.dataset.net = "1"; }
  else if (bar.dataset.net) { bar.style.display = "none"; delete bar.dataset.net; }
}

/* ============================================================
   TASKS
============================================================ */
const recurDays = (t) => (t.recur_days && t.recur_days.length) ? t.recur_days
  : (t.recur_dow !== null && t.recur_dow !== undefined ? [t.recur_dow] : []);
// Monday-based week number since the epoch, so "every 2 weeks" stays stable.
const weekIndex = (ds) => Math.floor((Date.parse(ds + "T12:00") / 86400000 + 3) / 7);
const lastDayOfMonth = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

function occursOn(t, dateStr) {
  if (!t.recurrence) return t.due_date === dateStr;
  const from = t.recur_from || t.due_date || null;
  if (from && dateStr < from) return false;                    // not started yet
  if (t.recur_until && dateStr > t.recur_until) return false;  // finished
  const d = new Date(dateStr + "T12:00");
  const every = Math.max(1, parseInt(t.recur_every) || 1);

  if (t.recurrence === "daily") {
    if (every === 1 || !from) return true;
    const days = Math.round((Date.parse(dateStr + "T12:00") - Date.parse(from + "T12:00")) / 86400000);
    return days >= 0 && days % every === 0;
  }
  if (t.recurrence === "weekly") {
    if (!recurDays(t).includes(d.getDay())) return false;
    if (every === 1 || !from) return true;
    return (weekIndex(dateStr) - weekIndex(from)) % every === 0;
  }
  if (t.recurrence === "monthly") {
    // a task set for the 31st still fires on the 30th, 29th or 28th
    const target = Math.min(t.recur_dom || 1, lastDayOfMonth(d));
    if (d.getDate() !== target) return false;
    if (every === 1 || !from) return true;
    const f = new Date(from + "T12:00");
    const months = (d.getFullYear() - f.getFullYear()) * 12 + (d.getMonth() - f.getMonth());
    return months >= 0 && months % every === 0;
  }
  return false;
}

// How far back a missed repeat is still asked about. A habit's misses are in
// its record and are not chased here; a daily routine only its last day, as
// the day before that has passed; anything else for a week, then it lets go.
function missLookback(t) {
  if (isHabit(t)) return 0;
  if (t.recurrence === "daily") return Math.max(1, parseInt(t.recur_every) || 1);
  return 7;
}

// "Mine" means what I could pick up: assigned to me, or to nobody.
const taskInScope = (t, ctx) =>
  (!state.mineOnly || t.assigned_to === state.uid || !t.assigned_to)
  && (!ctx || ctx === "all" || t.context === ctx);

// One rule for what needs attention, read by Home, the Tasks tab and the badge,
// so the three can never disagree about how much is late or due.
function taskBuckets(today, ctx) {
  const overdue = [], missed = [], todays = [], undated = [], doneToday = [];
  for (const t of state.tasks) {
    if (!taskInScope(t, ctx)) continue;
    if (t.recurrence) {
      const m = missedDates(t, today, missLookback(t));
      if (m.length) missed.push({ t, dates: m });
    } else if (!t.done && t.due_date && t.due_date < today) overdue.push(t);
    else if (!t.done && !t.due_date) undated.push(t);
    if (occursOn(t, today) && !isDoneOn(t, today)) todays.push(t);
    // finished today: a recurring occurrence ticked for today, or a one-off
    // whose completion was recorded today (whatever day it was due)
    if (t.recurrence ? isDoneOn(t, today) : (t.done && t.last_done === today)) doneToday.push(t);
  }
  const ids = new Set([...overdue, ...todays].map((t) => t.id).concat(missed.map((m) => m.t.id)));
  return { overdue, missed, todays, undated, doneToday, late: overdue.length + missed.length, attention: ids.size };
}

// Occurrences in the recent past that were never ticked off.
function missedDates(t, today, lookback = 30) {
  if (!t.recurrence) return [];
  const out = [];
  const d = new Date(today + "T12:00");
  for (let i = 1; i <= lookback; i++) {
    d.setDate(d.getDate() - 1);
    const ds = d.toLocaleDateString("sv-SE");
    // done or deliberately skipped — either way it is settled
    if (occursOn(t, ds) && !isDoneOn(t, ds) && !state.skipSet.has(t.id + ":" + ds)) out.push(ds);
    if (out.length >= 5) break;
  }
  return out;
}
function isDoneOn(t, dateStr) {
  if (!t.recurrence) return !!t.done;
  return state.doneSet.has(t.id + ":" + dateStr) || t.last_done === dateStr;
}

// Says what is actually filtering, and offers the way out.
function emptyToday() {
  const bits = [];
  if (state.ctxFilter && state.ctxFilter !== "all") bits.push(CTX[state.ctxFilter]);
  if (state.mineOnly) bits.push("assigned to you");
  if (!bits.length) return '<div class="empty">No tasks for today.<br>Add with + or the microphone</div>';
  return `<div class="empty">Nothing in ${bits.join(" · ")} today.<br>
    <button class="btn sm ghost" style="margin-top:10px;display:inline-flex;width:auto"
      onclick="state.ctxFilter='all';state.mineOnly=false;renderToday()">Show everything</button></div>`;
}
// Assigning work is only half of delegating — you also have to be able to see
// what each person is holding. Personal tasks never appear here: the database
// hides other people's, so they are not in this list to begin with.
function personWork(uid) {
  const t = todayStr();
  const mine = state.tasks.filter((x) => x.assigned_to === uid && !x.done);
  return {
    all: mine,
    overdue: mine.filter((x) => !x.recurrence && x.due_date && x.due_date < t),
    today: mine.filter((x) => occursOn(x, t) && !isDoneOn(x, t)),
  };
}

/* ---------- adding a task in one line ----------
   Typed as it would be said: "Call Marko tomorrow 10:00 elaks". The words
   the voice entry understands — a day, a time, an area, "important" — are
   taken out and the rest is the title. With no day it is for today; with a
   time it reminds at that time. */
function quickAddParse() {
  const raw = (($("tk-quick") || {}).value || "").trim();
  if (!raw) return null;
  const p = parseSpoken(raw);
  if (!p.title) return null;
  const ctx = p.context && myCtx().includes(p.context) ? p.context
    : state.ctxFilter !== "all" && myCtx().includes(state.ctxFilter) ? state.ctxFilter : defaultCtx();
  return { ...p, context: ctx, due_date: p.due_date || viewDay() || todayStr() };
}
// what will be saved, said under the line as it is typed
function quickAddHint() {
  const el = $("tk-quick-hint");

  if (!p) { el.innerHTML = ""; return; }
  const day = p.due_date === todayStr() ? T("today", "денес")
    : p.due_date === backDays(-1) ? T("tomorrow", "утре") : wd(p.due_date) + " " + dm(p.due_date);
  el.innerHTML = `${T("Adds", "Додава")} <b>${esc(p.title)}</b> · ${day}${p.due_time ? " " + p.due_time : ""}`
    + ` · ${CTX[p.context]}${p.priority ? " · ★" : ""}${p.due_time ? " · " + T("reminds then", "потсетува тогаш") : ""}`;
}
function quickAddKey(e) {
  if (e.key !== "Enter" || e.isComposing) return;
  e.preventDefault();
  quickAdd();
}
function quickAdd() {
  const p = quickAddParse();
  if (!p) { $("tk-quick").focus(); return toast(T("Type the task first", "Прво напиши ја задачата")); }
  const row = {
    id: newId(), title: p.title, context: p.context, due_date: p.due_date, due_time: p.due_time || null,
    remind: !!p.due_time, remind_before: 0, priority: !!p.priority,
    ...(p.context === "personal" ? { owner_uid: state.uid } : {}),

  taskSave([{ t: "tasks", do: "insert", row }]);

}
// search is one tap away rather than a second box above the list
function toggleTaskSearch() {

// A search result needs its date and, if finished, when — the plain row shows neither.
const searchRow = (today) => (t) => {
  const done = !t.recurrence && t.done;
  const when = done ? "done " + dmy(t.last_done)
    : t.recurrence ? "repeats"
    : t.due_date ? dmy(t.due_date) : "no date";
  return `<div class="card task ${done ? "done" : ""}">
    <button class="tick" onclick="toggleTask('${t.id}',null,this)" aria-label="done">${done ? "✓" : ""}</button>

    <span class="t-title" role="button" tabindex="0" onclick="openTaskSheet('${t.id}')">${t.priority ? '<span class="star">★</span> ' : ""}${esc(t.title)}</span>
    <span class="t-time">${when}</span>
  </div>`;
};
// The day is not only tasks: there is work booked at a client's site and
// guests coming and going. Those live in other tabs, which meant no single
// screen showed the day. They appear here as entries you can open, not tick.
function dayExtras(today) {
  const rows = [];
  const ctxOk = (c) => state.ctxFilter === "all" || state.ctxFilter === c;

  if (state.perm.elaks && ctxOk("elaks")) {
    for (const j of state.jobs) {
      if (j.status === "done" || j.status === "cancelled") continue;
      if (!j.scheduled_on || j.scheduled_on > today) continue;
      if (state.mineOnly && j.assigned_to && j.assigned_to !== state.uid) continue;
      rows.push({
        ctx: "elaks", ico: "job", time: j.scheduled_time ? String(j.scheduled_time).slice(0, 5) : "",
        late: j.scheduled_on < today,
        tag: T("job", "работа"), title: j.title,
        sub: [jobClient(j), jobSite(j), j.address].filter(Boolean).join(" · "),
        open: `openJobSheet('${j.id}')`,
      });
    }
  }

  if (state.perm.apts && ctxOk("apts")) {
    for (const s of state.stays) {
      const apt = (s.apartments && s.apartments.name) || "";
      if (dOnly(s.check_in) === today && !s.arrived_at) {
        rows.push({ ctx: "apts", ico: "arrive", time: "", tag: T("arriving", "пристига"),
          title: s.guest_name, sub: [apt, s.source].filter(Boolean).join(" · "),
          open: `openStaySheet('${s.id}')` });
      }
      if (dOnly(s.check_out) === today && !stayEnded(s)) {
        rows.push({ ctx: "apts", ico: "leave", time: checkoutTimeFor(s.apartment_id),
          tag: T("leaving", "заминува"),
          title: s.guest_name, sub: apt, open: `openStaySheet('${s.id}')` });
      }
    }
  }

  // rent that falls due today or is already late this month
  if (state.perm.apts && ctxOk("apts")) {
    const m = today.slice(0, 7);
    for (const l of state.leases || []) {
      if (rentLeft(l, m) <= 0.005 || rentDueDate(l, m) > today) continue;
      rows.push({ ctx: "apts", ico: "home", time: "", late: rentDueDate(l, m) < today,
        tag: T("rent", "кирија"), title: l.tenant_name,
        sub: [aptName(l.apartment_id), fmt(rentLeft(l, m)) + " ден."].join(" · "),
        open: `openRentPay('${l.id}','${m}')` });
    }
  }

  return rows.sort((a, b) => (b.late ? 1 : 0) - (a.late ? 1 : 0)
    || (a.time || "99:99").localeCompare(b.time || "99:99"));
}

// What else is on a day ahead: work booked for it, guests coming or going,
// rent falling due. Today's own list (dayExtras) also carries what is late.
function dayExtrasOn(ds) {
  if (ds === todayStr()) return dayExtras(ds);
  const rows = [];
  const ctxOk = (c) => state.ctxFilter === "all" || state.ctxFilter === c;
  if (state.perm.elaks && ctxOk("elaks")) {
    for (const j of state.jobs) {
      if (j.status === "done" || j.status === "cancelled" || j.scheduled_on !== ds) continue;
      if (state.mineOnly && j.assigned_to && j.assigned_to !== state.uid) continue;
      rows.push({ ctx: "elaks", ico: "job", time: j.scheduled_time ? String(j.scheduled_time).slice(0, 5) : "",
        tag: T("job", "работа"), title: j.title, sub: [jobClient(j), jobSite(j), j.address].filter(Boolean).join(" · "),
        open: `openJobSheet('${j.id}')` });
    }
  }
  if (state.perm.apts && ctxOk("apts")) {
    for (const s of state.stays) {
      const apt = (s.apartments && s.apartments.name) || "";
      if (dOnly(s.check_in) === ds) rows.push({ ctx: "apts", ico: "arrive", time: "", tag: T("arriving", "пристига"),
        title: s.guest_name, sub: [apt, s.source].filter(Boolean).join(" · "), open: `openStaySheet('${s.id}')` });
      if (dOnly(s.check_out) === ds) rows.push({ ctx: "apts", ico: "leave", time: checkoutTimeFor(s.apartment_id),
        tag: T("leaving", "заминува"), title: s.guest_name, sub: apt, open: `openStaySheet('${s.id}')` });
    }
    for (const l of state.leases || []) {
      const m = ds.slice(0, 7);
      if (rentDueDate(l, m) !== ds || rentLeft(l, m) <= 0.005) continue;
      rows.push({ ctx: "apts", ico: "home", time: "", tag: T("rent", "кирија"), title: l.tenant_name,
        sub: [aptName(l.apartment_id), fmt(rentLeft(l, m)) + " ден."].join(" · "), open: `openRentPay('${l.id}','${m}')` });
    }
  }
  return rows.sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
}
// the tasks on a day, still to do — a repeating one counted on each day it comes round
const openOn = (ds) => state.tasks.filter((t) => taskInScope(t, state.ctxFilter) && occursOn(t, ds) && !isDoneOn(t, ds));
// the day being looked at, if not today; a day that has since passed lets go

// How the day is going, at a glance: what is done against all there is, and

function todayHead(B) {

function renderToday() {
  const today = todayStr();
  const q = (($("tk-search") || {}).value || "").trim().toLowerCase();
  renderCtxChips();
  renderTaskStrip();
  renderTaskBar();
  if (!q && viewDay()) return renderDayView(viewDay());
  if (q) {
    const hits = state.tasks.filter((t) => taskInScope(t, state.ctxFilter) && (
      (t.title || "").toLowerCase().includes(q) || (t.notes || "").toLowerCase().includes(q) ||
      (t.checklist || []).some((c) => (c.text || "").toLowerCase().includes(q))));
    const open = hits.filter((t) => !isDoneOn(t, today) || t.recurrence);
    const done = hits.filter((t) => !t.recurrence && t.done);
    $("today-list").innerHTML = hits.length
      ? `<div class="sec tapp" role="button" tabindex="0" onclick="$('tk-search').value='';renderToday()">
           ${hits.length} result${hits.length > 1 ? "s" : ""} <span class="muted" style="font-weight:400">· clear ✕</span></div>`
        + open.map(searchRow(today)).join("")
        + (done.length ? '<div class="sec">Completed</div>' + done.map(searchRow(today)).join("") : "")
      : `<div class="empty">Nothing found for "${esc(q)}"${state.ctxFilter !== "all" || state.mineOnly ? " with these filters" : ""}.<br>
          <button class="btn sm ghost" style="margin-top:10px;display:inline-flex;width:auto"
            onclick="$('tk-search').value='';state.ctxFilter='all';state.mineOnly=false;renderToday()">Clear search and filters</button></div>`;
    $("week-list").innerHTML = "";
    return;
  }
  const vis = (t) => taskInScope(t, state.ctxFilter);
  const byPrio = (a, b) => (b.priority ? 1 : 0) - (a.priority ? 1 : 0);
  const B = taskBuckets(today, state.ctxFilter);
  const overdue = B.overdue.slice().sort(byPrio);
  const missed = B.missed;
  const todays = B.todays.slice().sort(byPrio);
  const inbox = B.undated;
  const extras = dayExtras(today);
  const row = taskRow(today);
  // In the order you would deal with them: what slipped, what is on today,
  // what else is happening today, and only then what has no day yet — which
  // used to sit above today and push it off the screen.
  let html = "";
  // A pile of late things used to push today off the screen. Two or fewer are
  // shown as they are; more fold into one line that opens.
  const lateN = overdue.length + missed.length;
  const fold = lateN > 2 && !state.showLate;
  if (fold) {
    const names = [...overdue.map((t) => t.title), ...missed.map((m) => m.t.title)];
    html += `<div class="card late-line" role="button" tabindex="0" onclick="state.showLate=true;renderToday()">
      <span class="late-n">${lateN}</span><b style="color:var(--danger)">${T("overdue", "задоцнети")}</b>
      <span class="late-what">${esc(names.slice(0, 3).join(" · "))}</span><span class="chev">›</span></div>`;
  } else if (lateN) {
    html += `<div class="sec-row"><div class="sec ${lateN > 2 ? "tapp" : ""}" style="color:var(--danger)" ${lateN > 2
      ? `role="button" tabindex="0" onclick="state.showLate=false;renderToday()"` : ""}>${T("Overdue", "Задоцнети")} · ${lateN}${
      lateN > 2 ? ` <span class="muted" style="font-weight:400">▾</span>` : ""}</div>
      ${overdue.length ? `<button class="chip sm" onclick="moveAllOverdue()">${T("Move all to today", "Помести ги на денес")}</button>` : ""}
    </div>` + overdue.map(row).join("") + missed.map(missedRow).join("");
  }
  if (!state.loading) html += todayHead(B);
  if (todays.length) html += todays.map(row).join("");
  if (extras.length) html += `<div class="sec">${T("Also today", "Исто денес")}</div>` + extras.map(extraRow).join("");
  if (inbox.length) html += `<div class="sec">${T("No date", "Без датум")} · ${inbox.length}</div>` + inbox.map(row).join("");
  if (!todays.length && !overdue.length && !missed.length && !inbox.length && !extras.length && !B.doneToday.length) {
    html += state.loading ? SKEL() : emptyToday();
  }
  if (!state.loading && B.doneToday.length) {
    html += `<div class="sec tapp" role="button" tabindex="0" onclick="state.showDone=!state.showDone;renderToday()">
      ${T("Done today", "Завршени денес")} · ${B.doneToday.length} <span class="muted" style="font-weight:400">${state.showDone ? "▾" : "▸"}</span></div>`;
    if (state.showDone) html += B.doneToday.map(row).join("");
  }
  $("today-list").innerHTML = html;

  // what is coming
  const horizon = state.horizon || 7;
  const days = Array.from({ length: horizon }, (_, i) => backDays(-(i + 1)));
  // Something that comes round more than once in the window — every day, or
  // Tue, Thu and Sat — would put the same row under each of its days below.
  // It is said once, above them, by how it repeats, instead.
  const daily = state.tasks.filter((t) => vis(t) && t.recurrence && days.filter((ds) => occursOn(t, ds)).length > 1);
  let week = `<div class="sec-row"><div class="sec">${T("Upcoming", "Претстојни")}</div><div class="chips">
    ${[7, 30].map((n) => `<button class="chip sm ${horizon === n ? "on" : ""}" onclick="state.horizon=${n};renderToday()">${n} ${T("days", "дена")}</button>`).join("")}
  </div></div>`;
  // one line per rhythm, every day first
  const rhythms = new Map();
  for (const t of daily.slice().sort((a, b) => (a.recurrence === "daily" ? 0 : 1) - (b.recurrence === "daily" ? 0 : 1)
    || (a.due_time || "99:99").localeCompare(b.due_time || "99:99"))) {
    const k = repeatLabel(t);
    if (!rhythms.has(k)) rhythms.set(k, []);
    rhythms.get(k).push(t);
  }
  for (const [k, ts] of rhythms) {
    week += `<div class="tk-daily">${ICON.repeat}<span>${esc(k)}:</span>${ts.map((t, i) =>
      `<button onclick="openTaskSheet('${t.id}')">${esc(t.title)}${t.due_time ? ` <span class="muted">${t.due_time.slice(0, 5)}</span>` : ""}</button>${
        i < ts.length - 1 ? "<span>·</span>" : ""}`).join("")}</div>`;
  }
  let any = daily.length > 0;
  days.forEach((ds, i) => {
    const list = state.tasks.filter((t) => vis(t) && occursOn(t, ds) && !daily.includes(t));
    if (!list.length) return;
    any = true;
    week += `<div class="sec">${i === 0 ? `${T("Tomorrow", "Утре")} · ${wd(ds)} ${dm(ds)}` : `${wd(ds, "long")} · ${dm(ds)}`}</div>`
      + list.sort(byPrio).map(taskRow(today, ds)).join("");
  });
  // Everything beyond the forward window — a check-in three weeks away used
  // to be invisible here, which made it look as if no task had been created.
  const horizonEnd = days[days.length - 1];
  const later = state.tasks
    .filter((t) => vis(t) && !t.recurrence && !t.done && t.due_date && t.due_date > horizonEnd)
    .sort((a, b) => a.due_date.localeCompare(b.due_date));
  if (later.length) {
    any = true;
    week += `<div class="sec">${T("Later", "Подоцна")} · ${later.length}</div>` + later.slice(0, 40).map(row).join("");
  }
  if (!any) week += `<div class="empty">${T("Nothing scheduled.", "Ништо не е закажано.")}</div>`;
  $("week-list").innerHTML = week;
}
// Things slip. Recording that should cost one tap, or the overdue list stops

function moveTask(id, date) {
