<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centrala</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A5F">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=cyrillic-ext" rel="stylesheet">
<style>
:root{
  --navy:#1E3A5F; --navy-deep:#152A46; --amber:#F5B301; --paper:#F7F8FA;
  --card:#FFFFFF; --ink:#23272E; --muted:#6B7280; --line:#E5E8EC;
  --work:#4C6EF5; --elaks:#1E3A5F; --personal:#2F9E68; --apts:#7E5BC0; --danger:#D6455D; --danger-bg:#FBE9EC;
  --surface:#FFFFFF; --on-dark:#FFFFFF;
  --r:14px; --pad:16px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;width:100%;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;display:flex;align-items:baseline;gap:10px}
.topbar h1{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em}
.topbar img{width:22px;height:22px;border-radius:6px;flex:none;align-self:center}
.topbar .date{margin-left:auto;font-size:12.5px;opacity:.75;font-family:var(--mono)}

/* ---- tab bar ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--navy-deep);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:9px 0 7px;color:#8DA2BC;font-family:var(--cond);font-weight:600;
  font-size:12px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .led{width:5px;height:5px;border-radius:50%;background:transparent}
.tabbar button{position:relative}
.tabbar button.on{color:#fff}
.bdg{position:absolute;top:3px;right:calc(50% - 24px);background:var(--amber);color:var(--navy-deep);font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px;display:none}
.bdg.on{display:block}
.tabbar button.on .led{background:var(--amber);box-shadow:0 0 6px var(--amber)}

/* ---- generic ---- */
.view{display:none;padding:var(--pad);padding-bottom:calc(var(--pad) + 80px)}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.led.work{background:var(--work)} .led.elaks{background:var(--elaks)} .led.personal{background:var(--personal)} .led.apts{background:var(--apts)}
.led.ok{background:var(--personal)} .led.low{background:var(--amber);box-shadow:0 0 5px var(--amber)}
.led.out{background:var(--danger);box-shadow:0 0 5px var(--danger)}
.led.draft{background:#9AA4B2} .led.sent{background:var(--work)} .led.accepted{background:var(--personal)} .led.rejected{background:var(--danger)}
.sec{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:10px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{background:var(--navy);color:#fff;border-radius:11px;padding:12px 16px;font-weight:600;width:100%;margin-top:14px}
.btn.amber{background:var(--amber);color:var(--navy-deep)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger)}
.btn.sm{width:auto;padding:8px 13px;margin:0;font-size:13.5px;border-radius:9px}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:19;
  width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--navy-deep);
  font-size:30px;font-weight:600;box-shadow:0 4px 14px rgba(30,58,95,.35);display:none;align-items:center;justify-content:center;line-height:1}
.fab.on{display:flex}
.mic{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:19;
  width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;
  box-shadow:0 4px 14px rgba(30,58,95,.35);display:none;align-items:center;justify-content:center}
.mic.beside{right:86px;bottom:calc(74px + env(safe-area-inset-bottom))}
.mic.on{display:flex}
.mic.rec{background:var(--danger);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.vbig{font-size:19px;line-height:1.45;min-height:96px;margin:14px 0;color:var(--ink)}
.vbig .dim{color:var(--muted)}
.vhint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}

/* ---- sheet ---- */
.overlay{position:fixed;inset:0;background:rgba(21,42,70,.45);z-index:30;display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);
  border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:0 var(--pad) calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;display:none}
.sheet.on{display:block;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{font-family:var(--cond);font-weight:700;font-size:17px;margin-bottom:4px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-top{position:sticky;top:0;z-index:3;background:var(--paper);touch-action:none;
  margin:0 calc(var(--pad) * -1) 10px;padding:12px var(--pad) 10px;border-radius:18px 18px 0 0}
.sheet-x{position:absolute;right:10px;top:6px;width:31px;height:31px;border-radius:50%;
  background:var(--line);color:var(--muted);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.sheet-x:active{opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.grid2 > div{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.grid2 > div > label{margin-top:12px}
.grid2 > div > label:first-child{margin-top:0}

/* ---- tasks ---- */
.task{display:flex;align-items:center;gap:11px}
.task .tick{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.task.done .tick{background:var(--personal);border-color:var(--personal)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.task .t-title{flex:1;font-weight:500}
.task .t-time{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.task .rec{font-size:11px;color:var(--muted)}
.who{background:var(--line);color:var(--muted);border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:700;flex:none}
.clbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;color:var(--on-dark);font-size:14px;display:flex;align-items:center;justify-content:center}
.clbox.on{background:var(--personal);border-color:var(--personal)}

/* ---- inventory ---- */
.art{display:flex;align-items:center;gap:11px}
.art .a-name{flex:1;min-width:0}
.art .a-name b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .a-name span{font-size:12px;color:var(--muted)}
.art .a-qty{font-family:var(--mono);font-weight:600;font-size:16px;text-align:right}
.art .a-qty small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;flex:none;background:#ECECEC}
.thumb-lg{width:100%;max-height:210px;object-fit:contain;border-radius:11px;background:#ECECEC;margin-top:10px}
.mov{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border:0}

/* ---- offers ---- */
.offer .o-num{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.offer .o-total{font-family:var(--mono);font-weight:600;white-space:nowrap}
.oitem{display:grid;grid-template-columns:1fr 58px 74px 74px 28px;gap:6px;align-items:center;margin-bottom:6px;font-size:13.5px}
.oitem input{padding:7px 8px;font-size:14px}
.oitem .del{color:var(--danger);font-size:18px;text-align:center}
.ohead{display:grid;grid-template-columns:1fr 58px 74px 74px 28px;gap:6px;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px}
.totalbar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;
  border-radius:11px;padding:11px 14px;margin-top:10px;font-weight:600}
.totalbar .mono{color:var(--amber);font-size:17px}

/* ---- login ---- */
#login{max-width:360px;margin:16vh auto 0;padding:0 var(--pad)}
#login .logo{width:64px;height:64px;border-radius:16px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--navy-deep);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:center;gap:12px;max-width:92vw}
.toast.act{pointer-events:auto}
.toast button{color:var(--amber);font-weight:700;font-size:13.5px;white-space:nowrap}
.toast.on{opacity:1}
.search{margin-bottom:10px}
#loadbar{background:var(--danger-bg);color:var(--danger);padding:9px 14px;font-size:13px;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#loadbar button{font-weight:700;text-decoration:underline;flex:none}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hcard h3{font-family:var(--cond);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;gap:10px;flex-wrap:wrap}
.hrow > :first-child{flex:0 0 auto;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow > :last-child{margin-left:auto;white-space:nowrap;text-align:right}
.hsub{font-size:12.5px;color:var(--muted);line-height:1.5;margin:2px 0 4px}
.hsub b{color:var(--ink);font-weight:600}
.hnote{font-size:12px;color:var(--muted);text-align:right;margin:-2px 0 4px}
.hnote.warn{color:var(--danger)}
.htxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick.sm{width:21px;height:21px;border-radius:7px;font-size:12px}
.bank-big{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.01em}
.bank-lbl{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:14px 0 2px}
.acct{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:8px 10px;cursor:pointer}
.acct:active{opacity:.65}
.acct span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct b{display:block;font-family:var(--mono);font-size:14.5px;margin-top:1px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:14px}
.setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;margin-bottom:8px;cursor:pointer}
.setrow:active{opacity:.65}
.setrow .ico{width:34px;height:34px;border-radius:10px;background:var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.setrow .txt{flex:1;min-width:0}
.setrow .txt b{display:block;font-size:15px}
.setrow .txt span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.setrow .chev{color:var(--muted);font-size:18px;flex:none}
.more{margin:6px 0}
.more .morebody{display:none}
.more[data-open="1"] .morebody{display:block}
.more[data-open="1"] .chev{transform:rotate(180deg)}
.morebtn{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  font-weight:600;font-size:14px;color:var(--muted);margin:4px 0 10px}
.morebtn .chev{transition:transform .18s}
.setgrp{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(21,42,70,.55);display:none;
  align-items:center;justify-content:center;padding:22px}
.dlg.on{display:flex}
.dlg-box{background:var(--card);border-radius:16px;padding:18px 18px 14px;width:100%;max-width:360px;
  box-shadow:0 12px 34px rgba(0,0,0,.35)}
.dlg-msg{white-space:pre-line;line-height:1.5;margin-bottom:14px}
.dlg-box .btn{margin-top:8px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:35;
  background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;display:none;
  align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 18px rgba(30,58,95,.4)}
.updbar.on{display:flex}
.updbar button{background:var(--amber);color:var(--navy-deep);border-radius:9px;padding:7px 14px;font-weight:700}
.hrow b{font-family:var(--mono)}
.hbig{font-size:26px;font-weight:700;font-family:var(--cond)}
.hflag{color:var(--danger);font-weight:600}
.skel{height:58px;border-radius:var(--r);margin-bottom:10px;
  background:linear-gradient(90deg,var(--line) 25%,var(--card) 37%,var(--line) 63%);
  background-size:400% 100%;animation:shim 1.3s ease-in-out infinite}
.skel.tall{height:104px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.mov.tapp{cursor:pointer}
.sec.tapp{cursor:pointer;display:flex;align-items:center;gap:6px}
.sec.tapp:active{opacity:.6}
.mov.tapp:active{opacity:.6}
.bankrow{justify-content:space-between;align-items:baseline;margin-top:7px}
.nw{white-space:nowrap}
.calc{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.hok{color:var(--personal);font-weight:600}
.cal-apt{font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.cal-head span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.cal-head span.we{color:var(--ink)}
.cal-d{aspect-ratio:1/1;border-radius:9px;background:var(--line);color:var(--muted);
  font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.1;padding:0;min-height:38px}
.cal-d.bk{background:var(--personal);color:#fff}
.cal-d.pad{background:transparent;pointer-events:none}
.cal-d.now{box-shadow:inset 0 0 0 2px var(--amber)}
.cal-d small{font-size:9.5px;font-weight:700;opacity:.95}

/* ---- printable offer (PDF) ---- */
#printroot{display:none}
@media print{
  body{background:#fff;padding:0}
  body > *:not(#printroot){display:none !important}
  #printroot{display:block !important}
  @page{size:A4;margin:12mm 10mm}
}
.pv{font-family:Arial,Helvetica,sans-serif;color:#232323;font-size:9.5pt;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.pv-top{width:100%;border-collapse:collapse;margin-bottom:6mm}
.pv-top td{vertical-align:top}
.pv-top td.r{text-align:right;width:42mm}
.pv-num{font-size:13pt;font-weight:700;padding-top:4mm}
.pv-num u{color:#1F3864;text-decoration:underline;margin-left:4mm}
.pv-logo{width:39mm;height:auto}
.pv-banner{width:125mm;height:auto;display:block}
.pv-client{font-size:12pt;font-weight:700;color:#1F3864;margin:3mm 0 3mm 5mm}
.pv-fields{border-collapse:collapse;margin:0 0 8mm 5mm;font-size:9.5pt}
.pv-fields td{padding:1.1mm 0;vertical-align:top}
.pv-fields td:first-child{width:32mm;color:#232323}
.pv-items{width:100%;border-collapse:separate;border-spacing:1.2mm 1.2mm;table-layout:fixed}
.pv-items th{font-weight:400;color:#252525;font-size:10pt;padding:1mm 0;text-align:center}
.pv-items td{background:#ECECEC;padding:2.4mm 2mm;vertical-align:middle;font-size:9pt}
.pv-items td.c{text-align:center}
.pv-items td.b{font-weight:700}
.pv-items td img{max-width:100%;max-height:26mm;display:block;margin:0 auto}
.pv-items .sp{margin-top:1.5mm;line-height:1.35}
.pv-total{background:#2462AC !important;color:#fff;font-weight:700;font-size:11pt;padding:3mm 4mm !important;text-align:left}
.pv-note{color:#C00000;font-weight:700;text-align:center;margin:6mm 0 2mm}
.pv-valid{color:#C00000;font-weight:700;text-align:center;margin-bottom:8mm}
.pv-footer{display:block;margin:10mm auto 0;width:57mm;height:auto}
.pv-items tr{page-break-inside:avoid}
.rp-h1{font-size:13pt;font-weight:700;margin:0 0 1mm}
.rp-sub{color:#555;font-size:9.5pt;margin-bottom:6mm}
.rp-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:6mm}
.rp-tbl th{text-align:left;border-bottom:1px solid #8a8a8a;padding:1.8mm 1mm;font-weight:700}
.rp-tbl td{border-bottom:1px solid #dcdcdc;padding:1.8mm 1mm}
.rp-tbl th.r,.rp-tbl td.r{text-align:right}
.rp-bar{background:#2462AC !important;color:#fff;font-weight:700;padding:2.6mm 3mm;font-size:10.5pt;
  display:flex;justify-content:space-between;margin-bottom:6mm}
@media (prefers-color-scheme: dark){
  :root{--paper:#12161C;--card:#1A202A;--ink:#E7EAF0;--line:#2A3242;--muted:#95A1B5;--danger-bg:#3A1B22;--surface:#1A202A}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .task .tick{border-color:#39424F}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" style="display:none">
  <img src="icon-192.png?v=3" class="logo" alt="">
  <h1 style="font-family:var(--cond);font-size:24px;margin-bottom:2px">Centrala</h1>
  <p class="muted" style="margin-bottom:18px">Tasks · Stock · Offers</p>
  <label>Email</label><input id="lg-email" type="email" autocomplete="username">
  <label>Password</label><input id="lg-pass" type="password" autocomplete="current-password">
  <button class="btn" onclick="login()">Sign in</button>

const backDays = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toLocaleDateString("sv-SE"); };
const backMonths = (n) => { const d = new Date(); d.setMonth(d.getMonth() - n, 1); return d.toLocaleDateString("sv-SE"); };

async function refreshAll(only) {
  const keys = (only || Object.keys(LOADERS)).filter((k) => LOADERS[k] && LOADERS[k].need());
  const res = await Promise.all(keys.map((k) => LOADERS[k].q()));
  const failed = [];
  keys.forEach((k, i) => {
    const r = res[i];
    if (r.error) { console.error("load", k, r.error); failed.push(k); return; }
    if (LOADERS[k].scalar) state[k] = (r.data && r.data.balance != null) ? parseFloat(r.data.balance) : 0;
    else state[k] = r.data ?? [];
    if (k === "completions") state.doneSet = new Set((r.data ?? []).map((c) => c.task_id + ":" + c.done_on));
  });
  if (failed.length) {
    $("loadmsg").textContent = "Could not load: " + failed.join(", ") + ". Data shown may be incomplete.";
    $("loadbar").style.display = "flex";
  } else if (!only) $("loadbar").style.display = "none";
}

/* ---------- asking things, in the app's own language and style ----------
   Replaces the browser's confirm/alert/prompt, which cannot be translated,
   carry the site address in their title, and ignore the app's styling. */
function dialog({ msg, ok, cancel, danger, input }) {
  return new Promise((resolve) => {
    const box = $("dlg"), okBtn = $("dlg-ok"), noBtn = $("dlg-cancel"), field = $("dlg-input");
    $("dlg-msg").textContent = msg;
    okBtn.textContent = ok || T("OK", "Во ред");
    okBtn.classList.toggle("danger", !!danger);
    noBtn.style.display = cancel === false ? "none" : "";
    noBtn.textContent = T("Cancel", "Откажи");
    field.style.display = input === undefined ? "none" : "";
    if (input !== undefined) { field.value = input; }
    box.classList.add("on");
    if (input !== undefined) setTimeout(() => field.focus(), 60);

    const done = (val) => {
      box.classList.remove("on");
      okBtn.onclick = noBtn.onclick = box.onclick = null;
      okBtn.classList.remove("danger");
      resolve(val);
    };
    okBtn.onclick = () => done(input === undefined ? true : (field.value || ""));
    noBtn.onclick = () => done(input === undefined ? false : null);
    box.onclick = (e) => { if (e.target === box) done(input === undefined ? false : null); };
  });
}

// The app sits open in the background for days, so a deploy never reaches it
// until the page is really reloaded — switching to it from recents just resumes
// the old page. Check whenever it comes back to the foreground.
const BUILD = "20260808-232348";
let lastBuildCheck = Date.now();
async function checkForUpdate() {
  if (Date.now() - lastBuildCheck < 60000) return;
  lastBuildCheck = Date.now();
  try {
    const res = await fetch("./index.html?ts=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const m = (await res.text()).match(/const BUILD = "([^"]+)"/);
    if (!m || m[1] === BUILD) return;
    const busy = sheetOpen || (document.activeElement && /input|textarea|select/i.test(document.activeElement.tagName));
    if (!busy) return location.reload();      // nothing in progress — just take it
    $("updbar").classList.add("on");          // mid-edit: let him finish first
  } catch (e) { /* offline — nothing to do */ }
}
// a row that behaves like a button should also be usable from a keyboard
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = document.activeElement;
  if (el && el.getAttribute && el.getAttribute("role") === "button" && el.tagName !== "BUTTON") {
    e.preventDefault(); el.click();
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  checkForUpdate();
  render();                       // check-out time may have passed while away
});
// "Currently staying" depends on the time of day, so keep it honest while open
setInterval(() => { if (!document.hidden) render(); }, 5 * 60 * 1000);
window.addEventListener("focus", checkForUpdate);

// A notification hands its task over through the URL (or a message when the
// app is already open); act on it, then clean the address bar.
function handleNotificationIntent() {
  const p = new URLSearchParams(location.search);
  const id = p.get("task");

  runTaskIntent(id, p.get("do") || "open");

async function runTaskIntent(id, action) {
  if (!id) return;
  await refreshAll(["tasks", "completions"]);
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return toast("That task is no longer there");
  if (action === "done") {
    if (!isDoneOn(t, todayStr())) await toggleTask(id);
    tab("today"); toast("Done \u2713 " + t.title);
    return;
  }
  if (action === "snooze") {

const recurDays = (t) => (t.recur_days && t.recur_days.length) ? t.recur_days
  : (t.recur_dow !== null && t.recur_dow !== undefined ? [t.recur_dow] : []);
// Monday-based week number since the epoch, so "every 2 weeks" stays stable.
const weekIndex = (ds) => Math.floor((Date.parse(ds + "T12:00") / 86400000 + 3) / 7);
const lastDayOfMonth = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

function occursOn(t, dateStr) {
  if (!t.recurrence) return t.due_date === dateStr;
  const from = t.recur_from || t.due_date || null;
  if (from && dateStr < from) return false;                    // not started yet
  if (t.recur_until && dateStr > t.recur_until) return false;  // finished
  const d = new Date(dateStr + "T12:00");
  const every = Math.max(1, parseInt(t.recur_every) || 1);

  if (t.recurrence === "daily") {
    if (every === 1 || !from) return true;
    const days = Math.round((Date.parse(dateStr + "T12:00") - Date.parse(from + "T12:00")) / 86400000);
    return days >= 0 && days % every === 0;
  }
  if (t.recurrence === "weekly") {
    if (!recurDays(t).includes(d.getDay())) return false;
    if (every === 1 || !from) return true;
    return (weekIndex(dateStr) - weekIndex(from)) % every === 0;
  }
  if (t.recurrence === "monthly") {
    // a task set for the 31st still fires on the 30th, 29th or 28th
    const target = Math.min(t.recur_dom || 1, lastDayOfMonth(d));
    if (d.getDate() !== target) return false;
    if (every === 1 || !from) return true;
    const f = new Date(from + "T12:00");
    const months = (d.getFullYear() - f.getFullYear()) * 12 + (d.getMonth() - f.getMonth());
    return months >= 0 && months % every === 0;
  }
  return false;
}

const MISS_LOOKBACK = 30;

// "Mine" means what I could pick up: assigned to me, or to nobody.
const taskInScope = (t, ctx) =>
  (!state.mineOnly || t.assigned_to === state.uid || !t.assigned_to)
  && (!ctx || ctx === "all" || t.context === ctx);

// One rule for what needs attention, read by Home, the Tasks tab and the badge,
// so the three can never disagree about how much is late or due.
function taskBuckets(today, ctx) {
  const overdue = [], missed = [], todays = [], undated = [], doneToday = [];
  for (const t of state.tasks) {
    if (!taskInScope(t, ctx)) continue;
    if (t.recurrence) {
      const m = missedDates(t, today, MISS_LOOKBACK);
      if (m.length) missed.push({ t, dates: m });
    } else if (!t.done && t.due_date && t.due_date < today) overdue.push(t);
    else if (!t.done && !t.due_date) undated.push(t);
    if (occursOn(t, today) && !isDoneOn(t, today)) todays.push(t);
    // finished today: a recurring occurrence ticked for today, or a one-off
    // whose completion was recorded today (whatever day it was due)
    if (t.recurrence ? isDoneOn(t, today) : (t.done && t.last_done === today)) doneToday.push(t);
  }
  const ids = new Set([...overdue, ...todays].map((t) => t.id).concat(missed.map((m) => m.t.id)));
  return { overdue, missed, todays, undated, doneToday, late: overdue.length + missed.length, attention: ids.size };
}

// Occurrences in the recent past that were never ticked off.
function missedDates(t, today, lookback = 30) {
  if (!t.recurrence) return [];
  const out = [];
  const d = new Date(today + "T12:00");
  for (let i = 1; i <= lookback; i++) {
    d.setDate(d.getDate() - 1);
    const ds = d.toLocaleDateString("sv-SE");
    if (occursOn(t, ds) && !isDoneOn(t, ds)) out.push(ds);
    if (out.length >= 5) break;
  }
  return out;
}
function isDoneOn(t, dateStr) {
  if (!t.recurrence) return !!t.done;
  return state.doneSet.has(t.id + ":" + dateStr) || t.last_done === dateStr;
}

async function toggleTask(id, onDate) {

  if (!t) return;

  const upd = t.recurrence
    ? { last_done: was ? null : day }
    : { done: !was, last_done: !was ? day : null };
  try {
    await dbq(db.from("tasks").update(upd).eq("id", id), "Not updated");
    if (was) {
      const r = await db.from("task_completions").delete().eq("task_id", id).eq("done_on", day);
      if (r.error) { console.error(r.error); toast("Could not un-tick that day"); return; }
      state.doneSet.delete(id + ":" + day);

      if (r.error) { console.error(r.error); toast("Could not record that day"); return; }

function pickTaskImage(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (f.size > 12 * 1024 * 1024) return toast("Photo too large");
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => { tkImg = { mode: "new", thumb: imgResize(im, 72, 0.6), full: imgResize(im, 900, 0.75) }; renderTkImg(); };
    im.onerror = () => toast("Could not read that image");
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}
function removeTaskImage() {

}
function applyTemplate(tid) {

async function saveTask(id) {
  const d = new Date(($("tk-date").value || todayStr()) + "T12:00");
  const rec = $("tk-rec").value || null;
  let days = [];
  if (rec === "weekly") {
    days = [...$("tk-dow").querySelectorAll(".chip.on")].map((b) => parseInt(b.dataset.d));
    if (!days.length) days = [d.getDay()];
    days.sort((a, b) => a - b);
  }
  const row = {
    title: $("tk-title").value.trim(),
    context: $("tk-ctx").querySelector(".chip.on").dataset.c,
    due_date: $("tk-date").value || null,
    due_time: $("tk-time").value || null,
    recurrence: rec,
    recur_dow: rec === "weekly" ? days[0] : null,
    recur_days: rec === "weekly" ? days : null,
    recur_dom: rec === "monthly" ? d.getDate() : null,
    recur_every: rec ? Math.max(1, parseInt(($("tk-int") || {}).value) || 1) : 1,
    recur_from: rec ? ($("tk-date").value || todayStr()) : null,
    recur_until: rec ? (($("tk-until") || {}).value || null) : null,
    priority: $("tk-prio").classList.contains("on"),
    client_id: ($("tk-client") || {}).value || null,
    apartment_id: ($("tk-apt2") || {}).value || null,
    remind: $("tk-rem").value === "1",
    assigned_to: $("tk-who").value || null,
    notes: $("tk-notes").value.trim() || null,
    checklist: tkChecklist.filter((it) => it.text.trim()).length ? tkChecklist.filter((it) => it.text.trim()) : null,
  };
  if (!row.title) return toast("Enter a title");
  if (tkImg.mode === "new") row.photo_thumb = tkImg.thumb;
  if (tkImg.mode === "remove") row.photo_thumb = null;
  try {
    let tid = id;
    if (id) await dbq(db.from("tasks").update(row).eq("id", id), "Task not saved");
    else tid = (await dbq(db.from("tasks").insert(row).select().single(), "Task not saved")).id;
    if (tkImg.mode === "new") await dbq(db.from("task_photos").upsert({ task_id: tid, data: tkImg.full }, { onConflict: "task_id" }), "Photo not saved");
    if (tkImg.mode === "remove") await db.from("task_photos").delete().eq("task_id", tid);
  } catch { return; }
  closeSheet(); await refreshAll(["tasks"]); renderToday(); toast("Saved");
}
async function delTask(id) {
  const row = state.tasks.find((x) => x.id === id);
  if (!row || !await ask("Delete this task?")) return;
  await deleteUndoable("tasks", row, T("Task deleted", "Задачата е избришана"), ["tasks", "completions"]);
}
function openHistory() {
  const rows = [];
  for (const t of state.tasks) {
    if (!t.recurrence) { if (t.done) rows.push({ t, on: t.last_done || "" }); continue; }
    for (const c of state.completions) if (c.task_id === t.id) rows.push({ t, on: c.done_on, rec: true });
  }
  rows.sort((a, b) => (b.on || "").localeCompare(a.on || ""));
  const done = rows;
  const fmtD = (d) => d ? wd(d) + " " + dmy(d) : "Earlier";
  let html = `<h2>Completed tasks</h2>`;
  if (!done.length) html += '<p class="muted">Nothing completed yet.</p>';
  let lastD = null;
  for (const r of done.slice(0, 300)) {
    const t = r.t;
    if (r.on !== lastD) { html += `<div class="sec">${fmtD(r.on)}</div>`; lastD = r.on; }
    html += `<div class="card task done">
      <span class="led ${t.context}"></span>
      <span class="t-title">${esc(t.title)}${r.rec ? '<span class="rec"> ↻</span>' : ""}</span>
      ${r.rec ? "" : `<button class="btn sm ghost" onclick="restoreTask('${t.id}')">Restore</button>
      <button style="color:var(--danger);font-size:17px;padding:4px" onclick="histDelTask('${t.id}')" aria-label="delete">✕</button>`}
    </div>`;
  }
  openSheet(html);
}
async function restoreTask(id) {
  try { await dbq(db.from("tasks").update({ done: false, last_done: null, due_date: todayStr() }).eq("id", id), "Not restored"); } catch { return; }
  await refreshAll(["tasks"]); openHistory(); renderToday(); updateBadges(); toast("Restored to today");
}
async function histDelTask(id) {
  if (!await ask("Delete this task permanently?")) return;
  try { await dbq(db.from("tasks").delete().eq("id", id), "Not deleted"); } catch { return; }
  await refreshAll(["tasks"]); openHistory(); renderToday();
}

const PHOTO_MATTE = "#ECECEC";   // matches the offer table cells (docx + PDF)

function imgHasAlpha(im) {
  try {
    const w = Math.max(1, Math.min(160, im.naturalWidth));
    const h = Math.max(1, Math.round(im.naturalHeight * w / im.naturalWidth));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.drawImage(im, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
  } catch (e) { console.warn("alpha check", e); }
  return false;
}

// Transparent artwork stays transparent (PNG) so it blends into the offer cells.
// Opaque photos stay JPEG. Oversized PNGs fall back to a matte on the cell colour.
function imgResize(im, max, q) {
  const scale = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(im.naturalWidth * scale));
  c.height = Math.max(1, Math.round(im.naturalHeight * scale));
  const ctx = c.getContext("2d");
  if (imgHasAlpha(im)) {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(im, 0, 0, c.width, c.height);
    const png = c.toDataURL("image/png");
    if (png.length < 480000) return png;      // ~350 KB of image data
  }
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = PHOTO_MATTE;
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

/* ---------- spotting duplicates in the list ---------- */
function duplicateGroups() {
  const seen = {}, out = [];
  for (const a of state.stock) {
    if (a.active === false) continue;
    const keys = [normName(a.name)];
    if (a.supplier_code) keys.push("sc:" + String(a.supplier_code).toLowerCase());
    if (a.code) keys.push("c:" + String(a.code).toLowerCase());
    for (const k of keys) {
      if (!k || k.length < 4) continue;
      (seen[k] = seen[k] || []).push(a);
    }
  }
  const used = new Set();
  for (const k of Object.keys(seen)) {
    const g = seen[k].filter((a, i, arr) => arr.findIndex((y) => y.id === a.id) === i);
    if (g.length < 2) continue;
    const sig = g.map((a) => a.id).sort().join("|");
    if (used.has(sig)) continue;
    used.add(sig); out.push(g);
  }
  return out;
}
function openDuplicates() {
  const groups = duplicateGroups();
  openSheet(`<h2>Possible duplicates</h2>
    ${groups.length ? groups.map((g) => `<div class="card">
      ${g.map((a) => `<div class="mov"><span><b>${esc(a.name)}</b>
        <div class="muted">${esc(a.code || a.supplier_code || "")} · stock ${fmt(a.stock)} · ${fmt(a.purchase_price)} ден.</div></span>
        <button class="chip" onclick="openMergeSheet('${a.id}')">Merge…</button></div>`).join("")}
    </div>`).join("")
    : '<p class="muted">None found — every article looks distinct.</p>'}`);
}

function pickArticleImage(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (f.size > 12 * 1024 * 1024) return toast("Photo too large");
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      arImg = { mode: "new", thumb: imgResize(im, 72, 0.6), full: imgResize(im, 700, 0.75) };
      renderArImg();
    };
    im.onerror = () => toast("Could not read that image");
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}

async function nextOfferNumber() {

    return `${y}-${String(last + 1).padStart(3, "0")}`;
  } catch {
    const nums = state.offers.map((o) => o.number || "").filter((n) => n.startsWith(y + "-")).map((n) => parseInt(n.split("-")[1]) || 0);
    return `${y}-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0")}`;
  }
}

// Cost is snapshotted on the item when it is added, so changing a supplier
// price later never rewrites the profit on offers already made.
function itemCost(it) {
  if (it.free) return 0;
  if (it.cost !== undefined && it.cost !== null) return parseFloat(it.cost) || 0;
  const a = state.stock.find((x) => x.id === it.article_id);
  return a ? (parseFloat(a.purchase_price) || 0) : 0;
}
// The rate is snapshotted with the item; labour and manual rows are standard 18%.
function itemVat(it) {
  if (it.vat !== undefined && it.vat !== null) return parseFloat(it.vat) || 0;
  const a = state.stock.find((x) => x.id === it.article_id);
  return a && a.vat_rate !== undefined && a.vat_rate !== null ? (parseFloat(a.vat_rate) || 0) : 18;
}
// ДДВ is collected for the state, never income — so profit works on net figures.
function itemProfit(it) {
  const t = itemTotal(it);
  if (t === null) return null;                       // meters not measured yet
  const r = itemVat(it);
  const q = it.free ? 0 : (it.unit === "m" ? (it.consumed || 0) : (it.qty || 0));
  return netOf(t, r) - netOf(itemCost(it) * q, r);
}
// { gross, net, vat, byRate: { 18: amount, 5: amount } } — per-meter rows are skipped
function vatBreakdown(items) {
  const byRate = {}; let gross = 0, net = 0;
  for (const it of items || []) {
    const t = itemTotal(it);
    if (t === null) continue;
    const r = itemVat(it);
    const n = netOf(t, r);
    gross += t; net += n;
    byRate[r] = (byRate[r] || 0) + (t - n);
  }
  return { gross, net, vat: gross - net, byRate };
}
function profitOf(items) {
  let value = 0, pending = false;
  for (const it of items || []) {
    const p = itemProfit(it);
    if (p === null) pending = true; else value += p;
  }
  return { value, pending };
}
function itemTotal(it) {
  if (it.unit === "m") return it.consumed ? it.consumed * (it.price || 0) : null; // measured after install
  if (it.free) return it.price || 0;
  return (it.qty || 0) * (it.price || 0);
}

    const tot = itemTotal(it);

function updateTotal() {
  let sum = 0;
  offerItems.forEach((it, i) => {
    const t = itemTotal(it);
    const cell = $("of-it-tot-" + i);
    if (cell) cell.value = t === null ? "???" : fmt(t);

  });
  $("of-total").textContent = fmt(sum) + " ден.";
  const vb = vatBreakdown(offerItems);
  const vEl = $("of-vat");
  if (vEl) vEl.textContent = fmt(vb.net) + " + "
    + VAT_RATES.filter((r) => vb.byRate[r]).map((r) => fmt(vb.byRate[r]) + " (" + r + "%)").join(" + ")
    + " ден.";
  const pr = profitOf(offerItems);
  const pEl = $("of-profit");
  if (pEl) {
    pEl.textContent = fmt(pr.value) + " ден." + (pr.pending ? " + meters" : "");
    pEl.style.color = pr.value < 0 ? "var(--danger)" : "var(--personal)";
  }
  const metersOpen = offerItems.filter((it) => it.unit === "m" && !it.consumed);
  const noteEl = $("of-note");
  if (noteEl && !noteEl.dataset.manual) {
    noteEl.value = metersOpen.length ? "(не се вклучени " + metersOpen.map((m) => m.name.split(" ")[0].toLowerCase()).join(" и ") + ")" : "";
  }
  return sum;
}

// Puts real pictures where the template left «IMG:n» markers.
// Done by hand so the document pipeline owns no third-party image library.
function dataUrlToBytes(dataUrl) {
  const bin = atob(dataUrl.split(",")[1] || "");
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function drawingXml(rid, wPx, hPx, id) {
  const cx = Math.round(wPx * 9525), cy = Math.round(hPx * 9525);   // px -> EMU
  const A = "http://schemas.openxmlformats.org/drawingml/2006/main";
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">` +
    `<wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/>` +
    `<wp:docPr id="${5000 + id}" name="Photo ${id}"/>` +
    `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="${A}" noChangeAspect="1"/></wp:cNvGraphicFramePr>` +
    `<a:graphic xmlns:a="${A}"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:nvPicPr><pic:cNvPr id="${id}" name="Photo ${id}"/><pic:cNvPicPr/></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>` +
    `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
    `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
function insertPictures(zip, photos) {
  let xml = zip.file("word/document.xml").asText();
  if (xml.indexOf("«IMG:") === -1) return;
  const relsPath = "word/_rels/document.xml.rels";
  let rels = zip.file(relsPath).asText();
  let n = 0;
  xml = xml.replace(/<w:r(?:>| [^>]*>)(?:(?!<\/w:r>).)*?«IMG:(\d+)»(?:(?!<\/w:r>).)*?<\/w:r>/g, (run, idxStr) => {
    const p = photos[parseInt(idxStr)];
    if (!p) return "";
    n++;
    const isPng = p.dataUrl.startsWith("data:image/png");
    const name = `photo${n}.${isPng ? "png" : "jpeg"}`;
    const rid = `rIdPhoto${n}`;
    zip.file("word/media/" + name, dataUrlToBytes(p.dataUrl), { binary: true });
    rels = rels.replace("</Relationships>",
      `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${name}"/></Relationships>`);
    return drawingXml(rid, p.w, p.h, n);
  });
  xml = xml.replace(/«IMG:\d+»/g, "");   // safety net
  zip.file("word/document.xml", xml);
  zip.file(relsPath, rels);
}

function imgDims(src) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth || 4, h: im.naturalHeight || 3 });
    im.onerror = () => res({ w: 4, h: 3 });
    im.src = src;
  });
}
async function generateDocx(o) {
  const metersOpen = (o.items || []).map((it, i) => ({ it, n: i + 1 })).filter((x) => x.it.unit === "m" && !x.it.consumed);
  try {
    if (!window.PizZip || !window.docxtemplater) throw new Error("Document libraries did not load — check connection and reload the app");
    const res = await fetch("Ponuda_TEMPLATE.docx", { cache: "no-store" });
    if (!res.ok) throw new Error("Template not found on server (HTTP " + res.status + ")");
    const buf = await res.arrayBuffer();
    const head = new Uint8Array(buf.slice(0, 2));
    if (head[0] !== 0x50 || head[1] !== 0x4B) throw new Error("Template file on server is not a valid .docx");
    // product photos: fetch and measure (inserted into the document after rendering)
    const ids = [...new Set((o.items || []).filter((it) => it.article_id).map((it) => it.article_id))];
    const photo = {};   // article_id -> { dataUrl, w, h }
    if (ids.length) {
      const { data: imgs } = await db.from("article_images").select("article_id, data").in("article_id", ids);
      for (const r of imgs || []) {
        if (!r.data) continue;
        const d = await imgDims(r.data);
        const MAXW = 120, MAXH = 95;
        let w = MAXW, h = Math.round(MAXW * d.h / d.w);
        if (h > MAXH) { h = MAXH; w = Math.round(MAXH * d.w / d.h); }
        photo[r.article_id] = { dataUrl: r.data, w, h };
      }
    }
    const doc = new window.docxtemplater(new PizZip(buf), { linebreaks: true, paragraphLoop: true });
    const client = state.clients.find((c) => c.id === o.client_id);
    doc.render({
      title: o.title, system: o.system || "",
      offer_number: o.number, date: dmy(o.offer_date),
      client: client ? client.name : "", validity: o.validity,
      client_contact: client ? (client.contact || "") : "",
      client_phone: client ? (client.phone || "") : "",
      client_address: client ? (client.address || "") : "",
      client_email: client ? (client.email || "") : "",
      items: o.items.map((it, i) => ({
        num: i + 1, name: it.name, specs: it.specs || "",
        qty: it.unit === "m" ? (it.consumed ? fmt(it.consumed) + " m" : "m") : (it.free ? "" : fmt(it.qty || 0)),
        price: it.free ? "" : fmt(it.price || 0),
        total: itemTotal(it) === null ? "???" : fmt(itemTotal(it) || 0),
        img_mark: photo[it.article_id] ? `«IMG:${i}»` : "",
      })),
      total_note: o.total_note || "", grand_total: fmt(o.grand_total),
      footnote: metersOpen.length
        ? `* Ставките ${metersOpen.map((m) => m.n).join(" и ")} се пресметуваат по потрошена должина по завршување на монтажата.`
        : "",
    });
    insertPictures(doc.getZip(), (o.items || []).map((it) => photo[it.article_id] || null));
    const blob = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Ponuda_${o.number}.docx`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    return true;
  } catch (e) {
    console.error(e);
    const det = (e.properties && e.properties.errors)
      ? e.properties.errors.map((x) => x.properties && x.properties.explanation).filter(Boolean).join("\n")
      : e.message;
    say("Could not generate the offer document:\n\n" + det);
    return false;
  }
}

  const ms = o.items.map((it, i) => ({ it, i })).filter((x) => x.it.unit === "m" && !x.it.consumed);
  openSheet(`
    <h2>Close job — ${o.number}</h2>
    <p class="muted">Enter consumed length per item. The offer total and stock will be updated.</p>
    ${ms.map((x) => `<label>${esc(x.it.name)} (@ ${fmt(x.it.price || 0)} /m)</label>
      <input type="number" inputmode="decimal" min="0" step="any" id="cj-${x.i}">`).join("")}
    <button class="btn" onclick="closeJob('${id}')">Confirm — update offer & stock</button>
  `);
}
async function closeJob(id) {
  const o = state.offers.find((x) => x.id === id);
  const items = JSON.parse(JSON.stringify(o.items));
  const movRows = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.unit === "m" && !it.consumed) {
      const v = parseFloat(($("cj-" + i) || {}).value);
      if (!v || v <= 0) return toast("Enter meters for every item");
      it.consumed = v;
      if (it.article_id) movRows.push({ article_id: it.article_id, type: "out", qty: v, ref: o.number, note: "Offer " + o.number });
    }
  }
  if (!o.stock_deducted) items.forEach((it) => {
    if (it.article_id && it.unit !== "m") movRows.push({ article_id: it.article_id, type: "out", qty: it.qty || 0, ref: o.number, note: "Offer " + o.number });
  });
  const total = items.reduce((s, it) => {
    const t = it.unit === "m" ? it.consumed * (it.price || 0) : (it.free ? (it.price || 0) : (it.qty || 0) * (it.price || 0));
    return s + (t || 0);
  }, 0);
  try {
    if (movRows.length) await dbq(db.from("movements").insert(movRows), "Stock not updated");
    await dbq(db.from("offers").update({ items, grand_total: total, total_note: null, stock_deducted: true }).eq("id", id), "Offer not updated");
  } catch { return; }
  closeSheet(); await refreshAll(["offers", "stock"]); renderOffers();
  const wasPaid = parseFloat(o.paid_amount) || 0;
  if (o.paid_at && Math.abs(total - wasPaid) > 0.005) {   // the invoice moved after it was paid
    setTimeout(() => reconcileSheet(id, wasPaid, total), 260);
    return;
  }
  toast("Job closed — total and stock updated");
}

const POLICY_KINDS = ["Автомобил", "Зелен картон", "Имот", "Патничко", "Живот", "Друго"];

const polPaid = (p) => sumBy(state.polPays.filter((x) => x.policy_id === p.id), (x) => x.amount);
const polBalance = (p) => (parseFloat(p.amount) || 0) - polPaid(p);
const polSettled = (p) => polBalance(p) <= 0.005;
const polDaysLeft = (p) => !p.end_date ? null
  : Math.round((Date.parse(p.end_date + "T12:00") - Date.parse(todayStr() + "T12:00")) / 86400000);

// a green card runs out long before the policy does
const gcSoon = (p) => {
  if (!p.has_green_card || !p.green_card_end) return false;
  const d = Math.round((Date.parse(p.green_card_end + "T12:00") - Date.parse(todayStr() + "T12:00")) / 86400000);
  return d >= 0 && d <= 14;
};
function polStatus(p) {
  const d = polDaysLeft(p);
  if (d !== null && d < 0) return { key: "expired", label: T("expired", "истечена"), colour: "var(--muted)" };
  if (d !== null && d <= 30) return { key: "expiring", label: T("ends in", "истекува за") + " " + d + "d", colour: "var(--amber)" };
  return { key: "live", label: T("running", "активна"), colour: "var(--personal)" };
}

async function savePolicy(id) {
  const row = {
    holder_name: $("po-name").value.trim(),
    policy_no: $("po-no").value.trim() || null,
    phone: $("po-phone").value.trim() || null,
    kind: ($("po-kind").querySelector(".chip.on") || {}).dataset?.k || null,
    insurer: $("po-insurer").value.trim() || null,
    start_date: $("po-start").value || todayStr(),
    end_date: $("po-end").value || null,
    amount: parseFloat($("po-amount").value) || 0,
    commission: parseFloat($("po-comm").value) || 0,
    has_green_card: $("po-gc").classList.contains("on"),
    green_card_no: $("po-gcno").value.trim() || null,
    green_card_end: $("po-gcend").value || null,
    note: $("po-note").value.trim() || null,
  };
  if (!row.holder_name) return toast(T("Whose policy is it?", "Чија е полисата?"));
  if (polImg.mode === "new") row.photo_thumb = polImg.thumb;
  if (polImg.mode === "remove") row.photo_thumb = null;
  if (row.end_date && row.end_date < row.start_date) return toast(T("It cannot end before it starts", "Не може да заврши пред да почне"));
  let saved;
  try {
    saved = await dbq(id ? db.from("policies").update(row).eq("id", id).select().single()
                         : db.from("policies").insert(row).select().single(), T("Not saved", "Не е зачувано"));
    if (polImg.mode === "new") {
      await dbq(db.from("policy_photos").upsert({ policy_id: saved.id, data: polImg.full }, { onConflict: "policy_id" }),
        T("Photo not saved", "Сликата не е зачувана"));
    }
    if (polImg.mode === "remove") await db.from("policy_photos").delete().eq("policy_id", saved.id);
  } catch { return; }
  closeSheet(); await refreshAll(["policies"]); render(); toast(T("Saved", "Зачувано"));
  if (!id) setTimeout(() => openPolicySheet(saved.id), 240);
}

  if (!r || !await ask(T("Remove this instalment of " + fmt(r.amount) + " ден.?", "Отстрани ја оваа рата од " + fmt(r.amount) + " ден.?"))) return;

// A policy ending is next month's sale, not a dead record. Renewing copies
// everything forward for the same length of time and keeps the two linked.
async function renewPolicy(id) {
  const p = state.policies.find((x) => x.id === id);
  if (!p) return;
  const start = p.end_date && p.end_date > todayStr() ? p.end_date : todayStr();
  const lenDays = p.end_date && p.start_date
    ? Math.round((Date.parse(p.end_date) - Date.parse(p.start_date)) / 86400000)
    : 365;
  const endD = new Date(start + "T12:00");
  endD.setDate(endD.getDate() + Math.max(1, lenDays));
  const end = endD.toLocaleDateString("sv-SE");

  if (!await ask(T(
    `Renew ${p.holder_name}?\n\nNew term ${dmy(start)} → ${dmy(end)}, same price and commission. Nothing is paid on it yet.`,
    `Обнови за ${p.holder_name}?\n\nНов период ${dmy(start)} → ${dmy(end)}, иста цена и провизија. Сè уште нема уплати.`),
    T("Renew", "Обнови"))) return;

  const row = {
    holder_name: p.holder_name, policy_no: null, phone: p.phone, kind: p.kind,
    insurer: p.insurer, client_id: p.client_id, start_date: start, end_date: end,
    amount: p.amount, commission: p.commission, note: p.note,
    has_green_card: p.has_green_card, green_card_no: null,
    green_card_end: p.has_green_card ? (() => {
      const g = new Date(start + "T12:00"); g.setMonth(g.getMonth() + 1);
      return g.toLocaleDateString("sv-SE");
    })() : null,
    renewed_from: p.id,
  };
  let made;
  try { made = await dbq(db.from("policies").insert(row).select().single(), T("Not renewed", "Не е обновено")); }
  catch { return; }
  closeSheet(); await refreshAll(["policies"]); render();
  setTimeout(() => openPolicySheet(made.id), 240);
  toast(T("Renewed — check the number and price", "Обновено — провери број и цена"));
}

async function delPolicy(id) {
  const p = state.policies.find((x) => x.id === id);
  const pays = state.polPays.filter((x) => x.policy_id === id).length;
  if (!await ask(T(`Remove this policy?${pays ? `\n\nIts ${pays} recorded payment(s) go too.` : ""}`,
    `Отстрани ја полисата?${pays ? `\n\nЌе се избришат и ${pays} уплати.` : ""}`))) return;
  await deleteUndoable("policies", p, T("Policy removed", "Полисата е отстранета"), ["policies", "polPays"]);
}

/* ---------- suppliers ---------- */
// A chosen name rather than a typed one — typing is how "Wizard Systems" and
// "wizard sistemi" became two suppliers in the first place.
// A scanned note can name a supplier that is not on the list yet: match it to
// one we have whatever the spelling, and otherwise keep it rather than lose it.
function setSupplierValue(id, value) {
  const sel = $(id);
  const v = String(value || "").trim();
  if (!sel || !v) return;
  const hit = [...sel.options].find((o) => o.value.toLowerCase() === v.toLowerCase());
  if (hit) { sel.value = hit.value; return; }
  const opt = document.createElement("option");
  opt.value = v;
  opt.textContent = v + " · " + T("new", "нов");
  sel.appendChild(opt);
  sel.value = v;
}
// Any name that ends up saved joins the list, so it can be picked next time.
async function ensureSupplier(name) {
  const v = String(name || "").trim();
  if (!v) return;
  if (state.suppliers.some((s) => s.name.toLowerCase() === v.toLowerCase())) return;
  try { await db.from("suppliers").insert({ name: v }); await refreshAll(["suppliers"]); }
  catch (e) { console.warn("supplier", e); }
}
function supplierSelect(id, current) {
  const names = state.suppliers.map((s) => s.name);
  const stray = current && !names.some((n) => n.toLowerCase() === String(current).toLowerCase()) ? [current] : [];
  return `<select id="${id}">
    <option value="">${T("No supplier", "Без добавувач")}</option>
    ${stray.concat(names).map((n) => `<option value="${esc(n)}" ${n === current ? "selected" : ""}>${esc(n)}${
      stray.includes(n) ? " · " + T("not in the list", "не е во листата") : ""}</option>`).join("")}
  </select>`;
}
const supplierStats = (name) => ({
  articles: state.stock.filter((a) => a.supplier === name).length,
  purchases: state.purchases.filter((p) => p.supplier === name).length,
  spent: sumBy(state.purchases.filter((p) => p.supplier === name), (p) => p.total),
  owed: sumBy(state.purchases.filter((p) => p.supplier === name && purchaseBalance(p) > 0.005), purchaseBalance),
});

async function saveSupplier(id) {
  const name = $("sp-name").value.trim();
  if (!name) return toast(T("A supplier needs a name", "Добавувачот треба име"));
  const row = { phone: $("sp-phone").value.trim() || null, email: $("sp-email").value.trim() || null,
                address: $("sp-addr").value.trim() || null, note: $("sp-note").value.trim() || null };
  try {
    if (id) {
      const old = state.suppliers.find((x) => x.id === id);
      if (old && old.name !== name) await dbq(db.rpc("rename_supplier", { p_id: id, p_name: name }), T("Not renamed", "Не е преименувано"));
      await dbq(db.from("suppliers").update(row).eq("id", id), T("Not saved", "Не е зачувано"));
    } else {
      await dbq(db.from("suppliers").insert({ name, ...row }), T("Not saved", "Не е зачувано"));
    }
  } catch { return; }
  closeSheet(); await refreshAll(["suppliers", "stock", "purchases"]); renderElaks(); toast(T("Saved", "Зачувано"));
}

async function delSupplier(id) {
  const s = state.suppliers.find((x) => x.id === id);
  const st = supplierStats(s.name);
  if (st.articles || st.purchases) {
    return say(T(s.name + " is used by " + st.articles + " article(s) and " + st.purchases + " purchase(s).\n\nMerge it into another supplier instead of removing it.",
      s.name + " се користи кај " + st.articles + " артикл(и) и " + st.purchases + " набавка(и).\n\nСпој го со друг добавувач наместо да го отстраниш."));
  }
  if (!await ask(T("Remove this supplier?", "Отстрани го овој добавувач?"))) return;
  try { await dbq(db.from("suppliers").delete().eq("id", id), T("Not removed", "Не е отстрането")); } catch { return; }
  closeSheet(); await refreshAll(["suppliers"]); renderElaks();
}

// Scanned invoices spell names differently — "Wizard Systems" and "WIZARD

function openSupMerge(fromId) {
  const a = state.suppliers.find((x) => x.id === fromId);
  openSheet(`

async function doSupMerge(fromId, toId) {
  const a = state.suppliers.find((x) => x.id === fromId), b = state.suppliers.find((x) => x.id === toId);
  if (!await ask(T('Merge "' + a.name + '" into "' + b.name + '"?', 'Спој „' + a.name + '" во „' + b.name + '"?'))) return;
  let moved = "0";
  try { moved = await dbq(db.rpc("merge_suppliers", { p_from: fromId, p_to: toId }), T("Not merged", "Не е споено")); } catch { return; }
  closeSheet(); await refreshAll(["suppliers", "stock", "purchases"]); renderElaks();
  toast(T("Merged · " + moved + " record(s) moved", "Споено · " + moved + " записи преместени"));
}

// hidden clients keep their history but drop out of lists and new offers
const activeClients = () => state.clients.filter((c) => c.active !== false);
// You rarely remember the company name — often it is the phone, the contact
// person or the street. Match against all of it.
const SEARCH_FROM = 7;      // below this a search box is clutter, not help
function matchesQuery(row, q) {
  if (!q) return true;
  return ["name", "contact", "phone", "email", "address", "note"]
    .some((k) => String(row[k] || "").toLowerCase().includes(q));
}
function searchBox(id, count) {
  const el = $(id);
  if (!el) return "";
  el.style.display = count >= SEARCH_FROM ? "" : "none";
  if (count < SEARCH_FROM) el.value = "";
  return (el.value || "").trim().toLowerCase();
}

function renderClients() {
  const hidden = state.clients.filter((c) => c.active === false);
  const pool = state.showHiddenClients ? state.clients : activeClients();
  const q = searchBox("cli-search", pool.length);
  const list = pool.filter((c) => matchesQuery(c, q));
  $("cli-list").innerHTML = (list.map((c) => `
    <div class="card row" role="button" tabindex="0" onclick="openClientSheet('${c.id}')"
         style="${c.active === false ? "opacity:.55" : ""}">
      <div style="flex:1"><b>${esc(c.name)}</b>${c.active === false ? ` <span class="muted">· ${T("hidden", "скриен")}</span>` : ""}
        <div class="muted">${esc(c.contact || "")}</div></div>
    </div>`).join("") || `<p class="muted">${q
      ? `${T("Nothing matches", "Ништо не одговара")} “${esc(q)}”`
      : T("No clients.", "Нема клиенти.")}</p>`)
    + (hidden.length ? `<button class="btn sm ghost" style="margin-top:10px"
        onclick="state.showHiddenClients=!state.showHiddenClients;renderClients()">
        ${state.showHiddenClients ? T("Hide the hidden", "Скриј ги скриените") : `${T("Show hidden", "Прикажи скриени")} (${hidden.length})`}</button>` : "");
}

    <span class="muted">${t.due_date ? dmy(t.due_date) : ""} ›</span></div>`).join("");

// A client with history is hidden rather than deleted — deleting would take
// their offers with it, and those are the record of work you actually did.
async function unhideClient(id) {
  try { await dbq(db.from("clients").update({ active: true }).eq("id", id), T("Not saved", "Не е зачувано")); } catch { return; }
  closeSheet(); await refreshAll(["clients"]); renderElaks(); toast(T("Back in the list", "Вратен во листата"));
}
async function delClient(id) {
  const c = state.clients.find((x) => x.id === id);
  if (!c) return;
  const offers = state.offers.filter((o) => o.client_id === id).length;
  const kit = state.installs.filter((i) => i.client_id === id).length;
  const tasks = state.tasks.filter((t) => t.client_id === id && !t.done).length;

  if (offers || kit) {
    const msg = T(
      `${c.name} has ${offers} offer(s) and ${kit} piece(s) of installed equipment.\n\nHide the client instead? Their history stays, and they disappear from the list and from new offers.`,
      `${c.name} има ${offers} понуда(и) и ${kit} вградена опрема.\n\nДа го скриеме наместо да го избришеме? Историјата останува, а исчезнува од листата и од новите понуди.`);
    if (!await ask(msg, T("Hide client", "Скриј клиент"))) return;
    try { await dbq(db.from("clients").update({ active: false }).eq("id", id), T("Not saved", "Не е зачувано")); } catch { return; }
    closeSheet(); await refreshAll(["clients"]); renderElaks();
    toastUndo(T("Client hidden", "Клиентот е скриен"), async () => {
      await db.from("clients").update({ active: true }).eq("id", id);
      await refreshAll(["clients"]); renderElaks(); toast(T("Restored", "Вратено"));
    });
    return;
  }

  if (tasks && !await ask(T(`${c.name} has ${tasks} open task(s), which will lose their link.\n\nRemove anyway?`,
    `${c.name} има ${tasks} отворени задачи, кои ќе ја изгубат врската.\n\nСепак да го отстранам?`))) return;
  if (!tasks && !await ask(T("Remove this client?", "Отстрани го овој клиент?"))) return;
  await deleteUndoable("clients", c, T("Client removed", "Клиентот е отстранет"), ["clients"]);
}

async function saveClient(id) {
  const row = { name: $("cl-name").value.trim(), contact: $("cl-contact").value.trim() || null,

  try { await dbq(id ? db.from("clients").update(row).eq("id", id) : db.from("clients").insert(row), "Client not saved"); } catch { return; }
  closeSheet(); await refreshAll(["clients"]); renderClients(); toast("Saved");
}

function permSummary(r) {
  if (r.role === "owner") return "Owner · everything";
  const parts = [];
  if ((r.task_contexts || []).length) parts.push("Tasks: " + r.task_contexts.map((c) => CTX[c]).join(", "));
  if (r.see_elaks) parts.push("Elaks");
  if (r.see_apts) parts.push("Apts");
  if (r.see_insurance) parts.push(T("Insurance", "Осигурување"));
  return parts.join(" · ") || "No access yet";
}
function renderTeam() {
  const el = $("team-list");                  // only exists while the Team sheet is open
  if (!el) return;
  el.innerHTML = state.team.map((r) => `
    <div class="card row" ${r.role === "owner" ? "" : `role="button" tabindex="0" onclick="openPermSheet('${r.user_id}')"`}>
      <div style="flex:1"><b>${esc(r.display_name || "Unnamed")}</b>
        <div class="muted">${permSummary(r)}</div></div>
    </div>`).join("") || '<p class="muted">Only you so far.</p>';
}

}

function urlB64(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function enablePush() {

    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(CONFIG.VAPID_PUBLIC_KEY) });
    await db.from("push_subscriptions").upsert({ endpoint: sub.endpoint, sub: sub.toJSON(), user_id: state.uid }, { onConflict: "endpoint" });
    updatePushState(); toast("Notifications enabled");
  } catch (e) { console.error(e); toast("Error enabling push"); }
}

// The key goes into a table the app can write but never read: there is no
// select policy on it, so only the server (service role) can fetch it.
// Putting a backup back. Order matters: a stay needs its apartment to exist
// first, an offer needs its client, and so on.
const RESTORE_ORDER = ["app_settings", "user_roles", "clients", "apartments", "articles",
  "offers", "purchases", "stays", "bills", "tasks", "task_templates", "task_completions",
  "ical_feeds", "movements", "article_prices", "offer_payments", "elaks_cash"];

function restoreJson(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    let file;
    try { file = JSON.parse(fr.result); } catch { return say("That file is not a Centrala backup."); }
    const data = file.data || file;              // the export nests tables under "data"
    const tables = RESTORE_ORDER.filter((t) => Array.isArray(data[t]) && data[t].length);
    if (!tables.length) return say("Nothing to restore — the file has no records in it.");
    const summary = tables.map((t) => `· ${t.replace(/_/g, " ")}: ${data[t].length}`).join("\n");
    if (!await ask(`Restore this backup?\n\n${summary}\n\nExisting records with the same id are updated; nothing is deleted.`)) return;
    openSheet('<h2>Restoring…</h2><div class="skel"></div><div class="skel"></div>');
    const done = [], failed = [];
    for (const t of tables) {
      try {
        // in batches, so one large table cannot time out the whole restore
        for (let i = 0; i < data[t].length; i += 200) {
          const chunk = data[t].slice(i, i + 200);
          const { error } = await db.from(t).upsert(chunk, { onConflict: t === "app_settings" ? "key" : "id" });
          if (error) throw error;
        }
        done.push(`${t.replace(/_/g, " ")}: ${data[t].length}`);
      } catch (e) {
        console.error("restore", t, e);
        failed.push(`${t.replace(/_/g, " ")} — ${e.message || "failed"}`);
      }
    }
    await refreshAll();
    openSheet(`<h2>Restore finished</h2>
      ${done.length ? '<div class="sec">Put back</div>' + done.map((d) => `<div class="mov"><span>${esc(d)}</span><span class="hok">✓</span></div>`).join("") : ""}
      ${failed.length ? '<div class="sec" style="color:var(--danger)">Could not restore</div>'
        + failed.map((d) => `<div class="mov"><span>${esc(d)}</span></div>`).join("")
        + '<p class="muted" style="font-size:12.5px">Usually a table that no longer has the same columns. The rest went in.</p>' : ""}
      <button class="btn" onclick="closeSheet();render()">Done</button>`);
  };
  fr.readAsText(f);
}

// Pulls the last fortnight from every table that records an author, so you can
// see what your team has been doing without opening each screen.
async function loadActivity() {
  const el = $("act-list");
  if (!el) return;
  const since = backDays(14);
  const q = (t, cols, dateCol) => db.from(t).select(cols).gte(dateCol, since)
    .order(dateCol, { ascending: false }).limit(60);
  const [cash, movs, stays, offers, purch, bills] = await Promise.all([
    q("elaks_cash", "id, amount, note, created_at, created_by", "created_at"),
    q("movements", "id, type, qty, note, article_id, created_at, created_by", "created_at"),
    q("stays", "id, guest_name, check_in, apartment_id, created_at, created_by", "created_at"),
    q("offers", "id, number, title, created_at, created_by", "created_at"),
    q("purchases", "id, supplier, doc_no, total, created_at, created_by", "created_at"),
    q("bills", "id, kind, amount, apartment_id, created_at, created_by", "created_at"),
  ]);
  const artName = (id) => (state.stock.find((a) => a.id === id) || {}).name || "article";
  const aptName = (id) => (state.apartments.find((a) => a.id === id) || {}).name || "apartment";
  const rows = [];
  for (const r of cash.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `${(parseFloat(r.amount) || 0) >= 0 ? "Cash in" : "Cash out"} ${fmt(Math.abs(r.amount))} ден.${r.note ? " · " + r.note : ""}` });
  for (const r of movs.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `${r.type === "in" ? "Stock in" : "Stock out"} ${fmt(Math.abs(r.qty))} · ${artName(r.article_id)}` });
  for (const r of stays.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `Booking · ${r.guest_name} · ${aptName(r.apartment_id)} from ${dmy(r.check_in)}` });
  for (const r of offers.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `Offer ${r.number}${r.title ? " · " + r.title : ""}` });
  for (const r of purch.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `Purchase ${r.supplier}${r.doc_no ? " · " + r.doc_no : ""} · ${fmt(r.total)} ден.` });
  for (const r of bills.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `Bill ${r.kind} · ${aptName(r.apartment_id)} · ${fmt(r.amount)} ден.` });

  rows.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (!rows.length) return (el.innerHTML = '<p class="muted">Nothing recorded in the last two weeks.</p>');

  let day = null, html = "";
  for (const r of rows.slice(0, 120)) {
    const d = String(r.at).slice(0, 10);
    if (d !== day) { html += `<div class="sec">${dmy(d)}</div>`; day = d; }
    const who = (!r.by || r.by === state.uid) ? "you" : (personName(r.by) || "someone");
    html += `<div class="mov"><span>${esc(r.what)}</span>
      <span class="muted nw">${esc(who)} · ${String(r.at).slice(11, 16)}</span></div>`;
  }
  el.innerHTML = html + '<p class="muted" style="font-size:12.5px">Entries made before this was switched on show no name.</p>';
}

async function backupJson() {
  toast("Preparing backup…");
  // photos are deliberately excluded: they are large, and a backup that fails
  // when you need it is worse than one that leaves images behind
  const tables = ["tasks", "task_completions", "task_templates", "articles", "article_prices",
                  "movements", "clients", "offers", "offer_payments", "purchases",
                  "apartments", "stays", "bills", "ical_feeds", "elaks_cash",
                  "user_roles", "app_settings"];
  const out = { app: "Centrala", version: 1, exported_at: new Date().toISOString(), data: {} };
  const missed = [];
  for (const t of tables) {
    try {
      const { data, error } = await db.from(t).select("*");
      if (error) { missed.push(t); continue; }
      out.data[t] = data || [];
    } catch { missed.push(t); }
  }
  const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "centrala-backup-" + todayStr() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast(missed.length ? "Backup saved (skipped: " + missed.join(", ") + ")" : "Backup downloaded");
}

async function saveAccount(id) {
  const a = state.accounts.find((x) => x.id === id);
  const shown = accountBalances()[id] || 0;
  const fromMovements = shown - (parseFloat(a.opening_balance) || 0);
  const real = parseFloat($("ac-real").value);
  const row = { payout_delay_days: Math.max(0, parseInt($("ac-delay").value) || 0) };
  if (Number.isFinite(real)) row.opening_balance = Math.round((real - fromMovements) * 100) / 100;
  try { await dbq(db.from("accounts").update(row).eq("id", id), "Not saved"); } catch { return; }
  closeSheet(); await refreshAll(["accounts"]); render(); toast(T("Saved", "Зачувано"));
}

function accountMap() {
  const raw = setting("account_by_source", "");
  if (!raw) return {};
  try { return typeof raw === "object" ? raw : JSON.parse(raw); } catch { return {}; }
}
const accountName = (id) => (state.accounts.find((a) => a.id === id) || {}).name || "";
function accountFor(row) {
  if (row.account_id) return row.account_id;
  const bySource = accountMap()[row.source || "Direct"];
  if (bySource) return bySource;
  const cash = state.accounts.find((a) => /cash|кеш/i.test(a.name));
  return cash ? cash.id : null;
}
// What is in each account: money already received, less what has been paid out.
// Airbnb pays out the day after arrival, so an account can hold money later
// than the guest turns up. Delay is per account, 0 for cash in the hand.
function moneyArrived(s, acct) {
  const delay = parseInt((acct || {}).payout_delay_days) || 0;
  if (!delay) return stayStarted(s);
  const ci = dOnly(s.check_in);
  if (!ci) return false;
  const d = new Date(ci + "T12:00");
  d.setDate(d.getDate() + delay);
  return d.toLocaleDateString("sv-SE") <= todayStr();
}
function accountBalances() {
  const bal = {};
  for (const a of state.accounts) bal[a.id] = parseFloat(a.opening_balance) || 0;
  for (const s of state.stays) {
    const id = accountFor(s);
    const acct = state.accounts.find((a) => a.id === id);
    if (!moneyArrived(s, acct)) continue;
    if (id) bal[id] = (bal[id] || 0) + (parseFloat(s.amount) || 0);
  }
  for (const b of state.bills) {
    const id = accountFor(b);
    if (id) bal[id] = (bal[id] || 0) - (parseFloat(b.amount) || 0);
  }
  // apartment starting amounts are cash on hand
  const cash = state.accounts.find((a) => /cash|кеш/i.test(a.name));
  if (cash) bal[cash.id] = (bal[cash.id] || 0) + sumBy(state.apartments, (a) => a.opening_balance);
  return bal;
}

function renderStays() {
  if (!state.apartments.length) { $("apt-body").innerHTML = '<div class="empty">Add an apartment first (Apartments tab above).</div>'; return; }
  const t = todayStr();
  // A guest is "currently staying" until the end of their check-out day —
  // one pass, so a booking can only ever land in a single section.
  const cur = [], up = [], past = [];
  for (const s of state.stays.filter(inAptFilter)) {
    const ci = dOnly(s.check_in), co = dOnly(s.check_out);
    if (!ci || !co) { up.push(s); continue; }
    if (ci > t) up.push(s);
    else if (stayEnded(s)) past.push(s);
    else cur.push(s);
  }
  cur.sort((a, b) => dOnly(a.check_out).localeCompare(dOnly(b.check_out)));
  up.sort((a, b) => dOnly(a.check_in).localeCompare(dOnly(b.check_in)));
  past.sort((a, b) => dOnly(b.check_out).localeCompare(dOnly(a.check_out)));

  // The only way one guest can show twice is two records for the same booking —
  // typically one typed by hand and the same one synced in from a platform.
  const dupes = [];
  const live = state.stays.filter((s) => dOnly(s.check_out) >= t && inAptFilter(s));
  for (let i = 0; i < live.length; i++) {
    for (let j = i + 1; j < live.length; j++) {
      const a = live[i], b = live[j];
      if (a.apartment_id !== b.apartment_id) continue;
      if (dOnly(a.check_in) < dOnly(b.check_out) && dOnly(b.check_in) < dOnly(a.check_out)) dupes.push([a, b]);
    }
  }

  let html = "";
  if (dupes.length) html += `<div class="card" style="border-color:var(--danger)">
    <b style="color:var(--danger)">${dupes.length} overlapping booking(s)</b>
    <div class="muted">Two records cover the same nights in one apartment — open each and delete the one you don't want.</div>
    ${dupes.slice(0, 5).map(([a, b]) => `<div class="mov">
      <span class="tapp" role="button" tabindex="0" onclick="openStaySheet('${a.id}')">${esc(a.guest_name)} ${dm(a.check_in)}→${dm(a.check_out)}${a.external_uid ? " · synced" : " · typed"} ›</span>
      <span class="tapp" role="button" tabindex="0" onclick="openStaySheet('${b.id}')">${esc(b.guest_name)} ${dm(b.check_in)}→${dm(b.check_out)}${b.external_uid ? " · synced" : " · typed"} ›</span>
    </div>`).join("")}
  </div>`;
  if (cur.length) html += '<div class="sec">Currently staying</div>' + cur.map((s) => stayRow(s)).join("");
  if (up.length) html += '<div class="sec">Upcoming</div>' + up.map((s) => stayRow(s)).join("");
  html += '<div class="sec">Past</div>' + (past.slice(0, 30).map((s) => stayRow(s)).join("") || '<p class="muted">No past stays.</p>');
  $("apt-body").innerHTML = html || (state.loading ? SKEL(3) : '<div class="empty">No guests yet.<br>Add with +</div>');
}

    const d = new Date(stay.check_in + "T12:00");
    d.setDate(d.getDate() - 1);
    const dayBefore = d.toLocaleDateString("sv-SE");
    const due = dayBefore < todayStr() ? todayStr() : dayBefore;
    const nights = nightsBetween(stay.check_in, stay.check_out);
    const row = {
      title: `Check-in: ${stay.guest_name}${apt ? " · " + apt.name : ""}`,
      context: "apts", due_date: due, due_time: time, remind: true,
      notes: `Arrives ${stay.check_in} · leaves ${stay.check_out} · ${nights} night(s)`
        + (stay.source && stay.source !== "Direct" ? " · " + stay.source : ""),
      stay_id: stay.id,
    };
    if (existing && due > todayStr()) { row.done = false; row.reminded_on = null; }
    // supabase reports errors in the result rather than throwing, so check it
    const res = existing
      ? await db.from("tasks").update(row).eq("id", existing.id)
      : await db.from("tasks").insert(row);
    if (res.error) { console.error("stay task", res.error); return { ok: false, msg: res.error.message }; }
    return { ok: true, on: due };
  } catch (e) {
    console.error("stay task", e);
    return { ok: false, msg: e && e.message ? e.message : "unknown error" };
  }
}
async function saveStay(id) {
  const row = {
    apartment_id: $("st-apt").value, guest_name: $("st-guest").value.trim(),
    check_in: $("st-in").value, check_out: $("st-out").value,
    amount: parseFloat($("st-amt").value) || 0, source: $("st-src").value,
    notes: $("st-notes").value.trim() || null,
  };
  if (!row.apartment_id) return toast("Add an apartment first");
  if (!row.guest_name) return toast("Enter guest name");
  if (!row.check_in || !row.check_out || row.check_out <= row.check_in) return toast("Check-out must be after check-in");
  const clash = state.stays.find((x) => x.id !== id && x.apartment_id === row.apartment_id
    && x.check_in < row.check_out && row.check_in < x.check_out);
  if (clash) return say(`Those dates overlap an existing booking:\n\n${clash.guest_name} · ${clash.check_in} → ${clash.check_out}`);
  const wantTask = $("st-task").classList.contains("on");
  let saved;
  try {
    saved = await dbq(id
      ? db.from("stays").update(row).eq("id", id).select().single()
      : db.from("stays").insert(row).select().single(), "Stay not saved");
  } catch (e) {
    if (e && (e.code === "23P01" || String(e.message || "").includes("stays_no_overlap"))) say("Those dates are already booked for this apartment.");
    return;
  }
  const res = await syncStayTask(saved, wantTask);
  closeSheet(); await refreshAll(["stays", "tasks", "aptCash"]); renderApt();
  if (res && res.ok) toast("Saved · reminder on " + dmy(res.on));
  else if (res && res.msg) say("The stay was saved, but its reminder task could not be created:\n\n" + res.msg
    + "\n\nIf this mentions a missing column, the tasks migration has not been run yet.");
  else toast("Saved");
}
