/* ---------- swipe and hold ----------
   Swipe a task right to finish it. Swipe it left for later: a one-off moves
   a day on — to tomorrow from today or earlier — and a repeating one skips
   that day. Hold it for the rest: when, edit, delete. Only a clear sideways
   move counts as a swipe, so scrolling the list is untouched. */
const SW_GO = 90;                         // how far before letting go acts
let sw = null, heldAt = 0;
// what a left swipe will do to this task on this day
function laterOf(t, day) {
  if (t.recurrence) return { label: T("Skip", "Прескокни"), skip: true };
  const base = t.due_date && t.due_date > todayStr() ? t.due_date : todayStr();
  const d = new Date(base + "T12:00"); d.setDate(d.getDate() + 1);
  const to = d.toLocaleDateString("sv-SE");
  return { label: base === todayStr() ? T("Tomorrow", "Утре") : "+1 " + T("day", "ден"), to };
}
function swStart(e) {
  const row = e.target.closest(".task[data-id]");
  if (!row || e.touches.length !== 1) return;
  const p = e.touches[0];
  sw = { row, x: p.clientX, y: p.clientY, dx: 0, on: false };
  // held still for half a second: the menu
  sw.hold = setTimeout(() => {
    if (!sw || sw.on) return;
    if (Date.now() - heldAt < 800) { sw = null; return; }    // the phone's own hold got there first
    heldAt = Date.now();
    try { navigator.vibrate && navigator.vibrate(12); } catch {}
    openTaskMenu(row.dataset.id, row.dataset.day);
    sw = null;
  }, 500);
}
function swMove(e) {
  if (!sw) return;
  const p = e.touches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    clearTimeout(sw.hold);
    if (Math.abs(dy) >= Math.abs(dx)) { sw = null; return; }       // scrolling
    sw.on = true;
    const t = state.tasks.find((x) => x.id === sw.row.dataset.id);
    sw.t = t;
    sw.later = t ? laterOf(t, sw.row.dataset.day) : null;
  }
  // a finished row has nothing to finish
  const done = sw.row.classList.contains("done");
  sw.dx = dx > 0 && done ? 0 : dx;
  sw.row.style.transform = `translateX(${sw.dx}px)`;
  sw.row.classList.toggle("sw-r", sw.dx > 0);
  sw.row.classList.toggle("sw-l", sw.dx < 0);
  sw.row.classList.toggle("sw-go", Math.abs(sw.dx) >= SW_GO);
  sw.row.dataset.sw = sw.dx > 0 ? "\u2713 " + T("Done", "Готово") : sw.later ? sw.later.label + " \u2192" : "";
}
async function swEnd() {
  if (!sw) return;
  const s0 = sw; sw = null;
  clearTimeout(s0.hold);
  if (!s0.on) return;
  const { row, dx, t } = s0;
  const go = Math.abs(dx) >= SW_GO && t;
  row.classList.add("sw-back");
  row.style.transform = go ? `translateX(${dx > 0 ? 110 : -110}%)` : "";
  setTimeout(() => { row.classList.remove("sw-back", "sw-r", "sw-l", "sw-go"); if (!go) row.style.transform = ""; }, 220);
  if (!go) return;
  const day = row.dataset.day;
  if (dx > 0) return toggleTask(t.id, day);
  if (s0.later.skip) return skipOccurrence(t.id, day);
  return moveTaskQuiet(t.id, s0.later.to);
}
// moved by a swipe or from the menu: no sheet to close, and a way back
function moveTaskQuiet(id, date) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  const was = t.due_date || null;
  taskSave([{ t: "tasks", do: "update", id, set: { due_date: date || null, reminded_on: null } }]);
  render();
  toastUndo(T("Moved to ", "Поместено на ") + wd(date) + " " + dm(date), () => {
    taskSave([{ t: "tasks", do: "update", id, set: { due_date: was } }]);
    render();
  });
}
// everything you can do to a task without opening it
function openTaskMenu(id, day) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  day = day || todayStr();
  const done = isDoneOn(t, day);
  const b = (label, call, cls = "ghost") => `<button class="btn ${cls}" onclick="closeSheet();setTimeout(()=>{${call}},240)">${label}</button>`;
  const plus = (n) => { const d = new Date(todayStr() + "T12:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); };
  openSheet(`<h2>${esc(t.title)}</h2>
    <p class="muted">${t.recurrence ? repeatLabel(t) + " · " + wd(day) + " " + dm(day)
      : t.due_date ? T("Due", "Рок") + " " + wd(t.due_date) + " " + dmy(t.due_date) : T("No date", "Без датум")}</p>
    ${b(done ? T("Not done after all", "Сепак не е завршено") : "\u2713 " + T("Done", "Готово"), `toggleTask('${id}','${day}')`, done ? "ghost" : "")}
    ${t.recurrence
      ? (!done ? b(T("Skip this day — it is not happening", "Прескокни го денов — нема да се случи"), `skipOccurrence('${id}','${day}')`) : "")
      : !done ? `<div class="grid2">
          ${b(T("Tomorrow", "Утре"), `moveTaskQuiet('${id}','${plus(1)}')`)}
          ${b(T("Next week", "Следна недела"), `moveTaskQuiet('${id}','${plus(7)}')`)}
        </div>
        ${b(T("Pick a date…", "Избери датум…"), `moveTaskSheet('${id}')`)}` : ""}
    ${b(T("Edit", "Уреди"), `openTaskSheet('${id}')`)}
    <button class="btn danger" onclick="delTask('${id}')">${T("Delete", "Избриши")}</button>`);
}
// a hold must not also open the task once the finger lifts
document.addEventListener("click", (e) => {
  if (Date.now() - heldAt < 700 && e.target.closest(".task[data-id]")) { e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener("touchstart", swStart, { passive: true });
document.addEventListener("touchmove", swMove, { passive: true });
document.addEventListener("touchend", swEnd);
document.addEventListener("touchcancel", swEnd);
// right-click on a computer, or a hold where the phone reports it this way
document.addEventListener("contextmenu", (e) => {

  if (!row) return;

// the morning triage: everything that slipped, brought forward at once
async function moveAllOverdue() {
  const B = taskBuckets(todayStr(), state.ctxFilter);

  if (!ids.length) return;

// a recurring day that simply did not happen — settled, but not done
function skipOccurrence(id, day) {

  render();

// Which choice of the Repeat list a task is: weekdays, the last day and
// yearly are kept as weekly, monthly on the 31st and every twelve months.
function recKind(t) {
  if (!t || !t.recurrence) return "";
  const n = Math.max(1, parseInt(t.recur_every) || 1);
  if (t.recurrence === "weekly" && n === 1 && recurDays(t).slice().sort().join() === "1,2,3,4,5") return "weekdays";
  if (t.recurrence === "monthly" && n % 12 === 0) return "yearly";
  if (t.recurrence === "monthly" && (t.recur_dom || 0) >= 31) return "monthly-last";
  return t.recurrence;
}
// How a task repeats, said the way you would say it.
const ordEn = (n) => n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : (["th", "st", "nd", "rd"][n % 10] || "th"));
const ordMk = (n) => n + "-" + ([11, 12, 17, 18].includes(n % 100) ? "ти" : ({ 1: "ви", 2: "ри", 7: "ми", 8: "ми" }[n % 10] || "ти"));
function repeatLabel(t) {
  const n = Math.max(1, parseInt(t.recur_every) || 1);
  if (t.recurrence === "daily") return n === 1 ? T("Every day", "Секој ден") : T(`Every ${n} days`, `Секои ${n} дена`);
  if (t.recurrence === "weekly") {
    const ds = recurDays(t).slice().sort((a, b) => (a + 6) % 7 - (b + 6) % 7);     // Monday first
    const days = ds.length === 7 ? T("every day", "секој ден")
      : ds.join() === "1,2,3,4,5" ? T("weekdays", "работни денови")
      : ds.map((i) => wd(new Date(2026, 0, 4 + i))).join(", ");                    // 4 Jan 2026 was a Sunday
    return n === 1 ? days.charAt(0).toUpperCase() + days.slice(1) : T(`Every ${n} weeks`, `Секои ${n} недели`) + " · " + days;
  }
  if (t.recurrence === "monthly") {
    const dom = t.recur_dom || parseInt(String(t.recur_from || t.due_date || "").slice(8, 10)) || 1;
    if (n % 12 === 0) {
      const from = String(t.recur_from || t.due_date || todayStr()).slice(0, 7), y = n / 12;
      const when = langMk() ? `${dom} ${MONTHS_MK[Number(from.slice(5, 7)) - 1].toLowerCase()}`
        : `${dom} ${monthIn("en", from).slice(0, 3)}`;
      return y === 1 ? T(`Every year on ${when}`, `Секоја година на ${when}`)
        : T(`Every ${y} years on ${when}`, `Секои ${y} години на ${when}`);
    }
    if (dom >= 31) return n === 1 ? T("Monthly on the last day", "Месечно, последниот ден")
      : T(`Every ${n} months on the last day`, `Секои ${n} месеци, последниот ден`);
    return n === 1 ? T(`Monthly on the ${ordEn(dom)}`, `Месечно на ${ordMk(dom)}`)
      : T(`Every ${n} months on the ${ordEn(dom)}`, `Секои ${n} месеци на ${ordMk(dom)}`);
  }
  return "";
}
const remindLabel = (m) => !m ? T("at the time", "во тоа време")
  : m < 60 ? `${m} ${T("min before", "мин. порано")}`
  : `${m / 60} ${m === 60 ? T("hour before", "час порано") : T("hours before", "часа порано")}`;

// What a row says under its title: how it repeats, how far its checklist has
// got, who or what it is about, when it will remind you and how its notes
// begin — all of which used to wait behind a tap. Under a day in Upcoming the
// rhythm goes unsaid: the days themselves show it.
function taskMeta(t, rhythm = true) {
  const bits = [];
  const add = (html, cls) => bits.push(`<span${cls ? ` class="${cls}"` : ""}>${html}</span>`);
  if (t.recurrence && rhythm) {
    const run = isHabit(t) ? habitStreak(t) : 0;
    if (run >= 2) add(ICON.flame + run, "streak");          // a run worth keeping
    add(ICON.repeat + esc(repeatLabel(t)));
  }
  const cl = t.checklist || [];
  const ticked = cl.filter((x) => x.done).length;
  if (cl.length) add(ICON.list + ticked + "/" + cl.length, ticked === cl.length ? "full" : "");
  const client = t.client_id && state.clients.find((c) => c.id === t.client_id);
  if (client) add(ICON.client + esc(client.name));
  const apt = t.apartment_id && state.apartments.find((a) => a.id === t.apartment_id);
  if (apt) add(ICON.home + esc(apt.name));
  if (t.remind && t.due_time) add(ICON.bell + (t.remind_before ? remindLabel(t.remind_before) : ""));   // with no time it never fires
  const note = (t.notes || "").trim().split("\n")[0];
  if (note) add(ICON.note + esc(note));
  return bits.length ? `<div class="t-meta">${bits.join("")}</div>` : "";
}
// how late, in a word where a word is shorter
const dueWord = (d) => d === backDays(1) ? T("Yesterday", "Вчера") : dm(d);

// One row for a task, wherever it is listed. `on` is the day the row stands
// for — a later day in Upcoming — so ticking it settles that day and no other.
const taskRow = (today, on) => (t) => {
  const day = on || today;
  const done = isDoneOn(t, day);
  const late = !t.recurrence && !t.done && t.due_date && t.due_date < today;
  const label = late ? dueWord(t.due_date)
    : (!t.recurrence && t.due_date && t.due_date > day) ? `${wd(t.due_date)} ${dm(t.due_date)}`
    : t.due_time ? t.due_time.slice(0, 5) : "";
  // only a one-off has a day of its own to move; a repeating task keeps its rhythm
  const movable = !t.recurrence && !done;
  const side = label
    ? (movable ? `<button class="t-time ${late ? "late" : ""}" onclick="moveTaskSheet('${t.id}')" title="${T("Move", "Помести")}">${label}</button>`
      : `<span class="t-time">${label}</span>`)
    : (movable ? `<button class="t-when" onclick="moveTaskSheet('${t.id}')" aria-label="${
      t.due_date ? T("Move", "Помести") : T("Give it a date", "Стави датум")}">${ICON.calendar}</button>` : "");
  return `<div class="card task ${done ? "done" : ""}" data-id="${t.id}" data-day="${day}">
    <button class="tick" onclick="toggleTask('${t.id}','${day}',this)" aria-label="${T("Done", "Готово")}">${done ? "✓" : ""}</button>
    <span class="led ${t.context}"></span>
    <div class="t-body" role="button" tabindex="0" onclick="openTaskSheet('${t.id}')">
      <div class="t-title">${t.priority ? '<span class="star">★</span> ' : ""}${esc(t.title)}</div>
      ${taskMeta(t, !on)}
    </div>
    ${t.photo_thumb ? `<img class="thumb" style="width:30px;height:30px" src="${t.photo_thumb}" alt="">` : ""}
    ${t.assigned_to && t.assigned_to !== state.uid ? `<span class="who">${initials(personName(t.assigned_to))}</span>` : ""}
    ${side}
  </div>`;
};
// A repeating task that came round and was not ticked. Ticking settles the day
// it was missed; Skip says it did not happen, which settles it too.
const missedRow = ({ t, dates }) => {
  const first = dates[0] === backDays(1) ? T("yesterday", "вчера") : `${wd(dates[0])} ${dm(dates[0])}`;
  const more = dates.length > 1 ? T(` · +${dates.length - 1} more`, ` · уште ${dates.length - 1}`) : "";
  return `<div class="card task" data-id="${t.id}" data-day="${dates[0]}">
    <button class="tick" onclick="toggleTask('${t.id}','${dates[0]}',this)" aria-label="${T("Done", "Готово")}"></button>
    <span class="led ${t.context}"></span>
    <div class="t-body" role="button" tabindex="0" onclick="openTaskSheet('${t.id}')">
      <div class="t-title">${t.priority ? '<span class="star">★</span> ' : ""}${esc(t.title)}</div>
      <div class="t-meta"><span class="late">${ICON.repeat}${T("Missed", "Пропуштено")} ${first}${more}</span></div>

async function toggleTask(id, onDate, btn) {

  // simply done, and done today, whatever day it was listed under — and when
  // it is un-ticked, the day to clear is the one it was done on.
  const day = t.recurrence ? (onDate || todayStr()) : todayStr();
  const was = isDoneOn(t, day);

  if (btn) {
    btn.classList.toggle("on", !was);
    btn.classList.toggle("pop", !was);
    btn.textContent = was ? "" : "✓";
    const row = btn.closest(".task");
    if (row) row.classList.toggle("done", !was);
  }
  const upd = t.recurrence
    ? { last_done: was ? null : day }
    : { done: !was, last_done: !was ? day : null };
  taskSave([{ t: "tasks", do: "update", id, set: upd },
    was ? { t: "task_completions", do: "delete", row: { task_id: id, done_on: clearOn } }
      : { t: "task_completions", do: "upsert", row: { task_id: id, done_on: day, done_by: state.uid } }]);

  const wait = 420 - (Date.now() - tapped);

  if (!was) {
    const name = t.title.length > 30 ? t.title.slice(0, 29) + "…" : t.title;

// A reminder needs a time to count back from; with one, say when it will
// arrive — worked out as the server does, never earlier than midnight.
function tkRemChanged() {
  const hint = $("tk-rem-hint");
  if (!hint) return;
  // a new task given a time is reminded at that time, until a choice is made
  const box = $("tk-before"), given = ($("tk-time") || {}).value;
  if ($("tk-rem-row")) $("tk-rem-row").style.display = given ? "" : "none";
  if (box && box.dataset.fresh && given && tkRemindMins() < 0) {
    box.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x.dataset.b === "0"));
  }
  const lead = tkRemindMins(), time = given;
  if (lead < 0) { hint.textContent = ""; return; }
  if (!time) {
    hint.textContent = T("Give the task a time, otherwise there is nothing to count back from.",
      "Стави време на задачата, инаку нема од што да се брои наназад.");
    return;
  }
  const [h, m] = time.split(":").map(Number);
  const at = Math.max(0, h * 60 + m - lead);
  const hm = p2(Math.floor(at / 60)) + ":" + p2(at % 60);
  hint.textContent = T(`The reminder comes at ${hm}.`, `Потсетникот ќе дојде во ${hm}.`);
}

async function saveTask(id) {
  const d = new Date(($("tk-date").value || todayStr()) + "T12:00");
  // the three newer choices are kept in the columns that were already there:
  // weekdays are weekly on Mon–Fri, the last day is the 31st (which every
  // month rounds down to its own last day), and a year is twelve months
  const kind = $("tk-rec").value || null;
  const rec = kind === "weekdays" ? "weekly" : kind === "monthly-last" || kind === "yearly" ? "monthly" : kind;
  const every = Math.max(1, parseInt(($("tk-int") || {}).value) || 1);
  let days = [];
  if (kind === "weekdays") days = [1, 2, 3, 4, 5];
  else if (rec === "weekly") {
    days = [...$("tk-dow").querySelectorAll(".chip.on")].map((b) => parseInt(b.dataset.d));
    if (!days.length) days = [d.getDay()];
    days.sort((a, b) => a - b);
  }
  const ctx = $("tk-ctx").querySelector(".chip.on").dataset.c;
  const row = {
    title: $("tk-title").value.trim(),
    context: ctx,
    // a personal task is private to one person — mine unless I am keeping
    // someone else's list for them
    owner_uid: ctx === "personal" ? (($("tk-owner") || {}).value || state.uid) : null,
    due_date: $("tk-date").value || null,
    due_time: $("tk-time").value || null,
    recurrence: rec,
    recur_dow: rec === "weekly" ? days[0] : null,
    recur_days: rec === "weekly" ? days : null,
    recur_dom: rec === "monthly" ? (kind === "monthly-last" ? 31 : d.getDate()) : null,
    recur_every: rec ? (kind === "yearly" ? every * 12 : every) : 1,
    recur_from: rec ? ($("tk-date").value || todayStr()) : null,
    recur_until: rec ? (($("tk-until") || {}).value || null) : null,
    // only a repeating task can be a habit, and the field is only sent once it exists
    ...(state.habitCol ? { habit: !!rec && !!($("tk-habit") && $("tk-habit").classList.contains("on")) } : {}),
    priority: $("tk-prio").classList.contains("on"),
    client_id: ($("tk-client") || {}).value || null,
    apartment_id: ($("tk-apt2") || {}).value || null,
    remind: tkRemindMins() >= 0,
    remind_before: Math.max(0, tkRemindMins()),
    assigned_to: $("tk-who").value || null,
    notes: $("tk-notes").value.trim() || null,
    checklist: tkChecklist.filter((it) => it.text.trim()).length ? tkChecklist.filter((it) => it.text.trim()) : null,
  };
  if (!row.title) return toast("Enter a title");
  // the server sends a task's reminder once a day; moved to a new time, it
  // must be free to come again at that time
  const was = id ? state.tasks.find((x) => x.id === id) : null;
  if (was && (was.due_date !== row.due_date || (was.due_time || "").slice(0, 5) !== (row.due_time || "").slice(0, 5)
    || (parseInt(was.remind_before) || 0) !== row.remind_before || !!was.remind !== row.remind)) row.reminded_on = null;
  if (tkImg.mode === "new") row.photo_thumb = tkImg.thumb;
  if (tkImg.mode === "remove") row.photo_thumb = null;
  const tid = id || newId();
  taskSave([id ? { t: "tasks", do: "update", id, set: row } : { t: "tasks", do: "insert", row: { id: tid, ...row } },
    ...(tkImg.mode === "new" ? [{ t: "task_photos", do: "upsert", row: { task_id: tid, data: tkImg.full } }] : []),
    ...(tkImg.mode === "remove" ? [{ t: "task_photos", do: "delete", id: tid }] : [])]);
  closeSheet(); renderToday(); toast(T("Saved", "Зачувано"));
  return true;
}

// Completed lists one-off tasks first: a daily routine's ticks, every day,

let histKind = "one";
function openHistory() {
  openSheet(`<h2>${T("Completed tasks", "Завршени задачи")}</h2>
    <input class="search" id="hist-q" placeholder="${T("Search completed…", "Барај завршени…")}" oninput="renderHistory()">
    <div class="chips" id="hist-kind" style="margin-bottom:4px"></div>
    <div id="hist-list"></div>`);

function renderHistory() {
  const list = $("hist-list");
  if (!list) return;
  const q = (($("hist-q") || {}).value || "").trim().toLowerCase();
  const rows = [];
  for (const t of state.tasks) {
    if (!t.recurrence) { if (t.done) rows.push({ t, on: t.last_done || "" }); continue; }
    for (const c of state.completions) if (c.task_id === t.id && !c.skipped) rows.push({ t, on: c.done_on, rec: true });
  }
  const n = { one: rows.filter((r) => !r.rec).length, rep: rows.filter((r) => r.rec).length };
  n.all = n.one + n.rep;
  $("hist-kind").innerHTML = [["one", T("One-off", "Еднократни")], ["rep", T("Repeating", "Повторливи")], ["all", T("All", "Сите")]]
    .map(([k, l]) => `<button class="chip sm ${histKind === k ? "on" : ""}" onclick="histKind='${k}';renderHistory()">${l} · ${n[k]}</button>`).join("");
  const shown = rows.filter((r) => (histKind === "all" || (histKind === "rep") === !!r.rec)
      && (!q || (r.t.title || "").toLowerCase().includes(q) || (r.t.notes || "").toLowerCase().includes(q)))
    .sort((a, b) => (b.on || "").localeCompare(a.on || ""));
  const fmtD = (d) => !d ? T("Earlier", "Порано")
    : d === todayStr() ? `${T("Today", "Денес")} · ${wd(d)} ${dm(d)}`
    : d === backDays(1) ? `${T("Yesterday", "Вчера")} · ${wd(d)} ${dm(d)}`
    : wd(d) + " " + dmy(d);
  let html = "";
  if (!shown.length) html = `<p class="muted" style="margin-top:12px">${q ? T(`Nothing completed matches "${esc(q)}".`, `Ништо завршено не одговара на "${esc(q)}".`)
    : T("Nothing completed yet.", "Сè уште ништо завршено.")}</p>`;
  let lastD = null;
  for (const r of shown.slice(0, 300)) {
    const t = r.t;
    if (r.on !== lastD) { html += `<div class="sec">${fmtD(r.on)}</div>`; lastD = r.on; }
    html += `<div class="card task done">
      <span class="led ${t.context}"></span>
      <span class="t-title">${esc(t.title)}${r.rec ? '<span class="rec"> ↻</span>' : ""}</span>
      ${r.rec ? "" : `<button class="btn sm ghost" onclick="restoreTask('${t.id}')">${T("Restore", "Врати")}</button>
      <button style="color:var(--danger);font-size:17px;padding:4px" onclick="histDelTask('${t.id}')" aria-label="delete">✕</button>`}
    </div>`;
  }
  list.innerHTML = html;
}

// A product photographed on white sits in the offer's grey cells as a white
// box. Cut the white away: from the edges inward, through solid white only —
// a pixel whose neighbours are all white too — so the cut cannot slip through
// a bright edge into a white camera's body. Then one pixel more, and the

function cutWhiteBackground(im, max = 900) {

    const i = p * 4, lo = Math.min(d[i], d[i + 1], d[i + 2]), hi = Math.max(d[i], d[i + 1], d[i + 2]);
    white[p] = d[i + 3] > 200 && lo >= 246 && hi - lo <= 10 ? 1 : 0;

  const touches = (m, p) => {
    const x = p % w;
    return (x > 0 && m[p - 1]) || (x < w - 1 && m[p + 1]) || (p >= w && m[p - w]) || (p < n - w && m[p + w]);

  // the edge must be mostly white
  let edge = 0, onWhite = 0;
  const count = (p) => { edge++; onWhite += white[p]; };
  for (let x = 0; x < w; x++) { count(x); count((h - 1) * w + x); }
  for (let y = 1; y < h - 1; y++) { count(y * w); count(y * w + w - 1); }
  if (onWhite < edge * 0.6) return null;
  const solid = (p) => {
    if (!white[p]) return false;
    const x = p % w, y = (p - x) / w;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < w && yy < h && !white[yy * w + xx]) return false;
    }

  let head = 0, tail = 0;
  const seed = (p) => { if (!cut[p] && solid(p)) { cut[p] = 1; queue[tail++] = p; } };
  for (let x = 0; x < w; x++) { seed(x); seed((h - 1) * w + x); }
  for (let y = 1; y < h - 1; y++) { seed(y * w); seed(y * w + w - 1); }
  while (head < tail) {
    const p = queue[head++], x = p % w;
    for (const m of [x > 0 ? p - 1 : -1, x < w - 1 ? p + 1 : -1, p - w, p + w]) {

  const grow = [];
  for (let p = 0; p < n; p++) if (!cut[p] && white[p] && touches(cut, p)) grow.push(p);
  for (const p of grow) cut[p] = 1;
  for (let p = 0; p < n; p++) if (cut[p]) d[p * 4 + 3] = 0;

    if (cut[p] || !touches(cut, p)) continue;
    const i = p * 4, a = Math.max(0, Math.min(1, (255 - Math.min(d[i], d[i + 1], d[i + 2])) / 70));

  }

}

const PHOTO_MATTE = "#ECECEC";   // matches the offer table cells (docx + PDF)

function imgHasAlpha(im) {
  try {
    const W0 = im.naturalWidth || im.width, H0 = im.naturalHeight || im.height;
    const w = Math.max(1, Math.min(160, W0));
    const h = Math.max(1, Math.round(H0 * w / W0));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.drawImage(im, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
  } catch (e) { console.warn("alpha check", e); }
  return false;
}

// Transparent artwork stays transparent (PNG) so it blends into the offer cells.
// Opaque photos stay JPEG. Oversized PNGs fall back to a matte on the cell colour.
function imgResize(im, max, q) {
  const W0 = im.naturalWidth || im.width, H0 = im.naturalHeight || im.height;   // an image or a canvas
  const scale = Math.min(1, max / Math.max(W0, H0));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(W0 * scale));
  c.height = Math.max(1, Math.round(H0 * scale));
  const ctx = c.getContext("2d");
  if (imgHasAlpha(im)) {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(im, 0, 0, c.width, c.height);
    const png = c.toDataURL("image/png");
    if (png.length < 480000) return png;      // ~350 KB of image data
  }
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = PHOTO_MATTE;
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

/* ---------- spotting duplicates in the list ---------- */
function duplicateGroups() {
  const seen = {}, out = [];
  for (const a of state.stock) {
    if (a.active === false) continue;
    const keys = [normName(a.name)];
    if (a.supplier_code) keys.push("sc:" + String(a.supplier_code).toLowerCase());
    if (a.code) keys.push("c:" + String(a.code).toLowerCase());
    for (const k of keys) {
      if (!k || k.length < 4) continue;
      (seen[k] = seen[k] || []).push(a);
    }
  }
  const used = new Set();
  for (const k of Object.keys(seen)) {
    const g = seen[k].filter((a, i, arr) => arr.findIndex((y) => y.id === a.id) === i);
    if (g.length < 2) continue;
    const sig = g.map((a) => a.id).sort().join("|");
    if (used.has(sig)) continue;
    used.add(sig); out.push(g);
  }
  return out;
}
function openDuplicates() {
  const groups = duplicateGroups();
  openSheet(`<h2>Possible duplicates</h2>
    ${groups.length ? groups.map((g) => `<div class="card">
      ${g.map((a) => `<div class="mov"><span><b>${esc(a.name)}</b>
        <div class="muted">${esc(a.code || a.supplier_code || "")} · stock ${fmt(a.stock)} · ${fmt(a.purchase_price)} ден.</div></span>
        <button class="chip" onclick="openMergeSheet('${a.id}')">Merge…</button></div>`).join("")}
    </div>`).join("")
    : '<p class="muted">None found — every article looks distinct.</p>'}`);
}

function addFreeItem() {

// Cost is snapshotted on the item when it is added, so changing a supplier
// price later never rewrites the profit on offers already made.
function itemCost(it) {
  if (it.free) return 0;
  if (it.cost !== undefined && it.cost !== null) return parseFloat(it.cost) || 0;
  const a = state.stock.find((x) => x.id === it.article_id);
  return a ? (parseFloat(a.purchase_price) || 0) : 0;
}
// The rate is snapshotted with the item; labour and manual rows are standard 18%.
function itemVat(it) {
  if (it.vat !== undefined && it.vat !== null) return parseFloat(it.vat) || 0;
  const a = state.stock.find((x) => x.id === it.article_id);
  return a && a.vat_rate !== undefined && a.vat_rate !== null ? (parseFloat(a.vat_rate) || 0) : 18;
}
// ДДВ is collected for the state, never income — so profit works on net figures.
function itemProfit(it) {
  const t = itemTotal(it);
  if (t === null) return null;                       // meters not measured yet
  const r = itemVat(it);
  const q = it.free ? 0 : (it.unit === "m" ? (metred(it) ? it.consumed : 0) : (it.qty || 0));
  return netOf(t, r) - netOf(itemCost(it) * q, r);
}
// { gross, net, vat, byRate: { 18: amount, 5: amount } } — per-meter rows are skipped
function vatBreakdown(items) {
  const byRate = {}; let gross = 0, net = 0;
  for (const it of items || []) {
    const t = itemTotal(it);
    if (t === null) continue;
    const r = itemVat(it);
    const n = netOf(t, r);
    gross += t; net += n;
    byRate[r] = (byRate[r] || 0) + (t - n);
  }
  return { gross, net, vat: gross - net, byRate };
}
function profitOf(items) {
  let value = 0, pending = false;
  for (const it of items || []) {
    const p = itemProfit(it);
    if (p === null) pending = true; else value += p;
  }
  return { value, pending };
}
// A line sold by the metre is measured after the work, so until then it has
// no length. 0 is a length too — none was needed — and settles it as 20 does.
const metred = (it) => typeof it.consumed === "number" && isFinite(it.consumed);
const metersOpenOf = (items) => (items || []).filter((it) => it.unit === "m" && !metred(it));
function itemTotal(it) {
  if (it.unit === "m") return metred(it) ? it.consumed * (it.price || 0) : null; // measured after install
  if (it.free) return it.price || 0;
  return (it.qty || 0) * (it.price || 0);
}
// The order is what the client reads on the offer, so it has to be changeable
// without deleting everything below and adding it again.
function moveOfferItem(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= offerItems.length) return;
  [offerItems[i], offerItems[j]] = [offerItems[j], offerItems[i]];
  renderOfferItems();
  const rows = $("of-items").children;          // the rows look alike, so show what moved
  if (rows[j]) {
    rows[j].classList.add("moved");
    setTimeout(() => rows[j] && rows[j].classList.remove("moved"), 700);
  }
}

function renderOfferItems() {
  $("of-items").innerHTML = offerItems.map((it, i) => {
    const tot = itemTotal(it);
    const last = offerItems.length - 1;
    return `<div class="lrow">
      <span class="omove">
        <button ${i === 0 ? "disabled" : ""} onclick="moveOfferItem(${i},-1)"
          aria-label="${T("Move up", "Помести горе")}">▲</button>
        <button ${i === last ? "disabled" : ""} onclick="moveOfferItem(${i},1)"
          aria-label="${T("Move down", "Помести долу")}">▼</button>
      </span>
      <div class="lbody">
        <input class="lname" value="${esc(it.name)}" oninput="offerItems[${i}].name=this.value">
        <div class="lnums">
          ${it.unit === "m"
            ? `<input value="${metred(it) ? fmt(it.consumed) + " m" : "m"}" disabled>`
            : it.free
              ? `<input value="—" disabled>`
              : `<input type="number" inputmode="decimal" value="${it.qty ?? ""}" oninput="offerItems[${i}].qty=parseFloat(this.value)||0;updateTotal()">`}
          <span class="lop">×</span>
          <input type="number" inputmode="decimal" id="of-it-price-${i}" value="${it.price ?? ""}" oninput="offerItems[${i}].price=parseFloat(this.value)||0;updateTotal()">
          <span class="lop">=</span>
          <b class="mono ltot" id="of-it-tot-${i}">${tot === null ? "???" : fmt(tot)}</b>
        </div>
      </div>
      <button class="del" onclick="offerItems.splice(${i},1);renderOfferItems()">✕</button>
      ${marginLine(it, i)}
    </div>`;
  }).join("");
  updateTotal();
}
// What an item costs you and how much it is marked up: the same "+50%" the
// article sheet puts on the purchase price. Changing it here changes this
// offer's price only, for this customer; the article keeps its own.
function markupOf(it) {
  const c = itemCost(it);
  return c > 0 && it.price ? Math.round(((it.price - c) / c) * 1000) / 10 : null;
}
// for the line, net of ДДВ as Profit is; a metre item is not measured yet, so per metre
function gainHtml(it) {
  const p = itemProfit(it);
  const v = p === null ? netOf((it.price || 0) - itemCost(it), itemVat(it)) : p;
  return `<span class="${v < 0 ? "neg" : ""}">${T("you make", "заработуваш")} ${fmt(Math.round(v))}${p === null ? " / m" : ""}</span>`;
}
function marginLine(it, i) {
  const c = itemCost(it);
  if (it.free || !(c > 0)) return "";
  return `<div class="lmargin">
    <span>${T("Cost", "Набавна")} ${fmt(c)}</span>
    <span class="lpct">+<input type="number" inputmode="decimal" step="any" id="of-it-mk-${i}" value="${markupOf(it) ?? ""}"
      oninput="offerMarkup(${i},this.value)" aria-label="${T("Markup %", "Надценка %")}">%</span>
    <span id="of-it-gain-${i}">${gainHtml(it)}</span>
  </div>`;
}
function offerMarkup(i, v) {
  const it = offerItems[i], pct = parseFloat(v), c = it ? itemCost(it) : 0;
  if (!(c > 0) || !Number.isFinite(pct)) return;
  it.price = Math.round(c * (1 + pct / 100));
  const el = $("of-it-price-" + i);
  if (el) el.value = it.price;
  updateTotal();
}
function offerMarkupAll() {
  const pct = parseFloat($("of-mk-all").value);
  if (!Number.isFinite(pct)) return toast(T("Enter the markup %", "Внеси надценка %"));
  let n = 0;
  for (const it of offerItems) {
    const c = itemCost(it);
    if (it.free || !(c > 0)) continue;
    it.price = Math.round(c * (1 + pct / 100));
    n++;
  }
  if (!n) return toast(T("No item here has a purchase price", "Ниедна ставка нема набавна цена"));
  $("of-mk-all").value = "";
  renderOfferItems();
  toast(T(`${n} item${n > 1 ? "s" : ""} at +${pct}%`, `${n} ставки на +${pct}%`));
}
function updateTotal() {
  let sum = 0;
  offerItems.forEach((it, i) => {
    const t = itemTotal(it);
    const cell = $("of-it-tot-" + i);
    // the per-line total is text now, not a disabled input
    if (cell) cell.textContent = t === null ? "???" : fmt(t);
    if (t !== null) sum += t;
  });
  $("of-total").textContent = fmt(sum) + " ден.";
  const vb = vatBreakdown(offerItems);
  const vEl = $("of-vat");
  if (vEl) vEl.textContent = fmt(vb.net) + " + "
    + VAT_RATES.filter((r) => vb.byRate[r]).map((r) => fmt(vb.byRate[r]) + " (" + r + "%)").join(" + ")
    + " ден.";
  const pr = profitOf(offerItems);
  const pEl = $("of-profit");
  if (pEl) {
    pEl.textContent = fmt(pr.value) + " ден." + (pr.pending ? " + meters" : "");
    pEl.style.color = pr.value < 0 ? "var(--danger)" : "var(--personal)";
  }
  // each item's markup and gain — not the % box being typed in
  let cost = 0, sale = 0;
  offerItems.forEach((it, i) => {
    const mk = $("of-it-mk-" + i), gain = $("of-it-gain-" + i);
    if (mk && document.activeElement !== mk) mk.value = markupOf(it) ?? "";
    if (gain) gain.innerHTML = gainHtml(it);
    const c = itemCost(it), q = it.unit === "m" ? 0 : (it.qty || 0);
    if (!it.free && c > 0) { cost += c * q; sale += (it.price || 0) * q; }
  });
  const mkRow = $("of-mk-row"), mkNow = $("of-mk-now");
  if (mkRow) mkRow.style.display = offerItems.some((it) => !it.free && itemCost(it) > 0) ? "" : "none";
  if (mkNow) mkNow.textContent = cost > 0 ? `· ${T("now", "сега")} +${Math.round(((sale - cost) / cost) * 1000) / 10}%` : "";
  const metersOpen = metersOpenOf(offerItems);
  const noteEl = $("of-note");
  if (noteEl && !noteEl.dataset.manual) {
    noteEl.value = metersOpen.length ? "(не се вклучени " + metersOpen.map((m) => m.name.split(" ")[0].toLowerCase()).join(" и ") + ")" : "";
  }
  return sum;
}
async function saveOffer(id, generate, pdf, share) {
  const meters = offerItems.map((it, i) => ({ it, n: i + 1 })).filter((x) => x.it.unit === "m");
  const row = {
    number: id ? state.offers.find((x) => x.id === id).number : await nextOfferNumber(),
    title: $("of-title").value.trim(), system: $("of-system").value.trim() || null,
    client_id: $("of-client").value || null, offer_date: $("of-date").value,
    validity: parseInt($("of-val").value) || 7, status: $("of-status").value,
    items: offerItems, total_note: $("of-note").value.trim() || null,
    grand_total: updateTotal(),
  };
  if (!row.title) return toast("Enter a title");
  if (!offerItems.length) return toast("Add items");
  let saved;
  try {
    if (id) { await dbq(db.from("offers").update(row).eq("id", id), "Offer not saved"); saved = { ...row, id }; }
    else {
      let ins = await db.from("offers").insert(row).select().single();
      if (ins.error && ins.error.code === "23505") {   // number collision → renumber and retry once
        row.number = await nextOfferNumber();
        ins = await db.from("offers").insert(row).select().single();
      }
      if (ins.error) { toast("Offer not saved — " + ins.error.message); return; }
      saved = ins.data;
    }
  } catch { return; }
  await refreshAll(["offers", "stock"]);
  let genOk = null;
  if (generate) genOk = await generateDocx(saved);
  closeSheet(); renderOffers();
  if (pdf) { await printOffer(saved); setTimeout(() => promptDeduct(saved.id), 500); return; }
  if (share) { await shareOffer(saved); return; }   // the stock question waits until it has gone
  toast(genOk === false ? "Offer saved — document failed" : genOk ? "Offer saved · downloading .docx" : "Offer saved");
  setTimeout(() => promptDeduct(saved.id), 400);
}
// What an offer's file is called once it leaves the app: the title you gave it,
// as you typed it. Characters a file system refuses become dashes, and an
// offer with no title falls back to its number.
function offerFileName(o, ext) {
  const base = String(o.title || "").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "-")
    .replace(/\s+/g, " ").trim().slice(0, 90) || `Ponuda ${o.number || ""}`.trim();
  return `${base}.${ext}`;
}

// The browser names a "Save as PDF" after the page, which is why every offer
// came out as Centrala.pdf. Lend the page the document's name while the print
// dialog is open, then give it back.
function printTitled(name) {
  const was = document.title;
  const back = () => { document.title = was; window.removeEventListener("afterprint", back); };
  document.title = name;
  window.addEventListener("afterprint", back);
  setTimeout(back, 60000);            // for a browser that never says afterprint
  window.print();
}

        <thead><tr><th>Бр</th><th>Слика</th><th>Спецификација</th><th>Ком</th><th>Цена</th><th>Вк. Цена</th></tr></thead>
        <tbody>${rows}</tbody>

const imagesLoaded = (root) => Promise.all([...root.querySelectorAll("img")]
  .map((im) => im.complete ? true : new Promise((r) => { im.onload = im.onerror = r; })));

async function printOffer(o) {
  try {
    $("printroot").innerHTML = await offerSheetHtml(o);
    await imagesLoaded($("printroot"));
    await new Promise((r) => setTimeout(r, 150));
    printTitled(offerFileName(o, "pdf").slice(0, -4));   // never cleared afterwards — see printDoc for why
    toast(T('Choose "Save as PDF" in the print dialog', 'Избери „Зачувај како PDF" во дијалогот'));
  } catch (e) {
    console.error(e);
    say("Could not build the PDF view: " + e.message);
  }
}

// Sharing is two taps on purpose. A phone opens its share sheet — Viber,
// WhatsApp, Messenger, mail — only straight from a tap, and drawing the PDF
// takes long enough that the first tap would have expired. So the first one
// saves and prepares the file, and the second hands it over.
let offerFile = null;
async function shareOffer(o) {
  toast(T("Preparing the PDF…", "Се подготвува PDF…"));
  // the sheet that just closed hides itself 220 ms later; do not open into that
  const settled = new Promise((r) => setTimeout(r, 240));
  try { [offerFile] = await Promise.all([offerPdfFile(o), settled]); }

// Fetched the first time Share is used, so the app itself loads no slower.
// A failed load is forgotten, so the next tap tries again.
const scriptOnce = (() => {
  const seen = {};
  return (src) => seen[src] || (seen[src] = new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok;
    s.onerror = () => { delete seen[src]; s.remove();
      no(new Error(T("no connection to fetch the PDF maker", "нема врска за PDF алатката"))); };
    document.head.appendChild(s);
  }));
})();

// The offer as a real PDF file. The print view cannot be handed to another
// app — the browser keeps it — so this draws the same layout onto A4 pages

const offerPdfFile = async (o) => htmlPdfFile(await offerSheetHtml(o), offerFileName(o, "pdf"));
// Any paper document as a PDF file that can be handed to another app: an
// offer, an invoice. Laid out off screen at A4 width, photographed, and cut
// into pages between rows rather than through them.
async function htmlPdfFile(html, name) {
  await Promise.all([
    scriptOnce("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"),
    scriptOnce("https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"),
  ]);
  // A4 less the print margins: 190 by 273 mm, laid out off screen
  const W = 190, H = 273, host = document.createElement("div");
  // the paper colours #printroot gives a printout, whatever the phone's theme
  host.style.cssText = `position:absolute;left:-10000px;top:0;width:${W}mm;background:#fff;`
    + "--paper:#fff;--card:#fff;--ink:#232323;--line:#CCCCCC;--muted:#555555;--surface:#fff";
  host.innerHTML = html;
  document.body.appendChild(host);
  try {
    await imagesLoaded(host);
    const scale = 2;
    const canvas = await window.html2canvas(host, { scale, backgroundColor: "#ffffff", logging: false });
    const pxPerMm = canvas.width / W, pageH = Math.floor(H * pxPerMm);
    const top = host.getBoundingClientRect().top;
    const cuts = [...host.querySelectorAll(".pv > *, .pv-items tr, .rp-tbl tr")]
      .map((el) => Math.round((el.getBoundingClientRect().bottom - top) * scale)).sort((a, b) => a - b);
    // where the column headings and the item rows sit, so a page that opens
    // in the middle of the list can carry the headings again, as print does
    const at = (sel) => { const el = host.querySelector(sel); if (!el) return null;
      const r = el.getBoundingClientRect(); return { top: Math.round((r.top - top) * scale), bottom: Math.round((r.bottom - top) * scale) }; };
    const head = at(".pv-items thead"), rows = at(".pv-items tbody");
    const headH = head ? head.bottom - head.top : 0;
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", compress: true });
    for (let y = 0, page = 0; y < canvas.height - 1; page++) {
      const repeat = page > 0 && headH > 0 && rows && y > rows.top && y < rows.bottom;
      const lift = repeat ? headH : 0;
      let end = Math.min(canvas.height, y + pageH - lift);
      if (end < canvas.height) {
        const fit = cuts.filter((c) => c > y + 40 && c <= end);
        if (fit.length) end = fit[fit.length - 1];   // else one row is taller than a page: cut it
      }
      const slice = document.createElement("canvas");
      slice.width = canvas.width; slice.height = lift + (end - y);
      const g = slice.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, slice.width, slice.height);
      if (repeat) g.drawImage(canvas, 0, head.top, canvas.width, headH, 0, 0, canvas.width, headH);
      g.drawImage(canvas, 0, y, canvas.width, end - y, 0, lift, canvas.width, end - y);
      if (page) pdf.addPage();
      pdf.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", 10, 12, W, slice.height / pxPerMm);
      y = end;
    }
    return new File([pdf.output("blob")], name, { type: "application/pdf" });
  } finally { host.remove(); }
}
// Puts real pictures where the template left «IMG:n» markers.
// Done by hand so the document pipeline owns no third-party image library.
function dataUrlToBytes(dataUrl) {
  const bin = atob(dataUrl.split(",")[1] || "");
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function drawingXml(rid, wPx, hPx, id) {
  const cx = Math.round(wPx * 9525), cy = Math.round(hPx * 9525);   // px -> EMU
  const A = "http://schemas.openxmlformats.org/drawingml/2006/main";
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">` +
    `<wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/>` +
    `<wp:docPr id="${5000 + id}" name="Photo ${id}"/>` +
    `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="${A}" noChangeAspect="1"/></wp:cNvGraphicFramePr>` +
    `<a:graphic xmlns:a="${A}"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:nvPicPr><pic:cNvPr id="${id}" name="Photo ${id}"/><pic:cNvPicPr/></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>` +
    `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
    `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
function insertPictures(zip, photos) {
  let xml = zip.file("word/document.xml").asText();
  if (xml.indexOf("«IMG:") === -1) return;
  const relsPath = "word/_rels/document.xml.rels";
  let rels = zip.file(relsPath).asText();
  let n = 0;
  xml = xml.replace(/<w:r(?:>| [^>]*>)(?:(?!<\/w:r>).)*?«IMG:(\d+)»(?:(?!<\/w:r>).)*?<\/w:r>/g, (run, idxStr) => {
    const p = photos[parseInt(idxStr)];
    if (!p) return "";
    n++;
    const isPng = p.dataUrl.startsWith("data:image/png");
    const name = `photo${n}.${isPng ? "png" : "jpeg"}`;
    const rid = `rIdPhoto${n}`;
    zip.file("word/media/" + name, dataUrlToBytes(p.dataUrl), { binary: true });
    rels = rels.replace("</Relationships>",
      `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${name}"/></Relationships>`);
    return drawingXml(rid, p.w, p.h, n);
  });
  xml = xml.replace(/«IMG:\d+»/g, "");   // safety net
  zip.file("word/document.xml", xml);
  zip.file(relsPath, rels);
}

/* ---------- one branded print wrapper for both ---------- */
// Android hands the page to the system print service, which takes its snapshot
// AFTER window.print() returns — and fires "afterprint" straight away. So
// anything that empties the page on a timer or on afterprint races that
// snapshot and wins, which is exactly how blank PDFs happened. Nothing is
// cleared after printing at all: #printroot is hidden on screen, so leftover
// content is invisible, and it is replaced at the start of the next document.
//
// brand: false for anything that is not Elaks.
// the page a document is printed on: the letterhead, the body, the footer
function docShell(inner, opts) {
  const brand = !opts || opts.brand !== false;
  return `<div class="pv">
      ${brand
        ? `<table class="pv-top"><tr><td></td><td class="r"><img class="pv-logo" src="brand-logo.png" alt="ELAKS"></td></tr></table>`
        : (opts && opts.heading ? `<div class="pv-plain">${opts.heading}</div>` : "")}
      ${inner}
      ${brand ? `<img class="pv-footer" src="brand-footer.png" alt="ELAKS">` : ""}
    </div>`;
}
async function printDoc(inner, opts) {
  const root = $("printroot");
  try {
    root.innerHTML = docShell(inner, opts);
    const imgs = [...root.querySelectorAll("img")];
    await Promise.all(imgs.map((im) => im.complete ? true : new Promise((r) => { im.onload = im.onerror = r; })));
    await new Promise((r) => setTimeout(r, 150));
    if (!root.textContent.trim()) throw new Error(T("the document came out empty", "документот испадна празен"));
    window.print();
    toast(T('Choose "Save as PDF" in the print dialog', 'Избери „Зачувај како PDF" во дијалогот'));
  } catch (e) {
    console.error(e);
    root.innerHTML = "";
    say(T("Could not build the document: ", "Не можев да го подготвам документот: ") + e.message);
  }
}

function imgDims(src) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth || 4, h: im.naturalHeight || 3 });
    im.onerror = () => res({ w: 4, h: 3 });
    im.src = src;
  });
}
async function generateDocx(o) {
  const metersOpen = (o.items || []).map((it, i) => ({ it, n: i + 1 })).filter((x) => x.it.unit === "m" && !metred(x.it));
  try {
    if (!window.PizZip || !window.docxtemplater) throw new Error("Document libraries did not load — check connection and reload the app");
    const res = await fetch("Ponuda_TEMPLATE.docx", { cache: "no-store" });
    if (!res.ok) throw new Error("Template not found on server (HTTP " + res.status + ")");
    const buf = await res.arrayBuffer();
    const head = new Uint8Array(buf.slice(0, 2));
    if (head[0] !== 0x50 || head[1] !== 0x4B) throw new Error("Template file on server is not a valid .docx");
    // product photos: fetch and measure (inserted into the document after rendering)
    const ids = [...new Set((o.items || []).filter((it) => it.article_id).map((it) => it.article_id))];
    const photo = {};   // article_id -> { dataUrl, w, h }
    if (ids.length) {
      const { data: imgs } = await db.from("article_images").select("article_id, data").in("article_id", ids);
      for (const r of imgs || []) {
        if (!r.data) continue;
        const d = await imgDims(r.data);
        const MAXW = 120, MAXH = 95;
        let w = MAXW, h = Math.round(MAXW * d.h / d.w);
        if (h > MAXH) { h = MAXH; w = Math.round(MAXH * d.w / d.h); }
        photo[r.article_id] = { dataUrl: r.data, w, h };
      }
    }
    const doc = new window.docxtemplater(new PizZip(buf), { linebreaks: true, paragraphLoop: true });
    const client = state.clients.find((c) => c.id === o.client_id);
    doc.render({
      title: o.title, system: o.system || "",
      offer_number: o.number, date: dmy(o.offer_date),
      client: client ? client.name : "", validity: o.validity,
      client_contact: client ? (client.contact || "") : "",
      client_phone: client ? (client.phone || "") : "",
      client_address: client ? (client.address || "") : "",
      client_email: client ? (client.email || "") : "",
      items: o.items.map((it, i) => ({
        num: i + 1, name: it.name, specs: it.specs || "",
        qty: it.unit === "m" ? (metred(it) ? fmt(it.consumed) + " m" : "m") : (it.free ? "" : fmt(it.qty || 0)),
        price: it.free ? "" : fmt(it.price || 0),
        total: itemTotal(it) === null ? "???" : fmt(itemTotal(it) || 0),
        img_mark: photo[it.article_id] ? `«IMG:${i}»` : "",
      })),
      total_note: o.total_note || "", grand_total: fmt(o.grand_total),
      footnote: metersOpen.length
        ? `* Ставките ${metersOpen.map((m) => m.n).join(" и ")} се пресметуваат по потрошена должина по завршување на монтажата.`
        : "",
    });
    insertPictures(doc.getZip(), (o.items || []).map((it) => photo[it.article_id] || null));
    const blob = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = offerFileName(o, "docx");
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    return true;
  } catch (e) {
    console.error(e);
    const det = (e.properties && e.properties.errors)
      ? e.properties.errors.map((x) => x.properties && x.properties.explanation).filter(Boolean).join("\n")
      : e.message;
    say("Could not generate the offer document:\n\n" + det);
    return false;
  }
}

async function finishAccept(id) {
  const o = state.offers.find((x) => x.id === id);

async function closeJob(id, then) {
  const o = state.offers.find((x) => x.id === id);
  const items = JSON.parse(JSON.stringify(o.items));
  const movRows = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.unit === "m" && !metred(it)) {
      const raw = (($("cj-" + i) || {}).value || "").trim();
      const v = parseFloat(raw);
      if (raw === "" || !isFinite(v) || v < 0) return toast(T("Enter the metres for every line — 0 if none was used", "Внеси метри за секоја ставка — 0 ако не е потрошено"));
      it.consumed = v;
      if (it.article_id && v > 0) movRows.push({ article_id: it.article_id, type: "out", qty: v, ref: o.number, note: "Offer " + o.number });
    }
  }
  if (!o.stock_deducted) items.forEach((it) => {
    if (it.article_id && it.unit !== "m") movRows.push({ article_id: it.article_id, type: "out", qty: it.qty || 0, ref: o.number, note: "Offer " + o.number });
  });
  const total = items.reduce((s, it) => {
    const t = it.unit === "m" ? it.consumed * (it.price || 0) : (it.free ? (it.price || 0) : (it.qty || 0) * (it.price || 0));
    return s + (t || 0);
  }, 0);
  // the metres are in once the work is over: its job is finished with them
  const job = state.jobs.find((j) => j.offer_id === id && j.status !== "done" && j.status !== "cancelled");
  try {
    if (movRows.length) await dbq(db.from("movements").insert(movRows), "Stock not updated");
    await dbq(db.from("offers").update({ items, grand_total: total, total_note: null, stock_deducted: true }).eq("id", id), "Offer not updated");
    if (job) await dbq(db.from("jobs").update({ status: "done", done_at: new Date().toISOString() }).eq("id", job.id), T("Job not updated", "Работата не е ажурирана"));
  } catch { return; }
  closeSheet(); await refreshAll(["offers", "stock", "jobs"]); render();
  const wasPaid = parseFloat(o.paid_amount) || 0;
  if (o.paid_at && Math.abs(total - wasPaid) > 0.005) {   // the invoice moved after it was paid
    setTimeout(() => reconcileSheet(id, wasPaid, total), 260);
    return;
  }
  if (then === "invoice") return void setTimeout(() => newInvoiceFromOffer(id), 260);
  toast(job ? T("Finished — the cable is on the total and out of stock", "Завршена — кабелот е во вкупното и симнат од магацин")
    : T("Job closed — total and stock updated", "Работата е затворена — вкупното и магацинот се ажурирани"));
}

// You earn on the green card as well as on the policy it rides on.
const gcComm = (p) => p.has_green_card ? (parseFloat(p.gc_commission) || 0) : 0;
const policyCommission = (p) => (parseFloat(p.commission) || 0) + gcComm(p);
const polPays = (p) => state.polPays.filter((x) => x.policy_id === p.id);
// Card and bank go straight to the insurer; only cash passes through your hands.
// Only cash handed to YOU has to be handed on. Cash the client takes to the
// insurer, like card and bank, never passes through your hands.
const throughMe = (m) => String(m || "cash").toLowerCase() === "cash";
const PAY_LABELS = {
  cash: ["cash to me", "кеш кај мене"],
  cash_insurer: ["cash to insurer", "кеш кај осигурителната"],
  card: ["card to insurer", "картичка кај осигурителната"],
  bank: ["bank to insurer", "банка кај осигурителната"],
};
const payLabel = (m) => { const l = PAY_LABELS[m] || PAY_LABELS.cash; return T(l[0], l[1]); };
// how a policy was paid, in words — "cash to me 3.000 · card to insurer 1.000"
const payBreakdown = (p) => {
  const by = {};
  for (const x of polPays(p)) by[x.method || "cash"] = (by[x.method || "cash"] || 0) + (parseFloat(x.amount) || 0);
  return Object.entries(by).map(([m, a]) => `${payLabel(m)} ${fmt(a)}`).join(" · ");
};
const polPaid = (p) => sumBy(polPays(p), (x) => x.amount);
const polPaidCash = (p) => sumBy(polPays(p).filter((x) => throughMe(x.method)), (x) => x.amount);
const polPaidDirect = (p) => sumBy(polPays(p).filter((x) => !throughMe(x.method)), (x) => x.amount);
// what the insurer expects from YOU: the premium less whatever the client
// already sent them directly
const policyDue = (p) => Math.max(0, policyTotal(p) - polPaidDirect(p));
const polBalance = (p) => policyTotal(p) - polPaid(p);
const polSettled = (p) => polBalance(p) <= 0.005;
const polDaysLeft = (p) => !p.end_date ? null
  : Math.round((Date.parse(p.end_date + "T12:00") - Date.parse(todayStr() + "T12:00")) / 86400000);

// a green card runs out long before the policy does
const gcSoon = (p) => {
  if (!p.has_green_card || !p.green_card_end) return false;
  const d = Math.round((Date.parse(p.green_card_end + "T12:00") - Date.parse(todayStr() + "T12:00")) / 86400000);
  return d >= 0 && d <= 14;
};
function polStatus(p) {
  const d = polDaysLeft(p);
  if (d !== null && d < 0) return { key: "expired", label: T("expired", "истечена"), colour: "var(--muted)" };
  if (d !== null && d <= 30) return { key: "expiring", label: T("ends in", "истекува за") + " " + d + "d", colour: "var(--amber)" };
  return { key: "live", label: T("running", "активна"), colour: "var(--personal)" };
}

// Money moves three ways here, and the summary has to keep them apart:
// what clients still owe me, what I owe the insurers, and what they owe me.
const polRemitted = (p) => !!p.remit_statement_id;
const polCommPaid = (p) => !!p.comm_statement_id;
const polCommDue = (p) => polCommPaid(p) ? 0 : policyCommission(p);
// sent on out of your own money, because the cash has not come in yet
const polFronted = (p) => polRemitted(p) ? Math.max(0, policyDue(p) - polPaidCash(p)) : 0;
// cash in your hands that belongs to the insurer
const polHolding = (p) => !polRemitted(p) ? Math.min(polPaidCash(p), policyDue(p)) : 0;

/* ---------- statements: settling with the insurer ---------- */
const stmtPolicies = (s) => state.policies.filter((p) =>
  (s.kind === "remittance" ? p.remit_statement_id : p.comm_statement_id) === s.id);
const insurersUsed = () => [...new Set(state.policies.map((p) => p.insurer).filter(Boolean))].sort();

// Who to chase: premiums already sent to the insurer that the client has not
// finished paying. This is your own money sitting with someone else.
function openFronted() {
  const list = state.policies.filter((p) => polFronted(p) > 0.005)
    .sort((a, b) => polBalance(b) - polBalance(a));
  openSheet(`<h2>${T("Paid for, not collected", "Платено, ненаплатено")}</h2>
    <p class="muted">${T("You have sent these premiums to the insurer. The clients are still paying you.",
      "Овие премии се веќе платени на осигурителната. Клиентите сè уште ти плаќаат.")}</p>
    <div class="totalbar"><span>${T("Out of my pocket", "Од мој џеб")}</span>
      <span class="mono">${fmt(sumBy(list, polFronted))} ден.</span></div>
    ${list.length ? list.map((p) => `<div class="card offer row" role="button" tabindex="0" onclick="openPolicySheet('${p.id}')">
      <div style="flex:1;min-width:0"><b>${esc(p.holder_name)}</b>
        <div class="o-num">${esc(p.kind || "")}${p.policy_no ? " · " + esc(p.policy_no) : ""}${p.phone ? " · " + esc(p.phone) : ""}
          · ${T("paid", "платил")} ${fmt(polPaid(p))} ${T("of", "од")} ${fmt(policyTotal(p))}</div></div>
      <span class="o-total mono" style="color:var(--amber)">${fmt(polBalance(p))}</span>
    </div>`).join("") : `<p class="muted">${T("Nothing — every remitted policy is paid up.", "Ништо — сите препратени полиси се наплатени.")}</p>`}`);
}

/* ---------- what the month actually earned ---------- */
let insRepMonth = null;
function insMonthFigures(mo) {
  const inMonth = (d) => (d || "").slice(0, 7) === mo;
  const sold = state.policies.filter((p) => inMonth(p.start_date));
  const renewals = sold.filter((p) => p.renewed_from);
  const stmts = state.statements.filter((s) => inMonth(s.paid_on));
  return {
    sold, renewals,
    // what the month earned, whether or not the money has arrived
    commissionEarned: sumBy(sold, policyCommission),
    premiumsWritten: sumBy(sold, policyTotal),
    // what actually moved
    collected: sumBy(state.polPays.filter((x) => inMonth(x.paid_on)), (x) => x.amount),
    remitted: sumBy(stmts.filter((s) => s.kind === "remittance"), (s) => s.amount),
    commissionReceived: sumBy(stmts.filter((s) => s.kind === "commission"), (s) => s.amount),
    byKind: POLICY_KINDS.map((k) => ({ k, n: sold.filter((p) => p.kind === k).length,
      comm: sumBy(sold.filter((p) => p.kind === k), policyCommission) })).filter((x) => x.n),
    byInsurer: [...new Set(sold.map((p) => p.insurer).filter(Boolean))].map((ins) => ({
      ins, n: sold.filter((p) => p.insurer === ins).length,
      comm: sumBy(sold.filter((p) => p.insurer === ins), policyCommission),
    })).sort((a, b) => b.comm - a.comm),
  };
}

        <span class="mono">${fmt(x.comm)} ден.</span></div>`).join("")}` : ""}

    ${f.byInsurer.length ? `<div class="sec">${T("By insurer", "По осигурителна")}</div>

const nextMonth = (ym) => {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m, 1).toLocaleDateString("sv-SE").slice(0, 7);
};

// Twelve months at a glance — the question "how am I doing" is really a
// question about the trend, not one month.
function openInsYear() {
  const year = (insRepMonth || todayStr()).slice(0, 4);
  const months = Array.from({ length: 12 }, (_, i) => `${year}-${String(i + 1).padStart(2, "0")}`);
  const rows = months.map((mo) => ({ mo, f: insMonthFigures(mo) }));
  const totalComm = sumBy(rows, (r) => r.f.commissionEarned);
  const totalPol = rows.reduce((s, r) => s + r.f.sold.length, 0);
  const best = Math.max(...rows.map((r) => r.f.commissionEarned), 1);
  openSheet(`
    <h2>${year}</h2>
    <div class="totalbar"><span>${T("Commission earned", "Заработена провизија")}</span>
      <span class="mono">${fmt(totalComm)} ден.</span></div>
    <p class="muted">${totalPol} ${T("policies over the year", "полиси во годината")}</p>
    ${rows.map((r) => `<div style="margin-bottom:7px">
      <div class="row" style="justify-content:space-between;font-size:12.5px">
        <span class="muted nw">${monthName(r.mo)}</span>
        <span class="mono">${r.f.sold.length ? fmt(r.f.commissionEarned) + " ден. · " + r.f.sold.length : "—"}</span></div>
      <div style="height:6px;border-radius:3px;background:var(--line);overflow:hidden">
        <div style="height:100%;width:${Math.round((r.f.commissionEarned / best) * 100)}%;background:var(--personal)"></div></div>
    </div>`).join("")}`);
}

// Pick an insurer and a month; everything of that insurer not yet settled that
// way is offered, so nothing is quietly left behind.
let stmtDraft = null;
// Going to the insurer: you take a list of every policy not yet settled —
// however the client paid — because that list is what their commission is
// worked out from. Premiums owed and commission earned close together.
function openSettleSheet(insurer) {
  const ins = insurer || insurersUsed()[0] || "";
  const pool = state.policies
    .filter((p) => (p.insurer || "") === ins && (!p.remit_statement_id || !p.comm_statement_id))
    .sort((a, b) => (a.start_date || "").localeCompare(b.start_date || ""));
  settleDraft = { insurer: ins, picked: pool.map((p) => p.id) };

  openSheet(`
    <h2>${T("Settle with an insurer", "Порамни со осигурителна")}</h2>
    <label>${T("Insurance company", "Осигурителна компанија")}</label>
    <select id="se-ins" onchange="openSettleSheet(this.value)">
      ${insurersUsed().map((n) => `<option ${n === ins ? "selected" : ""}>${esc(n)}</option>`).join("")
        || `<option>${T("no policies yet", "сè уште нема полиси")}</option>`}
    </select>

    <div class="sec">${T("Everything not yet settled", "Сè што не е порамнето")} · ${pool.length}
      <span class="muted" style="font-weight:400">· ${T("oldest first", "најстарите прво")}</span></div>
    ${pool.length ? `<div class="ohead" style="grid-template-columns:26px 1fr 78px 70px">
        <span></span><span>${T("Policy", "Полиса")}</span><span style="text-align:right">${T("Premium", "Премија")}</span>
        <span style="text-align:right">${T("Commission", "Провизија")}</span></div>`
      : ""}
    ${pool.length ? pool.map((p) => `<div class="row" style="gap:8px;margin-bottom:6px;align-items:flex-start">
      <button class="clbox on" style="margin-top:2px" onclick="settleToggle('${p.id}', this)">✓</button>
      <div style="flex:1;min-width:0"><b>${esc(p.holder_name)}</b>
        <div class="muted" style="font-size:12px">${p.plate ? esc(p.plate) + " · " : ""}${esc(p.kind || "")}${p.policy_no ? " · " + esc(p.policy_no) : ""} · ${dmy(p.start_date)}</div>
        <div style="font-size:12px">${polPaidCash(p)
            ? `<span style="color:var(--personal)">${T("cash", "кеш")} ${fmt(polPaidCash(p))}</span>` : ""}${
          polPaidDirect(p) ? `<span class="muted">${polPaidCash(p) ? " · " : ""}${T("paid them directly", "платено директно")} ${fmt(polPaidDirect(p))}</span>` : ""}${
          policyDue(p) - polPaidCash(p) > 0.005 ? `<span style="color:var(--amber)">${(polPaidCash(p) || polPaidDirect(p)) ? " · " : ""}${T("not collected", "ненаплатено")} ${fmt(policyDue(p) - polPaidCash(p))}</span>` : ""}</div>
      </div>
      <span class="mono" style="width:78px;text-align:right">${fmt(policyDue(p))}${
        polPaidDirect(p) ? `<div class="muted" style="font-size:11px">${T("of", "од")} ${fmt(policyTotal(p))}</div>` : ""}</span>
      <span class="mono" style="width:70px;text-align:right;color:var(--personal)">${fmt(policyCommission(p))}</span>
    </div>`).join("")
      : `<p class="muted">${T("Nothing outstanding with this company.", "Ништо неподмирено кај оваа компанија.")}</p>`}

    <div class="card" style="margin-top:12px">
      <div class="row bankrow" style="margin-top:0"><span class="muted nw">${T("All policies, full price", "Сите полиси, полна цена")}</span>

      <div class="row bankrow"><span class="muted nw">${T("Premiums to hand over", "Премии за предавање")}</span>
        <span class="mono" id="se-prem">0</span></div>
      <div class="row bankrow"><span class="muted nw">${T("Commission earned", "Заработена провизија")}</span>
        <span class="mono" id="se-comm" style="color:var(--personal)">0</span></div>

  `);

}
let settleDraft = null;
function printSettleDraft() {
  const picked = state.policies.filter((p) => settleDraft.picked.includes(p.id));
  if (!picked.length) return toast(T("Nothing selected", "Ништо не е избрано"));
  printSettlementList(picked, $("se-ins").value, $("se-date").value || todayStr(),
    { note: $("se-note").value.trim() });
}
function settleToggle(id, btn) {
  const i = settleDraft.picked.indexOf(id);
  if (i >= 0) { settleDraft.picked.splice(i, 1); btn.classList.remove("on"); btn.textContent = ""; }
  else { settleDraft.picked.push(id); btn.classList.add("on"); btn.textContent = "✓"; }
  settleTotals();
}
function settleTotals() {
  const picked = state.policies.filter((p) => settleDraft.picked.includes(p.id));
  const full = sumBy(picked, policyTotal);
  const direct = sumBy(picked, polPaidDirect);
  const prem = sumBy(picked, policyDue);
  const comm = sumBy(picked, policyCommission);
  const net = prem - comm;
  const notCollected = sumBy(picked, (p) => Math.max(0, policyDue(p) - polPaidCash(p)));
  $("se-full").innerHTML = `<b>${fmt(full)}</b> ден.`;
  $("se-direct").textContent = "−" + fmt(direct) + " ден.";
  $("se-prem").textContent = fmt(prem) + " ден.";
  $("se-comm").textContent = "−" + fmt(comm) + " ден.";
  $("se-net").textContent = fmt(Math.abs(net)) + " ден.";
  $("se-net-label").textContent = net >= 0 ? T("Net to pay them", "Нето за плаќање") : T("Net they owe you", "Нето што ти должат");
  $("se-front").textContent = notCollected > 0.005
    ? T(`Of the premiums, ${fmt(notCollected)} ден. has not been collected from clients yet — you are covering it.`,
        `Од премиите, ${fmt(notCollected)} ден. сè уште не се наплатени од клиентите — ти го покриваш.`)
    : "";
}

// The paper you hand the insurer: every policy on the settlement, what it is
// for, and by which route the money reached them — grouped, because they
// reconcile the cash they received separately from the cards and transfers.
async function printSettlementList(policies, insurer, when, opts) {
  const o = opts || {};
  const groups = [
    ["cash", T("Cash collected by me — handed over now", "Кеш наплатен од мене — се предава сега")],
    ["cash_insurer", T("Cash paid to you directly", "Кеш платен директно кај вас")],
    ["card", T("Card to you", "Картичка кај вас")],
    ["bank", T("Bank transfer to you", "Банка кај вас")],
    ["unpaid", T("Not collected yet", "Сè уште ненаплатено")],
  ];
  // a policy can be split across routes, so it is listed by each amount
  const lines = [];
  for (const p of policies) {
    const pays = polPays(p);
    for (const x of pays) lines.push({ p, method: x.method || "cash", amount: parseFloat(x.amount) || 0 });
    const unpaid = policyTotal(p) - polPaid(p);
    if (unpaid > 0.005) lines.push({ p, method: "unpaid", amount: unpaid });
  }
  const money = (m) => sumBy(lines.filter((l) => l.method === m), (l) => l.amount);

  const table = (m) => {
    const rows = lines.filter((l) => l.method === m);
    if (!rows.length) return "";
    return `<div class="rp-h1">${groups.find((g) => g[0] === m)[1]}</div>
      <table class="rp-tbl">
        <tr><th>Осигуреник</th><th>Регистрација</th><th>Полиса</th><th class="r">Износ</th></tr>
        ${rows.map((l) => `<tr><td>${esc(l.p.holder_name)}</td><td>${esc(l.p.plate || "—")}</td>
          <td>${esc(l.p.policy_no || "—")}</td><td class="r">${fmt(l.amount)} ден.</td></tr>`).join("")}
        <tr><th>Вкупно</th><td></td><td></td><th class="r">${fmt(money(m))} ден.</th></tr>
      </table>`;
  };

  const premiums = sumBy(policies, policyDue);
  const commission = sumBy(policies, policyCommission);
  await printDoc(`
    <div class="rp-sub">${policies.length} полиси · ${dmy(when)}</div>
    <div class="rp-bar"><span>За плаќање (премии − провизија)</span><span>${fmt(premiums - commission)} ден.</span></div>
    <table class="rp-tbl">
      <tr><th>Вкупна вредност на полисите</th><td class="r">${fmt(sumBy(policies, policyTotal))} ден.</td></tr>
      <tr><th>Платено директно кај вас</th><td class="r">${fmt(sumBy(policies, polPaidDirect))} ден.</td></tr>
      <tr><th>Премии што ги предавам</th><td class="r">${fmt(premiums)} ден.</td></tr>
      <tr><th>Провизија</th><td class="r">${fmt(commission)} ден.</td></tr>
    </table>
    ${groups.map(([m]) => table(m)).join("")}
    ${o.note ? `<div class="rp-sub">${esc(o.note)}</div>` : ""}`,
    { brand: false, heading: `<b>Спецификација — ${esc(insurer)}</b><span>${dmy(when)}</span>` });
}

async function saveSettlement() {
  const d = settleDraft;
  if (!d || !d.picked.length) return toast(T("Nothing selected", "Ништо не е избрано"));
  const picked = state.policies.filter((p) => d.picked.includes(p.id));
  const prem = sumBy(picked, policyDue);
  const comm = sumBy(picked, policyCommission);
  const paid = $("se-date").value || todayStr();
  const note = $("se-note").value.trim() || null;
  const period = paid.slice(0, 7);
  const insurer = $("se-ins").value;
  try {
    // kept as two records so the report can still tell the two flows apart,
    // even though you settle them in one visit
    const remit = await dbq(db.from("statements").insert({
      insurer, kind: "remittance", period, amount: prem, paid_on: paid, note,
    }).select().single(), T("Not saved", "Не е зачувано"));
    const commSt = await dbq(db.from("statements").insert({
      insurer, kind: "commission", period, amount: comm, paid_on: paid, note,
    }).select().single(), T("Not saved", "Не е зачувано"));
    await dbq(db.from("policies").update({ remit_statement_id: remit.id, comm_statement_id: commSt.id })
      .in("id", d.picked), T("Policies not linked", "Полисите не се поврзани"));
  } catch { return; }
  closeSheet(); await refreshAll(["statements", "policies"]); render();
  toast(T(`${d.picked.length} policies settled`, `${d.picked.length} полиси порамнети`));
}

const stmtDueDefault = (period) => {
  const day = parseInt(setting("remit_due_day", "15")) || 15;
  const [y, m] = period.split("-").map(Number);
  const d = new Date(y, m, Math.min(day, 28));      // the month after the period
  return d.toLocaleDateString("sv-SE");
};
function stmtToggle(id, btn) {
  const i = stmtDraft.picked.indexOf(id);
  if (i >= 0) { stmtDraft.picked.splice(i, 1); btn.classList.remove("on"); btn.textContent = ""; }
  else { stmtDraft.picked.push(id); btn.classList.add("on"); btn.textContent = "✓"; }
  stmtTotals();
}
function stmtTotals() {
  const kind = stmtDraft.kind;
  const picked = state.policies.filter((p) => stmtDraft.picked.includes(p.id));
  $("st-total").textContent = fmt(sumBy(picked, (p) => kind === "remittance" ? policyDue(p) : policyCommission(p))) + " ден.";
  const fr = $("st-front");
  if (fr) fr.textContent = fmt(sumBy(picked, (p) => Math.max(0, policyDue(p) - polPaidCash(p)))) + " ден.";
}

async function settleStatement(id) {

  catch { return; }

async function unsettleStatement(id) {
  try { await dbq(db.from("statements").update({ paid_on: null }).eq("id", id), T("Not saved", "Не е зачувано")); } catch { return; }
  closeSheet(); await refreshAll(["statements"]); render();
}
async function delStatement(id) {
  const s = state.statements.find((x) => x.id === id);
  const n = stmtPolicies(s).length;
  if (!await ask(T(`Delete this statement?\n\nIts ${n} policies go back to unsettled.`,
    `Избриши го изводот?\n\nНеговите ${n} полиси се враќаат како неподмирени.`))) return;
  try { await dbq(db.from("statements").delete().eq("id", id), T("Not deleted", "Не е избришано")); } catch { return; }
  closeSheet(); await refreshAll(["statements", "policies"]); render();
}

        <div class="mono"><b>${fmt(policyTotal(p))}</b></div>
        <div class="muted" style="font-size:12px">${bal > 0.005
          ? `<span class="hflag">${fmt(bal)} ${T("left", "останува")}</span>`
          : (policyCommission(p) ? `+${fmt(policyCommission(p))}` : T("paid", "платено"))}</div>
        <div class="muted" style="font-size:11px">${polRemitted(p)
          ? (polCommPaid(p) ? T("closed", "затворена") : `<span style="color:var(--personal)">${T("commission due", "провизија следува")}</span>`)
          : `<span style="color:var(--amber)">${T("to remit", "за плаќање")}</span>`}</div></div>
    </div>`;
  }).join("") : (state.loading ? SKEL(3) : `<div class="empty">${q
      ? `${T("Nothing matches", "Ништо не одговара")} “${esc(q)}”`
      : T("No policies here.<br>Add with +", "Нема полиси.<br>Додај со +")}</div>`);
}

// A policy is usually several pages, so it carries a list. Each page keeps its
// own small thumbnail, and the full-size version is fetched only when opened.
let polPhotos = [];        // { id?, thumb, full?, isNew? }
let polRemoved = [];       // ids to delete on save
let polOpenId = null;

function renderPolImg() {
  const el = $("po-img");
  if (!el) return;
  el.innerHTML = polPhotos.length
    ? `<div class="pgrid">${polPhotos.map((p, i) => `<div class="pcell">
        <img src="${p.thumb || p.full}" alt="" role="button" tabindex="0" onclick="viewPolicyPhoto(${i})">
        <button class="pdel" onclick="event.stopPropagation();removePolicyImage(${i})"
          aria-label="${T("Remove", "Отстрани")}">✕</button>
        <span class="pnum">${i + 1}</span>
      </div>`).join("")}</div>`
    : `<p class="muted" style="font-size:12.5px">${T("No pages yet.", "Сè уште нема страници.")}</p>`;
}

function pickPolicyImage(input) {
  const files = [...(input.files || [])];
  input.value = "";
  if (!files.length) return;
  let added = 0;
  files.forEach((f) => {
    if (f.size > 12 * 1024 * 1024) return toast(T("One photo was too large", "Една слика беше преголема"));
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        // big enough to read the small print, small enough to sync
        polPhotos.push({ thumb: imgResize(im, 110, 0.6), full: imgResize(im, 1400, 0.8), isNew: true });
        added++;
        renderPolImg();
      };
      im.onerror = () => toast(T("Could not read that image", "Не можев да ја прочитам сликата"));
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}

function removePolicyImage(i) {
  const p = polPhotos[i];
  if (!p) return;
  if (p.id) polRemoved.push(p.id);       // deleted from the database on save
  polPhotos.splice(i, 1);
  renderPolImg();
}

async function viewPolicyPhoto(i) {
  const p = polPhotos[i];
  if (!p) return;
  if (!p.full && p.id) {
    try {
      const { data } = await db.from("policy_photos").select("data").eq("id", p.id).maybeSingle();
      if (data && data.data) p.full = data.data;
    } catch (e) { console.warn("policy photo", e); }
  }
  const src = p.full || p.thumb;
  const back = polOpenId;
  openSheet(`<h2>${T("Page", "Страница")} ${i + 1} ${T("of", "од")} ${polPhotos.length}</h2>
    <img src="${src}" alt="" style="width:100%;border-radius:11px;background:#ECECEC">
    ${polPhotos.length > 1 ? `<div class="grid2" style="margin-top:8px">
      <button class="btn sm ghost" style="width:100%" ${i === 0 ? "disabled" : ""}
        onclick="viewPolicyPhoto(${i - 1})">‹ ${T("Previous", "Претходна")}</button>
      <button class="btn sm ghost" style="width:100%" ${i === polPhotos.length - 1 ? "disabled" : ""}
        onclick="viewPolicyPhoto(${i + 1})">${T("Next", "Следна")} ›</button>
    </div>` : ""}
    <button class="btn ghost" onclick="window.open('${src}','_blank')">${T("Open full size", "Отвори во полна големина")}</button>
    ${back ? `<button class="btn ghost" onclick="openPolicySheet('${back}')">${T("Back to the policy", "Назад кон полисата")}</button>` : ""}`);
}

// 18% is the usual rate, so entering a price fills the commission in. Type
// your own figure and it stops guessing for that policy.
const DEFAULT_COMM_PCT = 18;
function autoComm() {
  const el = $("po-comm");
  if (el && !el.dataset.touched) {
    el.value = Math.round((parseFloat($("po-amount").value) || 0) * DEFAULT_COMM_PCT) / 100;
  }
  polCommHint();
}
function autoGcComm() {
  const el = $("po-gccomm");
  if (el && !el.dataset.touched) {
    el.value = Math.round((parseFloat($("po-gcprice").value) || 0) * DEFAULT_COMM_PCT) / 100;
  }
  polCommHint();
}
function setComm(pct) {
  const el = $("po-comm");
  el.value = Math.round((parseFloat($("po-amount").value) || 0) * pct) / 100;
  el.dataset.touched = "1";                      // an explicit choice
  polCommHint();
}
function setGcComm(pct) {
  const el = $("po-gccomm");
  el.value = Math.round((parseFloat($("po-gcprice").value) || 0) * pct) / 100;
  el.dataset.touched = "1";
  polCommHint();
}
// what the client pays in total: the policy plus the green card on it
function sheetTotal() {
  const amt = parseFloat(($("po-amount") || {}).value) || 0;
  const gc = ($("po-gc") && $("po-gc").classList.contains("on"))
    ? (parseFloat(($("po-gcprice") || {}).value) || 0) : 0;
  return amt + gc;
}
function polCommHint() {
  const el = $("po-comm-hint");
  if (!el) return;
  const total = sheetTotal();
  const comm = (parseFloat($("po-comm").value) || 0)
    + (($("po-gc") && $("po-gc").classList.contains("on")) ? (parseFloat(($("po-gccomm") || {}).value) || 0) : 0);
  const auto = $("po-comm") && !$("po-comm").dataset.touched;
  el.textContent = (total ? `${T("sale", "продажба")} ${fmt(total)}` : "")
    + (comm ? ` · ${T("you earn", "заработуваш")} ${fmt(comm)}` : "")
    + (total && comm ? ` (${Math.round((comm / total) * 1000) / 10}%)` : "")
    + (auto && comm ? ` · ${T("default", "стандардно")} ${DEFAULT_COMM_PCT}%` : "");
}
function gcToggle() {
  const on = $("po-gc").classList.contains("on");
  $("po-gc-fields").style.display = on ? "block" : "none";
  if (on) autoGcComm();
  polCommHint();
  // a green card is usually a month — offer that rather than leave it blank
  if (on && !$("po-gcend").value) {
    const start = $("po-start").value || todayStr();
    const d = new Date(start + "T12:00");
    d.setMonth(d.getMonth() + 1);
    $("po-gcend").value = d.toLocaleDateString("sv-SE");
  }
}
function pickKind(btn) {
  [...$("po-kind").querySelectorAll(".chip")].forEach((b) => b.classList.toggle("on", b === btn));
}
