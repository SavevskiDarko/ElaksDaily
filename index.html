<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centrala</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A5F">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=cyrillic-ext" rel="stylesheet">
<style>
:root{
  --navy:#1E3A5F; --navy-deep:#152A46; --amber:#F5B301; --paper:#F7F8FA;
  --card:#FFFFFF; --ink:#23272E; --muted:#6B7280; --line:#E5E8EC;
  --work:#4C6EF5; --elaks:#1E3A5F; --personal:#2F9E68; --apts:#7E5BC0; --danger:#D6455D; --danger-bg:#FBE9EC;
  --r:14px; --pad:16px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;display:flex;align-items:baseline;gap:10px}
.topbar h1{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em}
.topbar img{width:22px;height:22px;border-radius:6px;flex:none;align-self:center}
.topbar .date{margin-left:auto;font-size:12.5px;opacity:.75;font-family:var(--mono)}

/* ---- tab bar ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--navy-deep);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:9px 0 7px;color:#8DA2BC;font-family:var(--cond);font-weight:600;
  font-size:12px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .led{width:5px;height:5px;border-radius:50%;background:transparent}
.tabbar button{position:relative}
.tabbar button.on{color:#fff}
.bdg{position:absolute;top:3px;right:calc(50% - 24px);background:var(--amber);color:var(--navy-deep);font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px;display:none}
.bdg.on{display:block}
.tabbar button.on .led{background:var(--amber);box-shadow:0 0 6px var(--amber)}

/* ---- generic ---- */
.view{display:none;padding:var(--pad);padding-bottom:calc(var(--pad) + 80px)}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.led.work{background:var(--work)} .led.elaks{background:var(--elaks)} .led.personal{background:var(--personal)} .led.apts{background:var(--apts)}
.led.ok{background:var(--personal)} .led.low{background:var(--amber);box-shadow:0 0 5px var(--amber)}
.led.out{background:var(--danger);box-shadow:0 0 5px var(--danger)}
.led.draft{background:#9AA4B2} .led.sent{background:var(--work)} .led.accepted{background:var(--personal)} .led.rejected{background:var(--danger)}
.sec{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:10px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{background:var(--navy);color:#fff;border-radius:11px;padding:12px 16px;font-weight:600;width:100%;margin-top:14px}
.btn.amber{background:var(--amber);color:var(--navy-deep)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger)}
.btn.sm{width:auto;padding:8px 13px;margin:0;font-size:13.5px;border-radius:9px}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:19;
  width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--navy-deep);
  font-size:30px;font-weight:600;box-shadow:0 4px 14px rgba(30,58,95,.35);display:none;align-items:center;justify-content:center;line-height:1}
.fab.on{display:flex}
.mic{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:19;
  width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;
  box-shadow:0 4px 14px rgba(30,58,95,.35);display:none;align-items:center;justify-content:center}
.mic.beside{right:86px;bottom:calc(74px + env(safe-area-inset-bottom))}
.mic.on{display:flex}
.mic.rec{background:var(--danger);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.vbig{font-size:19px;line-height:1.45;min-height:96px;margin:14px 0;color:var(--ink)}
.vbig .dim{color:var(--muted)}
.vhint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}

/* ---- sheet ---- */
.overlay{position:fixed;inset:0;background:rgba(21,42,70,.45);z-index:30;display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);
  border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:0 var(--pad) calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;display:none}
.sheet.on{display:block;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{font-family:var(--cond);font-weight:700;font-size:17px;margin-bottom:4px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-top{position:sticky;top:0;z-index:3;background:var(--paper);touch-action:none;
  margin:0 calc(var(--pad) * -1) 10px;padding:12px var(--pad) 10px;border-radius:18px 18px 0 0}
.sheet-x{position:absolute;right:10px;top:6px;width:31px;height:31px;border-radius:50%;
  background:var(--line);color:var(--muted);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.sheet-x:active{opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---- tasks ---- */
.task{display:flex;align-items:center;gap:11px}
.task .tick{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.task.done .tick{background:var(--personal);border-color:var(--personal)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.task .t-title{flex:1;font-weight:500}
.task .t-time{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.task .rec{font-size:11px;color:var(--muted)}
.who{background:var(--line);color:var(--muted);border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:700;flex:none}
.clbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.clbox.on{background:var(--personal);border-color:var(--personal)}

/* ---- inventory ---- */
.art{display:flex;align-items:center;gap:11px}
.art .a-name{flex:1;min-width:0}
.art .a-name b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .a-name span{font-size:12px;color:var(--muted)}
.art .a-qty{font-family:var(--mono);font-weight:600;font-size:16px;text-align:right}
.art .a-qty small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;flex:none;background:#ECECEC}
.thumb-lg{width:100%;max-height:210px;object-fit:contain;border-radius:11px;background:#ECECEC;margin-top:10px}
.mov{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.mov:last-child{border:0}

/* ---- offers ---- */
.offer .o-num{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.offer .o-total{font-family:var(--mono);font-weight:600;white-space:nowrap}
.oitem{display:grid;grid-template-columns:1fr 58px 74px 74px 28px;gap:6px;align-items:center;margin-bottom:6px;font-size:13.5px}
.oitem input{padding:7px 8px;font-size:14px}
.oitem .del{color:var(--danger);font-size:18px;text-align:center}
.ohead{display:grid;grid-template-columns:1fr 58px 74px 74px 28px;gap:6px;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px}
.totalbar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;
  border-radius:11px;padding:11px 14px;margin-top:10px;font-weight:600}
.totalbar .mono{color:var(--amber);font-size:17px}

/* ---- login ---- */
#login{max-width:360px;margin:16vh auto 0;padding:0 var(--pad)}
#login .logo{width:64px;height:64px;border-radius:16px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--navy-deep);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.search{margin-bottom:10px}
#loadbar{background:var(--danger-bg);color:var(--danger);padding:9px 14px;font-size:13px;display:flex;
  align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#loadbar button{font-weight:700;text-decoration:underline;flex:none}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hcard h3{font-family:var(--cond);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;gap:10px;flex-wrap:wrap}
.hrow > :first-child{flex:0 0 auto;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow > :last-child{margin-left:auto;white-space:nowrap;text-align:right}
.hsub{font-size:12.5px;color:var(--muted);line-height:1.5;margin:2px 0 4px}
.hsub b{color:var(--ink);font-weight:600}
.hnote{font-size:12px;color:var(--muted);text-align:right;margin:-2px 0 4px}
.hnote.warn{color:var(--danger)}
.htxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick.sm{width:21px;height:21px;border-radius:7px;font-size:12px}
.setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;margin-bottom:8px;cursor:pointer}
.setrow:active{opacity:.65}
.setrow .ico{width:34px;height:34px;border-radius:10px;background:var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.setrow .txt{flex:1;min-width:0}
.setrow .txt b{display:block;font-size:15px}
.setrow .txt span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.setrow .chev{color:var(--muted);font-size:18px;flex:none}
.setgrp{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:35;
  background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;display:none;
  align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 18px rgba(30,58,95,.4)}
.updbar.on{display:flex}
.updbar button{background:var(--amber);color:var(--navy-deep);border-radius:9px;padding:7px 14px;font-weight:700}
.hrow b{font-family:var(--mono)}
.hbig{font-size:26px;font-weight:700;font-family:var(--cond)}
.hflag{color:var(--danger);font-weight:600}
.skel{height:58px;border-radius:var(--r);margin-bottom:10px;
  background:linear-gradient(90deg,var(--line) 25%,var(--card) 37%,var(--line) 63%);
  background-size:400% 100%;animation:shim 1.3s ease-in-out infinite}
.skel.tall{height:104px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.mov.tapp{cursor:pointer}
.sec.tapp{cursor:pointer;display:flex;align-items:center;gap:6px}
.sec.tapp:active{opacity:.6}
.mov.tapp:active{opacity:.6}
.bankrow{justify-content:space-between;align-items:baseline;margin-top:7px}
.nw{white-space:nowrap}
.calc{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.hok{color:var(--personal);font-weight:600}
.cal-apt{font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.cal-head span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.cal-head span.we{color:var(--ink)}
.cal-d{aspect-ratio:1/1;border-radius:9px;background:var(--line);color:var(--muted);
  font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.1;padding:0;min-height:38px}
.cal-d.bk{background:var(--personal);color:#fff}
.cal-d.pad{background:transparent;pointer-events:none}
.cal-d.now{box-shadow:inset 0 0 0 2px var(--amber)}
.cal-d small{font-size:9.5px;font-weight:700;opacity:.95}

/* ---- printable offer (PDF) ---- */
#printroot{display:none}
@media print{
  body{background:#fff;padding:0}
  body > *:not(#printroot){display:none !important}
  #printroot{display:block !important}
  @page{size:A4;margin:12mm 10mm}
}
.pv{font-family:Arial,Helvetica,sans-serif;color:#232323;font-size:9.5pt;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.pv-top{width:100%;border-collapse:collapse;margin-bottom:6mm}
.pv-top td{vertical-align:top}
.pv-top td.r{text-align:right;width:42mm}
.pv-num{font-size:13pt;font-weight:700;padding-top:4mm}
.pv-num u{color:#1F3864;text-decoration:underline;margin-left:4mm}
.pv-logo{width:39mm;height:auto}
.pv-banner{width:125mm;height:auto;display:block}
.pv-client{font-size:12pt;font-weight:700;color:#1F3864;margin:3mm 0 3mm 5mm}
.pv-fields{border-collapse:collapse;margin:0 0 8mm 5mm;font-size:9.5pt}
.pv-fields td{padding:1.1mm 0;vertical-align:top}
.pv-fields td:first-child{width:32mm;color:#232323}
.pv-items{width:100%;border-collapse:separate;border-spacing:1.2mm 1.2mm;table-layout:fixed}
.pv-items th{font-weight:400;color:#252525;font-size:10pt;padding:1mm 0;text-align:center}
.pv-items td{background:#ECECEC;padding:2.4mm 2mm;vertical-align:middle;font-size:9pt}
.pv-items td.c{text-align:center}
.pv-items td.b{font-weight:700}
.pv-items td img{max-width:100%;max-height:26mm;display:block;margin:0 auto}
.pv-items .sp{margin-top:1.5mm;line-height:1.35}
.pv-total{background:#2462AC !important;color:#fff;font-weight:700;font-size:11pt;padding:3mm 4mm !important;text-align:left}
.pv-note{color:#C00000;font-weight:700;text-align:center;margin:6mm 0 2mm}
.pv-valid{color:#C00000;font-weight:700;text-align:center;margin-bottom:8mm}
.pv-footer{display:block;margin:10mm auto 0;width:57mm;height:auto}
.pv-items tr{page-break-inside:avoid}
.rp-h1{font-size:13pt;font-weight:700;margin:0 0 1mm}
.rp-sub{color:#555;font-size:9.5pt;margin-bottom:6mm}
.rp-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:6mm}
.rp-tbl th{text-align:left;border-bottom:1px solid #8a8a8a;padding:1.8mm 1mm;font-weight:700}
.rp-tbl td{border-bottom:1px solid #dcdcdc;padding:1.8mm 1mm}
.rp-tbl th.r,.rp-tbl td.r{text-align:right}
.rp-bar{background:#2462AC !important;color:#fff;font-weight:700;padding:2.6mm 3mm;font-size:10.5pt;
  display:flex;justify-content:space-between;margin-bottom:6mm}
@media (prefers-color-scheme: dark){
  :root{--paper:#12161C;--card:#1A202A;--ink:#E7EAF0;--line:#2A3242;--muted:#95A1B5;--danger-bg:#3A1B22}
  .chip{background:var(--card);color:var(--ink)}
  input,select,textarea{background:var(--card);color:var(--ink)}
  .btn.ghost{background:var(--card);color:var(--ink)}
  .task .tick{border-color:#39424F}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" style="display:none">
  <img src="icon-192.png?v=3" class="logo" alt="">
  <h1 style="font-family:var(--cond);font-size:24px;margin-bottom:2px">Centrala</h1>
  <p class="muted" style="margin-bottom:18px">Tasks · Stock · Offers</p>
  <label>Email</label><input id="lg-email" type="email" autocomplete="username">
  <label>Password</label><input id="lg-pass" type="password" autocomplete="current-password">
  <button class="btn" onclick="login()">Sign in</button>
  <p id="lg-err" class="muted" style="color:var(--danger);margin-top:10px"></p>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">
  <div class="topbar"><img src="icon-192.png?v=3" alt=""><h1 id="bar-title">Home</h1><span class="date" id="bar-date"></span></div>
  <div id="loadbar" style="display:none"><span id="loadmsg">Could not load data.</span><button onclick="retryLoad()">Retry</button></div>

  <!-- HOME -->
  <div class="view on" id="v-home"><div id="home-body"></div></div>

  <!-- TODAY -->
  <div class="view" id="v-today">
    <input class="search" id="tk-search" placeholder="Search tasks…" oninput="renderToday()">
    <div class="chips" id="ctx-filter" style="margin-bottom:12px"></div>
    <div id="today-list"></div>
    <button class="btn sm ghost" style="margin:2px 0 14px" onclick="openHistory()">Completed tasks →</button>
    <div id="week-list"></div>
  </div>

  <!-- ELAKS BUSINESS -->
  <div class="view" id="v-elaks">
    <div class="chips" id="elaks-tabs" style="margin-bottom:12px"></div>
    <div id="el-body-inv">
      <input class="search" id="inv-search" placeholder="Search article…" oninput="renderInv()">
      <div class="chips" id="cat-filter" style="margin-bottom:12px"></div>
      <div id="inv-list"></div>
    </div>
    <div id="el-body-off" style="display:none">
      <input class="search" id="off-search" placeholder="Search offers…" oninput="renderOffers()">
      <div class="chips" id="off-filter" style="margin-bottom:12px"></div>
      <div id="off-list"></div>
    </div>
    <div id="el-body-pur" style="display:none">
      <input class="search" id="pur-list-search" placeholder="Search supplier or document…" oninput="renderPurchases()">
      <div id="pur-summary"></div>
      <div id="pur-list"></div>
    </div>
    <div id="el-body-cli" style="display:none">
      <div id="cli-list"></div>
      <button class="btn ghost" onclick="openClientSheet()">+ New client</button>
    </div>
  </div>

  <!-- APARTMENTS -->
  <div class="view" id="v-apt">
    <div id="apt-bank"></div>
    <div class="chips" id="apt-tabs" style="margin-bottom:12px"></div>
    <div id="apt-body"></div>
  </div>

  <!-- SETTINGS -->
  <div class="view" id="v-set">
    <div id="set-menu"></div>
  </div>

  <div class="updbar" id="updbar"><span>A newer version is ready</span>
    <button onclick="location.reload()">Reload</button></div>

const recurDays = (t) => (t.recur_days && t.recur_days.length) ? t.recur_days
  : (t.recur_dow !== null && t.recur_dow !== undefined ? [t.recur_dow] : []);
// Monday-based week number since the epoch, so "every 2 weeks" stays stable.
const weekIndex = (ds) => Math.floor((Date.parse(ds + "T12:00") / 86400000 + 3) / 7);
const lastDayOfMonth = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

function occursOn(t, dateStr) {
  if (!t.recurrence) return t.due_date === dateStr;
  const from = t.recur_from || t.due_date || null;
  if (from && dateStr < from) return false;                    // not started yet
  if (t.recur_until && dateStr > t.recur_until) return false;  // finished
  const d = new Date(dateStr + "T12:00");
  const every = Math.max(1, parseInt(t.recur_every) || 1);

  if (t.recurrence === "daily") {
    if (every === 1 || !from) return true;
    const days = Math.round((Date.parse(dateStr + "T12:00") - Date.parse(from + "T12:00")) / 86400000);
    return days >= 0 && days % every === 0;
  }
  if (t.recurrence === "weekly") {
    if (!recurDays(t).includes(d.getDay())) return false;
    if (every === 1 || !from) return true;
    return (weekIndex(dateStr) - weekIndex(from)) % every === 0;
  }
  if (t.recurrence === "monthly") {
    // a task set for the 31st still fires on the 30th, 29th or 28th
    const target = Math.min(t.recur_dom || 1, lastDayOfMonth(d));
    if (d.getDate() !== target) return false;
    if (every === 1 || !from) return true;
    const f = new Date(from + "T12:00");
    const months = (d.getFullYear() - f.getFullYear()) * 12 + (d.getMonth() - f.getMonth());
    return months >= 0 && months % every === 0;
  }
  return false;
}

const taskInScope = (t, ctx) =>
  (!state.mineOnly || t.assigned_to === state.uid || !t.assigned_to)
  && (!ctx || ctx === "all" || t.context === ctx);

// One rule for what needs attention, read by Home, the Tasks tab and the badge,
// so the three can never disagree about how much is late or due.
function taskBuckets(today, ctx) {
  const overdue = [], missed = [], todays = [], undated = [], doneToday = [];
  for (const t of state.tasks) {
    if (!taskInScope(t, ctx)) continue;
    if (t.recurrence) {
      const m = missedDates(t, today, MISS_LOOKBACK);
      if (m.length) missed.push({ t, dates: m });
    } else if (!t.done && t.due_date && t.due_date < today) overdue.push(t);
    else if (!t.done && !t.due_date) undated.push(t);
    if (occursOn(t, today) && !isDoneOn(t, today)) todays.push(t);
    // finished today: a recurring occurrence ticked for today, or a one-off
    // whose completion was recorded today (whatever day it was due)
    if (t.recurrence ? isDoneOn(t, today) : (t.done && t.last_done === today)) doneToday.push(t);
  }
  const ids = new Set([...overdue, ...todays].map((t) => t.id).concat(missed.map((m) => m.t.id)));
  return { overdue, missed, todays, undated, doneToday, late: overdue.length + missed.length, attention: ids.size };
}

// Occurrences in the recent past that were never ticked off.
function missedDates(t, today, lookback = 30) {
  if (!t.recurrence) return [];
  const out = [];
  const d = new Date(today + "T12:00");
  for (let i = 1; i <= lookback; i++) {
    d.setDate(d.getDate() - 1);
    const ds = d.toLocaleDateString("sv-SE");
    if (occursOn(t, ds) && !isDoneOn(t, ds)) out.push(ds);
    if (out.length >= 5) break;
  }
  return out;
}
function isDoneOn(t, dateStr) {
  if (!t.recurrence) return !!t.done;
  return state.doneSet.has(t.id + ":" + dateStr) || t.last_done === dateStr;
}

// Says what is actually filtering, and offers the way out.
function emptyToday() {
  const bits = [];
  if (state.ctxFilter && state.ctxFilter !== "all") bits.push(CTX[state.ctxFilter]);
  if (state.mineOnly) bits.push("assigned to you");
  if (!bits.length) return '<div class="empty">No tasks for today.<br>Add with + or the microphone</div>';
  return `<div class="empty">Nothing in ${bits.join(" · ")} today.<br>
    <button class="btn sm ghost" style="margin-top:10px;display:inline-flex;width:auto"
      onclick="state.ctxFilter='all';state.mineOnly=false;renderToday()">Show everything</button></div>`;
}
function renderCtxChips() {
  $("ctx-filter").innerHTML = (myCtx().length > 1 ? ["all", ...myCtx()] : []).map((c) =>
    `<button class="chip ${state.ctxFilter === c ? "on" : ""}" onclick="state.ctxFilter='${c}';renderToday()">${c === "all" ? "All" : CTX[c]}</button>`).join("")
    + `<button class="chip ${state.mineOnly ? "on" : ""}" onclick="state.mineOnly=!state.mineOnly;renderToday()">Mine</button>`;
}
// A search result needs its date and, if finished, when — the plain row shows neither.
const searchRow = (today) => (t) => {
  const done = !t.recurrence && t.done;
  const when = done ? "done " + dmy(t.last_done)
    : t.recurrence ? "repeats"
    : t.due_date ? dmy(t.due_date) : "no date";
  return `<div class="card task ${done ? "done" : ""}">
    <button class="tick" onclick="toggleTask('${t.id}')" aria-label="done">${done ? "✓" : ""}</button>
    <span class="led ${t.context}"></span>
    <span class="t-title" onclick="openTaskSheet('${t.id}')">${t.priority ? '<span style="color:var(--amber)">★ </span>' : ""}${esc(t.title)}</span>
    <span class="t-time">${when}</span>
  </div>`;
};
function renderToday() {
  const today = todayStr();
  const q = (($("tk-search") || {}).value || "").trim().toLowerCase();
  renderCtxChips();
  if (q) {
    const hits = state.tasks.filter((t) => taskInScope(t, state.ctxFilter) && (
      (t.title || "").toLowerCase().includes(q) || (t.notes || "").toLowerCase().includes(q) ||
      (t.checklist || []).some((c) => (c.text || "").toLowerCase().includes(q))));
    const open = hits.filter((t) => !isDoneOn(t, today) || t.recurrence);
    const done = hits.filter((t) => !t.recurrence && t.done);
    $("today-list").innerHTML = hits.length
      ? `<div class="sec tapp" onclick="$('tk-search').value='';renderToday()">
           ${hits.length} result${hits.length > 1 ? "s" : ""} <span class="muted" style="font-weight:400">· clear ✕</span></div>`
        + open.map(searchRow(today)).join("")
        + (done.length ? '<div class="sec">Completed</div>' + done.map(searchRow(today)).join("") : "")
      : `<div class="empty">Nothing found for "${esc(q)}"${state.ctxFilter !== "all" || state.mineOnly ? " with these filters" : ""}.<br>
          <button class="btn sm ghost" style="margin-top:10px;display:inline-flex;width:auto"
            onclick="$('tk-search').value='';state.ctxFilter='all';state.mineOnly=false;renderToday()">Clear search and filters</button></div>`;
    $("week-list").innerHTML = "";
    return;
  }
  const vis = (t) => taskInScope(t, state.ctxFilter);
  const byPrio = (a, b) => (b.priority ? 1 : 0) - (a.priority ? 1 : 0);
  const B = taskBuckets(today, state.ctxFilter);
  const overdue = B.overdue.slice().sort(byPrio);
  const missed = B.missed;
  const todays = B.todays.slice().sort(byPrio);
  const inbox = B.undated;
  let html = "";
  if (overdue.length || missed.length) {
    html += '<div class="sec" style="color:var(--danger)">Overdue</div>' + overdue.map(taskRow(today)).join("");
    html += missed.map(({ t, dates }) => `<div class="card task">
      <button class="tick" onclick="toggleTask('${t.id}','${dates[0]}')" aria-label="done"></button>
      <span class="led ${t.context}"></span>
      <span class="t-title" onclick="openTaskSheet('${t.id}')">${esc(t.title)}
        <span class="rec"> missed ${dmy(dates[0])}${dates.length > 1 ? ` +${dates.length - 1}` : ""}</span></span>
    </div>`).join("");
  }
  if (inbox.length) html += '<div class="sec">No date</div>' + inbox.map(taskRow(today)).join("");
  if (todays.length) {
    html += (overdue.length || missed.length || inbox.length) ? '<div class="sec">Today</div>' : "";
    html += todays.map(taskRow(today)).join("");
  } else if (!overdue.length && !missed.length && !inbox.length) {
    html += state.loading ? SKEL() : emptyToday();
  }
  if (B.doneToday.length) {
    html += `<div class="sec tapp" onclick="state.showDone=!state.showDone;renderToday()">
      Done today · ${B.doneToday.length} <span class="muted" style="font-weight:400">${state.showDone ? "▾" : "▸"}</span></div>`;
    if (state.showDone) html += B.doneToday.map(taskRow(today)).join("");
  }
  $("today-list").innerHTML = html;

  // forward view
  const horizon = state.horizon || 7;
  let week = `<div class="chips" style="margin-bottom:8px">
    ${[7, 30].map((n) => `<button class="chip ${horizon === n ? "on" : ""}" onclick="state.horizon=${n};renderToday()">Next ${n} days</button>`).join("")}
  </div>`;
  for (let i = 1; i <= horizon; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const ds = d.toLocaleDateString("sv-SE");
    const list = state.tasks.filter((t) => vis(t) && occursOn(t, ds));
    if (!list.length) continue;
    week += `<div class="sec">${wd(d, "long")} · ${dmy(d)}</div>` +
      list.sort(byPrio).map((t) => `<div class="card task ${isDoneOn(t, ds) ? "done" : ""}">
        <button class="tick" onclick="toggleTask('${t.id}','${ds}')" aria-label="done">${isDoneOn(t, ds) ? "✓" : ""}</button>
        <span class="led ${t.context}"></span>
        <span class="t-title" onclick="openTaskSheet('${t.id}')">${esc(t.title)}</span>
        ${t.due_time ? `<span class="t-time">${t.due_time.slice(0, 5)}</span>` : ""}</div>`).join("");
  }
  // Everything beyond the forward window — a check-in three weeks away used
  // to be invisible here, which made it look as if no task had been created.
  const horizonEnd = (() => { const d = new Date(); d.setDate(d.getDate() + horizon); return d.toLocaleDateString("sv-SE"); })();
  const later = state.tasks
    .filter((t) => vis(t) && !t.recurrence && !t.done && t.due_date && t.due_date > horizonEnd)
    .sort((a, b) => a.due_date.localeCompare(b.due_date));
  if (later.length) {
    week += `<div class="sec">Later · ${later.length}</div>` + later.slice(0, 40).map((t) => `<div class="card task">
      <button class="tick" onclick="toggleTask('${t.id}','${t.due_date}')" aria-label="done"></button>
      <span class="led ${t.context}"></span>
      <span class="t-title" onclick="openTaskSheet('${t.id}')">${t.priority ? '<span style="color:var(--amber)">★ </span>' : ""}${esc(t.title)}</span>
      <span class="t-time">${dmy(t.due_date)}</span>
    </div>`).join("");
  }
  if (!week.includes("class=\"sec\"")) week += '<div class="empty">Nothing scheduled.</div>';
  $("week-list").innerHTML = week;
}
const taskRow = (today) => (t) => {
  const done = isDoneOn(t, today);
  return `<div class="card task ${done ? "done" : ""}">
    <button class="tick" onclick="toggleTask('${t.id}')" aria-label="done">${done ? "✓" : ""}</button>
    <span class="led ${t.context}"></span>
    <span class="t-title" onclick="openTaskSheet('${t.id}')">${t.priority ? '<span style="color:var(--amber)">★ </span>' : ""}${esc(t.title)}
      ${t.recurrence ? `<span class="rec"> ↻${t.recurrence === "weekly" && recurDays(t).length > 1
        ? " " + recurDays(t).map((i) => ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"][i]).join("") : ""}</span>` : ""}${t.checklist && t.checklist.length ? `<span class="rec"> ☑ ${t.checklist.filter((x) => x.done).length}/${t.checklist.length}</span>` : ""}</span>
    ${t.photo_thumb ? `<img class="thumb" style="width:30px;height:30px" src="${t.photo_thumb}" alt="">` : ""}
    ${t.assigned_to ? `<span class="who">${initials(personName(t.assigned_to))}</span>` : ""}
    ${t.due_time ? `<span class="t-time">${t.due_time.slice(0, 5)}</span>` : ""}
  </div>`;
};
async function toggleTask(id, onDate) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  const day = onDate || todayStr();
  const was = isDoneOn(t, day);
  const upd = t.recurrence
    ? { last_done: was ? null : day }
    : { done: !was, last_done: !was ? day : null };
  try {
    await dbq(db.from("tasks").update(upd).eq("id", id), "Not updated");
    if (was) {
      const r = await db.from("task_completions").delete().eq("task_id", id).eq("done_on", day);
      if (r.error) { console.error(r.error); toast("Could not un-tick that day"); return; }
      state.doneSet.delete(id + ":" + day);
    } else {
      const r = await db.from("task_completions").upsert({ task_id: id, done_on: day, done_by: state.uid }, { onConflict: "task_id,done_on" });
      if (r.error) { console.error(r.error); toast("Could not record that day"); return; }
      state.doneSet.add(id + ":" + day);
    }
  } catch { return; }
  Object.assign(t, upd); render();
}

function pickTaskImage(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (f.size > 12 * 1024 * 1024) return toast("Photo too large");
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => { tkImg = { mode: "new", thumb: imgResize(im, 72, 0.6), full: imgResize(im, 900, 0.75) }; renderTkImg(); };
    im.onerror = () => toast("Could not read that image");
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}

  tkImg = { mode: "remove", thumb: null, full: null };
  const f = $("tk-img-file"); if (f) f.value = "";
  renderTkImg();
}

function openHistory() {
  const rows = [];
  for (const t of state.tasks) {
    if (!t.recurrence) { if (t.done) rows.push({ t, on: t.last_done || "" }); continue; }
    for (const c of state.completions) if (c.task_id === t.id) rows.push({ t, on: c.done_on, rec: true });
  }
  rows.sort((a, b) => (b.on || "").localeCompare(a.on || ""));
  const done = rows;
  const fmtD = (d) => d ? wd(d) + " " + dmy(d) : "Earlier";
  let html = `<h2>Completed tasks</h2>`;
  if (!done.length) html += '<p class="muted">Nothing completed yet.</p>';
  let lastD = null;
  for (const r of done.slice(0, 300)) {
    const t = r.t;
    if (r.on !== lastD) { html += `<div class="sec">${fmtD(r.on)}</div>`; lastD = r.on; }
    html += `<div class="card task done">
      <span class="led ${t.context}"></span>
      <span class="t-title">${esc(t.title)}${r.rec ? '<span class="rec"> ↻</span>' : ""}</span>

      <button style="color:var(--danger);font-size:17px;padding:4px" onclick="histDelTask('${t.id}')" aria-label="delete">✕</button>`}
    </div>`;
  }
  openSheet(html);
}

const PHOTO_MATTE = "#ECECEC";   // matches the offer table cells (docx + PDF)

function imgHasAlpha(im) {
  try {
    const w = Math.max(1, Math.min(160, im.naturalWidth));
    const h = Math.max(1, Math.round(im.naturalHeight * w / im.naturalWidth));
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.drawImage(im, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
  } catch (e) { console.warn("alpha check", e); }
  return false;
}

// Transparent artwork stays transparent (PNG) so it blends into the offer cells.
// Opaque photos stay JPEG. Oversized PNGs fall back to a matte on the cell colour.
function imgResize(im, max, q) {
  const scale = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(im.naturalWidth * scale));
  c.height = Math.max(1, Math.round(im.naturalHeight * scale));
  const ctx = c.getContext("2d");
  if (imgHasAlpha(im)) {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(im, 0, 0, c.width, c.height);
    const png = c.toDataURL("image/png");
    if (png.length < 480000) return png;      // ~350 KB of image data
  }
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = PHOTO_MATTE;
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
function pickArticleImage(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (f.size > 12 * 1024 * 1024) return toast("Photo too large");

  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      arImg = { mode: "new", thumb: imgResize(im, 72, 0.6), full: imgResize(im, 700, 0.75) };
      renderArImg();
    };
    im.onerror = () => toast("Could not read that image");
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}

// Cost is snapshotted on the item when it is added, so changing a supplier
// price later never rewrites the profit on offers already made.
function itemCost(it) {
  if (it.free) return 0;
  if (it.cost !== undefined && it.cost !== null) return parseFloat(it.cost) || 0;
  const a = state.stock.find((x) => x.id === it.article_id);
  return a ? (parseFloat(a.purchase_price) || 0) : 0;
}
// The rate is snapshotted with the item; labour and manual rows are standard 18%.
function itemVat(it) {
  if (it.vat !== undefined && it.vat !== null) return parseFloat(it.vat) || 0;
  const a = state.stock.find((x) => x.id === it.article_id);
  return a && a.vat_rate !== undefined && a.vat_rate !== null ? (parseFloat(a.vat_rate) || 0) : 18;
}
// ДДВ is collected for the state, never income — so profit works on net figures.
function itemProfit(it) {
  const t = itemTotal(it);
  if (t === null) return null;                       // meters not measured yet
  const r = itemVat(it);
  const q = it.free ? 0 : (it.unit === "m" ? (it.consumed || 0) : (it.qty || 0));
  return netOf(t, r) - netOf(itemCost(it) * q, r);
}
// { gross, net, vat, byRate: { 18: amount, 5: amount } } — per-meter rows are skipped
function vatBreakdown(items) {
  const byRate = {}; let gross = 0, net = 0;
  for (const it of items || []) {
    const t = itemTotal(it);
    if (t === null) continue;
    const r = itemVat(it);
    const n = netOf(t, r);
    gross += t; net += n;
    byRate[r] = (byRate[r] || 0) + (t - n);
  }
  return { gross, net, vat: gross - net, byRate };
}
function profitOf(items) {
  let value = 0, pending = false;
  for (const it of items || []) {
    const p = itemProfit(it);
    if (p === null) pending = true; else value += p;
  }
  return { value, pending };
}
function itemTotal(it) {
  if (it.unit === "m") return it.consumed ? it.consumed * (it.price || 0) : null; // measured after install
  if (it.free) return it.price || 0;
  return (it.qty || 0) * (it.price || 0);
}

// Puts real pictures where the template left «IMG:n» markers.
// Done by hand so the document pipeline owns no third-party image library.
function dataUrlToBytes(dataUrl) {
  const bin = atob(dataUrl.split(",")[1] || "");
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function drawingXml(rid, wPx, hPx, id) {
  const cx = Math.round(wPx * 9525), cy = Math.round(hPx * 9525);   // px -> EMU
  const A = "http://schemas.openxmlformats.org/drawingml/2006/main";
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">` +
    `<wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/>` +
    `<wp:docPr id="${5000 + id}" name="Photo ${id}"/>` +
    `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="${A}" noChangeAspect="1"/></wp:cNvGraphicFramePr>` +
    `<a:graphic xmlns:a="${A}"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:nvPicPr><pic:cNvPr id="${id}" name="Photo ${id}"/><pic:cNvPicPr/></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>` +
    `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
    `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
function insertPictures(zip, photos) {
  let xml = zip.file("word/document.xml").asText();
  if (xml.indexOf("«IMG:") === -1) return;
  const relsPath = "word/_rels/document.xml.rels";
  let rels = zip.file(relsPath).asText();
  let n = 0;
  xml = xml.replace(/<w:r(?:>| [^>]*>)(?:(?!<\/w:r>).)*?«IMG:(\d+)»(?:(?!<\/w:r>).)*?<\/w:r>/g, (run, idxStr) => {
    const p = photos[parseInt(idxStr)];
    if (!p) return "";
    n++;
    const isPng = p.dataUrl.startsWith("data:image/png");
    const name = `photo${n}.${isPng ? "png" : "jpeg"}`;
    const rid = `rIdPhoto${n}`;
    zip.file("word/media/" + name, dataUrlToBytes(p.dataUrl), { binary: true });
    rels = rels.replace("</Relationships>",
      `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${name}"/></Relationships>`);
    return drawingXml(rid, p.w, p.h, n);
  });
  xml = xml.replace(/«IMG:\d+»/g, "");   // safety net
  zip.file("word/document.xml", xml);
  zip.file(relsPath, rels);
}

  const cashOut = cash.reduce((s, e) => s + Math.min(0, parseFloat(e.amount) || 0), 0);
  const settled = state.offers.filter((o) => offerSettled(o) && (o.paid_at || "").slice(0, 7) === mo);
  const profit = settled.reduce((s, o) => s + profitOf(o.items).value, 0);
  const vatOut = settled.reduce((s, o) => s + vatBreakdown(o.items).vat, 0);
  const netOut = settled.reduce((s, o) => s + vatBreakdown(o.items).net, 0);
  const agg = {};
  for (const mv of movs) agg[mv.article_id] = (agg[mv.article_id] || 0) + (parseFloat(mv.qty) || 0);
  const top = Object.entries(agg).map(([aid, q]) => {
    const a = state.stock.find((x) => x.id === aid);
    return { name: a ? a.name : "(removed article)", qty: q, unit: a ? unitLbl(a.unit) : "" };
  }).sort((a, b) => b.qty - a.qty).slice(0, 8);
  const owed = state.offers.filter((o) => o.status === "accepted" && offerBalance(o) > 0.005);
  const buys = state.purchases.filter((p) => (p.doc_date || "").slice(0, 7) === mo);
  const vatIn = buys.reduce((s, p) => s + purchaseTotals(p.items).vat, 0);
  const buySum = sumBy(buys, (p) => p.total);
  const label = new Date(mo + "-02").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  lastReport = { mo, label, received, inCash, cashIn, cashOut, profit, settled, top, owed, vatOut, netOut, vatIn, buySum, buys };

  const row = (l, v, colour) => `<div class="row bankrow"><span class="muted nw">${l}</span>
    <span class="mono"${colour ? ` style="color:${colour}"` : ""}>${v}</span></div>`;
  openSheet(`
    <h2>Elaks — monthly report</h2>
    <div class="row" style="justify-content:center;gap:18px;margin:6px 0 10px">
      <button class="chip" onclick="openReportSheet(shiftMonth('${mo}', -1))">‹</button><b>${label}</b>
      <button class="chip" onclick="openReportSheet(shiftMonth('${mo}', 1))">›</button>
    </div>
    ${failed ? '<p class="muted">Some figures could not be loaded — check your connection.</p>' : ""}
    <div class="totalbar"><span>Profit on jobs settled</span><span class="mono">${fmt(profit)} ден.</span></div>
    <div class="sec">Money received</div>
    ${row("Total received", fmt(received) + " ден.", "var(--personal)")}
    ${row("of that in cash", fmt(inCash) + " ден.")}
    ${row("Jobs fully settled", settled.length)}
    <div class="sec">ДДВ on settled jobs</div>
    ${row("Base (основа)", fmt(netOut) + " ден.")}
    ${row("ДДВ collected (output)", fmt(vatOut) + " ден.", "var(--amber)")}
    ${row("ДДВ on purchases (input)", fmt(vatIn) + " ден.", "var(--personal)")}
    ${row("ДДВ payable", fmt(vatOut - vatIn) + " ден.")}
    <div class="sec">Bought this month</div>
    ${row("Supplier bills", buys.length)}
    ${row("Value", fmt(buySum) + " ден.")}
    <div class="sec">Cash register</div>
    ${row("In", "+" + fmt(cashIn) + " ден.", "var(--personal)")}
    ${row("Out", "−" + fmt(Math.abs(cashOut)) + " ден.", "var(--danger)")}
    ${row("Month result", fmt(cashIn + cashOut) + " ден.")}
    <div class="sec">Most used articles</div>
    ${top.length ? top.map((t) => `<div class="mov"><span>${esc(t.name)}</span>
        <span class="mono">${fmt(t.qty)} ${t.unit}</span></div>`).join("") : '<p class="muted">Nothing left stock this month.</p>'}
    <div class="sec">Outstanding (all time)</div>
    ${owed.length ? owed.map((o) => `<div class="mov tapp" onclick="openOfferSheet('${o.id}')">
        <span>${o.number} · ${esc((state.clients.find((c) => c.id === o.client_id) || {}).name || "no client")}</span>
        <span class="mono" style="color:var(--amber)">${fmt(offerBalance(o))} ден. ›</span></div>`).join("")
      : '<p class="muted">Everything accepted has been paid.</p>'}

  `);
}

let orderQty = {}, orderGroups = [];

function imgDims(src) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth || 4, h: im.naturalHeight || 3 });
    im.onerror = () => res({ w: 4, h: 3 });
    im.src = src;
  });
}
async function generateDocx(o) {
  const metersOpen = (o.items || []).map((it, i) => ({ it, n: i + 1 })).filter((x) => x.it.unit === "m" && !x.it.consumed);
  try {
    if (!window.PizZip || !window.docxtemplater) throw new Error("Document libraries did not load — check connection and reload the app");
    const res = await fetch("Ponuda_TEMPLATE.docx", { cache: "no-store" });
    if (!res.ok) throw new Error("Template not found on server (HTTP " + res.status + ")");
    const buf = await res.arrayBuffer();
    const head = new Uint8Array(buf.slice(0, 2));
    if (head[0] !== 0x50 || head[1] !== 0x4B) throw new Error("Template file on server is not a valid .docx");
    // product photos: fetch and measure (inserted into the document after rendering)
    const ids = [...new Set((o.items || []).filter((it) => it.article_id).map((it) => it.article_id))];
    const photo = {};   // article_id -> { dataUrl, w, h }
    if (ids.length) {
      const { data: imgs } = await db.from("article_images").select("article_id, data").in("article_id", ids);
      for (const r of imgs || []) {
        if (!r.data) continue;
        const d = await imgDims(r.data);
        const MAXW = 120, MAXH = 95;
        let w = MAXW, h = Math.round(MAXW * d.h / d.w);
        if (h > MAXH) { h = MAXH; w = Math.round(MAXH * d.w / d.h); }
        photo[r.article_id] = { dataUrl: r.data, w, h };
      }
    }
    const doc = new window.docxtemplater(new PizZip(buf), { linebreaks: true, paragraphLoop: true });
    const client = state.clients.find((c) => c.id === o.client_id);
    doc.render({
      title: o.title, system: o.system || "",
      offer_number: o.number, date: dmy(o.offer_date),
      client: client ? client.name : "", validity: o.validity,
      client_contact: client ? (client.contact || "") : "",
      client_phone: client ? (client.phone || "") : "",
      client_address: client ? (client.address || "") : "",
      client_email: client ? (client.email || "") : "",
      items: o.items.map((it, i) => ({
        num: i + 1, name: it.name, specs: it.specs || "",
        qty: it.unit === "m" ? (it.consumed ? fmt(it.consumed) + " m" : "m") : (it.free ? "" : fmt(it.qty || 0)),
        price: it.free ? "" : fmt(it.price || 0),
        total: itemTotal(it) === null ? "???" : fmt(itemTotal(it) || 0),
        img_mark: photo[it.article_id] ? `«IMG:${i}»` : "",
      })),
      total_note: o.total_note || "", grand_total: fmt(o.grand_total),
      footnote: metersOpen.length
        ? `* Ставките ${metersOpen.map((m) => m.n).join(" и ")} се пресметуваат по потрошена должина по завршување на монтажата.`
        : "",
    });
    insertPictures(doc.getZip(), (o.items || []).map((it) => photo[it.article_id] || null));
    const blob = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Ponuda_${o.number}.docx`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    return true;
  } catch (e) {
    console.error(e);
    const det = (e.properties && e.properties.errors)
      ? e.properties.errors.map((x) => x.properties && x.properties.explanation).filter(Boolean).join("\n")
      : e.message;
    alert("Could not generate the offer document:\n\n" + det);
    return false;
  }
}
// A piece item leaves stock once the job is agreed or money has arrived.
// Metre items are booked later by Close job, so they are skipped here.
const deductLines = (o) => (o.items || []).filter((it) => it.article_id && it.unit !== "m" && (it.qty || 0) > 0);
const needsDeduct = (o) => !o.stock_deducted && deductLines(o).length > 0
  && (o.status === "accepted" || offerPaid(o) > 0);

// Offered right after accepting or taking payment, so stock never quietly stays on the shelf.
async function promptDeduct(id) {
  const o = state.offers.find((x) => x.id === id);
  if (!o || !needsDeduct(o)) return;
  const list = deductLines(o).map((it) => `· ${it.name} × ${fmt(it.qty)}`).join("\n");
  if (!confirm(`Take these off the shelf now?\n\n${list}`)) return;
  await deductStock(id, true);
}
async function deductStock(id, silent) {
  const o = state.offers.find((x) => x.id === id);
  if (!o) return;
  if (o.stock_deducted) return toast("Already taken out of stock");
  if (!silent && !confirm("Take this offer's items out of stock?")) return;
  const rows = deductLines(o)
    .map((it) => ({ article_id: it.article_id, type: "out", qty: it.qty || 0, ref: o.number, note: "Offer " + o.number }));
  try {
    if (rows.length) await dbq(db.from("movements").insert(rows), "Stock not updated");
    await dbq(db.from("offers").update({ stock_deducted: true }).eq("id", id), "Offer not updated");
  } catch { return; }
  closeSheet(); await refreshAll(["offers", "stock"]); render();
  toast(`Taken out of stock · ${rows.length} article(s)`);
}
async function delOffer(id) {
  if (!confirm("Delete this offer?")) return;
  try { await dbq(db.from("offers").delete().eq("id", id), "Not deleted"); } catch { return; }
  closeSheet(); await refreshAll(["offers"]); renderOffers();
}

function setPayMethod(m) {

  [...$("pay-m").querySelectorAll(".chip")].forEach((b, i) => b.classList.toggle("on", (i === 0) === (m === "cash")));

async function savePayment(id) {
  const o = state.offers.find((x) => x.id === id);
  const client = state.clients.find((c) => c.id === o.client_id);
  const amt = parseFloat($("pay-amt").value);
  if (!amt || amt === 0) return toast("Enter the amount received");
  const date = $("pay-date").value || todayStr();
  const note = $("pay-note").value.trim() || null;
  try {
    const pay = await dbq(db.from("offer_payments")
      .insert({ offer_id: id, amount: amt, method: payMethod, paid_on: date, note })
      .select().single(), "Payment not saved");
    if (payMethod === "cash") {
      await dbq(db.from("elaks_cash").insert({
        amount: amt, offer_id: id, payment_id: pay.id,
        note: `Offer ${o.number}${client ? " · " + client.name : ""}${note ? " · " + note : ""}`,
      }), "Cash entry not saved");
    }
    await syncOfferPaid(id);
  } catch { return; }
  closeSheet(); await refreshAll(["offers", "payments", "cash", "cashTotal"]); render();
  toast(payMethod === "cash" ? "Payment added to the register" : "Payment recorded");
  const pending = needsDeduct(state.offers.find((x) => x.id === id) || {});
  setTimeout(() => (pending ? promptDeduct(id) : openOfferSheet(id)), 300);
}
async function delPayment(pid) {
  const p = state.payments.find((x) => x.id === pid);
  if (!p) return;
  if (!confirm(`Remove this payment of ${fmt(p.amount)} ден.?${p.method === "cash" ? "\n\nIts cash register entry goes with it." : ""}`)) return;
  try {
    await dbq(db.from("elaks_cash").delete().eq("payment_id", pid), "Cash entry not removed");
    await dbq(db.from("offer_payments").delete().eq("id", pid), "Not removed");
    await syncOfferPaid(p.offer_id);
  } catch { return; }
  closeSheet(); await refreshAll(["offers", "payments", "cash", "cashTotal"]); render();
  setTimeout(() => openOfferSheet(p.offer_id), 240);
  toast("Payment removed");
}
function reconcileSheet(id, paid, total) {
  const o = state.offers.find((x) => x.id === id);
  const diff = total - paid;
  const owed = diff > 0;
  openSheet(`
    <h2>Payment needs checking</h2>
    <p class="muted">${o.number} — the total changed when the job was closed.</p>
    <div class="row bankrow"><span class="muted nw">Already paid</span><span class="mono">${fmt(paid)} ден.</span></div>
    <div class="row bankrow"><span class="muted nw">New total</span><span class="mono">${fmt(total)} ден.</span></div>
    <div class="row bankrow"><span class="muted nw">${owed ? "Client still owes" : "To give back"}</span>
      <span class="mono"><b style="color:${owed ? "var(--amber)" : "var(--danger)"}">${fmt(Math.abs(diff))}</b> ден.</span></div>
    <button class="btn" onclick="settleDiff('${id}', ${diff}, true)">${owed ? "Got it in cash — add to register" : "Refunded in cash — take from register"}</button>
    <button class="btn ghost" onclick="settleDiff('${id}', ${diff}, false)">Settled by bank — just record it</button>
    <button class="btn ghost" onclick="closeSheet()">Leave the balance open</button>
  `);
}
async function settleDiff(id, diff, cash) {
  const o = state.offers.find((x) => x.id === id);
  try {
    const pay = await dbq(db.from("offer_payments").insert({
      offer_id: id, amount: diff, method: cash ? "cash" : "bank",
      paid_on: todayStr(), note: "Balance after job closed",
    }).select().single(), "Payment not saved");
    if (cash) await dbq(db.from("elaks_cash").insert({
      amount: diff, offer_id: id, payment_id: pay.id,
      note: `Offer ${o.number} · balance after job closed`,
    }), "Cash entry not saved");
    await syncOfferPaid(id);
  } catch { return; }
  closeSheet(); await refreshAll(["offers", "payments", "cash", "cashTotal"]); render(); toast("Balance recorded");
}
function duplicateOffer(id) {
  const src = state.offers.find((x) => x.id === id);
  closeSheet();
  setTimeout(() => {
    openOfferSheet();
    $("of-title").value = src.title; $("of-system").value = src.system || "";
    $("of-client").value = src.client_id || ""; $("of-val").value = src.validity;
    offerItems = JSON.parse(JSON.stringify(src.items || [])).map((it) => { delete it.consumed; return it; });
    renderOfferItems();
  }, 240);
}
function closeJobSheet(id) {
  const o = state.offers.find((x) => x.id === id);
  const ms = o.items.map((it, i) => ({ it, i })).filter((x) => x.it.unit === "m" && !x.it.consumed);
  openSheet(`
    <h2>Close job — ${o.number}</h2>
    <p class="muted">Enter consumed length per item. The offer total and stock will be updated.</p>
    ${ms.map((x) => `<label>${esc(x.it.name)} (@ ${fmt(x.it.price || 0)} /m)</label>
      <input type="number" inputmode="decimal" min="0" step="any" id="cj-${x.i}">`).join("")}
    <button class="btn" onclick="closeJob('${id}')">Confirm — update offer & stock</button>
  `);
}
async function closeJob(id) {
  const o = state.offers.find((x) => x.id === id);
  const items = JSON.parse(JSON.stringify(o.items));
  const movRows = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.unit === "m" && !it.consumed) {
      const v = parseFloat(($("cj-" + i) || {}).value);
      if (!v || v <= 0) return toast("Enter meters for every item");
      it.consumed = v;
      if (it.article_id) movRows.push({ article_id: it.article_id, type: "out", qty: v, ref: o.number, note: "Offer " + o.number });
    }
  }
  if (!o.stock_deducted) items.forEach((it) => {
    if (it.article_id && it.unit !== "m") movRows.push({ article_id: it.article_id, type: "out", qty: it.qty || 0, ref: o.number, note: "Offer " + o.number });
  });
  const total = items.reduce((s, it) => {
    const t = it.unit === "m" ? it.consumed * (it.price || 0) : (it.free ? (it.price || 0) : (it.qty || 0) * (it.price || 0));
    return s + (t || 0);
  }, 0);
  try {
    if (movRows.length) await dbq(db.from("movements").insert(movRows), "Stock not updated");
    await dbq(db.from("offers").update({ items, grand_total: total, total_note: null, stock_deducted: true }).eq("id", id), "Offer not updated");
  } catch { return; }
  closeSheet(); await refreshAll(["offers", "stock"]); renderOffers();
  const wasPaid = parseFloat(o.paid_amount) || 0;
  if (o.paid_at && Math.abs(total - wasPaid) > 0.005) {   // the invoice moved after it was paid
    setTimeout(() => reconcileSheet(id, wasPaid, total), 260);
    return;
  }
  toast("Job closed — total and stock updated");
}

function urlB64(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

  if (el) el.textContent = !supported ? "Not supported on this device"

  if (btn) { btn.textContent = state.pushOn ? "Turn off" : "Enable"; btn.classList.toggle("ghost", state.pushOn); }
}
async function enablePush() {

    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(CONFIG.VAPID_PUBLIC_KEY) });
    await db.from("push_subscriptions").upsert({ endpoint: sub.endpoint, sub: sub.toJSON(), user_id: state.uid }, { onConflict: "endpoint" });

  } catch (e) { console.error(e); toast("Error enabling push"); }
}

// The key goes into a table the app can write but never read: there is no
// select policy on it, so only the server (service role) can fetch it.
async function saveAiKey() {
  const key = ($("ai-key").value || "").trim();
  if (!key) return toast("Paste the key first");
  if (!/^sk-ant-/.test(key)) {
    if (!confirm("That does not look like an Anthropic key (they start with sk-ant-).\n\nSave it anyway?")) return;
  }
  try {
    await dbq(db.from("secrets").upsert({ name: "anthropic_api_key", value: key }, { onConflict: "name" }), "Not saved");
    await dbq(db.from("app_settings").upsert({ key: "ai_key_set", value: "yes" }, { onConflict: "key" }), "Not saved");
  } catch { return; }
  closeSheet(); await refreshAll(["settings"]); render(); toast("Key saved");
}
async function removeAiKey() {
  if (!confirm("Remove the saved key? Reading photographed notes will stop working.")) return;
  try {

    await dbq(db.from("app_settings").upsert({ key: "ai_key_set", value: "no" }, { onConflict: "key" }), "Not saved");

  closeSheet(); await refreshAll(["settings"]); render(); toast("Key removed");

  try { await dbq(db.from("app_settings").upsert({ key: "stay_remind_time", value: t }, { onConflict: "key" }), "Not saved"); } catch { return; }
  toast("Saved");
}
async function saveBillsDay() {
  const d = Math.min(28, Math.max(1, parseInt($("bills-day").value) || 5));
  try { await dbq(db.from("app_settings").upsert({ key: "bills_day", value: String(d) }, { onConflict: "key" }), "Not saved"); } catch { return; }
  toast("Saved");
}
async function backupJson() {
  toast("Preparing backup…");
  // photos are deliberately excluded: they are large, and a backup that fails
  // when you need it is worse than one that leaves images behind
  const tables = ["tasks", "articles", "movements", "clients", "offers",
                  "apartments", "stays", "bills", "elaks_cash", "user_roles", "app_settings"];
  const out = { app: "Centrala", version: 1, exported_at: new Date().toISOString(), data: {} };
  const missed = [];
  for (const t of tables) {
    try {
      const { data, error } = await db.from(t).select("*");
      if (error) { missed.push(t); continue; }
      out.data[t] = data || [];
    } catch { missed.push(t); }
  }
  const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "centrala-backup-" + todayStr() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast(missed.length ? "Backup saved (skipped: " + missed.join(", ") + ")" : "Backup downloaded");
}
async function saveDigestHour() {
  try { await dbq(db.from("app_settings").update({ value: $("digest-hour").value }).eq("key", "digest_hour"), "Not saved"); } catch { return; }
  toast("Saved");
}

/* ============================================================
   APARTMENTS (rental business)
============================================================ */
const BILL_TYPES = ["electricity", "water", "internet", "building", "heating", "booking"];
const BILL_LBL = { electricity: "Electricity", water: "Water", internet: "Internet", building: "Building", heating: "Heating", booking: "Booking" };
const sumBy = (arr, f) => arr.reduce((a, x) => a + (parseFloat(f(x)) || 0), 0);

// one row of the apartments bank: net on the right, the arithmetic beneath it
function bankRow(label, inc, bil) {
  return `<div class="row bankrow"><span class="muted nw">${label}</span>
    <span class="mono" style="text-align:right"><b>${fmt(inc - bil)}</b> ден.
      <small class="calc">${fmt(inc)} − ${fmt(bil)}</small></span></div>`;
}
function renderApt() {
  const curM = new Date().getFullYear() + "-" + String(new Date().getMonth() + 1).padStart(2, "0");
  const yr = String(new Date().getFullYear());
  const inM = (d, m) => (d || "").slice(0, 7) === m;
  const incM = sumBy(state.stays.filter((s) => inM(s.check_in, curM)), (s) => s.amount);
  const incY = sumBy(state.stays.filter((s) => (s.check_in || "").slice(0, 4) === yr), (s) => s.amount);
  const recAll = sumBy(state.stays.filter(stayStarted), (s) => s.amount);
  const openAll = sumBy(state.apartments, (a) => a.opening_balance);
  const bilAll = sumBy(state.bills, (b) => b.amount);
  // the view sums the full history; the local figure is the fallback if it is missing
  const cashAll = state.aptCash === null ? (recAll + openAll - bilAll) : state.aptCash;
  const soon = sumBy(state.stays.filter((s) => !stayStarted(s)), (s) => s.amount);
  const bilM = sumBy(state.bills.filter((b) => inM(b.month, curM)), (b) => b.amount);
  const bilY = sumBy(state.bills.filter((b) => (b.month || "").slice(0, 4) === yr), (b) => b.amount);
  const t = todayStr();
  const occ = new Set(state.stays.filter((s) => s.check_in <= t && s.check_out > t).map((s) => s.apartment_id)).size;
  $("apt-bank").innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><b>Apartments bank</b>
      <span class="muted">${occ}/${state.apartments.length} occupied tonight</span></div>
    ${bankRow("This month", incM, bilM)}
    ${bankRow("This year", incY, bilY)}
    <div class="row bankrow"><span class="muted nw">Cash in hand</span>
      <span class="mono"><b>${fmt(cashAll)}</b> ден.</span></div>
    ${soon ? `<div class="row bankrow"><span class="muted nw">Upcoming bookings</span>
      <span class="mono">${fmt(soon)} ден.</span></div>` : ""}
  </div>`;
  $("apt-tabs").innerHTML = [["stays", "Stays"], ["calendar", "Calendar"], ["bills", "Bills"], ["apartments", "Apartments"]].map(([v, l]) =>
    `<button class="chip ${state.aptView === v ? "on" : ""}" onclick="state.aptView='${v}';renderApt()">${l}</button>`).join("");
  if (state.aptView === "stays") renderStays();
  else if (state.aptView === "calendar") renderCalendar();
  else if (state.aptView === "bills") renderBills();
  else renderAptList();
}

function renderCalendar() {
  if (!state.apartments.length) { $("apt-body").innerHTML = '<div class="empty">Add an apartment first.</div>'; return; }
  const [y, m] = state.aptMonth.split("-").map(Number);
  const days = new Date(y, m, 0).getDate();
  const label = new Date(state.aptMonth + "-02").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const today = todayStr();
  let html = `<div class="row" style="justify-content:center;gap:18px;margin-bottom:6px">
    <button class="chip" onclick="shiftAptMonth(-1)">‹</button><b>${label}</b>
    <button class="chip" onclick="shiftAptMonth(1)">›</button></div>
    <p class="muted" style="margin-bottom:4px">Tap a free day to book it, a booked day to open the stay.</p>`;
  // Monday-first month grid: the whole month is visible without scrolling sideways
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const headRow = `<div class="cal-head">${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"]
    .map((d, i) => `<span class="${i > 4 ? "we" : ""}">${d}</span>`).join("")}</div>`;
  for (const a of state.apartments) {
    const mine = state.stays.filter((s) => s.apartment_id === a.id);
    let cells = '<button class="cal-d pad"></button>'.repeat(lead);
    let nights = 0;
    for (let d = 1; d <= days; d++) {
      const ds = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const st = mine.find((s) => s.check_in <= ds && s.check_out > ds);
      if (st) nights++;
      const cls = "cal-d" + (st ? " bk" : "") + (ds === today ? " now" : "");
      const act = st ? `openStaySheet('${st.id}')` : `openStaySheet(null, { apartment_id: '${a.id}', check_in: '${ds}' })`;
      const who = st ? `<small>${esc(initials(st.guest_name))}</small>` : "";
      cells += `<button class="${cls}" onclick="${act}" title="${st ? esc(st.guest_name) : "free"}">${d}${who}</button>`;
    }
    html += `<div class="cal-apt"><span>${esc(a.name)}</span>
      <span class="muted" style="font-weight:400;white-space:nowrap">${nights}/${days} nights</span></div>
      ${headRow}<div class="cal-grid">${cells}</div>`;
  }
  $("apt-body").innerHTML = html;
}
function stayRow(s) {
  return `<div class="card offer row" onclick="openStaySheet('${s.id}')">
    <div style="flex:1;min-width:0"><b>${esc(s.guest_name)}</b>
      <div class="o-num">${esc(s.apartments?.name || "?")} · ${dm(s.check_in)} → ${dm(s.check_out)} · ${nightsBetween(s.check_in, s.check_out)}n${s.source && s.source !== "Direct" ? " · " + esc(s.source) : ""}${s.external_uid ? " · synced" : ""}${
        dOnly(s.check_in) === todayStr() ? ' · <span style="color:var(--amber)">arrives today</span>'
        : dOnly(s.check_out) === todayStr()
          ? (stayEnded(s) ? ' · <span class="muted">checked out today</span>'
             : ` · <span style="color:var(--amber)">leaves today by ${checkoutTimeFor(s.apartment_id)}</span>`)
          : ""}</div></div>
    <span class="o-total mono">${fmt(s.amount)} ден.</span>
  </div>`;
}
function renderStays() {
  if (!state.apartments.length) { $("apt-body").innerHTML = '<div class="empty">Add an apartment first (Apartments tab above).</div>'; return; }
  const t = todayStr();
  // A guest is "currently staying" until the end of their check-out day —
  // one pass, so a booking can only ever land in a single section.
  const cur = [], up = [], past = [];
  for (const s of state.stays) {
    const ci = dOnly(s.check_in), co = dOnly(s.check_out);
    if (!ci || !co) { up.push(s); continue; }
    if (ci > t) up.push(s);
    else if (stayEnded(s)) past.push(s);
    else cur.push(s);
  }
  cur.sort((a, b) => dOnly(a.check_out).localeCompare(dOnly(b.check_out)));
  up.sort((a, b) => dOnly(a.check_in).localeCompare(dOnly(b.check_in)));
  past.sort((a, b) => dOnly(b.check_out).localeCompare(dOnly(a.check_out)));

  // The only way one guest can show twice is two records for the same booking —
  // typically one typed by hand and the same one synced in from a platform.
  const dupes = [];
  const live = state.stays.filter((s) => dOnly(s.check_out) >= t);
  for (let i = 0; i < live.length; i++) {
    for (let j = i + 1; j < live.length; j++) {
      const a = live[i], b = live[j];
      if (a.apartment_id !== b.apartment_id) continue;
      if (dOnly(a.check_in) < dOnly(b.check_out) && dOnly(b.check_in) < dOnly(a.check_out)) dupes.push([a, b]);
    }
  }

  let html = "";
  if (dupes.length) html += `<div class="card" style="border-color:var(--danger)">
    <b style="color:var(--danger)">${dupes.length} overlapping booking(s)</b>
    <div class="muted">Two records cover the same nights in one apartment — open each and delete the one you don't want.</div>
    ${dupes.slice(0, 5).map(([a, b]) => `<div class="mov">
      <span class="tapp" onclick="openStaySheet('${a.id}')">${esc(a.guest_name)} ${dm(a.check_in)}→${dm(a.check_out)}${a.external_uid ? " · synced" : " · typed"} ›</span>
      <span class="tapp" onclick="openStaySheet('${b.id}')">${esc(b.guest_name)} ${dm(b.check_in)}→${dm(b.check_out)}${b.external_uid ? " · synced" : " · typed"} ›</span>
    </div>`).join("")}
  </div>`;
  if (cur.length) html += '<div class="sec">Currently staying</div>' + cur.map((s) => stayRow(s)).join("");
  if (up.length) html += '<div class="sec">Upcoming</div>' + up.map((s) => stayRow(s)).join("");
  html += '<div class="sec">Past</div>' + (past.slice(0, 30).map((s) => stayRow(s)).join("") || '<p class="muted">No past stays.</p>');
  $("apt-body").innerHTML = html || (state.loading ? SKEL(3) : '<div class="empty">No guests yet.<br>Add with +</div>');
}
function openStaySheet(id, pre) {

    <label>Guest name</label><input id="st-guest" value="${esc(s.guest_name || "")}">
    <div class="grid2">
      <div><label>Check-in</label><input id="st-in" type="date" value="${s.check_in || ""}" onchange="stayCalc()"></div>
      <div><label>Check-out</label><input id="st-out" type="date" value="${s.check_out || ""}" onchange="stayCalc()"></div>
    </div>
    <div class="grid2">
      <div><label>Booked via</label><select id="st-src">
        ${["Direct", "Booking.com", "Airbnb", "Other"].map((x) => `<option ${((s.source || "Direct") === x) ? "selected" : ""}>${x}</option>`).join("")}
      </select></div>
      <div><label>Amount paid (ден.)</label><input id="st-amt" type="number" inputmode="decimal" value="${s.amount ?? ""}" oninput="this.dataset.touched=1"></div>
    </div>
    <div class="muted" id="st-nights" style="margin-top:4px"></div>
    <div class="row" style="margin-top:12px">
      <button class="clbox ${stayHasTask(id) ? "on" : ""}" id="st-task"
        onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'\u2713':''">${stayHasTask(id) ? "\u2713" : ""}</button>
      <span>Reminder task the day before they arrive${(() => {
        const ex = id ? state.tasks.find((t) => t.stay_id === id) : null;
        return ex && ex.due_date
          ? ` <span class="muted">· set for ${dmy(ex.due_date)}</span>`
          : "";
      })()}</span>
    </div>
    <label>Notes (opt.)</label><input id="st-notes" value="${esc(s.notes || "")}">
    <button class="btn" onclick="saveStay('${id || ""}')">Save</button>

  `);
  stayCalc();
}
function nightsBetween(ci, co) {
  if (!ci || !co) return 0;
  return Math.round((Date.parse(co) - Date.parse(ci)) / 86400000);
}
function stayCalc() {
  const n = nightsBetween($("st-in").value, $("st-out").value);
  const a = state.apartments.find((x) => x.id === $("st-apt").value);
  const amt = $("st-amt");
  if (n > 0 && a && a.nightly_rate && !amt.dataset.touched && !amt.value) amt.value = n * a.nightly_rate;
  $("st-nights").textContent = n > 0
    ? `${n} night${n > 1 ? "s" : ""}${a && a.nightly_rate ? ` · rate ${fmt(a.nightly_rate)} ден./night` : ""}`
    : "";
}
const stayHasTask = (id) => !id ? true : state.tasks.some((t) => t.stay_id === id);

// One task per stay, dated the day before check-in so the existing
// reminder push does the notifying.
async function syncStayTask(stay, want) {
  const existing = state.tasks.find((t) => t.stay_id === stay.id);
  try {
    if (!want || !stay.check_in || stay.check_in < todayStr()) {
      if (existing && !want) await db.from("tasks").delete().eq("id", existing.id);
      return { ok: false, skipped: true };
    }
    const apt = state.apartments.find((a) => a.id === stay.apartment_id);
    const time = await getSetting("stay_remind_time", "09:00");
    const d = new Date(stay.check_in + "T12:00");
    d.setDate(d.getDate() - 1);
    const dayBefore = d.toLocaleDateString("sv-SE");
    const due = dayBefore < todayStr() ? todayStr() : dayBefore;
    const nights = nightsBetween(stay.check_in, stay.check_out);
    const row = {
      title: `Check-in: ${stay.guest_name}${apt ? " · " + apt.name : ""}`,
      context: "apts", due_date: due, due_time: time, remind: true,
      notes: `Arrives ${stay.check_in} · leaves ${stay.check_out} · ${nights} night(s)`
        + (stay.source && stay.source !== "Direct" ? " · " + stay.source : ""),
      stay_id: stay.id,
    };
    if (existing && due > todayStr()) { row.done = false; row.reminded_on = null; }
    // supabase reports errors in the result rather than throwing, so check it
    const res = existing
      ? await db.from("tasks").update(row).eq("id", existing.id)
      : await db.from("tasks").insert(row);
    if (res.error) { console.error("stay task", res.error); return { ok: false, msg: res.error.message }; }
    return { ok: true, on: due };
  } catch (e) {
    console.error("stay task", e);
    return { ok: false, msg: e && e.message ? e.message : "unknown error" };
  }
}
async function saveStay(id) {
  const row = {
    apartment_id: $("st-apt").value, guest_name: $("st-guest").value.trim(),
    check_in: $("st-in").value, check_out: $("st-out").value,
    amount: parseFloat($("st-amt").value) || 0, source: $("st-src").value,
    notes: $("st-notes").value.trim() || null,
  };
  if (!row.apartment_id) return toast("Add an apartment first");
  if (!row.guest_name) return toast("Enter guest name");
  if (!row.check_in || !row.check_out || row.check_out <= row.check_in) return toast("Check-out must be after check-in");
  const clash = state.stays.find((x) => x.id !== id && x.apartment_id === row.apartment_id
    && x.check_in < row.check_out && row.check_in < x.check_out);
  if (clash) return alert(`Those dates overlap an existing booking:\n\n${clash.guest_name} · ${clash.check_in} → ${clash.check_out}`);
  const wantTask = $("st-task").classList.contains("on");
  let saved;
  try {
    saved = await dbq(id
      ? db.from("stays").update(row).eq("id", id).select().single()
      : db.from("stays").insert(row).select().single(), "Stay not saved");
  } catch (e) {
    if (e && (e.code === "23P01" || String(e.message || "").includes("stays_no_overlap"))) alert("Those dates are already booked for this apartment.");
    return;
  }
  const res = await syncStayTask(saved, wantTask);
  closeSheet(); await refreshAll(["stays", "tasks", "aptCash"]); renderApt();
  if (res && res.ok) toast("Saved · reminder on " + dmy(res.on));
  else if (res && res.msg) alert("The stay was saved, but its reminder task could not be created:\n\n" + res.msg
    + "\n\nIf this mentions a missing column, the tasks migration has not been run yet.");
  else toast("Saved");
}
async function delStay(id) {
  if (!confirm("Delete this stay?")) return;
  try { await dbq(db.from("stays").delete().eq("id", id), "Not deleted"); } catch { return; }
  closeSheet(); await refreshAll(["stays", "tasks", "aptCash"]); renderApt();
}

function shiftAptMonth(dir) {
  const [y, m] = state.aptMonth.split("-").map(Number);
  const d = new Date(y, m - 1 + dir, 1);
  state.aptMonth = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  renderApt();
}
function billOf(aptId, type) {
  return state.bills.find((b) => b.apartment_id === aptId && (b.month || "").slice(0, 7) === state.aptMonth && b.type === type);
}
function renderBills() {
  if (!state.apartments.length) { $("apt-body").innerHTML = '<div class="empty">Add an apartment first.</div>'; return; }
  const label = new Date(state.aptMonth + "-02").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  let grand = 0;
  let html = `<div class="row" style="justify-content:center;gap:18px;margin-bottom:10px">
    <button class="chip" onclick="shiftAptMonth(-1)">‹</button><b>${label}</b>
    <button class="chip" onclick="shiftAptMonth(1)">›</button></div>`;
  for (const a of state.apartments) {
    const rows = BILL_TYPES.map((tp) => ({ tp, b: billOf(a.id, tp) }));
    const total = sumBy(rows, (r) => r.b?.amount);
    const paidN = rows.filter((r) => r.b && r.b.paid).length;
    grand += total;
    html += `<div class="card">
      <div class="row" style="justify-content:space-between"><b>${esc(a.name)}</b>
        <span style="font-weight:600;color:${paidN === BILL_TYPES.length ? "var(--personal)" : "var(--amber)"}">${paidN === BILL_TYPES.length ? "✓ PAID" : paidN + "/" + BILL_TYPES.length + " paid"}</span></div>
      ${rows.map(({ tp, b }) => `
        <div class="row" style="margin-top:7px">
          <button class="clbox ${b && b.paid ? "on" : ""}" onclick="setBill('${a.id}','${tp}','paid',${!(b && b.paid)})">${b && b.paid ? "✓" : ""}</button>
          <span style="flex:1">${BILL_LBL[tp]}</span>
          <input class="mono" type="number" inputmode="decimal" value="${b ? b.amount : ""}" placeholder="0"
            style="width:96px;text-align:right;padding:7px 8px"
            onchange="setBill('${a.id}','${tp}','amount',parseFloat(this.value)||0)">
        </div>`).join("")}
      <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Total</span>
        <b class="mono">${fmt(total)} ден.</b></div>
    </div>`;
  }
  html += `<div class="totalbar"><span>All bills · ${label}</span><span class="mono">${fmt(grand)} ден.</span></div>`;
  $("apt-body").innerHTML = html;
}
async function setBill(aptId, type, field, value) {
  const b = billOf(aptId, type);
  const row = {
    apartment_id: aptId, month: state.aptMonth + "-01", type,
    amount: b ? b.amount : 0, paid: b ? b.paid : false,
  };
  row[field] = value;
  if (field === "paid") row.paid_on = value ? todayStr() : null;
  try { await dbq(db.from("bills").upsert(row, { onConflict: "apartment_id,month,type" }), "Bill not saved"); } catch { return; }
  await refreshAll(["bills", "aptCash"]); renderApt();
}

function renderAptList() {
  $("apt-body").innerHTML = state.apartments.length ? state.apartments.map((a) => `
    <div class="card row" onclick="openAptStatement('${a.id}')">
      <div style="flex:1"><b>${esc(a.name)}</b>
        <div class="muted">${esc(a.address || "")} ${a.size_m2 ? "· " + fmt(a.size_m2) + " m²" : ""}${a.nightly_rate ? " · " + fmt(a.nightly_rate) + " ден./night" : ""}</div></div>
    </div>`).join("") : (state.loading ? SKEL(2) : '<div class="empty">No apartments.<br>Add with +</div>');
}
function openAptStatement(id, year) {
  const a = state.apartments.find((x) => x.id === id);
  const y = year || new Date().getFullYear();
  const mine = state.stays.filter((s) => s.apartment_id === id);
  const mybills = state.bills.filter((b) => b.apartment_id === id);
  let ti = 0, tb = 0, tn = 0, rows = "";
  for (let m = 1; m <= 12; m++) {
    const key = `${y}-${String(m).padStart(2, "0")}`;
    const inc = sumBy(mine.filter((s) => (s.check_in || "").slice(0, 7) === key), (s) => s.amount);
    const bil = sumBy(mybills.filter((b) => (b.month || "").slice(0, 7) === key), (b) => b.amount);
    const nights = mine.filter((s) => (s.check_in || "").slice(0, 7) === key)
      .reduce((n, s) => n + nightsBetween(s.check_in, s.check_out), 0);
    ti += inc; tb += bil; tn += nights;
    if (!inc && !bil) continue;
    rows += `<div class="mov"><span>${new Date(key + "-02").toLocaleDateString("en-GB", { month: "short" })}
      <span class="muted">${nights ? nights + "n" : ""}</span></span>
