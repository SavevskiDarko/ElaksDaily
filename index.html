async function savePolicy(id) {
  const row = {
    holder_name: $("po-name").value.trim(),
    policy_no: $("po-no").value.trim() || null,
    plate: ($("po-plate").value || "").trim().toUpperCase() || null,
    phone: $("po-phone").value.trim() || null,
    kind: ($("po-kind").querySelector(".chip.on") || {}).dataset?.k || null,
    insurer: $("po-insurer").value.trim() || null,
    start_date: $("po-start").value || todayStr(),
    end_date: $("po-end").value || null,
    amount: parseFloat($("po-amount").value) || 0,
    commission: parseFloat($("po-comm").value) || 0,
    has_green_card: $("po-gc").classList.contains("on"),
    green_card_price: parseFloat($("po-gcprice").value) || 0,
    gc_commission: parseFloat($("po-gccomm").value) || 0,
    green_card_no: $("po-gcno").value.trim() || null,
    green_card_end: $("po-gcend").value || null,
    note: $("po-note").value.trim() || null,
  };
  if (!row.holder_name) return toast(T("Whose policy is it?", "Чија е полисата?"));
  // the first page is what the list shows
  row.photo_thumb = polPhotos.length ? (polPhotos[0].thumb || null) : null;
  if (row.end_date && row.end_date < row.start_date) return toast(T("It cannot end before it starts", "Не може да заврши пред да почне"));
  let saved;
  try {
    saved = await dbq(id ? db.from("policies").update(row).eq("id", id).select().single()
                         : db.from("policies").insert(row).select().single(), T("Not saved", "Не е зачувано"));
    if (polRemoved.length) await db.from("policy_photos").delete().in("id", polRemoved);
    const fresh = polPhotos.filter((p) => p.isNew && p.full);
    if (fresh.length) {
      await dbq(db.from("policy_photos").insert(fresh.map((p, k) => ({
        policy_id: saved.id, data: p.full, thumb: p.thumb, sort: polPhotos.indexOf(p),
      }))), T("A page was not saved", "Страница не е зачувана"));
    }
    // keep the order the pages are shown in
    const kept = polPhotos.filter((p) => p.id);
    for (const p of kept) {
      const want = polPhotos.indexOf(p);
      if (p.sort !== want) await db.from("policy_photos").update({ sort: want }).eq("id", p.id);
    }
  } catch { return; }
  closeSheet(); await refreshAll(["policies"]); render(); toast(T("Saved", "Зачувано"));

// A policy ending is next month's sale, not a dead record. Renewing copies
// everything forward for the same length of time and keeps the two linked.
async function renewPolicy(id) {
  const p = state.policies.find((x) => x.id === id);
  if (!p) return;
  const start = p.end_date && p.end_date > todayStr() ? p.end_date : todayStr();
  const lenDays = p.end_date && p.start_date
    ? Math.round((Date.parse(p.end_date) - Date.parse(p.start_date)) / 86400000)
    : 365;
  const endD = new Date(start + "T12:00");
  endD.setDate(endD.getDate() + Math.max(1, lenDays));
  const end = endD.toLocaleDateString("sv-SE");

  if (!await ask(T(
    `Renew ${p.holder_name}?\n\nNew term ${dmy(start)} → ${dmy(end)}, same price and commission. Nothing is paid on it yet.`,
    `Обнови за ${p.holder_name}?\n\nНов период ${dmy(start)} → ${dmy(end)}, иста цена и провизија. Сè уште нема уплати.`),
    T("Renew", "Обнови"))) return;

  const row = {
    holder_name: p.holder_name, policy_no: null, phone: p.phone, kind: p.kind, plate: p.plate,
    insurer: p.insurer, client_id: p.client_id, start_date: start, end_date: end,
    amount: p.amount, commission: p.commission, gc_commission: p.gc_commission, note: p.note,
    has_green_card: p.has_green_card, green_card_price: p.green_card_price, green_card_no: null,
    green_card_end: p.has_green_card ? (() => {
      const g = new Date(start + "T12:00"); g.setMonth(g.getMonth() + 1);
      return g.toLocaleDateString("sv-SE");
    })() : null,
    renewed_from: p.id,
  };
  let made;
  try { made = await dbq(db.from("policies").insert(row).select().single(), T("Not renewed", "Не е обновено")); }
  catch { return; }
  closeSheet(); await refreshAll(["policies"]); render();
  setTimeout(() => openPolicySheet(made.id), 240);
  toast(T("Renewed — check the number and price", "Обновено — провери број и цена"));
}

async function delPolicy(id) {
  const p = state.policies.find((x) => x.id === id);
  const pays = state.polPays.filter((x) => x.policy_id === id).length;
  if (!await ask(T(`Remove this policy?${pays ? `\n\nIts ${pays} recorded payment(s) go too.` : ""}`,
    `Отстрани ја полисата?${pays ? `\n\nЌе се избришат и ${pays} уплати.` : ""}`))) return;
  await deleteUndoable("policies", p, T("Policy removed", "Полисата е отстранета"), ["policies", "polPays"]);
}

function pickDocFile(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) return toast(T("That file is too large (8 MB max)", "Датотеката е преголема (макс. 8 MB)"));
  docDraft = docDraft || { id: null };
  const fr = new FileReader();
  fr.onload = () => {
    if (f.type === "application/pdf") {
      docDraft.thumb = null; docDraft.full = fr.result; docDraft.type = "application/pdf";
      openDocSheet(docDraft.id, true);
      return;
    }
    const im = new Image();
    im.onload = () => {
      // readable enough for small print, small enough to sync
      docDraft.thumb = imgResize(im, 90, 0.6);
      docDraft.full = imgResize(im, 1500, 0.82);
      docDraft.type = "image/jpeg";
      openDocSheet(docDraft.id, true);
    };
    im.onerror = () => toast(T("Could not read that image", "Не можев да ја прочитам сликата"));
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}

function setSupplierValue(id, value) {
  const sel = $(id);
  const v = String(value || "").trim();
  if (!sel || !v) return;
  const hit = [...sel.options].find((o) => o.value.toLowerCase() === v.toLowerCase());
  if (hit) { sel.value = hit.value; return; }
  const opt = document.createElement("option");
  opt.value = v;
  opt.textContent = v + " · " + T("new", "нов");
  sel.appendChild(opt);
  sel.value = v;
}

  const v = String(name || "").trim();

  if (state.suppliers.some((s) => s.name.toLowerCase() === v.toLowerCase())) return;
  try { await db.from("suppliers").insert({ name: v }); await refreshAll(["suppliers"]); }

async function saveSupplier(id) {
  const name = $("sp-name").value.trim();
  if (!name) return toast(T("A supplier needs a name", "Добавувачот треба име"));
  const row = { phone: $("sp-phone").value.trim() || null, email: $("sp-email").value.trim() || null,
                address: $("sp-addr").value.trim() || null, note: $("sp-note").value.trim() || null };
  try {
    if (id) {
      const old = state.suppliers.find((x) => x.id === id);
      if (old && old.name !== name) await dbq(db.rpc("rename_supplier", { p_id: id, p_name: name }), T("Not renamed", "Не е преименувано"));
      await dbq(db.from("suppliers").update(row).eq("id", id), T("Not saved", "Не е зачувано"));
    } else {
      await dbq(db.from("suppliers").insert({ name, ...row }), T("Not saved", "Не е зачувано"));
    }
  } catch { return; }
  closeSheet(); await refreshAll(["suppliers", "stock", "purchases"]); renderElaks(); toast(T("Saved", "Зачувано"));
}

async function delSupplier(id) {
  const s = state.suppliers.find((x) => x.id === id);
  const st = supplierStats(s.name);
  if (st.articles || st.purchases) {
    return say(T(s.name + " is used by " + st.articles + " article(s) and " + st.purchases + " purchase(s).\n\nMerge it into another supplier instead of removing it.",
      s.name + " се користи кај " + st.articles + " артикл(и) и " + st.purchases + " набавка(и).\n\nСпој го со друг добавувач наместо да го отстраниш."));
  }
  if (!await ask(T("Remove this supplier?", "Отстрани го овој добавувач?"))) return;
  try { await dbq(db.from("suppliers").delete().eq("id", id), T("Not removed", "Не е отстрането")); } catch { return; }
  closeSheet(); await refreshAll(["suppliers"]); renderElaks();

function matchesQuery(row, q) {

async function unhideClient(id) {

async function delClient(id) {
  const c = state.clients.find((x) => x.id === id);
  if (!c) return;
  const offers = state.offers.filter((o) => o.client_id === id).length;
  const kit = state.installs.filter((i) => i.client_id === id).length;
  const tasks = state.tasks.filter((t) => t.client_id === id && !t.done).length;

  if (offers || kit) {
    const msg = T(
      `${c.name} has ${offers} offer(s) and ${kit} piece(s) of installed equipment.\n\nHide the client instead? Their history stays, and they disappear from the list and from new offers.`,
      `${c.name} има ${offers} понуда(и) и ${kit} вградена опрема.\n\nДа го скриеме наместо да го избришеме? Историјата останува, а исчезнува од листата и од новите понуди.`);
    if (!await ask(msg, T("Hide client", "Скриј клиент"))) return;
    try { await dbq(db.from("clients").update({ active: false }).eq("id", id), T("Not saved", "Не е зачувано")); } catch { return; }
    closeSheet(); await refreshAll(["clients"]); renderElaks();
    toastUndo(T("Client hidden", "Клиентот е скриен"), async () => {
      await db.from("clients").update({ active: true }).eq("id", id);
      await refreshAll(["clients"]); renderElaks(); toast(T("Restored", "Вратено"));
    });
    return;
  }

  if (tasks && !await ask(T(`${c.name} has ${tasks} open task(s), which will lose their link.\n\nRemove anyway?`,
    `${c.name} има ${tasks} отворени задачи, кои ќе ја изгубат врската.\n\nСепак да го отстранам?`))) return;
  if (!tasks && !await ask(T("Remove this client?", "Отстрани го овој клиент?"))) return;
  await deleteUndoable("clients", c, T("Client removed", "Клиентот е отстранет"), ["clients"]);
}

async function savePerm(uid) {
  const me = state.team.find((x) => x.user_id === uid);
  const row = me && me.role === "owner"
    ? { display_name: $("pm-name").value.trim() || null, hide_tabs: permDraft.hide }
    : (() => {
        // the grant lives on their row: it lists whose personal lists they may open
        const had = (me.personal_access || []).filter((u) => u !== state.uid);
        const wants = $("pm-pers") && $("pm-pers").classList.contains("on");
        return { display_name: $("pm-name").value.trim() || null, task_contexts: permDraft.ctx,
                 see_elaks: permDraft.elaks, see_apts: permDraft.apts, see_insurance: permDraft.ins,
                 apts_own_only: permDraft.apts && permDraft.aptsOwnOnly,
                 ...(permDraft.aptList ? { apt_ids: permDraft.apts && permDraft.aptsOwnOnly ? permDraft.aptIds : [] } : {}),
                 personal_access: wants ? [...had, state.uid] : had };
      })();
  try { await dbq(db.from("user_roles").update(row).eq("user_id", uid), T("Not saved", "Не е зачувано")); } catch { return false; }
  if (uid === state.uid && me && me.role === "owner") {
    // my own view — take effect straight away
    state.perm.elaks = !permDraft.hide.includes("elaks");
    state.perm.apts = !permDraft.hide.includes("apt");
    state.perm.ins = !permDraft.hide.includes("ins");
    applyTabVisibility();
    await refreshAll(); render();
  }
  closeSheet(); await loadTeam();
  toast(uid === state.uid ? T("Saved", "Зачувано") : T("Permissions saved", "Дозволите се зачувани"));
}

function urlB64(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

    : perm === "granted" && state.pushSaved === false ? T("Allowed, but this phone is not signed up — tap Enable", "Дозволено, но телефонот не е пријавен — допри Вклучи")
    : perm === "granted" ? T("Checking…", "Се проверува…")
    : T("Off", "Исклучено");
  const en = $("push-enable"), te = $("push-test");
  if (en) en.style.display = state.pushOn || !supported || perm === "denied" ? "none" : "";

}
// Notifications only reach a phone whose sign-up the server holds. The push
// service can retire one at any time and the server then drops it, so the
// phone went quiet while still showing as allowed. Each start, with
// permission given, the sign-up is made again if it is gone or was made with
// another key, and saved — so a phone mends itself just by being opened.
async function keepPushAlive() {
  try {
    if (!state.uid || !("Notification" in window) || Notification.permission !== "granted"
      || !navigator.serviceWorker || !("PushManager" in window)) return;
    // ready never settles where the service worker could not start; give up rather than wait forever
    const reg = await Promise.race([navigator.serviceWorker.ready,
      new Promise((_, no) => setTimeout(() => no(new Error("no service worker")), 8000))]);
    const key = urlB64(CONFIG.VAPID_PUBLIC_KEY);
    let sub = await reg.pushManager.getSubscription();
    const was = sub && sub.options && sub.options.applicationServerKey;
    if (was && !(was.byteLength === key.length && new Uint8Array(was).every((x, i) => x === key[i]))) {
      await sub.unsubscribe();
      sub = null;
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const r = await db.from("push_subscriptions")
      .upsert({ endpoint: sub.endpoint, sub: sub.toJSON(), user_id: state.uid }, { onConflict: "endpoint" });
    if (r.error) console.warn("push sign-up not saved", r.error);
    // with no signal it is not known either way: no warning, and asked again once there is one
    state.pushSaved = !r.error ? true : netFailed(r) ? undefined : false;
  } catch (e) {
    console.warn("push sign-up", e);
    state.pushSaved = offlineNow() || netFailed(e) ? undefined : false;
  }
  updatePushState();
  if (state.tab === "home") renderHome();
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { updatePushState(); return toast(T("Permission denied", "Дозволата е одбиена")); }
  } catch (e) { console.error(e); return toast(T("Error enabling push", "Грешка при вклучување")); }
  await keepPushAlive();
  toast(state.pushSaved ? T("Notifications on for this phone", "Известувањата се вклучени за овој телефон")
    : T("This phone could not be signed up", "Телефонот не може да се пријави"));
}
// A notification sent now through the same server and route the reminders
// take, to this person's phones only — so "do they reach me" has an answer.
async function testPush() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return toast(T("Sign in first", "Прво најави се"));
  let r, j = {};
  try {
    r = await fetch(CONFIG.SUPABASE_URL + "/functions/v1/push?test=1", { method: "POST",
      headers: { Authorization: "Bearer " + session.access_token, apikey: CONFIG.SUPABASE_ANON_KEY } });
    j = await r.json().catch(() => ({}));
  } catch (e) { return say(T("Could not reach the server: ", "Серверот не е достапен: ") + e.message); }
  if (!r.ok) return say(T(`The server did not send it (${r.status}).`, `Серверот не го испрати (${r.status}).`));
  if (!j.sent) {
    state.pushSaved = false; updatePushState();
    return say(T("The server has no phone of yours to send to. Tap Enable, then try again.",
      "Серверот нема твој телефон на кој да прати. Допри Вклучи, па пробај пак."));
  }
  toast(T(`Sent to ${j.sent} device${j.sent > 1 ? "s" : ""} — it should arrive in a few seconds`,
    `Испратено на ${j.sent} уред(и) — треба да стигне за неколку секунди`));
}
async function getSetting(key, fallback) {
  try {
    const { data, error } = await db.from("app_settings").select("value").eq("key", key).maybeSingle();
    if (error || !data) return fallback;
    const v = typeof data.value === "string" ? data.value.replace(/"/g, "") : data.value;
    return v || fallback;
  } catch { return fallback; }
}

// The key goes into a table the app can write but never read: there is no
// select policy on it, so only the server (service role) can fetch it.
// Putting a backup back. Order matters: a stay needs its apartment to exist
// first, an offer needs its client, and so on.
// parents before children, or the foreign keys reject the rows
const RESTORE_ORDER = ["app_settings", "user_roles", "team_members", "accounts", "suppliers",
  "clients", "apartments", "articles", "statements",
  "offers", "purchases", "stays", "bills", "policies",
  "tasks", "task_templates", "task_completions", "ical_feeds",
  "documents", "installations", "movements", "article_prices", "offer_payments",
  "policy_payments", "elaks_cash"];

function restoreJson(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    let file;
    try { file = JSON.parse(fr.result); } catch { return say("That file is not a Centrala backup."); }
    const data = file.data || file;              // the export nests tables under "data"
    const tables = RESTORE_ORDER.filter((t) => Array.isArray(data[t]) && data[t].length);
    if (!tables.length) return say("Nothing to restore — the file has no records in it.");
    const summary = tables.map((t) => `· ${t.replace(/_/g, " ")}: ${data[t].length}`).join("\n");
    if (!await ask(`Restore this backup?\n\n${summary}\n\nExisting records with the same id are updated; nothing is deleted.`)) return;
    openSheet('<h2>Restoring…</h2><div class="skel"></div><div class="skel"></div>');
    const done = [], failed = [];
    for (const t of tables) {
      try {
        // in batches, so one large table cannot time out the whole restore
        for (let i = 0; i < data[t].length; i += 200) {
          const chunk = data[t].slice(i, i + 200);
          const { error } = await db.from(t).upsert(chunk, { onConflict: t === "app_settings" ? "key" : "id" });
          if (error) throw error;
        }
        done.push(`${t.replace(/_/g, " ")}: ${data[t].length}`);
      } catch (e) {
        console.error("restore", t, e);
        failed.push(`${t.replace(/_/g, " ")} — ${e.message || "failed"}`);
      }
    }
    await refreshAll();
    openSheet(`<h2>Restore finished</h2>
      ${done.length ? '<div class="sec">Put back</div>' + done.map((d) => `<div class="mov"><span>${esc(d)}</span><span class="hok">✓</span></div>`).join("") : ""}
      ${failed.length ? '<div class="sec" style="color:var(--danger)">Could not restore</div>'
        + failed.map((d) => `<div class="mov"><span>${esc(d)}</span></div>`).join("")
        + '<p class="muted" style="font-size:12.5px">Usually a table that no longer has the same columns. The rest went in.</p>' : ""}
      <button class="btn" onclick="closeSheet();render()">Done</button>`);
  };
  fr.readAsText(f);
}

// Pulls the last fortnight from every table that records an author, so you can
// see what your team has been doing without opening each screen.
async function loadActivity() {
  const el = $("act-list");
  if (!el) return;
  const since = backDays(14);
  const q = (t, cols, dateCol) => db.from(t).select(cols).gte(dateCol, since)
    .order(dateCol, { ascending: false }).limit(60);
  const [cash, movs, stays, offers, purch, bills] = await Promise.all([
    q("elaks_cash", "id, amount, note, created_at, created_by", "created_at"),
    q("movements", "id, type, qty, note, article_id, created_at, created_by", "created_at"),
    q("stays", "id, guest_name, check_in, apartment_id, created_at, created_by", "created_at"),
    q("offers", "id, number, title, created_at, created_by", "created_at"),
    q("purchases", "id, supplier, doc_no, total, created_at, created_by", "created_at"),
    q("bills", "id, kind, amount, apartment_id, created_at, created_by", "created_at"),
  ]);
  const artName = (id) => (state.stock.find((a) => a.id === id) || {}).name || "article";
  const aptName = (id) => (state.apartments.find((a) => a.id === id) || {}).name || "apartment";
  const rows = [];
  for (const r of cash.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `${(parseFloat(r.amount) || 0) >= 0 ? "Cash in" : "Cash out"} ${fmt(Math.abs(r.amount))} ден.${r.note ? " · " + r.note : ""}` });
  for (const r of movs.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `${r.type === "in" ? "Stock in" : "Stock out"} ${fmt(Math.abs(r.qty))} · ${artName(r.article_id)}` });
  for (const r of stays.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `Booking · ${r.guest_name} · ${aptName(r.apartment_id)} from ${dmy(r.check_in)}` });
  for (const r of offers.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `Offer ${r.number}${r.title ? " · " + r.title : ""}` });
  for (const r of purch.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `Purchase ${r.supplier}${r.doc_no ? " · " + r.doc_no : ""} · ${fmt(r.total)} ден.` });
  for (const r of bills.data || []) rows.push({ at: r.created_at, by: r.created_by,
    what: `Bill ${r.kind} · ${aptName(r.apartment_id)} · ${fmt(r.amount)} ден.` });

  rows.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (!rows.length) return (el.innerHTML = '<p class="muted">Nothing recorded in the last two weeks.</p>');

  let day = null, html = "";
  for (const r of rows.slice(0, 120)) {
    const d = String(r.at).slice(0, 10);
    if (d !== day) { html += `<div class="sec">${dmy(d)}</div>`; day = d; }
    const who = (!r.by || r.by === state.uid) ? "you" : (personName(r.by) || "someone");
    html += `<div class="mov"><span>${esc(r.what)}</span>
      <span class="muted nw">${esc(who)} · ${String(r.at).slice(11, 16)}</span></div>`;
  }
  el.innerHTML = html + '<p class="muted" style="font-size:12.5px">Entries made before this was switched on show no name.</p>';
}

async function saveAiKey() {
  const key = ($("ai-key").value || "").trim();
  if (!key) return toast("Paste the key first");
  if (!/^sk-ant-/.test(key)) {
    if (!await ask("That does not look like an Anthropic key (they start with sk-ant-).\n\nSave it anyway?")) return;
  }
  // goes through a function that runs with the database's own rights, so the
  // key can be written to a table nothing signed in is allowed to read

async function backupJson() {
  toast("Preparing backup…");
  // photos are deliberately excluded: they are large, and a backup that fails
  // when you need it is worse than one that leaves images behind
  const tables = ["app_settings", "user_roles", "team_members", "accounts", "suppliers",
                  "clients", "apartments", "articles", "statements",
                  "tasks", "task_completions", "task_templates",
                  "offers", "offer_payments", "purchases", "movements", "article_prices",
                  "installations", "documents",
                  "policies", "policy_payments",
                  "stays", "bills", "ical_feeds", "elaks_cash"];
  const out = { app: "Centrala", version: 1, exported_at: new Date().toISOString(), data: {} };
  const missed = [];
  for (const t of tables) {
    try {
      const { data, error } = await db.from(t).select("*");
      if (error) { missed.push(t); continue; }
      out.data[t] = data || [];
    } catch { missed.push(t); }
  }
  const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "centrala-backup-" + todayStr() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast(missed.length ? "Backup saved (skipped: " + missed.join(", ") + ")" : "Backup downloaded");
}

const BILL_TYPES = ["electricity", "water", "internet", "building", "heating", "booking"];
const BILL_LBL = { electricity: "Electricity", water: "Water", internet: "Internet", building: "Building", heating: "Heating", booking: "Booking" };
const sumBy = (arr, f) => arr.reduce((a, x) => a + (parseFloat(f(x)) || 0), 0);

// one row of the apartments bank: net on the right, the arithmetic beneath it
function bankRow(label, inc, bil) {

// Money sits in three places. A booking that has not been filed by hand is
// filed by where it came from — Airbnb pays into Payoneer, so it lands there.
// Set an account to what it actually holds. Rather than making you work out a
// starting figure, you type the real balance and the difference is stored.
function openAccountSheet(id) {
  const a = state.accounts.find((x) => x.id === id);

    <label>${T("Money arrives this many days after check-in", "Парите стигнуваат вака многу дена по пријавата")}</label>
    <input id="ac-delay" type="number" min="0" max="30" value="${parseInt(a.payout_delay_days) || 0}">
    <p class="muted" style="font-size:12.5px">${T(
      "0 for cash in your hand. Airbnb usually pays out the day after the guest arrives, so 1 suits Payoneer.",
      "0 за кеш в рака. Airbnb обично исплаќа ден по пристигнувањето на гостинот, па 1 одговара за Payoneer.")}</p>
    <button class="btn" onclick="saveAccount('${id}')">${T("Save", "Зачувај")}</button>

async function saveAccount(id) {
  const a = state.accounts.find((x) => x.id === id);
  const shown = accountBalances()[id] || 0;
  const fromMovements = shown - (parseFloat(a.opening_balance) || 0);
  const real = parseFloat($("ac-real").value);
  const row = { payout_delay_days: Math.max(0, parseInt($("ac-delay").value) || 0) };
  if (Number.isFinite(real)) row.opening_balance = Math.round((real - fromMovements) * 100) / 100;
  try { await dbq(db.from("accounts").update(row).eq("id", id), "Not saved"); } catch { return; }
  closeSheet(); await refreshAll(["accounts"]); render(); toast(T("Saved", "Зачувано"));
}

function accountMap() {
  const raw = setting("account_by_source", "");
  if (!raw) return {};
  try { return typeof raw === "object" ? raw : JSON.parse(raw); } catch { return {}; }
}
const accountName = (id) => (state.accounts.find((a) => a.id === id) || {}).name || "";
function accountFor(row) {
  if (row.account_id) return row.account_id;
  const bySource = accountMap()[row.source || "Direct"];
  if (bySource) return bySource;
  const cash = state.accounts.find((a) => /cash|кеш/i.test(a.name));
  return cash ? cash.id : null;
}
// What is in each account: money already received, less what has been paid out.
// Airbnb pays out the day after arrival, so an account can hold money later
// than the guest turns up. Delay is per account, 0 for cash in the hand.
function moneyArrived(s, acct) {
  const delay = parseInt((acct || {}).payout_delay_days) || 0;
  if (!delay) return stayStarted(s);
  const ci = dOnly(s.check_in);
  if (!ci) return false;
  const d = new Date(ci + "T12:00");
  d.setDate(d.getDate() + delay);
  return d.toLocaleDateString("sv-SE") <= todayStr();
}
// Somebody limited to their own apartments should see their own money. The
// bookings, bills and spending are already only theirs — the database hands
// over nothing else — but an account's starting amount is a shared figure and
// would drag the owner's takings into their total, so it starts at zero.
const aptsOwnOnly = () => !state.perm.owner && !!state.perm.aptsOwnOnly;
// Given a flat, what that flat alone has put into each account and taken out
// of it. An account's starting amount belongs to no one flat, so it is left out.
function accountBalances(aptId) {
  const bal = {};
  const shared = !aptsOwnOnly() && !aptId;
  const mine = (r) => !aptId || (!!r && r.apartment_id === aptId);
  for (const a of state.accounts) bal[a.id] = shared ? (parseFloat(a.opening_balance) || 0) : 0;
  for (const p of state.stayPays) {
    // where the payment went: what was chosen on it, else where that booking pays
    const s = state.stays.find((x) => x.id === p.stay_id);
    if (!mine(s)) continue;
    const id = p.account_id || (s ? accountFor(s) : null);
    if (id) bal[id] = (bal[id] || 0) + (parseFloat(p.amount) || 0);
  }
  // rent lands where it was paid to, else where the lease says it goes
  for (const p of state.rentPays || []) {
    if (!mine(p)) continue;
    const l = (state.leases || []).find((x) => x.id === p.lease_id);
    const id = p.account_id || (l && l.account_id) || accountFor({});
    if (id) bal[id] = (bal[id] || 0) + (parseFloat(p.amount) || 0);
  }
  for (const b of state.bills) {
    if (!mine(b)) continue;
    const id = accountFor(b);
    if (id) bal[id] = (bal[id] || 0) - (parseFloat(b.amount) || 0);
  }
  // one-off spending leaves the account it was paid from — the plumber, a new
  // mattress, restocking. This was going into the figures but not out of them.
  for (const e of (state.expenses || [])) {
    if (!mine(e)) continue;
    const id = e.account_id || accountFor(e);
    if (id) bal[id] = (bal[id] || 0) - (parseFloat(e.amount) || 0);
  }
  // apartment starting amounts are cash on hand
  const cash = state.accounts.find((a) => /cash|кеш/i.test(a.name));
  if (cash) bal[cash.id] = (bal[cash.id] || 0) + sumBy(state.apartments.filter((a) => !aptId || a.id === aptId), (a) => a.opening_balance);
  return bal;
}

// The chips at the top choose the flat the whole screen is about, the card
// with the money included, since flats can be looked after by different
// people. The choice stays on this phone for next time.
// (called while state itself is being made, so no constants from further down)
function keptAptFilter() {

function renderApt() {
  // a flat chosen earlier may since have been put away or taken off
  const one = state.apartments.find((a) => a.id === state.aptFilter) || null;
  if (!one && state.aptFilter !== "all" && !state.loading) keepAptFilter("all");
  const flat = one ? one.id : null;
  const inF = (r) => !flat || r.apartment_id === flat;
  const stays = state.stays.filter(inF), bills = state.bills.filter(inF), exps = (state.expenses || []).filter(inF);
  const curM = new Date().getFullYear() + "-" + String(new Date().getMonth() + 1).padStart(2, "0");
  const yr = String(new Date().getFullYear());
  const inM = (d, m) => (d || "").slice(0, 7) === m;
  // what the month earned after the platform and the cleaner, not before
  const staysM = stays.filter((s) => inM(s.check_in, curM));
  const staysY = stays.filter((s) => (s.check_in || "").slice(0, 4) === yr);
  // a flat let by the month earns its rent for each month, as a booking earns its price
  const incM = sumBy(staysM, stayNet) + rentEarned(curM, flat);
  const expM = sumBy(exps.filter((e) => inM(e.spent_on, curM)), (e) => e.amount);
  const expY = sumBy(exps.filter((e) => (e.spent_on || "").slice(0, 4) === yr), (e) => e.amount);
  const incY = sumBy(staysY, stayNet)
    + Array.from({ length: Number(curM.slice(5, 7)) }, (_, i) => rentEarned(`${yr}-${p2(i + 1)}`, flat)).reduce((a, b) => a + b, 0);
  // a payment knows its booking, not its flat
  const stayIds = new Set(stays.map((s) => s.id));
  const pays = flat ? state.stayPays.filter((p) => stayIds.has(p.stay_id)) : state.stayPays;
  const rents = (state.rentPays || []).filter(inF);
  const recAll = sumBy(pays, (p) => p.amount) + sumBy(rents, (p) => p.amount);
  const openAll = sumBy(state.apartments.filter((a) => !flat || a.id === flat), (a) => a.opening_balance);
  const bilAll = sumBy(bills, (b) => b.amount);
  const expAll = sumBy(exps, (e) => e.amount);
  // the view sums the full history; the local figure is the fallback if it is missing
  // apt_cash_total sums the whole history in one figure, which is not this
  // person's history when they are limited to their own flats
  // — nor when some flats are put away, nor one flat's; and the view knows nothing of rent yet
  const cashAll = (flat || state.aptCash === null || aptsOwnOnly() || state.hideApts.size)
    ? (recAll + openAll - bilAll - expAll) : state.aptCash + sumBy(state.rentPays || [], (p) => p.amount);
  // everything still to collect, whether the guest has arrived or not
  const soon = sumBy(stays.filter((s) => !staySettled(s)), stayBalance) + rentOutstanding(flat);
  // of which bookings not begun: paid when the guest comes, so not late
  const later = sumBy(stays.filter((s) => !staySettled(s) && !stayStarted(s)), stayBalance);
  // bookings the calendars brought in with no price on them yet
  const noPrice = stays.filter(stayUnpriced);
  const bilM = sumBy(bills.filter((b) => inM(b.month, curM)), (b) => b.amount);
  const bilY = sumBy(bills.filter((b) => (b.month || "").slice(0, 4) === yr), (b) => b.amount);
  const occ = occupiedTonight();
  const bal = accountBalances(flat);
  const total = state.accounts.length ? Object.values(bal).reduce((s, v) => s + v, 0) : cashAll;
  // one flat shows only the accounts its money went through, and as figures:
  // setting an account's real balance is for the whole account, under All
  const accts = flat ? state.accounts.filter((a) => Math.round(bal[a.id] || 0) !== 0) : state.accounts;

  $("apt-bank").innerHTML = `<div class="card">

        <div class="bank-big">${fmt(total)} <span style="font-size:16px">ден.</span></div>
        <div class="bank-lbl">${flat
          // not money in hand: what the accounts really hold is only known for all of them together
          ? T("received from this apartment, less its costs", "примено од овој стан, минус трошоците")
          : T("money in hand", "пари вкупно")}</div>
        ${who ? `<div class="bank-lbl">${T("Managed by", "Го води")} ${esc(who)}</div>` : ""}
      </div>

        ? (occ.has(flat) ? T("occupied tonight", "зафатен вечерва") : T("free tonight", "слободен вечерва"))

    </div>

    ${accts.length ? `<div class="acct-grid">
      ${accts.map((a) => flat ? `<div class="acct" style="cursor:default">
        <span>${esc(a.name)}</span><b>${fmt(bal[a.id] || 0)}</b></div>` : `<div class="acct" role="button" tabindex="0"
          onclick="event.stopPropagation();openAccountSheet('${a.id}')">

    </div>` : ""}

    <div class="stat-row">
      <div class="stat" role="button" tabindex="0" title="${T(
          `Earned ${fmt(incM)} · bills ${fmt(bilM)} · spending ${fmt(expM)}`,

        onclick="event.stopPropagation();state.aptView='bills';renderApt()">
        <span>${T("This month, after costs", "Овој месец, по трошоци")}</span><b>${fmt(incM - bilM - expM)}</b></div>

        <span>${T("To collect", "За наплата")} ›</span>
        <b class="${soon - later > 0.005 ? "hflag" : soon ? "" : "muted"}">${fmt(soon)}</b>
        ${later > 0.005 ? `<span style="font-size:11px;margin-top:1px">${soon - later > 0.005
          ? T(`${fmt(later)} from guests to come`, `${fmt(later)} од гости што доаѓаат`)

  </div>`;
  // Rent only once some flat is let by the month

  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const headRow = `<div class="cal-head">${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"]
    .map((d, i) => `<span class="${i > 4 ? "we" : ""}">${d}</span>`).join("")}</div>`;
  for (const a of shownApartments()) {
    if (isMonthly(a)) {
      const l = leaseOn(a.id, `${state.aptMonth}-${p2(days)}`) || leaseOn(a.id, `${state.aptMonth}-01`);
      html += `<div class="cal-apt"><span>${esc(a.name)}</span></div>

          <span class="muted">${T("On monthly rent", "Под месечна кирија")} · </span>${l ? `<b>${esc(l.tenant_name)}</b>${
            l.end_date ? ` <span class="muted">${T("until", "до")} ${dmy(l.end_date)}</span>` : ""}` : `<span class="muted">${T("no tenant", "без закупец")}</span>`}</div>`;
      continue;
    }
    const mine = state.stays.filter((s) => s.apartment_id === a.id);
    let cells = '<button class="cal-d pad"></button>'.repeat(lead);
    let nights = 0;
    for (let d = 1; d <= days; d++) {
      const ds = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const st = mine.find((s) => s.check_in <= ds && s.check_out > ds);
      if (st) nights++;
      const cls = "cal-d" + (st ? " bk" : "") + (ds === today ? " now" : "");
      const act = st ? `openStaySheet('${st.id}')` : `openStaySheet(null, { apartment_id: '${a.id}', check_in: '${ds}' })`;
      const who = st ? `<small>${esc(initials(st.guest_name))}</small>` : "";
      cells += `<button class="${cls}" onclick="${act}" title="${st ? esc(st.guest_name) : "free"}">${d}${who}</button>`;
    }
    html += `<div class="cal-apt"><span>${esc(a.name)}</span>
      <span class="muted" style="font-weight:400;white-space:nowrap">${nights}/${days} nights</span></div>
      ${headRow}<div class="cal-grid">${cells}</div>`;
  }
  $("apt-body").innerHTML = html;
}

// Where the money is going: whatever "Money went to" is showing right now,
// which may have just been changed to Payoneer or Wise and not saved yet.
// Only if that select is not on screen does the booking's own account decide.
function stayPayAccount(s) {
  const sel = $("st-acct");
  return (sel && sel.value) || accountFor(s) || null;
}
// And how it was paid follows from that, rather than being assumed to be cash:
// money in the hand is cash, money in any other account arrived by transfer.
// Same reading of an account's name that accountFor and accountBalances use.
function methodForAccount(id) {
  const a = state.accounts.find((x) => x.id === id);
  return (!a || /cash|кеш/i.test(a.name)) ? "cash" : "bank";
}

function renderStays() {
  if (!state.apartments.length) { $("apt-body").innerHTML = '<div class="empty">Add an apartment first (Apartments tab above).</div>'; return; }
  const t = todayStr();
  // A guest is "currently staying" until the end of their check-out day —
  // one pass, so a booking can only ever land in a single section.
  const cur = [], up = [], past = [];
  for (const s of state.stays.filter(inAptFilter)) {
    const ci = dOnly(s.check_in), co = dOnly(s.check_out);
    if (!ci || !co) { up.push(s); continue; }
    if (ci > t) up.push(s);
    else if (stayEnded(s)) past.push(s);
    else cur.push(s);
  }
  cur.sort((a, b) => dOnly(a.check_out).localeCompare(dOnly(b.check_out)));
  up.sort((a, b) => dOnly(a.check_in).localeCompare(dOnly(b.check_in)));
  past.sort((a, b) => dOnly(b.check_out).localeCompare(dOnly(a.check_out)));

  // The only way one guest can show twice is two records for the same booking —
  // typically one typed by hand and the same one synced in from a platform.
  const dupes = [];
  const live = state.stays.filter((s) => dOnly(s.check_out) >= t && inAptFilter(s));
  for (let i = 0; i < live.length; i++) {
    for (let j = i + 1; j < live.length; j++) {
      const a = live[i], b = live[j];
      if (a.apartment_id !== b.apartment_id) continue;
      if (dOnly(a.check_in) < dOnly(b.check_out) && dOnly(b.check_in) < dOnly(a.check_out)) dupes.push([a, b]);
    }
  }

  let html = "";
  if (dupes.length) html += `<div class="card" style="border-color:var(--danger)">
    <b style="color:var(--danger)">${dupes.length} overlapping booking(s)</b>
    <div class="muted">Two records cover the same nights in one apartment — open each and delete the one you don't want.</div>
    ${dupes.slice(0, 5).map(([a, b]) => `<div class="mov">
      <span class="tapp" role="button" tabindex="0" onclick="openStaySheet('${a.id}')">${esc(a.guest_name)} ${dm(a.check_in)}→${dm(a.check_out)}${a.external_uid ? " · synced" : " · typed"} ›</span>
      <span class="tapp" role="button" tabindex="0" onclick="openStaySheet('${b.id}')">${esc(b.guest_name)} ${dm(b.check_in)}→${dm(b.check_out)}${b.external_uid ? " · synced" : " · typed"} ›</span>
    </div>`).join("")}
  </div>`;
  if (cur.length) html += '<div class="sec">Currently staying</div>' + cur.map((s) => stayRow(s)).join("");
  if (up.length) html += '<div class="sec">Upcoming</div>' + up.map((s) => stayRow(s)).join("");
  html += '<div class="sec">Past</div>' + (past.slice(0, 30).map((s) => stayRow(s)).join("") || '<p class="muted">No past stays.</p>');
  $("apt-body").innerHTML = html || (state.loading ? SKEL(3) : '<div class="empty">No guests yet.<br>Add with +</div>');
}

function nightsBetween(ci, co) {
  if (!ci || !co) return 0;
  return Math.round((Date.parse(co) - Date.parse(ci)) / 86400000);
}

function stayCalc() {
  const n = nightsBetween($("st-in").value, $("st-out").value);
  const a = state.apartments.find((x) => x.id === $("st-apt").value);
  const amt = $("st-amt");
  if (n > 0 && a && a.nightly_rate && !amt.dataset.touched && !amt.value) amt.value = n * a.nightly_rate;
  $("st-nights").textContent = n > 0
    ? `${n} night${n > 1 ? "s" : ""}${a && a.nightly_rate ? ` · rate ${fmt(a.nightly_rate)} ден./night` : ""}`
    : "";
}
const stayHasTask = (id) => !id ? true : state.tasks.some((t) => t.stay_id === id);

// One task per stay, dated the day before check-in so the existing
// reminder push does the notifying.
async function syncStayTask(stay, want) {
  const existing = state.tasks.find((t) => t.stay_id === stay.id);
  try {
    if (!want || !stay.check_in || stay.check_in < todayStr()) {
      if (existing && !want) await db.from("tasks").delete().eq("id", existing.id);
      return { ok: false, skipped: true };
    }
    const apt = state.apartments.find((a) => a.id === stay.apartment_id);
    const time = await getSetting("stay_remind_time", "09:00");
    const d = new Date(stay.check_in + "T12:00");
    d.setDate(d.getDate() - 1);
    const dayBefore = d.toLocaleDateString("sv-SE");
    const due = dayBefore < todayStr() ? todayStr() : dayBefore;
    const nights = nightsBetween(stay.check_in, stay.check_out);
    const row = {
      title: `Check-in: ${stay.guest_name}${apt ? " · " + apt.name : ""}`,
      context: "apts", due_date: due, due_time: time, remind: true,
      notes: `Arrives ${stay.check_in} · leaves ${stay.check_out} · ${nights} night(s)`
        + (stay.source && stay.source !== "Direct" ? " · " + stay.source : ""),
      // the flat as well as the booking, so the task follows who may see that flat
      stay_id: stay.id, apartment_id: stay.apartment_id,
    };
    if (existing && due > todayStr()) { row.done = false; row.reminded_on = null; }
    // supabase reports errors in the result rather than throwing, so check it
    const res = existing
      ? await db.from("tasks").update(row).eq("id", existing.id)
      : await db.from("tasks").insert(row);
    if (res.error) { console.error("stay task", res.error); return { ok: false, msg: res.error.message }; }
    return { ok: true, on: due };
  } catch (e) {
    console.error("stay task", e);
    return { ok: false, msg: e && e.message ? e.message : "unknown error" };
  }
}
async function saveStay(id) {
  const row = {
    apartment_id: $("st-apt").value, guest_name: $("st-guest").value.trim(),
    check_in: $("st-in").value, check_out: $("st-out").value,
    amount: parseFloat($("st-amt").value) || 0, source: $("st-src").value,
    account_id: ($("st-acct") || {}).value || null,
    commission: parseFloat(($("st-comm") || {}).value) || 0,
    cleaning_cost: parseFloat(($("st-clean") || {}).value) || 0,
    notes: $("st-notes").value.trim() || null,
    // only sent once the column is there, so a save never asks for one that is missing
    ...(state.stayPhoneCol ? { guest_phone: (($("st-phone") || {}).value || "").trim() || null } : {}),
  };
  if (!row.apartment_id) return toast("Add an apartment first");
  if (!row.guest_name) return toast("Enter guest name");
  if (!row.check_in || !row.check_out || row.check_out <= row.check_in) return toast("Check-out must be after check-in");
  const clash = state.stays.find((x) => x.id !== id && x.apartment_id === row.apartment_id
    && x.check_in < row.check_out && row.check_in < x.check_out);
  if (clash) return say(`Those dates overlap an existing booking:\n\n${clash.guest_name} · ${clash.check_in} → ${clash.check_out}`);
  const wantTask = $("st-task").classList.contains("on");
  let saved;
  try {
    saved = await dbq(id
      ? db.from("stays").update(row).eq("id", id).select().single()
      : db.from("stays").insert(row).select().single(), "Stay not saved");
  } catch (e) {
    if (e && (e.code === "23P01" || String(e.message || "").includes("stays_no_overlap"))) say("Those dates are already booked for this apartment.");
    return;
  }
  const res = await syncStayTask(saved, wantTask);
  closeSheet(); await refreshAll(["stays", "tasks", "aptCash"]); renderApt();
  if (res && res.ok) toast("Saved · reminder on " + dmy(res.on));
  else if (res && res.msg) say("The stay was saved, but its reminder task could not be created:\n\n" + res.msg
    + "\n\nIf this mentions a missing column, the tasks migration has not been run yet.");
  else toast("Saved");
}

function renderBills() {

  $("apt-body").innerHTML = html;

/* ---------- monthly rent ----------
   A flat let by the month has a tenant instead of guests, and its money is
   rent: so much a month, due on a given day. A lease says who, how much and
   from when; each payment says the month it pays for. leases and
   rent_payments arrive with migration 0006 — until it is run none of this
   shows, and the flats behave as before. */
const isMonthly = (a) => !!a && a.rent_mode === "monthly";
const ym = (d) => String(d || "").slice(0, 7);
const curYm = () => todayStr().slice(0, 7);
const shiftYm = (m, n) => {
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + n, 1);
  return d.getFullYear() + "-" + p2(d.getMonth() + 1);
};
// the tenant living in a flat on a day: the latest lease begun and not ended
const leaseOn = (aptId, day = todayStr()) => (state.leases || [])
  .filter((l) => l.apartment_id === aptId && l.start_date <= day && (!l.end_date || l.end_date >= day))
  .sort((a, b) => b.start_date.localeCompare(a.start_date))[0] || null;
// a tenant who has signed but not moved in yet: the soonest lease still to begin
const leaseNext = (aptId, day = todayStr()) => (state.leases || [])
  .filter((l) => l.apartment_id === aptId && l.start_date > day)
  .sort((a, b) => a.start_date.localeCompare(b.start_date))[0] || null;
// A tenancy on a flat let by the night is left over — the flat was switched
// back, or it was added by mistake. Its rent still counts until it is ended or
// deleted, so it is shown, not hidden: the one still running, coming or owing.
const strayLease = (aptId) => {
  const a = state.apartments.find((x) => x.id === aptId);
  if (!a || isMonthly(a)) return null;
  return leaseOn(aptId) || leaseNext(aptId)
    || (state.leases || []).find((l) => l.apartment_id === aptId && rentOwed(l).length) || null;
};
// a lease owes a month's rent for every month it touches
const leaseInMonth = (l, m) => ym(l.start_date) <= m && (!l.end_date || ym(l.end_date) >= m);
const rentDue = (l, m) => (leaseInMonth(l, m) ? parseFloat(l.rent) || 0 : 0);
const rentPaid = (l, m) => sumBy((state.rentPays || []).filter((p) => p.lease_id === l.id && ym(p.month) === m), (p) => p.amount);
const rentLeft = (l, m) => Math.max(0, rentDue(l, m) - rentPaid(l, m));
// the day it falls due — the 31st in a short month is that month's last day
const rentDueDate = (l, m) => {
  const [y, mo] = m.split("-").map(Number);
  return `${m}-${p2(Math.min(parseInt(l.due_day) || 1, new Date(y, mo, 0).getDate()))}`;
};
const rentLate = (l, m) => rentLeft(l, m) > 0.005 && rentDueDate(l, m) < todayStr();
// the months still open, from the start of the lease (two years back at most) to this one
function rentOwed(l) {
  const out = [], from = shiftYm(curYm(), -24);
  const last = l.end_date && ym(l.end_date) < curYm() ? ym(l.end_date) : curYm();
  for (let m = ym(l.start_date) > from ? ym(l.start_date) : from; m <= last; m = shiftYm(m, 1)) {
    if (rentLeft(l, m) > 0.005) out.push(m);
  }
  return out;
}
const rentOutstanding = (aptId) => sumBy((state.leases || []).filter((l) => !aptId || l.apartment_id === aptId),
  (l) => sumBy(rentOwed(l), (m) => rentLeft(l, m)));
// What the flats on monthly rent earn in a month — owed whether or not it is
// in yet, as a booking's price counts before the guest has paid it.
const rentEarned = (m, aptId) => sumBy((state.leases || []).filter((l) => !aptId || l.apartment_id === aptId), (l) => rentDue(l, m));
// The bills a flat asks you for: none when the tenant pays them, and never
// the platform's fee on a flat that is not on a platform.
const billTypesFor = (a) => (isMonthly(a) ? (a.tenant_pays_bills ? [] : BILL_TYPES.filter((t) => t !== "booking")) : BILL_TYPES);
const monthIn = (lang, m) => (lang === "mk" ? MONTHS_MK[Number(m.slice(5, 7)) - 1]
  : new Date(m + "-02T12:00").toLocaleDateString("en-GB", { month: "long" }));
const aptName = (id) => (state.apartments.find((a) => a.id === id) || {}).name || "";

function rentCell(l, m) {
  const label = monthName(m).slice(0, 3);
  if (!leaseInMonth(l, m)) return `<span class="rent-m off">${label}</span>`;
  const left = rentLeft(l, m), cls = left <= 0.005 ? "paid" : rentPaid(l, m) > 0 ? "part" : rentLate(l, m) ? "late" : "due";
  return `<button class="rent-m ${cls}" onclick="openRentPay('${l.id}','${m}')">${label}</button>`;
}
function renderRent() {

    const l = leaseOn(a.id), next = leaseNext(a.id);

    const nextLine = next ? `<div class="tapp" role="button" tabindex="0" onclick="openLeaseSheet('${next.id}')" style="margin-top:6px">

        ${next ? `<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">

    const left = rentLeft(l, m), paid = rentPaid(l, m), due = rentDueDate(l, m);
    const status = left <= 0.005 ? `<span class="hok">✓ ${T("paid", "платено")}</span>`

      : `<span class="muted">${T("due", "доспева")} ${dm(due)}</span>`;
    const earlier = rentOwed(l).filter((x) => x < m);
    const day = parseInt(l.due_day) || 1;
    return `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:baseline;gap:10px">
        <b>${esc(a.name)}</b><span class="nw">${monthName(m)}: ${status}</span></div>
      <div class="tapp" role="button" tabindex="0" onclick="openLeaseSheet('${l.id}')" style="margin-top:2px">
        <div class="o-num">${esc(l.tenant_name)}${l.tenant_phone ? " · " + esc(l.tenant_phone) : ""} ·
          ${fmt(l.rent)} ${T("ден. a month, due on the", "ден. месечно, доспева на")} ${langMk() ? ordMk(day) : ordEn(day)} ›</div></div>
      <div class="rent-strip">${Array.from({ length: 6 }, (_, i) => rentCell(l, shiftYm(m, i - 5))).join("")}</div>
      ${earlier.length ? `<div class="hflag" style="font-size:12.5px;margin-top:6px">${T(

        `Неплатено од претходно: ${earlier.length} мес. · ${fmt(sumBy(earlier, (x) => rentLeft(l, x)))} ден.`)}</div>` : ""}
      ${nextLine}
      <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn sm" onclick="openRentPay('${l.id}','${left > 0.005 ? m : (earlier[0] || m)}')">${T("Record rent", "Внеси кирија")}</button>

  }).join("") + `<p class="muted" style="font-size:12.5px;margin-top:4px">${T(

async function saveLease(id) {
  const row = {
    apartment_id: $("ls-apt").value, tenant_name: $("ls-name").value.trim(),
    tenant_phone: $("ls-phone").value.trim() || null,
    rent: parseFloat($("ls-rent").value) || 0,
    due_day: Math.min(31, Math.max(1, parseInt($("ls-day").value) || 1)),
    deposit: parseFloat($("ls-dep").value) || 0,
    account_id: $("ls-acct").value || null,
    start_date: $("ls-from").value || todayStr(), end_date: $("ls-to").value || null,
    notes: $("ls-notes").value.trim() || null,
  };
  if (!row.tenant_name) return toast(T("Enter the tenant's name", "Внеси го името на закупецот"));
  if (!(row.rent > 0)) return toast(T("Enter the monthly rent", "Внеси ја месечната кирија"));
  if (row.end_date && row.end_date < row.start_date) return toast(T("The end is before the start", "Крајот е пред почетокот"));
  // one tenant at a time: two leases on the same days would count the rent twice
  const clash = (state.leases || []).find((x) => x.id !== id && x.apartment_id === row.apartment_id
    && x.start_date <= (row.end_date || "9999") && row.start_date <= (x.end_date || "9999"));
  if (clash) {
    // say when, and take them to it: the clash may be a tenant not yet moved in
    const until = clash.end_date ? T(` until ${dmy(clash.end_date)}`, ` до ${dmy(clash.end_date)}`) : "";
    const open = await ask(T(
      `${clash.tenant_name} is already down for this apartment from ${dmy(clash.start_date)}${until}. Open that tenancy to change its dates, or end it first.`,
      `${clash.tenant_name} веќе е внесен за овој стан од ${dmy(clash.start_date)}${until}. Отвори го тој закуп за да ги смениш датумите, или прво заврши го.`),
      T("Open it", "Отвори го"));
    if (open) { closeSheet(); setTimeout(() => openLeaseSheet(clash.id), 240); }
    return;
  }
  try { await dbq(id ? db.from("leases").update(row).eq("id", id) : db.from("leases").insert(row), T("Not saved", "Не е зачувано")); }
  catch { return; }
  closeSheet(); await refreshAll(["leases"]); renderApt(); toast(T("Saved", "Зачувано"));
}
async function endLease(id) {
  const l = (state.leases || []).find((x) => x.id === id);
  if (!l) return;
  const day = await askText(T(`Last day of ${l.tenant_name}'s tenancy (YYYY-MM-DD)`, `Последен ден од закупот на ${l.tenant_name} (ГГГГ-ММ-ДД)`), todayStr());
  if (!day) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day.trim()) || day.trim() < l.start_date) return toast(T("That is not a date after the start", "Тоа не е датум по почетокот"));
  try { await dbq(db.from("leases").update({ end_date: day.trim() }).eq("id", id), T("Not saved", "Не е зачувано")); }
  catch { return; }
  closeSheet(); await refreshAll(["leases"]); renderApt(); toast(T("Tenancy ended", "Закупот е завршен"));
}
async function delLease(id) {
  const row = (state.leases || []).find((x) => x.id === id);
  if (!row || !await ask(T("Delete this tenant? Use it for one added by mistake.", "Да се избрише закупецот? За внесен по грешка."))) return;
  await deleteUndoable("leases", row, T("Tenant deleted", "Закупецот е избришан"), ["leases"]);
}

function openRentPay(leaseId, m) {
  const l = (state.leases || []).find((x) => x.id === leaseId);
  if (!l) return;
  m = m || curYm();
  // the months it can be for: the lease's own, the last year of them and the next one
  const months = [];
  for (let k = shiftYm(curYm(), 1); k >= shiftYm(curYm(), -12); k = shiftYm(k, -1)) if (leaseInMonth(l, k)) months.push(k);
  if (!months.includes(m) && leaseInMonth(l, m)) months.push(m);
  const state_ = (k) => rentLeft(l, k) <= 0.005 ? T("paid", "платено") : rentPaid(l, k) > 0.005 ? T("part paid", "делумно") : T("open", "отворено");
  openSheet(`<h2>${T("Rent", "Кирија")} · ${esc(l.tenant_name)}</h2>
    <p class="muted">${esc(aptName(l.apartment_id))} · ${fmt(l.rent)} ${T("ден. a month", "ден. месечно")}</p>
    <label>${T("For the month", "За месецот")}</label>
    <select id="rp-month" onchange="rentPayMonth('${leaseId}')">${months.map((k) =>
      `<option value="${k}" ${k === m ? "selected" : ""}>${monthName(k)} ${k.slice(0, 4)} — ${state_(k)}</option>`).join("")}</select>
    <div class="grid2">
      <div><label>${T("Amount (ден.)", "Износ (ден.)")}</label><input id="rp-amt" type="number" inputmode="decimal" step="any" value="${rentLeft(l, m) || l.rent}"></div>
      <div><label>${T("Paid on", "Платено на")}</label><input id="rp-on" type="date" value="${todayStr()}"></div>
    </div>
    <label>${T("Money went to", "Парите одат во")}</label>
    <select id="rp-acct">${state.accounts.map((x) => `<option value="${x.id}" ${(l.account_id || accountFor({})) === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
    <label>${T("Note (opt.)", "Белешка (опц.)")}</label><input id="rp-note">
    <button class="btn amber" onclick="saveRentPay('${leaseId}')">${T("Save payment", "Зачувај уплата")}</button>
    <button class="btn ghost" onclick="closeSheet();setTimeout(()=>openLeaseSheet('${leaseId}'),240)">${T(
      "The tenancy: change, end or delete it ›", "Закупот: измени, заврши или избриши ›")}</button>`);
}
// a different month: suggest what is still owed for it
function rentPayMonth(leaseId) {

// A tenant: a reminder that the rent is due, or word that it has arrived.
function messageTenant(leaseId) {
  const l = (state.leases || []).find((x) => x.id === leaseId);
  if (!l) return;
  const m = curYm(), owed = rentOwed(l);
  const paidMonths = (state.rentPays || []).filter((p) => p.lease_id === l.id).map((p) => ym(p.month)).sort();
  const lastPaid = paidMonths[paidMonths.length - 1] || m;
  const text = (lang, key) => {
    const mk = lang === "mk", name = firstName(l.tenant_name), apt = aptName(l.apartment_id);
    if (key === "receipt") {
      return msgLines(mk
        ? [`Здраво ${name},`, `потврдувам дека ја примив киријата за ${monthIn("mk", lastPaid)} за ${apt} — ${fmt(rentPaid(l, lastPaid))} ден. Ви благодарам!`, "", myName()]
        : [`Hello ${name},`, `this is to confirm I have received the rent for ${monthIn("en", lastPaid)} for ${apt} — ${fmt(rentPaid(l, lastPaid))} MKD. Thank you!`, "", myName()]);
    }
    const mo = owed.includes(m) ? m : (owed[0] || m), due = rentDueDate(l, mo), late = due < todayStr();
    const before = owed.filter((x) => x !== mo), extra = sumBy(before, (x) => rentLeft(l, x));
    return msgLines(mk
      ? [`Здраво ${name},`, `потсетник за киријата за ${monthIn("mk", mo)} за ${apt} — ${fmt(rentLeft(l, mo) || l.rent)} ден., ${late ? "која доспеа на" : "која доспева на"} ${dmy(due)}.`,
         extra > 0.005 ? `Од претходните месеци останува уште ${fmt(extra)} ден.` : null, "", "Ви благодарам,", myName()]
      : [`Hello ${name},`, `a reminder about the rent for ${monthIn("en", mo)} for ${apt} — ${fmt(rentLeft(l, mo) || l.rent)} MKD, ${late ? "which was due on" : "due on"} ${dmy(due)}.`,
         extra > 0.005 ? `There is also ${fmt(extra)} MKD still open from earlier months.` : null, "", "Thank you,", myName()]);
  };
  openMessage({
    title: T("Message to the tenant", "Порака до закупецот"), to: `${l.tenant_name} · ${aptName(l.apartment_id)}`,
    phone: l.tenant_phone || "", phone0: l.tenant_phone || "", lang: langFor(l.tenant_name),
    templates: [["remind", T("Rent reminder", "Потсетник за кирија")], ["receipt", T("Rent received", "Кирија примена")]],
    key: owed.length ? "remind" : "receipt", text,
    savePhone: async (v) => {
      await dbq(db.from("leases").update({ tenant_phone: v }).eq("id", l.id), T("Number not kept", "Бројот не е зачуван"));
      l.tenant_phone = v;
    },
  });
}

/* ---------- which apartments a person sees ----------
   Two lists, both from migration 0006. hide_apts is your own screen: the
   flats you have chosen not to look at, as the owner who sees them all — out
   of every list and every total here, but nobody loses access to anything.
   apt_ids is access: the flats beyond their own that a limited person may
   see, and the database hands them nothing else. */
function applyAptHiding(keys) {
  const hid = state.hideApts;
  if (!hid || !hid.size) return;
  const keep = (r) => !hid.has(r.apartment_id);
  // a payment knows its booking, not its flat — so note the hidden bookings first
  if (keys.includes("stays")) {
    state.hiddenStays = new Set(state.stays.filter((s) => !keep(s)).map((s) => s.id));
    state.stays = state.stays.filter(keep);
  }
  if (keys.includes("apartments")) state.apartments = state.apartments.filter((a) => !hid.has(a.id));
  for (const k of ["bills", "expenses", "feeds", "leases", "rentPays"]) if (keys.includes(k)) state[k] = (state[k] || []).filter(keep);
  if (keys.includes("stayPays")) state.stayPays = state.stayPays.filter((p) => !(state.hiddenStays || new Set()).has(p.stay_id));
  if (keys.includes("tasks")) state.tasks = state.tasks.filter((t) => (!t.apartment_id || !hid.has(t.apartment_id))
    && (!t.stay_id || !(state.hiddenStays || new Set()).has(t.stay_id)));
}
let myAptsDraft = null;

  myAptsDraft = { all, hide: new Set(state.hideApts) };

function renderMyApts() {

      "Отчекирај ги оние што не сакаш да ги гледаш — излегуваат од твоите листи и збирови. Никој не губи пристап, а можеш да ги вратиш тука кога сакаш.")}</p>
    <div style="margin-top:10px">${d.all.map((a) => {

/* ---------- messages to clients and guests ----------
   One sheet writes them all: an invoice and the reminder that follows it, a
   policy coming to an end, a guest's way in and the thank-you after. It opens
   the chat in WhatsApp or Viber with the words already typed, or hands the
   words — and the PDF, where there is one — to any app through the phone's
   share sheet. The words can be changed before they go. */
let msg = null;

// Macedonian numbers are written 070 123 456 or +389 70 123 456; both chat
// apps want the international form, digits only
function intlPhone(raw) {
  const d = String(raw || "").replace(/[^\d+]/g, "");
  if (!d) return "";
  if (d.startsWith("+")) return d.slice(1).replace(/\D/g, "");
  if (d.startsWith("00")) return d.slice(2);
  if (d.startsWith("0")) return "389" + d.slice(1);
  if (d.length === 8) return "389" + d;                 // 70 123 456, the 0 left off
  return d;
}
// a number written into a stay's notes, from before there was a field for it
const phoneIn = (s) => ((String(s || "").match(/(?:\+|00)?\d[\d\s\/-]{6,}\d/) || [""])[0]).trim();
const firstName = (n) => String(n || "").trim().split(/\s+/)[0] || "";
const myName = () => personName(state.uid) || "";
// a guest who writes their name in Cyrillic is written to in Macedonian
const langFor = (name) => (/[Ѐ-ӿ]/.test(name || "") ? "mk" : "en");

// m: { title, to, phone, templates: [[key, label]], key, lang, text(lang, key),
//      makeFile() → Promise<File>, savePhone(phone) }
function openMessage(m) {
  msg = { lang: "mk", ...m, ready: null };
  if (m.makeFile) {
    // drawn while the words are read, so Share has the file the moment it is tapped
    m.makeFile().then((f) => { if (msg && msg.makeFile === m.makeFile) { msg.ready = f; msgShareReady(); } })
      .catch((e) => { console.error(e); if (msg) { msg.fileErr = e.message || String(e); msgShareReady(); } });
  }
  renderMessage();
}
function renderMessage() {
  const m = msg;
  openSheet(`<h2>${esc(m.title)}</h2>
    ${m.to ? `<p class="muted">${esc(m.to)}</p>` : ""}
    ${m.templates ? `<div class="chips" style="margin-top:10px">${m.templates.map(([k, l]) =>
      `<button class="chip ${m.key === k ? "on" : ""}" onclick="msgSet('key','${k}')">${l}</button>`).join("")}</div>` : ""}
    <div class="chips" style="margin-top:8px">${[["mk", "Македонски"], ["en", "English"]].map(([k, l]) =>
      `<button class="chip sm ${m.lang === k ? "on" : ""}" onclick="msgSet('lang','${k}')">${l}</button>`).join("")}</div>
    <label>${T("Phone", "Телефон")}</label>
    <input id="msg-phone" type="tel" inputmode="tel" value="${esc(m.phone || "")}"
      placeholder="${T("No number — you will pick the chat", "Нема број — ќе го избереш разговорот")}">
    <label>${T("Message", "Порака")}</label>
    <textarea id="msg-text" rows="9" oninput="msg.edited=this.value">${esc(m.edited ?? m.text(m.lang, m.key))}</textarea>
    ${m.makeFile && m.fileSent
      // Viber takes a shared PDF and drops the words that came with it, so
      // once the file has gone the words are a second step: the chat opens
      // on the same person with them written in, one tap to send.
      ? `<div class="card" style="margin-top:12px">
           <b>\u2713 ${T("The PDF has gone", "PDF-от е испратен")}</b>
           <p class="muted" style="font-size:12.5px;margin-top:4px">${T(
             "Viber sends the file without the words. Send them now: the chat opens with them written in. (WhatsApp keeps them with the file.)",
             "Viber го праќа фајлот без текстот. Прати го сега: разговорот се отвора со текстот внатре. (WhatsApp го задржува со фајлот.)")}</p>
           <div class="grid2" style="margin-top:8px">
             <button class="btn sm msg-vb" style="width:100%" onclick="msgSend('viber')">${T("Words to Viber", "Текст на Viber")}</button>
             <button class="btn sm msg-wa" style="width:100%" onclick="msgSend('wa')">${T("Words to WhatsApp", "Текст на WhatsApp")}</button>
           </div>
         </div>
         <button class="btn ghost" onclick="closeSheet()">${T("Done", "Готово")}</button>`
    : m.makeFile
      // A link into WhatsApp or Viber can carry words but never a file, so
      // with a PDF the first button is the phone's share menu, and the two
      // app buttons say plainly that they send the words alone.
      ? `<button class="btn" id="msg-share" onclick="msgShare()" disabled style="margin-top:12px">${ICON.share}<span id="msg-share-l"></span></button>
         <p class="muted" style="font-size:12.5px;margin-top:6px">${T(
           "Opens the phone's share menu: choose Viber or WhatsApp, then the chat. If the words do not go with the file, the next step sends them.",
           "Го отвора менито за споделување: избери Viber или WhatsApp, па разговорот. Ако текстот не оди со фајлот, следниот чекор го праќа.")}</p>
         <div class="sec" style="margin-top:14px">${T("Only the words, without the PDF", "Само текстот, без PDF")}</div>
         <div class="grid2">
           <button class="btn sm msg-wa" style="width:100%" onclick="msgSend('wa')">WhatsApp</button>
           <button class="btn sm msg-vb" style="width:100%" onclick="msgSend('viber')">Viber</button>
         </div>`
      : `<div class="grid2" style="margin-top:12px">
           <button class="btn msg-wa" onclick="msgSend('wa')">WhatsApp</button>
           <button class="btn msg-vb" onclick="msgSend('viber')">Viber</button>
         </div>
         <button class="btn ghost" onclick="msgShare()">${ICON.share}${T("Other apps…", "Други апликации…")}</button>`}
    <button class="btn ghost" onclick="msgCopy()">${T("Copy the words", "Копирај го текстот")}</button>`);
  msgShareReady();
}
function msgShareReady() {
  const b = $("msg-share"), l = $("msg-share-l");
  if (!b || !msg) return;
  b.disabled = !msg.ready;
  l.textContent = msg.ready ? T("Send with the PDF", "Испрати со PDF")
    : msg.fileErr ? T("The PDF could not be made", "PDF-от не може да се направи")
    : T("Preparing the PDF…", "Се подготвува PDF…");
}
// a template or language chip: the number typed so far stays, the words are written again
function msgSet(what, v) {
  if (!msg) return;
  if ($("msg-phone")) msg.phone = $("msg-phone").value;
  msg[what] = v;
  msg.edited = undefined;                              // new words for the new choice
  renderMessage();
}
const msgWords = () => (($("msg-text") || {}).value || "").trim();
// With a number the chat opens on that person; without one the app asks whom to send to.
const waLink = (phone, text) => `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
const viberLink = (phone, text) => phone ? `viber://chat?number=%2B${phone}&draft=${encodeURIComponent(text)}`
  : `viber://forward?text=${encodeURIComponent(text)}`;
async function msgSend(app) {
  const m = msg; if (!m) return;
  const text = msgWords(), raw = ($("msg-phone") || {}).value || "", phone = intlPhone(raw);
  if (!text) return toast(T("Write something first", "Прво напиши нешто"));
  if (app === "wa") {
    window.open(waLink(phone, text), "_blank");
  } else {
    // Viber takes the number and, on most phones, the words as a draft; they
    // are copied as well, for a phone that drops them
    try { await navigator.clipboard.writeText(text); } catch { /* the draft may still carry them */ }
    openLink(viberLink(phone, text));

// opening the Viber app, in one place so it can be watched
function openLink(url) { location.href = url; }
async function msgShare() {
  const m = msg; if (!m) return;
  const text = msgWords();
  const data = m.ready ? { files: [m.ready], title: m.ready.name.replace(/\.pdf$/, ""), text } : { text };
  if (!navigator.share || (navigator.canShare && !navigator.canShare(data))) {
    // a browser that cannot hand files on: save the PDF, copy the words
    if (m.ready) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(m.ready); a.download = m.ready.name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    }
    try { await navigator.clipboard.writeText(text); } catch { /* shown below anyway */ }
    return say(T("This browser cannot pass things to other apps. The words are copied", "Овој прелистувач не може да праќа во други апликации. Текстот е копиран")
      + (m.ready ? T(" and the PDF is downloaded.", " и PDF-от е преземен.") : "."));
  }
  // Viber takes the PDF but can leave the words behind, so they are on the
  // clipboard as well; not awaited, so the share keeps the tap that started it
  if (m.ready && navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  try { await navigator.share(data); }
  catch (e) {
    if (e && e.name === "AbortError") return;          // closed the share sheet without choosing
    console.error(e);
    return say(T("Could not share: ", "Не може да се сподели: ") + e.message);
  }
  msgKeepPhone(($("msg-phone") || {}).value || "");
  if (m.ready) {
    // the sheet stays, on the second step: the words, which Viber left behind
    m.phone = ($("msg-phone") || {}).value || "";
    m.edited = text;
    m.fileSent = true;
    return renderMessage();
  }
  closeSheet(); toast(T("Sent", "Испратено"));
}
async function msgCopy() {
  try { await navigator.clipboard.writeText(msgWords()); toast(T("Copied", "Копирано")); }
  catch { await askText(T("Copy this", "Копирај го ова"), msgWords()); }
}
