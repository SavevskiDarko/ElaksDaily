/* ---------- speaking a task ---------- */
const VOICE_LANG_KEY = "centrala_voice_lang";
const voiceLang = () => { try { return localStorage.getItem(VOICE_LANG_KEY) || "mk-MK"; } catch { return "mk-MK"; } };
const setVoiceLang = (l) => { try { localStorage.setItem(VOICE_LANG_KEY, l); } catch {} renderVoiceSheet(); };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// Turns what was said into a task: pulls out the day, the time, which part of
// the business it belongs to, and whether it is urgent — in Macedonian or English.
function parseSpoken(raw) {
  // \b is ASCII-only in JavaScript, so Cyrillic needs explicit whitespace
  // boundaries — without this nothing spoken in Macedonian is recognised.
  const W = (body, flags) => new RegExp("(?:^|\\s)(?:" + body + ")(?=\\s|$)", "i" + (flags || ""));
  let s = " " + String(raw || "").replace(/[,!?;·]/g, " ").replace(/\s+/g, " ").trim() + " ";
  const has = (body) => W(body).test(s);
  const eat = (body) => {                     // only scheduling words are removed
    const m = s.match(W(body));
    if (!m) return null;
    s = s.slice(0, m.index) + " " + s.slice(m.index + m[0].length);
    return m;
  };
  const out = { context: null, due_date: null, due_time: null, priority: false };

  const PRIO = "важно|итно|important|urgent|priority";
  out.priority = has(PRIO);

  // Detected, not deleted: "провери го станот" needs to keep the apartment.
  const ctx = [
    ["елакс|elaks|камера|камери|аларм|аларми|алармна|монтажа", "elaks"],
    ["стан|станот|станови|апартман|апартмани|гостин|гости|apartment|apartments|apts|guest|guests", "apts"],
    ["работа|работно|состанок|scrum|sprint|meeting|work", "work"],
    ["лично|приватно|personal|private", "personal"],
  ];
  for (const [body, c] of ctx) if (has(body)) { out.context = c; break; }

  // Tags are only tags when they come last, and that must be judged on the
  // sentence as spoken: "провери го станот во петок" ends with a date, so
  // "станот" is the object of the sentence, not a tag.
  const tagBodies = [PRIO].concat(ctx.map(([b]) => b));
  for (let pass = 0; pass < 3; pass++) {
    let cut = false;
    for (const body of tagBodies) {
      const tail = new RegExp("(?:^|\\s)(?:" + body + ")\\s*$", "i");
      if (!tail.test(s.trim())) continue;
      const left = s.trim().replace(tail, "").trim();
      // "check the apartment" — the word is the object, not a tag
      const dangling = /(?:^|\s)(?:the|a|an|to|and|of|на|во|го|ја|се|од|за|со|му|ми)$/i.test(left);
      if (!left || left.split(/\s+/).length < 2 || dangling) continue;
      s = " " + left + " "; cut = true; break;
    }
    if (!cut) break;
  }

  const D = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); };
  if (eat("задутре|day after tomorrow")) out.due_date = D(2);
  else if (eat("утре|tomorrow")) out.due_date = D(1);
  else if (eat("денес|вечерва|today|tonight")) out.due_date = D(0);
  else if (eat("следната недела|next week")) out.due_date = D(7);
  else {
    const days = [["недела", "sunday"], ["понеделник", "monday"], ["вторник", "tuesday"], ["среда", "wednesday"],
                  ["четврток", "thursday"], ["петок", "friday"], ["сабота", "saturday"]];
    for (let i = 0; i < 7; i++) {
      if (eat("(?:во |на |on )?(?:" + days[i][0] + "|" + days[i][1] + ")")) {
        const t = new Date();
        const add = (i - t.getDay() + 7) % 7 || 7;   // always the next one
        t.setDate(t.getDate() + add);
        out.due_date = t.toLocaleDateString("sv-SE");
        break;
      }
    }
  }
  if (!out.due_date) {
    const m = eat("(?:на|on the|on)\\s+(\\d{1,2})(?:\\.|ти|th|st|nd|rd)?");
    if (m) {
      const day = parseInt(m[1]);
      if (day >= 1 && day <= 31) {
        const t = new Date();
        if (day < t.getDate()) t.setMonth(t.getMonth() + 1);
        t.setDate(day);
        out.due_date = t.toLocaleDateString("sv-SE");
      }
    }
  }

  // "потсети ме" / "remind me" asks for a notification even without a time
  out.askedRemind = !!eat("потсети ме|потсети|remind me|reminder|alarm");

  // spoken hours often come back as words
  const NUM = { еден: 1, една: 1, два: 2, две: 2, три: 3, четири: 4, пет: 5, шест: 6, седум: 7,
    осум: 8, девет: 9, десет: 10, единаесет: 11, дванаесет: 12,
    one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9,
    ten: 10, eleven: 11, twelve: 12 };
  const morning = /наутро|утринава|morning|am\b/i.test(s);

  let m = eat("(?:во|в|at|@)?\\s*(\\d{1,2})[:.](\\d{2})(?:\\s*(?:часот|h))?");
  if (m) out.due_time = p2(Math.min(23, +m[1])) + ":" + p2(Math.min(59, +m[2]));
  if (!out.due_time) {
    m = eat("(?:во|at)\\s+(\\d{1,2}|" + Object.keys(NUM).join("|") + ")\\s*(am|pm|часот|h)?");
    if (m) {
      const raw = (m[1] || "").toLowerCase();
      let hh = /^\d+$/.test(raw) ? +raw : (NUM[raw] || 0);
      const suf = (m[2] || "").toLowerCase();
      if (suf === "pm" && hh < 12) hh += 12;
      else if (suf === "am" && hh === 12) hh = 0;
      // "во 5" almost always means the afternoon; "во 5 наутро" does not
      else if (hh >= 1 && hh <= 6 && !morning) hh += 12;
      if (hh <= 23) out.due_time = p2(hh) + ":00";
    }
  }
  const gotMorning = eat("наутро|утринава|morning");
  const gotNoon = eat("попладне|afternoon");
  const gotEve = eat("навечер|evening");
  if (!out.due_time) {
    if (gotMorning) out.due_time = "08:00";
    else if (gotNoon) out.due_time = "15:00";
    else if (gotEve) out.due_time = "19:00";
  }

  // Words tacked on the end as tags ("… елакс", "… urgent") are noise in a
  // title; the same words inside the sentence are part of it and stay.
  if (out.askedRemind && !out.due_time) {
    if (!out.due_date || out.due_date === new Date().toLocaleDateString("sv-SE")) {
      const n = new Date(); n.setHours(n.getHours() + 1, 0, 0, 0);   // an hour from now
      out.due_time = p2(n.getHours()) + ":00";
      if (!out.due_date) out.due_date = n.toLocaleDateString("sv-SE");
    } else out.due_time = "09:00";
  }
  if (out.due_time && !out.due_date) out.due_date = new Date().toLocaleDateString("sv-SE");

  let title = s.replace(/\s{2,}/g, " ").trim();
  title = title.replace(/^[\s,.;:-]+|[\s,.;:-]+$/g, "");
  out.title = title.charAt(0).toUpperCase() + title.slice(1);
  return out;
}

let rec = null, voiceText = "", voiceFinal = "", voiceSession = "", voiceParsed = null;
let voiceStopping = false, silenceT = null, maxT = null, tickT = null, voiceStart = 0, voiceErr = "";

const VOICE_SILENCE_MS = 4000;   // how long a pause may last before it counts as "finished"
const VOICE_MAX_MS = 90000;      // hard ceiling

function startVoice() {
  if (!SR) return say("This phone's browser cannot listen.\n\nUse the microphone on your keyboard instead: tap +, then the mic key while typing the title.");
  voiceText = ""; voiceFinal = ""; voiceSession = ""; voiceParsed = null; voiceStopping = false; voiceErr = "";
  voiceStart = Date.now();
  openSheet(voiceSheetHtml("listening"));
  $("mic").classList.add("rec");
  tickT = setInterval(() => {
    const el = $("v-secs");
    if (el) el.textContent = Math.round((Date.now() - voiceStart) / 1000) + "s";
  }, 500);
  maxT = setTimeout(() => finishVoice(true), VOICE_MAX_MS);
  launchRec();
}
function launchRec() {
  try {
    rec = new SR();
    rec.lang = voiceLang();
    rec.interimResults = true;
    rec.continuous = true;                    // Chrome otherwise stops at the first pause
    rec.onresult = (e) => {
      // Rebuild from the whole result list every time. Appending as results
      // arrive double-counts: Chrome re-reports a phrase when it turns final
      // and again after each restart, which is what produced "јави се јави се".
      let fin = "", interim = "";
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) fin += (fin ? " " : "") + r[0].transcript.trim();
        else interim += r[0].transcript;
      }
      voiceSession = fin;
      voiceText = despam(mergeText(mergeText(voiceFinal, voiceSession), interim));
      const el = $("v-text");
      if (el) el.textContent = voiceText || "…";
      resetSilence();
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return;   // a pause, not a failure
      voiceErr = e.error === "not-allowed"
        ? "Microphone permission is off for this app. Allow it in the browser's site settings and try again."
        : "Listening failed: " + e.error;
      finishVoice(true);
    };
    rec.onend = () => {
      // Bank this engine's text, then build a NEW engine. Restarting the same
      // one keeps its results list, so it hands the whole utterance back again
      // and the transcript grows with every pause.
      voiceFinal = despam(mergeText(voiceFinal, voiceSession));
      voiceSession = "";
      if (!voiceStopping && Date.now() - voiceStart < VOICE_MAX_MS) {
        setTimeout(() => { if (!voiceStopping) launchRec(); }, 150);
        return;
      }
      finishVoice();
    };
    rec.start();
    resetSilence();
  } catch (e) {
    voiceErr = "Could not start listening: " + e.message;
    finishVoice(true);
  }
}
// Joins two pieces of transcript without repeating anything they share.
// Some engines hand back the whole utterance again after a restart, so a
// plain concatenation grows: "call Evan and make a call Evan and make a new".
function mergeText(a, b) {
  a = String(a || "").trim(); b = String(b || "").trim();
  if (!a) return b;
  if (!b) return a;
  if (a === b || a.endsWith(b)) return a;      // already contained
  if (b.startsWith(a)) return b;               // b is the same, only longer
  return a + " " + b;
}

// Recognisers stutter: a word or short phrase repeated back to back is almost
// always an artefact, not speech. Collapse those, leave everything else alone.
function despam(t) {
  let s = String(t || "").replace(/\s+/g, " ").trim();
  const re = /(^|\s)((?:\S+\s+){0,7}?\S+)(?:\s+\2)+(?=\s|$)/gi;
  for (let pass = 0; pass < 5; pass++) {     // "Јави јави се јави се" needs more than one sweep
    const before = s;
    s = s.replace(re, "$1$2");
    if (s === before) break;
  }
  return s.trim();
}
function resetSilence() {
  clearTimeout(silenceT);
  silenceT = setTimeout(() => { if (voiceText.trim()) finishVoice(); }, VOICE_SILENCE_MS);
}
function stopVoice() { voiceStopping = true; try { rec && rec.stop(); } catch (_) {} finishVoice(); }
function finishVoice(force) {
  voiceStopping = true;
  clearTimeout(silenceT); clearTimeout(maxT); clearInterval(tickT);
  try { rec && rec.stop(); } catch (_) {}
  const m = $("mic"); if (m) m.classList.remove("rec");
  if (!sheetOpen) return;
  if (voiceErr) return renderVoiceSheet("error", voiceErr);
  if (!voiceText.trim()) return renderVoiceSheet("error", "I didn't hear anything.");
  voiceParsed = parseSpoken(voiceText);
  renderVoiceSheet("ready");
}

function toggleVoiceRemind() {

// Reminders reach a phone only when it allows notifications and the server
// holds its sign-up. When either is missing, Home says so — a phone can turn
// them off for an app it thinks unused, and nothing else would tell you.
function pushWarning() {
  if (!("Notification" in window) || !("serviceWorker" in navigator)) return "";
  const perm = Notification.permission;
  if (perm === "granted" && state.pushSaved !== false) return "";
  let until = 0;
  try { until = Number(localStorage.getItem("centrala_push_nag")) || 0; } catch {}
  if (Date.now() < until) return "";
  const what = perm === "denied"
    ? T("Notifications are blocked for Centrala on this phone, so reminders will not arrive. Allow them in the phone's settings: Apps → Centrala → Notifications.",
      "Известувањата за Centrala се блокирани на овој телефон, па потсетниците нема да стигнат. Дозволи ги во поставките: Апликации → Centrala → Известувања.")
    : perm === "granted" ? T("This phone is not signed up for notifications, so reminders will not arrive.",
      "Овој телефон не е пријавен за известувања, па потсетниците нема да стигнат.")
    : T("Notifications are off on this phone, so reminders will not arrive.", "Известувањата се исклучени на овој телефон, па потсетниците нема да стигнат.");
  return `<div class="hcard push-warn">
    <h3 style="color:var(--danger)">${T("Notifications off", "Известувањата се исклучени")}</h3>
    <p class="hsub" style="margin:0 0 10px">${what}</p>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      ${perm === "denied"
        ? `<button class="btn sm" onclick="openSetSheet('push')">${T("How to turn them on", "Како да ги вклучам")}</button>`
        : `<button class="btn sm amber" onclick="pushTurnOn()">${T("Turn on", "Вклучи")}</button>`}
      <button class="btn sm ghost" onclick="pushNagLater()">${T("Not now", "Не сега")}</button>
    </div></div>`;
}

const paymentsOf = (offerId) => state.payments.filter((p) => p.offer_id === offerId);
// The payments loaded are the latest few hundred, so an older offer may have
// only some of its own among them. Its kept total (paid_amount, written by
// syncOfferPaid on every change) is whole, and is what counts once the list is cut.
const offerPaid = (o) => {
  const rows = paymentsOf(o.id);
  const kept = o.paid_amount === null || o.paid_amount === undefined ? null : parseFloat(o.paid_amount) || 0;
  if (state.paymentsCut && kept !== null) return kept;
  return rows.length ? sumBy(rows, (p) => p.amount) : (kept || 0);
};
// all of one offer's payments, for its sheet, when the list is cut
async function ensurePaymentsOf(offerId) {
  if (!state.paymentsCut || !offerId) return;
  const r = await db.from("offer_payments").select("*").eq("offer_id", offerId);
  if (r.error) return;
  const have = new Set(state.payments.map((p) => p.id));
  state.payments = state.payments.concat((r.data || []).filter((p) => !have.has(p.id)));
}
const offerBalance = (o) => (parseFloat(o.grand_total) || 0) - offerPaid(o);
const offerSettled = (o) => offerPaid(o) > 0 && offerBalance(o) <= 0.005;

// offers.paid_at / paid_amount are a cache of the payments table, kept in
// step here so lists and the Home screen never need to join.
async function syncOfferPaid(offerId) {
  const { data, error } = await db.from("offer_payments").select("amount, paid_on, method").eq("offer_id", offerId);
  if (error) { console.error(error); return; }
  const rows = data || [];
  const sum = rows.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  const last = rows.map((r) => r.paid_on).sort().pop() || null;
  const methods = [...new Set(rows.map((r) => r.method))];
  await db.from("offers").update({
    paid_amount: rows.length ? sum : null,
    paid_at: rows.length ? last : null,
    paid_method: rows.length ? (methods.length > 1 ? "mixed" : methods[0]) : null,
  }).eq("id", offerId);
  // its invoice is paid exactly when these payments cover it
  const { data: invs } = await db.from("invoices").select("id, total, paid_on, cancelled").eq("offer_id", offerId);
  for (const i of (invs || []).filter((x) => !x.cancelled)) {
    const total = parseFloat(i.total) || 0;
    if (total <= 0.005) continue;                   // nothing to pay: left as marked
    const covered = rows.length > 0 && sum >= total - 0.005;
    if (covered && !i.paid_on) await db.from("invoices").update({ paid_on: last }).eq("id", i.id);
    else if (!covered && i.paid_on) await db.from("invoices").update({ paid_on: null }).eq("id", i.id);
  }
}
/* ---------- purchases: what you buy from suppliers ---------- */
// line: { article_id, name, qty, price (GROSS per unit), vat }
function purchaseTotals(items) {
  const byRate = {}; let gross = 0, net = 0;
  for (const it of items || []) {
    const t = (parseFloat(it.qty) || 0) * (parseFloat(it.price) || 0);
    const r = it.vat === undefined || it.vat === null ? 18 : (parseFloat(it.vat) || 0);
    const n = netOf(t, r);
    gross += t; net += n;
    byRate[r] = (byRate[r] || 0) + (t - n);
  }
  return { gross, net, vat: gross - net, byRate };
}
// Deliveries can take months and arrive in pieces, so each line tracks how
// much has actually turned up. Purchases received before this existed have
// received_at set and no per-line figure — treat those as fully arrived.
const lineQty = (it) => parseFloat(it.qty) || 0;
const lineRecv = (p, it) => (it.recv === undefined || it.recv === null)
  ? (p.received_at ? lineQty(it) : 0)
  : (parseFloat(it.recv) || 0);
const linePending = (p, it) => Math.max(0, lineQty(it) - lineRecv(p, it));
const purPending = (p) => (p.items || []).filter((it) => linePending(p, it) > 0.0001);
const purArrivedCount = (p) => (p.items || []).length - purPending(p).length;
const purFullyArrived = (p) => (p.items || []).length > 0 && purPending(p).length === 0;
const purchaseBalance = (p) => (parseFloat(p.total) || 0) - (parseFloat(p.paid_amount) || 0);
const purchaseOverdue = (p) => !!p.due_date && purchaseBalance(p) > 0.005 && p.due_date < todayStr();

let purItems = [];

// Two names are "the same" if they differ only by case, spacing or punctuation.
const normName = (s) => String(s || "").toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
// A parsed line often carries the supplier's code in front: "0015 · baterija…"
function splitCode(name) {
  const m = String(name || "").match(/^\s*([\p{L}\d][\p{L}\d._/-]{1,14})\s*[·:|-]\s*(.+)$/u);
  return m ? { code: m[1], rest: m[2].trim() } : { code: null, rest: String(name || "").trim() };
}
// Find an article this purchase line already belongs to, before making a new one.
function matchArticle(line, supplier) {
  const { code, rest } = splitCode(line.name);
  const wanted = code || line.code || null;
  if (wanted) {
    const bySupplierCode = state.stock.find((a) => a.active !== false && a.supplier_code
      && a.supplier_code.toLowerCase() === String(wanted).toLowerCase()
      && (!supplier || !a.supplier || a.supplier === supplier));
    if (bySupplierCode) return bySupplierCode;
    const byOwnCode = state.stock.find((a) => a.active !== false && a.code
      && a.code.toLowerCase() === String(wanted).toLowerCase());
    if (byOwnCode) return byOwnCode;
  }
  const n = normName(rest);
  if (n.length >= 6) {
    const byName = state.stock.find((a) => a.active !== false && normName(a.name) === n);
    if (byName) return byName;
  }
  return null;
}

// Photograph a delivery note; the server reads it and hands back lines to check.
function readDocPhoto(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  if (setting("ai_key_set", "") !== "yes")
    return say("Add your API key first: Settings → Document reading.");
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = async () => {
      // big enough to read small print, small enough to send quickly
      const scale = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(im.naturalWidth * scale);
      c.height = Math.round(im.naturalHeight * scale);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(im, 0, 0, c.width, c.height);
      const b64 = c.toDataURL("image/jpeg", 0.85).split(",")[1];
      await sendDocForReading(b64);
    };
    im.onerror = () => toast("Could not read that photo");
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
}

async function sendDocForReading(b64) {
  openSheet(`<h2>Reading the note…</h2>
    <div class="skel tall"></div><div class="skel"></div><div class="skel"></div>
    <p class="muted">This takes a few seconds. Nothing is saved until you confirm.</p>`);
  try {
    const { data: sess } = await db.auth.getSession();
    const res = await fetch(CONFIG.SUPABASE_URL + "/functions/v1/read-doc", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + (sess?.session?.access_token || ""),
        "apikey": CONFIG.SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ image: b64, mediaType: "image/jpeg" }),
    });
    const out = await res.json();
    if (!res.ok || out.error) throw new Error(out.error || ("Reading failed (" + res.status + ")"));
    showReadResult(out);
  } catch (e) {
    console.error(e);
    openSheet(`<h2>Could not read it</h2>
      <p class="muted">${esc(e.message || "Something went wrong.")}</p>
      <div class="grid2">

        <button class="btn ghost" style="width:100%" onclick="$('doc-file').click()">From gallery</button>
      </div>
      <button class="btn ghost" onclick="closeSheet()">Close</button>`);
  }
}

// Receiving does three things: creates any article that doesn't exist yet,
// refreshes the cost on the ones that do, and books the stock in.
let recvQty = {};
function receiveSheet(id) {
  const p = state.purchases.find((x) => x.id === id);
  const pend = purPending(p);
  if (!pend.length) return toast("Everything has already arrived");
  recvQty = {};
  (p.items || []).forEach((it, i) => { recvQty[i] = linePending(p, it); });
  openSheet(`
    <h2>What arrived?</h2>
    <p class="muted">${esc(p.supplier)}${p.doc_no ? " · " + esc(p.doc_no) : ""} — leave a line at 0 if it still hasn't come.</p>
    <div class="ohead" style="grid-template-columns:1fr 62px 62px"><span>Article</span><span>Ordered</span><span>Arrived</span></div>
    ${(p.items || []).map((it, i) => {
      const pen = linePending(p, it);
      return `<div class="oitem" style="grid-template-columns:1fr 62px 62px">
        <div style="min-width:0"><b>${esc(it.name)}</b>
          ${pen < lineQty(it) ? `<div class="muted">${fmt(lineRecv(p, it))} already in</div>` : ""}</div>
        <input class="mono" value="${fmt(lineQty(it))}" disabled>
        <input type="number" inputmode="decimal" min="0" step="any" value="${pen || 0}"
          ${pen ? "" : "disabled"} oninput="recvQty[${i}]=parseFloat(this.value)||0">
      </div>`;
    }).join("")}
    <button class="btn" style="margin-top:12px" onclick="confirmArrival('${id}')">Book what arrived into stock</button>
  `);
}
async function confirmArrival(id) {
  const p = state.purchases.find((x) => x.id === id);
  const items = p.items || [];
  const arriving = items.map((it, i) => ({ it, i, n: Math.min(Math.max(0, recvQty[i] || 0), linePending(p, it)) }))
    .filter((x) => x.n > 0.0001);
  if (!arriving.length) return toast("Nothing marked as arrived");
  // link anything that already exists, so a second delivery does not make a twin
  let matched = 0;
  for (const x of arriving) {
    if (x.it.article_id) continue;
    const hit = matchArticle(x.it, p.supplier);
    if (hit) { x.it.article_id = hit.id; x.matchedName = hit.name; matched++; }
  }
  const fresh = arriving.filter((x) => !x.it.article_id && (x.it.name || "").trim());
  const msg = `Book ${arriving.length} line(s) into stock?`
    + (matched ? `\n\n${matched} line(s) matched to articles you already have.` : "")
    + (fresh.length ? `\n\n${fresh.length} new article(s) will be created:\n· ` + fresh.map((f) => f.it.name).join("\n· ") : "");
  if (!await ask(msg)) return;
  // buy prices that moved, for the sell prices to follow once it is booked
  const moved = [];
  try {
    const lines = JSON.parse(JSON.stringify(items));
    for (const x of arriving) {
      const it = lines[x.i];
      const paid = parseFloat(it.price) || 0;
      if (!it.article_id) {
        const parts = splitCode(it.name);
        const made = await dbq(db.from("articles").insert({
          name: parts.rest || "Unnamed", category: "Other", unit: "ком", min_stock: 0,
          purchase_price: paid,
          sell_price: paid ? Math.round(paid * (1 + DEFAULT_MARKUP_PCT / 100)) : 0,
          vat_rate: it.vat ?? 18, supplier: p.supplier,
          supplier_code: parts.code || it.code || null, active: true,
        }).select().single(), "Article not created");
        it.article_id = made.id;
      } else {
        // the article carries the LATEST price paid; earlier ones live in the history
        const a = state.stock.find((x) => x.id === it.article_id);
        const was = a ? parseFloat(a.purchase_price) || 0 : 0, sell = a ? parseFloat(a.sell_price) || 0 : 0;
        if (a && was > 0 && sell > 0 && paid > 0 && Math.abs(paid - was) >= 1 && !moved.some((m) => m.id === a.id))
          moved.push({ id: a.id, name: a.name, unit: a.unit, was, now: paid, sell, pct: (sell / was - 1) * 100 });
        await dbq(db.from("articles").update({ purchase_price: paid }).eq("id", it.article_id), "Cost not updated");
      }
      await db.from("article_prices").insert({
        article_id: it.article_id, price: paid, qty: x.n, supplier: p.supplier,
        doc_no: p.doc_no || null, purchase_id: p.id, bought_on: p.doc_date || todayStr(),
      });
      it.recv = lineRecv(p, x.it) + x.n;
    }
    await dbq(db.from("movements").insert(arriving.map((x) => ({
      article_id: lines[x.i].article_id, type: "in", qty: x.n,
      ref: p.doc_no || null,
      note: `${p.supplier}${p.doc_no ? " · " + p.doc_no : ""}`,
    }))), "Stock not updated");
    const done = lines.every((it) => (parseFloat(it.recv) || 0) + 0.0001 >= lineQty(it));
    await dbq(db.from("purchases").update({
      items: lines,
      received_at: done ? todayStr() : null,
    }).eq("id", id), "Purchase not updated");
  } catch { return; }
  closeSheet(); await refreshAll(["purchases", "stock"]); render();
  const left = purPending(state.purchases.find((x) => x.id === id) || {}).length;
  const bits = [];
  if (matched) bits.push(`${matched} matched`);
  if (fresh.length) bits.push(`${fresh.length} new`);
  if (left) bits.push(`${left} still to come`);
  toast("Booked in" + (bits.length ? " · " + bits.join(" · ") : ""));
  if (moved.length) setTimeout(() => openSellPrices(moved), 300);
}

// A supplier's new price changes the cost, not the price you ask: left alone,
// the margin quietly shrinks. Each article's new sell price keeps the markup
// it had; one that went up is ticked to change, one that went down is not.
let sellMoves = [];
function openSellPrices(moved) {
  sellMoves = moved.map((m) => ({ ...m, to: markupPrice(m.now, m.pct), on: m.now > m.was }));
  openSheet(`
    <h2>${T("Buy prices changed", "Набавните цени се сменија")}</h2>
    <p class="muted">${T("The sell prices are as they were. Ticked ones change to the price that keeps their markup; you can type your own.",
      "Продажните цени се исти како порано. Штиклираните се менуваат на цена што ја задржува маржата; може да внесеш своја.")}</p>
    ${sellMoves.map((m, i) => {
      const up = m.now > m.was, ch = Math.round(((m.now - m.was) / m.was) * 1000) / 10;
      const keep = Math.round((m.sell / m.now - 1) * 1000) / 10;
      return `<div class="card">
        <div class="row" style="align-items:flex-start;gap:10px">
          <button class="clbox ${m.on ? "on" : ""}" id="sp-on-${i}" onclick="sellMoveToggle(${i})" aria-label="${T("Change this one", "Смени ја оваа")}"></button>
          <div style="flex:1;min-width:0">
            <b>${esc(m.name)}</b>
            <div class="muted" style="font-size:12.5px">${T("Buy", "Набавна")} ${fmt(m.was)} → <b style="color:${up ? "var(--danger)" : "var(--personal)"}">${fmt(m.now)}</b> (${up ? "+" : ""}${ch}%)
              · ${T(`at ${fmt(m.sell)} the markup is +${keep}%, was +${Math.round(m.pct * 10) / 10}%`, `на ${fmt(m.sell)} маржата е +${keep}%, беше +${Math.round(m.pct * 10) / 10}%`)}</div>
            <div class="row" style="gap:8px;margin-top:6px"><span class="muted nw">${T("Sell", "Продажна")} ${fmt(m.sell)} →</span>
              <input type="number" inputmode="decimal" id="sp-to-${i}" value="${m.to}" style="max-width:120px" oninput="sellMoveTyped(${i})"></div>
          </div>
        </div>
      </div>`;
    }).join("")}
    <button class="btn amber" id="sp-go" onclick="applySellPrices()"></button>
    <button class="btn ghost" onclick="closeSheet()">${T("Keep the sell prices", "Задржи ги продажните цени")}</button>
  `);
  sellMoveCount();
}
function sellMoveToggle(i) {
  sellMoves[i].on = !sellMoves[i].on;
  $("sp-on-" + i).classList.toggle("on", sellMoves[i].on);
  sellMoveCount();
}
// typing a price means you want it
function sellMoveTyped(i) {
  if (!sellMoves[i].on) sellMoveToggle(i);
}
function sellMoveCount() {
  const n = sellMoves.filter((m) => m.on).length, b = $("sp-go");
  if (!b) return;
  b.disabled = !n;
  b.textContent = n ? T(`Change ${n} sell price${n > 1 ? "s" : ""}`, `Смени ${n} продажни цени`) : T("Nothing ticked", "Ништо не е штиклирано");
}
async function applySellPrices() {
  const go = sellMoves.map((m, i) => ({ ...m, to: parseFloat($("sp-to-" + i).value) })).filter((m) => m.on && m.to > 0);
  if (!go.length) return;
  try {
    for (const m of go) await dbq(db.from("articles").update({ sell_price: m.to }).eq("id", m.id), T("Price not saved", "Цената не е зачувана"));
  } catch { return; }
  closeSheet(); await refreshAll(["stock"]); render();
  toast(T(`${go.length} sell price${go.length > 1 ? "s" : ""} changed`, `Сменети продажни цени: ${go.length}`));
}

let purPayMethod = "cash";
function payPurchaseSheet(id) {
  const p = state.purchases.find((x) => x.id === id);
  purPayMethod = "cash";
  openSheet(`
    <h2>Pay supplier bill</h2>
    <p class="muted">${esc(p.supplier)}${p.doc_no ? " · " + esc(p.doc_no) : ""}</p>
    <label>Paid by</label>
    <div class="chips" id="pp-m">
      <button class="chip on" onclick="setPurPayMethod('cash')">Cash</button>
      <button class="chip" onclick="setPurPayMethod('bank')">Bank</button>
    </div>
    <label>Amount paid (ден.)</label>
    <input id="pp-amt" type="number" inputmode="decimal" step="any" value="${Math.round(purchaseBalance(p) * 100) / 100}">
    <label>Date</label><input id="pp-date" type="date" value="${todayStr()}">
    <p class="muted" id="pp-hint">Cash payments are taken out of the register.</p>
    <button class="btn" onclick="savePurchasePayment('${id}')">Confirm payment</button>
  `);
}
function setPurPayMethod(m) {
  purPayMethod = m;
  [...$("pp-m").querySelectorAll(".chip")].forEach((b, i) => b.classList.toggle("on", (i === 0) === (m === "cash")));
  $("pp-hint").textContent = m === "cash"
    ? "Cash payments are taken out of the register."
    : "Recorded as a bank payment — the cash register is not touched.";
}
async function savePurchasePayment(id) {
  const p = state.purchases.find((x) => x.id === id);
  const amt = parseFloat($("pp-amt").value);
  if (!amt || amt <= 0) return toast("Enter the amount");
  try {
    await dbq(db.from("purchases").update({
      paid_at: $("pp-date").value || todayStr(), paid_method: purPayMethod,
      paid_amount: (parseFloat(p.paid_amount) || 0) + amt,
    }).eq("id", id), "Not saved");
    if (purPayMethod === "cash") {
      await dbq(db.from("elaks_cash").insert({
        amount: -Math.abs(amt), purchase_id: id,
        note: `${p.supplier}${p.doc_no ? " · " + p.doc_no : ""}`,
      }), "Cash entry not saved");
    }
  } catch { return; }
  closeSheet(); await refreshAll(["purchases", "cash", "cashTotal"]); render();
  toast(purPayMethod === "cash" ? "Paid — taken from the register" : "Marked as paid");
}
async function undoPurchasePayment(id) {
  if (!await ask("Undo this payment? Any cash register entry for it will be removed too.")) return;
  try {
    await dbq(db.from("elaks_cash").delete().eq("purchase_id", id), "Cash entry not removed");
    await dbq(db.from("purchases").update({ paid_at: null, paid_method: null, paid_amount: null }).eq("id", id), "Not saved");
  } catch { return; }
  closeSheet(); await refreshAll(["purchases", "cash", "cashTotal"]); render(); toast("Payment undone");
}
function renderPurchases() {
  const q = (($("pur-list-search") || {}).value || "").toLowerCase();
  const list = state.purchases.filter((p) => !q
    || (p.supplier || "").toLowerCase().includes(q)
    || (p.doc_no || "").toLowerCase().includes(q));
  const open = state.purchases.filter((p) => purchaseBalance(p) > 0.005);
  const late = open.filter(purchaseOverdue);
  const onOrder = state.purchases.filter((p) => (p.items || []).length && !purFullyArrived(p));
  // three figures in the tiles every summary in the app uses, so the eye
  // finds the same thing in the same place from one screen to the next
  $("pur-summary").innerHTML = `<div class="card"><div class="stat-row top">
    <div class="stat"><span>${T("Owed", "Должиме")} · ${open.length} ${open.length === 1 ? T("bill", "сметка") : T("bills", "сметки")}</span>
      <b>${fmt(sumBy(open, purchaseBalance))}</b></div>
    <div class="stat"><span>${T("Overdue", "Задоцнети")}</span>
      <b style="color:${late.length ? "var(--danger)" : "inherit"}">${late.length}</b></div>
    <div class="stat"><span>${T("On the way", "На пат")}</span>
      <b style="color:${onOrder.length ? "var(--amber)" : "inherit"}">${onOrder.length}</b></div>
  </div></div>`;
  $("pur-list").innerHTML = list.length ? list.map((p) => {
    const bal = purchaseBalance(p);
    const state_ = bal <= 0.005 ? '<span style="color:var(--personal)">paid</span>'
      : purchaseOverdue(p) ? '<span style="color:var(--danger)">overdue</span>'
      : (p.due_date ? "due " + dmy(p.due_date) : "unpaid");
    return `<div class="card offer row" role="button" tabindex="0" onclick="openPurchaseSheet('${p.id}')">
      <span class="led ${bal <= 0.005 ? "accepted" : "sent"}"></span>
      <div style="flex:1;min-width:0">
        <b>${esc(p.supplier)}</b>
        <div class="o-num">${esc(p.doc_no || "no number")} · ${dmy(p.doc_date)} · ${state_}${
          purFullyArrived(p) ? ""
            : ` · <span style="color:var(--amber)">${purArrivedCount(p) ? `${purArrivedCount(p)}/${(p.items || []).length} arrived` : "on order"}${p.expected_date ? " · exp. " + dmy(p.expected_date) : ""}</span>`}${authorTag(p.created_by)}</div>
      </div>
      <span class="mono">${fmt(p.total)}</span>
    </div>`;
  }).join("") + olderButton("purchases", T("Show older purchases", "Прикажи постари набавки"))
    : (state.loading ? SKEL(3) : '<div class="empty">No purchases yet.<br>Add with +</div>');
}

  "јули", "август", "септември", "октомври", "ноември", "декември"];

const monthName = (ym) => {
  const m = Number(String(ym).slice(5, 7)) - 1;
  return langMk() ? (MONTHS_MK[m] || "")

};
const prevMonth = (ym) => {
  const d = new Date(String(ym) + "-02T12:00");
  d.setMonth(d.getMonth() - 1);
  return d.toLocaleDateString("sv-SE").slice(0, 7);
};
const langMk = () => { try { return localStorage.getItem("centrala_lang") === "mk"; } catch { return false; } };
function setLang(mk) {
  try { localStorage.setItem("centrala_lang", mk ? "mk" : "en"); } catch (e) { console.warn(e); }
  location.reload();
}
document.documentElement.lang = langMk() ? "mk" : "en";

// Walk the finished page and swap whole strings we know. Inputs and
// textareas are left alone — those hold real data, not labels.
function translatePage(root) {
  if (!langMk()) return;
  const skip = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1, OPTION: 1 };
  const walk = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentNode && skip[n.parentNode.nodeName]) || !n.nodeValue.trim()
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  for (let n = walk.nextNode(); n; n = walk.nextNode()) nodes.push(n);
  for (const n of nodes) {
    const raw = n.nodeValue;
    const t = raw.trim();
    const hit = MK[t];
    if (hit) n.nodeValue = raw.replace(t, hit);
  }
  for (const el of (root || document).querySelectorAll("[placeholder]")) {
    const p = MK[el.getAttribute("placeholder")];
    if (p) el.setAttribute("placeholder", p);
  }
}

  : Math.round((Date.parse(i.warranty_until + "T12:00") - Date.parse(todayStr() + "T12:00")) / 86400000);

  if (d < 0) return `<span class="muted">warranty ended ${dmy(i.warranty_until)}</span>`;

}

/* ---------- the work, from asking a price to being paid ----------
   Nothing new is stored here. A piece of work is an offer, whatever job was
   scheduled for it and whatever invoice came out of it — this reads those
   three and works out the one thing that has to happen next. */

const WORK_STAGES = {
  quote:    { en: "quote out",    mk: "понуда",        colour: "var(--muted)" },
  schedule: { en: "to schedule",  mk: "за закажување", colour: "var(--amber)" },
  booked:   { en: "scheduled",    mk: "закажана",      colour: "var(--work)" },
  invoice:  { en: "to invoice",   mk: "за фактура",    colour: "var(--amber)" },
  unpaid:   { en: "not paid",     mk: "неплатена",     colour: "var(--danger)" },
  paid:     { en: "paid",         mk: "платена",       colour: "var(--personal)" },
};

function workItem(o) {
  const job = state.jobs.find((j) => j.offer_id === o.id && j.status !== "cancelled");
  const inv = state.invoices.find((i) => i.offer_id === o.id && !i.cancelled);
  let stage = "quote";
  if (inv && invPaid(inv)) stage = "paid";
  else if (inv) stage = "unpaid";
  else if (o.status === "accepted" && job && job.status === "done") stage = "invoice";
  else if (o.status === "accepted" && job) stage = "booked";
  else if (o.status === "accepted") stage = "schedule";
  return { o, job, inv, stage };
}

function renderWork() {
  const items = state.offers
    .filter((o) => o.status !== "rejected")
    .map(workItem)
    .filter((w) => w.stage !== "quote" || w.o.status === "sent" || w.o.status === "draft");

  const counts = {
    schedule: items.filter((w) => w.stage === "schedule").length,
    booked: items.filter((w) => w.stage === "booked").length,
    invoice: items.filter((w) => w.stage === "invoice").length,
    unpaid: items.filter((w) => w.stage === "unpaid").length,
  };
  const active = (w) => w.stage !== "paid";
  $("work-filter").innerHTML = [
    ["active", T("In progress", "Во тек")],
    ["schedule", T("To schedule", "За закажување")],
    ["booked", T("Scheduled", "Закажани")],
    ["invoice", T("To invoice", "За фактура")],
    ["unpaid", T("Not paid", "Неплатени")],
    ["all", T("All", "Сите")],
  ].map(([v, l]) => `<button class="chip ${state.workFilter === v ? "on" : ""}"
    onclick="state.workFilter='${v}';renderWork()">${l}${counts[v] ? ` ${counts[v]}` : ""}</button>`).join("");

  let list = items;
  if (state.workFilter === "active") list = items.filter(active);
  else if (state.workFilter !== "all") list = items.filter((w) => w.stage === state.workFilter);

  // the things waiting on you first, then by when they are booked
  const order = { invoice: 0, unpaid: 1, schedule: 2, booked: 3, quote: 4, paid: 5 };
  list = list.slice().sort((a, b) => order[a.stage] - order[b.stage]
    || String(a.job && a.job.scheduled_on || "9999").localeCompare(String(b.job && b.job.scheduled_on || "9999")));

  $("work-list").innerHTML = list.length ? list.map((w) => {
    const st = WORK_STAGES[w.stage];
    const sub = [invClient(w.o), w.job && w.job.scheduled_on ? dmy(w.job.scheduled_on) : "",
      w.inv ? T("Фактура", "Фактура") + " " + w.inv.number : ""].filter(Boolean);
    return `<div class="card offer row" role="button" tabindex="0" onclick="openWorkSheet('${w.o.id}')">
      <span class="led" style="background:${st.colour}"></span>
      <div style="flex:1;min-width:0"><b>${esc(w.o.title || w.o.number)}</b>
        <div class="o-num">${esc(w.o.number)}${sub.length ? " · " + sub.map(esc).join(" · ") : ""}</div></div>
      <div style="text-align:right;flex:none">
        <div class="mono">${fmt(w.o.grand_total)}</div>
        <div style="font-size:11.5px;color:${st.colour}">${T(st.en, st.mk)}</div></div>
    </div>`;
  }).join("") : (state.loading ? SKEL(3)
    : `<div class="empty">${T("Nothing here.<br>Start with an offer.", "Ништо тука.<br>Почни со понуда.")}</div>`);
}

// One screen for one piece of work: the three steps, where it has got to,

  const step = (n, title, state_, body, action) => `
    <div class="card" style="border-left:3px solid ${state_ === "done" ? "var(--personal)" : state_ === "now" ? "var(--amber)" : "var(--line)"}">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <b>${n}. ${title}</b>
          <div class="muted" style="font-size:12.5px">${body}</div>
        </div>
        ${state_ === "done" ? '<span style="color:var(--personal);font-size:16px">✓</span>' : ""}
      </div>
      ${action || ""}
    </div>`;

  openSheet(`
    <h2>${esc(o.title || o.number)}</h2>
    <p class="muted">${esc(o.number)}${c ? " · " + esc(c.name) : ""} · ${fmt(o.grand_total)} ден.</p>

    ${step(1, T("The offer", "Понудата"),
      o.status === "accepted" ? "done" : "now",
      o.status === "accepted" ? T("Accepted", "Прифатена") : T(STATUS[o.status] || o.status, STATUS[o.status] || o.status),
      `<button class="btn sm ghost" style="margin-top:8px" onclick="closeSheet();setTimeout(()=>openOfferSheet('${o.id}'),240)">
         ${T("Open the offer", "Отвори ја понудата")}</button>`)}

    ${step(2, T("The work", "Работата"),
      w.job && w.job.status === "done" ? "done" : w.job ? "now" : (o.status === "accepted" ? "now" : "wait"),
      w.job
        ? `${jobLabel(w.job.status)}${w.job.scheduled_on ? " · " + dmy(w.job.scheduled_on) : " · " + T("no date", "без датум")}${
            w.job.assigned_to && w.job.assigned_to !== state.uid ? " · " + esc(personName(w.job.assigned_to)) : ""}`
        : o.status === "accepted" ? T("Not scheduled yet", "Сè уште не е закажана") : T("Waiting for the offer to be accepted", "Се чека прифаќање"),
      w.job
        ? `<div class="grid2" style="margin-top:8px">
             <button class="btn sm ghost" style="width:100%" onclick="closeSheet();setTimeout(()=>openJobSheet('${w.job.id}'),240)">${T("Open", "Отвори")}</button>
             ${w.job.status !== "done" ? `<button class="btn sm amber" style="width:100%" onclick="closeSheet();finishJob('${w.job.id}')">${T("Finished", "Завршена")}</button>` : ""}
           </div>`
        : o.status === "accepted"
          ? `<button class="btn sm amber" style="margin-top:8px" onclick="closeSheet();setTimeout(()=>openJobSheet(null,'${o.id}'),240)">${T("Schedule it", "Закажи ја")}</button>`
          : "")}

    ${step(3, T("The invoice", "Фактурата"),
      w.inv && invPaid(w.inv) ? "done" : w.inv ? "now" : (o.status === "accepted" ? "now" : "wait"),
      w.inv
        ? `${T("Фактура", "Фактура")} ${esc(w.inv.number)} · ${invPaid(w.inv)
            ? T("paid", "платена") + " " + dmy(invPaidOn(w.inv))
            : (w.inv.due_date ? T("due", "рок") + " " + dmy(w.inv.due_date) : T("not paid", "неплатена"))}`
        : o.status === "accepted" ? T("Not issued yet", "Сè уште не е издадена") : T("After the offer is accepted", "По прифаќање на понудата"),
      w.inv
        ? `<div class="grid2" style="margin-top:8px">
             <button class="btn sm ghost" style="width:100%" onclick="closeSheet();setTimeout(()=>openInvoiceSheet('${w.inv.id}'),240)">${T("Open", "Отвори")}</button>
             <button class="btn sm ghost" style="width:100%" onclick="printInvoice('${w.inv.id}')">PDF</button>
           </div>`
        : o.status === "accepted"
          ? `<button class="btn sm amber" style="margin-top:8px" onclick="closeSheet();setTimeout(()=>newInvoiceFromOffer('${o.id}'),240)">${T("Make the invoice", "Направи фактура")}</button>`

    ${w.stage === "paid" ? `<p class="muted" style="text-align:center;margin-top:12px">${T("Finished and paid.", "Завршено и платено.")}</p>` : ""}

// An invoice is paid when it is marked so — which now also records the money
// on its offer — or when the payments on its offer cover it. The second is
// for invoices from before the two were joined: paid on the offer, never marked.
const invOffer = (i) => (i && i.offer_id ? state.offers.find((o) => o.id === i.offer_id) : null);
function invPaidOn(i) {
  if (!i) return null;
  if (i.paid_on) return i.paid_on;
  const o = invOffer(i);
  if (!o || i.cancelled) return null;
  const got = offerPaid(o);
  if (got <= 0 || (parseFloat(i.total) || 0) <= 0.005 || got < (parseFloat(i.total) || 0) - 0.005) return null;
  return o.paid_at || paymentsOf(o.id).map((p) => p.paid_on).sort().pop() || i.invoice_date;
}
const invPaid = (i) => !!invPaidOn(i);
// Before payments and invoices were joined, an invoice paid on its offer was
// never marked. It shows paid (invPaidOn) but stays in the database as unpaid,
// and so among the open ones loaded every time. Marked once, here, it is not.
async function markOldInvoicesPaid() {
  try {
    if (localStorage.getItem("centrala_inv_marked") === "1" || offlineNow()) return;
    const r = await db.from("invoices").select("id, offer_id, total, invoice_date").is("paid_on", null).eq("cancelled", false);
    if (r.error) return;
    const todo = (r.data || []).filter((i) => i.offer_id && (parseFloat(i.total) || 0) > 0.005);
    const offers = [];
    const ids = [...new Set(todo.map((i) => i.offer_id))];
    for (let k = 0; k < ids.length; k += 100) {
      const o = await db.from("offers").select("id, paid_amount, paid_at").in("id", ids.slice(k, k + 100));
      if (o.error) return;
      offers.push(...(o.data || []));
    }
    let marked = 0;
    for (const i of todo) {
      const o = offers.find((x) => x.id === i.offer_id);
      if (!o || (parseFloat(o.paid_amount) || 0) < (parseFloat(i.total) || 0) - 0.005) continue;
      const u = await db.from("invoices").update({ paid_on: o.paid_at || i.invoice_date }).eq("id", i.id);
      if (u.error) return;
      marked++;
    }
    localStorage.setItem("centrala_inv_marked", "1");
    if (marked) { await refreshAll(["invoices"]); render(); }
  } catch (e) { console.warn("old invoices", e); }
}
// what the client has paid towards it so far, on its offer
const invReceived = (i) => { const o = invOffer(i); return o ? offerPaid(o) : 0; };
const invClient = (i) => (state.clients.find((c) => c.id === i.client_id) || {}).name || "";

async function nextInvoiceNumber() {
  const y = new Date().getFullYear();
  try {
    const { data } = await db.from("invoices").select("number").like("number", y + "-%")
      .order("number", { ascending: false }).limit(1);
    const last = (data && data[0]) ? (parseInt(String(data[0].number).split("-")[1]) || 0) : 0;
    return `${y}-${String(last + 1).padStart(3, "0")}`;
  } catch {
    const nums = state.invoices.map((i) => i.number || "").filter((n) => n.startsWith(y + "-"))
      .map((n) => parseInt(n.split("-")[1]) || 0);
    return `${y}-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0")}`;
  }
}

// work that has been delivered but never billed — the list that answers
// "what am I owed but never asked for"
function awaitingInvoice() {
  const billed = new Set(state.invoices.filter((i) => !i.cancelled).map((i) => i.offer_id).filter(Boolean));
  return state.offers.filter((o) => o.status === "accepted" && !billed.has(o.id));
}

function invoiceDue() {
  const days = parseInt(setting("invoice_due_days", "15")) || 15;
  const due = new Date(todayStr() + "T12:00"); due.setDate(due.getDate() + days);
  return due.toLocaleDateString("sv-SE");
}
let issuing = false;
async function issueInvoice(offerId) {
  const o = state.offers.find((x) => x.id === offerId);
  if (!o || issuing) return;
  if (metersOpenOf(o.items).length) return newInvoiceFromOffer(offerId);
  if (state.invoices.some((i) => i.offer_id === offerId && !i.cancelled)) return toast(T("This offer already has an invoice", "Оваа понуда веќе има фактура"));
  issuing = true;
  const b = $("iv-issue"); if (b) b.disabled = true;
  const vb = vatBreakdown(o.items || []);
  const j = state.jobs.find((x) => x.offer_id === offerId && x.status !== "cancelled");
  let made;
  try {
    made = await dbq(db.from("invoices").insert({
      number: await nextInvoiceNumber(), invoice_date: todayStr(),
      due_date: invoiceDue(),
      client_id: o.client_id || null, offer_id: o.id, job_id: j ? j.id : null,
      items: o.items || [], total: o.grand_total || 0, net: vb.net, vat: (o.grand_total || 0) - vb.net,
    }).select().single(), T("Not created", "Не е создадена"));
  } catch { issuing = false; if (b) b.disabled = false; return; }
  issuing = false;
  closeSheet(); await refreshAll(["invoices"]); render();
  setTimeout(() => openInvoiceSheet(made.id), 260);
  toast(T("Invoice ", "Фактура ") + made.number);
}

let invPayMethod = "bank";
function setInvPayMethod(m) {
  invPayMethod = m;
  document.querySelectorAll("#iv-pm .chip").forEach((b) => b.classList.toggle("on", b.dataset.m === m));
}
// Paid is one thing, wherever it is said: marking the invoice paid records
// what was still owed as a payment on its offer — in the cash register too
// when it came in cash — and a payment on the offer marks its invoice (syncOfferPaid).
let markingPaid = false;
async function markInvoicePaid(id) {
  const i = state.invoices.find((x) => x.id === id);
  if (!i || markingPaid) return;
  const o = invOffer(i);
  const date = $("iv-paid").value || todayStr();
  const method = invPayMethod;
  const owed = Math.round(((parseFloat(i.total) || 0) - (o ? offerPaid(o) : 0)) * 100) / 100;
  const who = invClient(i);
  markingPaid = true;
  try {
    if (owed > 0.005) {
      const pay = o ? await dbq(db.from("offer_payments")
        .insert({ offer_id: o.id, amount: owed, method, paid_on: date, note: "Фактура " + i.number })
        .select().single(), T("Payment not saved", "Плаќањето не е зачувано")) : null;
      if (method === "cash") await dbq(db.from("elaks_cash").insert({
        amount: owed, offer_id: o ? o.id : null, payment_id: pay ? pay.id : null,
        note: `Фактура ${i.number}${who ? " · " + who : ""}`,
      }), T("Cash entry not saved", "Ставката во каса не е зачувана"));
    }
    await dbq(db.from("invoices").update({ paid_on: date }).eq("id", id), T("Not saved", "Не е зачувано"));
    if (o) await syncOfferPaid(o.id);
  } catch { markingPaid = false; return; }
  markingPaid = false;
  closeSheet(); await refreshAll(["invoices", "offers", "payments", "cash", "cashTotal"]); render();
  toast(method === "cash" && owed > 0.005 ? T("Paid — into the cash register", "Платена — во касата") : T("Marked as paid", "Означена како платена"));
}

// an issued invoice is never deleted — it is cancelled, so the numbering
// stays continuous and the record of what was issued survives
async function cancelInvoice(id) {
  if (!await ask(T("Cancel this invoice? It stays on the list, marked as cancelled.",
    "Сторнирај ја фактурата? Останува на листата, означена како сторнирана."))) return;
  try { await dbq(db.from("invoices").update({ cancelled: true }).eq("id", id), T("Not saved", "Не е зачувано")); }
  catch { return; }
  closeSheet(); await refreshAll(["invoices"]); render();
}

/* ---------- jobs: the visit between an accepted offer and the money ---------- */
const JOB_STATES = { scheduled: ["scheduled", "закажана"], started: ["on site", "во тек"],
                     done: ["done", "завршена"], cancelled: ["cancelled", "откажана"] };
const jobLabel = (s) => T(...(JOB_STATES[s] || JOB_STATES.scheduled));
const jobColour = (j) => j.status === "done" ? "var(--personal)"
  : j.status === "cancelled" ? "var(--muted)"
  : j.status === "started" ? "var(--amber)"
  : (j.scheduled_on && j.scheduled_on < todayStr()) ? "var(--danger)" : "var(--work)";
const jobClient = (j) => (state.clients.find((c) => c.id === j.client_id) || {}).name || "";
const jobSite = (j) => (state.sites.find((s) => s.id === j.site_id) || {}).name || "";
// "Бензинска Макпетрол Аеродром · Макпетрол Аеродром" says one place twice;
// the site only adds something when it is not already in the client's name
const jobSiteIfNew = (j) => {
  const site = jobSite(j), cli = jobClient(j);
  if (!site || !cli) return site;
  const a = normName(site), b = normName(cli);
  return a.includes(b) || b.includes(a) ? "" : site;
};

function renderJobs() {
  const t = todayStr();
  const counts = {
    today: state.jobs.filter((j) => j.scheduled_on === t && j.status !== "done" && j.status !== "cancelled").length,

  $("job-filter").innerHTML = [["today", T("Today", "Денес")], ["upcoming", T("To do", "За работа")],

        d === t ? ` · ${T("today", "денес")}` : late ? ` · <span style="color:var(--danger)">${T("overdue", "задоцнето")}</span>` : ""}</div>`;
    }
    html += `<div class="card offer row" role="button" tabindex="0" onclick="openJobSheet('${j.id}')">
      <span class="led" style="background:${jobColour(j)}"></span>
      <div style="flex:1;min-width:0"><b>${esc(j.title)}</b>
        <div class="o-num">${[jobClient(j), jobSiteIfNew(j), j.scheduled_time ? String(j.scheduled_time).slice(0, 5) : "",
          j.assigned_to && j.assigned_to !== state.uid ? personName(j.assigned_to) : ""].filter(Boolean).map(esc).join(" · ")}</div></div>
      <span class="muted nw" style="font-size:12px;color:${jobColour(j)}">${jobLabel(j.status)}</span>
    </div>`;
  }

async function startJob(id) {

}
// a photo taken on the card is kept at once: nothing to forget to save
async function addJobPhotosNow(input, id) {
  const files = [...(input.files || [])];
  input.value = "";
  for (const f of files) {
    if (f.size > 12 * 1024 * 1024) { toast(T("One photo was too large", "Една слика беше преголема")); continue; }
    const url = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => ok(null); fr.readAsDataURL(f); });
    const im = url ? await loadImg(url) : null;
    if (!im) { toast(T("Could not read that image", "Не можев да ја прочитам сликата")); continue; }
    const thumb = imgResize(im, 110, 0.6), full = imgResize(im, 1400, 0.8);
    try {
      const row = await dbq(db.from("job_photos").insert({ job_id: id, data: full, thumb, sort: jobPhotos.length }).select("id").single(),
        T("A photo was not saved", "Слика не е зачувана"));
      jobPhotos.push({ id: row && row.id, thumb, full });
    } catch { break; }
    renderJobImg();
  }
  if (files.length) toast(T("Photo kept", "Сликата е зачувана"));
}
// the client of a job, on WhatsApp or Viber, the words already there

function renderJobImg() {

    ? `<div class="pgrid">${jobPhotos.map((p, i) => `<div class="pcell">

function pickJobImage(input) {
  const files = [...(input.files || [])];
  input.value = "";
  files.forEach((f) => {
    if (f.size > 12 * 1024 * 1024) return toast(T("One photo was too large", "Една слика беше преголема"));
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => { jobPhotos.push({ thumb: imgResize(im, 110, 0.6), full: imgResize(im, 1400, 0.8), isNew: true }); renderJobImg(); };
      im.onerror = () => toast(T("Could not read that image", "Не можев да ја прочитам сликата"));
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}
function removeJobImage(i) {

async function saveJob(id, forceStatus, noCard) {
  const row = {
    title: $("jb-title").value.trim(),
    client_id: $("jb-client").value || null,
    site_id: $("jb-site").value || null,
    address: $("jb-addr").value.trim() || null,
    scheduled_on: $("jb-date").value || null,
    scheduled_time: $("jb-time").value || null,
    assigned_to: $("jb-who") ? $("jb-who").value : state.uid,
    note: $("jb-note").value.trim() || null,
  };
  if (!row.title) return toast(T("What is the work?", "Што е работата?"));
  const stateEl = $("jb-state") && $("jb-state").querySelector(".chip.on");
  const status = forceStatus || (stateEl ? stateEl.dataset.s : "scheduled");
  row.status = status;
  if (status === "done") row.done_at = new Date().toISOString();
  if (status === "started" && !row.started_at) row.started_at = new Date().toISOString();

  const before = id ? { ...(state.jobs.find((x) => x.id === id) || {}) } : null;
  let saved;
  try {
    saved = await dbq(id ? db.from("jobs").update(row).eq("id", id).select().single()
                        : db.from("jobs").insert(row).select().single(), T("Not saved", "Не е зачувано"));
    if (jobRemoved.length) await db.from("job_photos").delete().in("id", jobRemoved);
    const fresh = jobPhotos.filter((p) => p.isNew && p.full);
    if (fresh.length) {
      await dbq(db.from("job_photos").insert(fresh.map((p) => ({
        job_id: saved.id, data: p.full, thumb: p.thumb, sort: jobPhotos.indexOf(p),
      }))), T("A photo was not saved", "Слика не е зачувана"));
    }
  } catch { return; }
  closeSheet(); await refreshAll(["jobs"]); render(); toast(T("Saved", "Зачувано"));
  tellJobChange(saved, before);
  if (!noCard) setTimeout(() => openJobCard(saved.id), 240);
}
// Whoever is given a job hears of it at once, and again when it moves —
// not when it is your own, nor once it is done. The server sends it, to
// their phones only (push ?job=).
function tellJobChange(j, before) {
  if (!j || !j.assigned_to || j.assigned_to === state.uid || j.status === "done" || j.status === "cancelled") return;
  const why = !before || before.assigned_to !== j.assigned_to ? "new"
    : (before.scheduled_on || "") !== (j.scheduled_on || "") || String(before.scheduled_time || "").slice(0, 5) !== String(j.scheduled_time || "").slice(0, 5) ? "moved" : null;
  if (why) tellJob(j.id, why);
}
async function tellJob(id, why) {
  try {
    if (offlineNow()) return;
    const { data: { session } } = await db.auth.getSession();
    if (!session) return;
    const r = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/push?job=${encodeURIComponent(id)}&why=${why}`, { method: "POST",
      headers: { Authorization: "Bearer " + session.access_token, apikey: CONFIG.SUPABASE_ANON_KEY } });
    const out = await r.json().catch(() => ({}));
    if (r.ok && out.sent) toast(T(`${out.to || "They"} will get a notification`, `${out.to || "Тој"} ќе добие известување`));
  } catch (e) { console.warn("job notice", e); }
}

async function finishJob(id) {
  const j = state.jobs.find((x) => x.id === id);
  if (!j) return;
  const fromForm = $("jb-title") && $("jb-title").dataset.job === id;
  const o = j.offer_id ? state.offers.find((x) => x.id === j.offer_id) : null;
  // cable by the metre: only known now, and the invoice needs it; the job is finished with it
  if (o && metersOpenOf(o.items).length) {
    if (fromForm) await saveJob(id, undefined, true);  // whatever was changed on the job is kept first
    else closeSheet();
    return void setTimeout(() => closeJobSheet(o.id), 260);
  }
  const fromCard = $("jb-img") && $("jb-img").dataset.view === "card";
  if (fromForm) await saveJob(id, "done");
  else {
    // from the card or the Work screen there is no form to read: the job is just marked finished
    try { await dbq(db.from("jobs").update({ status: "done", done_at: new Date().toISOString() }).eq("id", id), T("Not saved", "Не е зачувано")); }
    catch { return; }
    closeSheet(); await refreshAll(["jobs"]); render();
    if (fromCard) setTimeout(() => openJobCard(id), 240);     // the card again, with the invoice on it
  }
  toast(T("Finished — time to invoice", "Завршена — време за фактура"));
}

async function delJob(id) {
  const j = state.jobs.find((x) => x.id === id);
  if (!await ask(T("Remove this job?", "Отстрани ја работата?"))) return;
  await deleteUndoable("jobs", j, T("Job removed", "Работата е отстранета"), ["jobs"]);
}

/* ---------- what is installed at a site, and how to get into it ---------- */
const HDD_LIFE_YEARS = 3;      // recorders usually fail at the drive
function hddAge(s) {
  if (!s.hdd_installed_on) return null;
  return Math.round(((Date.parse(todayStr()) - Date.parse(s.hdd_installed_on)) / 31557600000) * 10) / 10;
}

function sitesBlock(clientId) {
  const list = state.sites.filter((s) => s.client_id === clientId);
  return `<div class="sec">${T("Sites", "Локации")}</div>
    ${list.map((s) => {
      const age = hddAge(s);
      return `<div class="card row tapp" role="button" tabindex="0" onclick="openSiteSheet('${s.id}')">
        <div style="flex:1;min-width:0"><b>${esc(s.name)}</b>
          <div class="muted">${[s.recorder, s.channels ? s.channels + "ch" : "",
            s.camera_count ? s.camera_count + " " + T("cameras", "камери") : ""].filter(Boolean).map(esc).join(" · ")}</div>
          ${age !== null ? `<div style="font-size:12.5px;color:${age >= HDD_LIFE_YEARS ? "var(--danger)" : age >= HDD_LIFE_YEARS - 1 ? "var(--amber)" : "var(--muted)"}">
            ${T("Drive", "Диск")} ${s.hdd_tb ? s.hdd_tb + "TB · " : ""}${age} ${T("years old", "години")}${
              age >= HDD_LIFE_YEARS ? " · " + T("worth replacing", "вреди да се замени") : ""}</div>` : ""}
        </div><span class="muted">›</span></div>`;
    }).join("") || `<p class="muted">${T("No site recorded yet.", "Сè уште нема локација.")}</p>`}
    <button class="btn sm ghost" onclick="openSiteSheet(null, '${clientId}')">+ ${T("Add a site", "Додај локација")}</button>`;
}

function openSiteSheet(id, clientId) {
  const s = id ? state.sites.find((x) => x.id === id) : { client_id: clientId };
  if (id && !s) return;
  const cid = s.client_id || clientId || "";
  const age = id ? hddAge(s) : null;
  const copyRow = (label, val) => val
    ? `<div class="mov tapp" role="button" tabindex="0" onclick="copyText('${String(val).replace(/'/g, "\\'")}')">
         <span class="muted">${label}</span>
         <span><b class="mono">${esc(val)}</b> <span class="muted">${T("copy", "копирај")}</span></span></div>`
    : "";
  const anyAccess = s.access_user || s.access_pass || s.remote_app || s.remote_id || s.network_note;

  openSheet(`
    <h2>${id ? esc(s.name) : T("New site", "Нова локација")}</h2>
    ${id && anyAccess ? `<div class="sec">${T("Getting in", "Пристап")}</div>
      <div class="card">
        ${copyRow(T("User", "Корисник"), s.access_user)}
        ${copyRow(T("Password", "Лозинка"), s.access_pass)}
        ${copyRow(T("App", "Апликација"), s.remote_app)}
        ${copyRow(T("Device / account", "Уред / сметка"), s.remote_id)}
      </div>
      ${s.network_note ? `<p class="muted" style="font-size:12.5px">${esc(s.network_note)}</p>` : ""}` : ""}

    <label>${T("Site name", "Име на локација")}</label>
    <input id="st-name" value="${esc(s.name || "")}" placeholder="${T("e.g. shop, house, warehouse", "на пр. продавница, куќа, магацин")}">
    <label>${T("Address", "Адреса")}</label><input id="st-addr" value="${esc(s.address || "")}">
    <label>${T("Client", "Клиент")}</label>
    <select id="st-client"><option value="">${T("No client", "Без клиент")}</option>
      ${state.clients.filter((c) => c.active !== false || cid === c.id)
        .map((c) => `<option value="${c.id}" ${cid === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
    </select>

    <div class="sec">${T("The system", "Системот")}</div>
    <label>${T("Recorder (DVR / NVR)", "Рекордер (DVR / NVR)")}</label>
    <input id="st-rec" value="${esc(s.recorder || "")}" placeholder="Hikvision DS-7208HQHI">
    <div class="grid2">
      <div><label>${T("Channels", "Канали")}</label>
        <input id="st-ch" type="number" inputmode="numeric" value="${s.channels ?? ""}"></div>
      <div><label>${T("Cameras", "Камери")}</label>
        <input id="st-cam" type="number" inputmode="numeric" value="${s.camera_count ?? ""}"></div>
    </div>
    <div class="grid2">
      <div><label>${T("Drive (TB)", "Диск (TB)")}</label>
        <input id="st-hdd" type="number" inputmode="decimal" step="any" value="${s.hdd_tb ?? ""}"></div>
      <div><label>${T("Drive fitted on", "Диск ставен на")}</label>
        <input id="st-hddate" type="date" value="${s.hdd_installed_on || ""}"></div>
    </div>
    ${age !== null ? `<p class="muted" style="font-size:12.5px">${T("The drive is", "Дискот е")} ${age} ${T("years old", "години стар")}${
      age >= HDD_LIFE_YEARS ? " — " + T("drives usually fail around three, so this is worth offering to replace.",
        "дисковите обично откажуваат околу три, па вреди да се понуди замена.") : "."}</p>` : ""}

    <div class="sec">${T("Getting in", "Пристап")}</div>
    <div class="grid2">
      <div><label>${T("User", "Корисник")}</label><input id="st-user" value="${esc(s.access_user || "")}"></div>
      <div><label>${T("Password", "Лозинка")}</label><input id="st-pass" value="${esc(s.access_pass || "")}"></div>
    </div>
    <div class="grid2">
      <div><label>${T("App", "Апликација")}</label>
        <input id="st-app" value="${esc(s.remote_app || "")}" placeholder="Hik-Connect"></div>
      <div><label>${T("Device / account", "Уред / сметка")}</label>
        <input id="st-rid" value="${esc(s.remote_id || "")}"></div>
    </div>
    <label>${T("Network note (router, SIM, ports)", "Мрежа (рутер, SIM, портови)")}</label>
    <input id="st-net" value="${esc(s.network_note || "")}">
    <label>${T("Note", "Белешка")}</label><input id="st-note" value="${esc(s.note || "")}">

    <button class="btn" onclick="saveSite('${id || ""}')">${T("Save", "Зачувај")}</button>
    ${id ? `<div class="sec">${T("Equipment here", "Опрема тука")}</div>
      ${state.installs.filter((i) => i.site_id === id).map((i) => `<div class="mov tapp" role="button" tabindex="0" onclick="openInstallSheet('${i.id}')">
        <span>${esc(i.name)}${i.serial ? " · SN " + esc(i.serial) : ""}</span><span class="muted">›</span></div>`).join("")
        || `<p class="muted">${T("Nothing filed here yet.", "Сè уште ништо тука.")}</p>`}
      <button class="btn danger" onclick="delSite('${id}')">${T("Remove site", "Отстрани локација")}</button>` : ""}
  `);
}

async function saveSite(id) {
  const row = {
    name: $("st-name").value.trim(), address: $("st-addr").value.trim() || null,
    client_id: $("st-client").value || null,
    recorder: $("st-rec").value.trim() || null,
    channels: parseInt($("st-ch").value) || null,
    camera_count: parseInt($("st-cam").value) || null,
    hdd_tb: parseFloat($("st-hdd").value) || null,
    hdd_installed_on: $("st-hddate").value || null,
    access_user: $("st-user").value.trim() || null,
    access_pass: $("st-pass").value.trim() || null,
    remote_app: $("st-app").value.trim() || null,
    remote_id: $("st-rid").value.trim() || null,
    network_note: $("st-net").value.trim() || null,
    note: $("st-note").value.trim() || null,
  };
  if (!row.name) return toast(T("Give the site a name", "Дај име на локацијата"));
  try {
    await dbq(id ? db.from("sites").update(row).eq("id", id)
                 : db.from("sites").insert(row), T("Not saved", "Не е зачувано"));
  } catch { return; }
  closeSheet(); await refreshAll(["sites"]); render(); toast(T("Saved", "Зачувано"));
  if (row.client_id) setTimeout(() => openClientSheet(row.client_id), 240);
}

async function delSite(id) {
  const s = state.sites.find((x) => x.id === id);
  if (!await ask(T("Remove this site? The equipment filed here stays.", "Отстрани ја локацијата? Опремата останува."))) return;
  await deleteUndoable("sites", s, T("Site removed", "Локацијата е отстранета"), ["sites", "installs"]);
}

// A faulty camera in your hand: type the serial and find out whose it is.
function openSerialSearch() {
  openSheet(`<h2>${T("Find by serial", "Најди по сериски")}</h2>
    <input class="search" id="sn-q" placeholder="${T("Serial number or name…", "Сериски број или име…")}"
      oninput="renderSerialSearch()" autocomplete="off">
    <div id="sn-list"></div>`);
  setTimeout(() => { const el = $("sn-q"); if (el) el.focus(); }, 80);
  renderSerialSearch();
}
function renderSerialSearch() {
  const q = (($("sn-q") || {}).value || "").trim().toLowerCase();
  const el = $("sn-list");
  if (!el) return;
  if (!q) return (el.innerHTML = `<p class="muted">${T("Type a serial number to find where it is installed.",
    "Внеси сериски број за да видиш каде е вградено.")}</p>`);
  const hits = state.installs.filter((i) =>
    [i.serial, i.name, i.location].some((v) => String(v || "").toLowerCase().includes(q))).slice(0, 30);
  const clientName = (id) => (state.clients.find((c) => c.id === id) || {}).name || T("no client", "без клиент");
  const siteName = (id) => (state.sites.find((s) => s.id === id) || {}).name || "";
  el.innerHTML = hits.length ? hits.map((i) => `<div class="card row tapp" role="button" tabindex="0" onclick="openInstallSheet('${i.id}')">
    <div style="flex:1;min-width:0"><b>${esc(i.name)}</b>
      <div class="muted">${i.serial ? "SN " + esc(i.serial) + " · " : ""}${esc(clientName(i.client_id))}${
        i.site_id ? " · " + esc(siteName(i.site_id)) : ""}${i.location ? " · " + esc(i.location) : ""}</div>
      <div style="font-size:12.5px">${warrantyLabel(i)}</div></div>
    <span class="muted">›</span></div>`).join("")
    : `<p class="muted">${T("Nothing matches", "Ништо не одговара")} “${esc(q)}”</p>`;
}

function installsBlock(clientId) {
  const list = state.installs.filter((i) => i.client_id === clientId);
  return `<div class="sec">Installed equipment</div>
    ${list.map((i) => `<div class="card row tapp" role="button" tabindex="0" onclick="openInstallSheet('${i.id}')">
      <div style="flex:1;min-width:0"><b>${esc(i.name)}</b>
        <div class="muted">${i.serial ? "SN " + esc(i.serial) + " · " : ""}${i.location ? esc(i.location) + " · " : ""}${dmy(i.installed_on)}</div>
        <div style="font-size:12.5px">${warrantyLabel(i)}</div></div>
      <span class="muted">›</span></div>`).join("")
      || '<p class="muted">Nothing recorded yet.</p>'}
    <button class="btn sm ghost" onclick="openInstallSheet(null, '${clientId}')">+ Add installed equipment</button>`;
}

// only the chosen client's sites, refreshed when the client changes
function inSiteOptions(selected) {
  const sel = $("in-site");
  if (!sel) return;
  const cid = $("in-client").value;
  const want = selected !== undefined ? selected : sel.value;
  const list = state.sites.filter((s) => s.client_id === cid);
  sel.innerHTML = `<option value="">${T("No site", "Без локација")}</option>`
    + list.map((s) => `<option value="${s.id}" ${want === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("");
}

function openInstallSheet(id, clientId) {
  const i = id ? state.installs.find((x) => x.id === id) : { client_id: clientId, installed_on: todayStr(), warranty_months: 24 };
  const cid = i.client_id || clientId || "";
  openSheet(`
    <h2>${id ? "Installed equipment" : "Add installed equipment"}</h2>
    <label>What is it</label>
    <input id="in-name" list="in-arts" value="${esc(i.name || "")}" placeholder="Hikvision 2MP camera">
    <datalist id="in-arts">${state.stock.slice(0, 200).map((a) => `<option value="${esc(a.name)}">`).join("")}</datalist>
    <div class="grid2">
      <div><label>Serial number</label><input id="in-serial" value="${esc(i.serial || "")}"></div>
      <div><label>Where</label><input id="in-loc" value="${esc(i.location || "")}" placeholder="entrance"></div>
    </div>
    <div class="grid2">
      <div><label>Installed on</label><input id="in-date" type="date" value="${i.installed_on || todayStr()}"></div>
      <div><label>Warranty (months)</label><input id="in-warr" type="number" min="0" max="120" value="${i.warranty_months ?? 24}"></div>
    </div>
    ${id && i.warranty_until ? `<p class="muted" style="font-size:12.5px">${warrantyLabel(i)}</p>` : ""}
    <label>Client</label>
    <select id="in-client" onchange="inSiteOptions('')"><option value="">No client</option>
      ${state.clients.map((c) => `<option value="${c.id}" ${cid === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
    </select>
    <label>${T("Site", "Локација")}</label>
    <select id="in-site"></select>
    <label>Note</label><input id="in-note" value="${esc(i.notes || "")}">
    <button class="btn" onclick="saveInstall('${id || ""}')">Save</button>
    ${id ? `<button class="btn danger" onclick="delInstall('${id}')">Remove</button>` : ""}
  `);
  inSiteOptions(i.site_id || "");
}
async function saveInstall(id) {
  const row = {
    name: $("in-name").value.trim(),
    serial: $("in-serial").value.trim() || null,
    location: $("in-loc").value.trim() || null,
    installed_on: $("in-date").value || todayStr(),
    warranty_months: parseInt($("in-warr").value) || 0,
    client_id: $("in-client").value || null,
    site_id: $("in-site").value || null,
    notes: $("in-note").value.trim() || null,
  };
  if (!row.name) return toast("What is it?");
  try {
    await dbq(id ? db.from("installations").update(row).eq("id", id)
                 : db.from("installations").insert(row), "Not saved");
  } catch { return; }
  closeSheet(); await refreshAll(["installs"]); render(); toast("Saved");
  if (row.client_id) setTimeout(() => openClientSheet(row.client_id), 240);
}
async function delInstall(id) {
  const row = state.installs.find((x) => x.id === id);
  if (!row || !await ask("Remove this equipment record?")) return;
  const copy = { ...row }; delete copy.warranty_until;   // worked out by the database
  await deleteUndoable("installations", copy, T("Equipment removed", "Опремата е отстранета"), ["installs"]);
}

// Everything whose warranty is running out, so it becomes service work
// rather than a date nobody noticed.
function openWarranties() {
  const list = expiringSoon().slice().sort((a, b) => (a.warranty_until || "").localeCompare(b.warranty_until || ""));
  const clientName = (id) => (state.clients.find((c) => c.id === id) || {}).name || "no client";
  openSheet(`<h2>Warranties ending</h2>
    <p class="muted">The next 90 days. A good moment to offer a service visit.</p>
    ${list.length ? list.map((i) => `<div class="card row tapp" role="button" tabindex="0" onclick="openInstallSheet('${i.id}')">
      <div style="flex:1;min-width:0"><b>${esc(i.name)}</b>
        <div class="muted">${esc(clientName(i.client_id))}${i.serial ? " · SN " + esc(i.serial) : ""}</div>
        <div style="font-size:12.5px">${warrantyLabel(i)}</div></div>
      <span class="muted">›</span></div>`).join("")
      : '<p class="muted">Nothing ending in the next three months.</p>'}`);
}

function offerExpired(o) {
  if (o.status !== "sent" || !o.offer_date) return false;
  const d = new Date(o.offer_date + "T12:00");
  d.setDate(d.getDate() + (o.validity || 7));
  return d < new Date(todayStr() + "T12:00");
}

function updateBadges() {
  const today = todayStr();
  const n = taskBuckets(today).attention;
  const low = state.stock.filter((a) => a.min_stock > 0 && a.stock <= a.min_stock).length;
  const set = (name, v) => { const e = $("bdg-" + name); if (e) { e.textContent = v; e.classList.toggle("on", v > 0); } };
  set("today", n); set("elaks", low);
  // The same count on the app's icon, where the phone can show a number —
  // an iPhone or a computer can; Android shows its own dot instead.
  if (!state.loading && navigator.setAppBadge) {
    (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
  }
}

async function exportCsv(kind) {
  const cell = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  let rows = [];
  if (kind === "articles") {
    rows = [["name", "code", "category", "unit", "stock", "min_stock", "purchase_price", "sell_price", "supplier"]]
      .concat(state.stock.map((a) => [a.name, a.code, a.category, a.unit, a.stock, a.min_stock, a.purchase_price, a.sell_price, a.supplier]));
  } else if (kind === "movements") {
    let data = [];
    try { data = await dbq(db.from("movements").select("*, articles(name)").order("created_at"), "Export failed"); } catch { return; }
    rows = [["date", "article", "type", "qty", "ref", "note"]]
      .concat((data || []).map((m) => [m.created_at.slice(0, 10), m.articles?.name, m.type, m.qty, m.ref, m.note]));
  } else {
    rows = [["number", "date", "title", "client", "status", "grand_total"]]
      .concat(state.offers.map((o) => [o.number, o.offer_date, o.title, o.clients?.name, o.status, o.grand_total]));
  }
  const csv = rows.map((r) => r.map(cell).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "elaks-" + kind + "-" + todayStr() + ".csv";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}

boot();
</script>
